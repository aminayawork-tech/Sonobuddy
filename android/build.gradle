// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Keep build outputs out of the repo folder. The project lives in an
    // iCloud-synced ~/Documents, and iCloud syncing thousands of build
    // intermediates mid-build corrupts Gradle caches and stalls bundling.
    // The release bundle ends up in
    // ~/.sonobuddy-android-build/app/outputs/bundle/release/app-release.aab
    layout.buildDirectory.set(new File(System.getProperty('user.home'), ".sonobuddy-android-build/${project.name}"))
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
