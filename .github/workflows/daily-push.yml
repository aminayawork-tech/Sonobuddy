name: Daily Push Notification

on:
  # This ran reliably every day for two straight weeks (Sept 28 – Oct 7)
  # before being switched off in favor of Vercel Cron, on the theory that
  # running both was double-sending. Vercel Cron's reliability couldn't be
  # confirmed afterward (no dashboard access, and notifications stopped
  # entirely for several days with no diagnosable cause), so this reverts to
  # the mechanism with an actual track record. vercel.json's `crons` block
  # is removed in the same change, so only one of the two ever runs again.
  schedule:
    - cron: '0 13 * * *'  # 9am ET (UTC-4 summer / UTC-5 winter — adjust if needed)
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title (leave blank to send today''s daily tip)'
        required: false
        default: ''
      body:
        description: 'Notification body (leave blank to send today''s daily tip)'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification
        run: |
          TITLE="${{ github.event.inputs.title }}"
          BODY="${{ github.event.inputs.body }}"

          if [ -n "$TITLE" ] && [ -n "$BODY" ]; then
            echo "Sending custom notification: $TITLE"
            RESPONSE=$(curl -sL -G "https://www.sonobuddy.com/api/push/send" \
              --data-urlencode "title=$TITLE" \
              --data-urlencode "body=$BODY" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          else
            echo "Sending daily tip notification..."
            RESPONSE=$(curl -sL "https://www.sonobuddy.com/api/push/send" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          fi

          echo "Full response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"error"' && echo "ERROR: API returned error" && exit 1 || true
          APNS_SENT=$(echo "$RESPONSE" | grep -o '"sent":[0-9]*' | head -2 | tail -1 | grep -o '[0-9]*' || echo "0")
          WEB_SENT=$(echo "$RESPONSE" | grep -o '"sent":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "0")
          echo "Web push sent: $WEB_SENT"
          echo "APNs sent: $APNS_SENT"
