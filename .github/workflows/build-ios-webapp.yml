name: Build iOS WebApp Bundle

# Regenerates the Next.js static export and commits ios/SonoBuddy/WebApp/
# whenever app code changes on main. The folder is bundled into the Xcode
# archive via the WebAppSchemeHandler (sono-web:// custom URL scheme).

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'data/**'
      - 'lib/**'
      - 'public/**'
      - 'content/**'
      - 'next.config.js'
      - 'tailwind.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export (hide API routes)
        run: |
          mv app/api api_ios_backup
          NEXT_STATIC_EXPORT=true npm run build
          mv api_ios_backup app/api

      - name: Update ios/SonoBuddy/WebApp
        run: |
          rm -rf ios/SonoBuddy/WebApp
          cp -r out ios/SonoBuddy/WebApp
          # The analytics dashboard is owner-only tooling. Shipping it inside
          # the app would put the page in every user's hands via the IPA, and
          # it can't work there anyway — it calls a same-origin API that does
          # not exist under the sono-web:// scheme.
          rm -rf ios/SonoBuddy/WebApp/admin
          # The app opens /articles, never /blog — the blog is the SEO copy of
          # the same content and is ~19MB of an 82MB bundle. The marketing
          # landing page is likewise unreachable from the app's navigation and
          # carries a "Coming soon to Google Play" button that has no business
          # shipping inside an iOS build. /app is a bare redirect('/home') with
          # no caller anywhere in the app — dead weight, same as the others.
          rm -rf ios/SonoBuddy/WebApp/blog
          rm -rf ios/SonoBuddy/WebApp/app
          rm -f ios/SonoBuddy/WebApp/index.html ios/SonoBuddy/WebApp/index.txt

          # Removing those routes orphans their JS chunks. A route-specific
          # glob here is exactly what missed /admin's own chunks and /blog's
          # last time — this sweeps every chunk once and drops any that
          # nothing points to any more.
          #
          # "Points to" has to include other JS files, not only HTML: some
          # chunks (e.g. /_not-found) are referenced only from Next's
          # client-side route manifest inside main-*.js, never from a <script>
          # tag. Checking HTML alone would call that an orphan and delete a
          # chunk the router still needs. Repeats while a pass finds
          # something, since removing one orphan can free up a chunk that
          # existed only to serve it.
          removed=1
          while [ "$removed" -eq 1 ]; do
            removed=0
            for f in $(find ios/SonoBuddy/WebApp/_next/static/chunks -name '*.js'); do
              [ -e "$f" ] || continue
              bn=$(basename "$f")
              if ! grep -rqF "$bn" ios/SonoBuddy/WebApp --include=*.html --include=*.js --exclude="$bn"; then
                rm -f "$f"
                removed=1
              fi
            done
          done

      - name: Commit updated WebApp bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/SonoBuddy/WebApp
          if git diff --staged --quiet; then
            echo "No changes to WebApp bundle."
          else
            git commit -m "chore: auto-update iOS WebApp bundle [skip ci]"
            git push origin main
          fi
