c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T2146,"])</script><script>self.__next_f.push([1,"Transcranial Doppler is the most technically demanding examination in most vascular laboratories. You are insonating vessels you cannot see, through bone, identifying them by depth, flow direction, and the response to compression manoeuvres rather than by anatomy on screen.\n\nIt is also uniquely valuable: TCD is the only bedside, repeatable, real-time monitor of cerebral haemodynamics, and in two settings — vasospasm after subarachnoid haemorrhage, and stroke risk screening in sickle cell disease — it changes management directly.\n\n---\n\n## Equipment\n\n**Probe:** Low-frequency phased array, **2 MHz**. Higher frequencies do not penetrate the skull.\n\n**Modes:**\n\n- **Non-imaging (blind) TCD** — pencil probe, relies entirely on depth and flow direction. Still used for monitoring and emboli detection.\n- **Transcranial colour-coded duplex (TCCD)** — B-mode and colour guidance. Substantially easier to learn and allows angle correction.\n\nSet a **low wall filter**, appropriate depth for the window, and adequate power output. Sample volume is typically 5–10 mm.\n\n---\n\n## The Four Acoustic Windows\n\nThe skull is largely opaque to ultrasound. You are exploiting thin regions and natural foramina.\n\n### 1. Transtemporal\n\nThe workhorse window. Above the zygomatic arch, anterior to the ear.\n\nThree sub-windows — **posterior, middle, anterior**. Start posterior, just above the zygoma and anterior to the ear, and work forward.\n\n**Vessels:** MCA, ACA, PCA, terminal ICA.\n\n**Failure rate matters.** An inadequate temporal window occurs in a meaningful minority of patients — more commonly in older patients, women, and certain ethnic groups, because of skull thickness. This is a limitation of the technique, not a failure of the operator, and should be stated plainly in the report.\n\n### 2. Transorbital\n\nThrough the closed eyelid, angled medially.\n\n**Vessels:** Ophthalmic artery, ICA siphon.\n\n**Reduce power output substantially** — the eye is sensitive to acoustic energy, and this is a hard safety requirement, not a suggestion. Use the lowest output that yields a signal and minimize dwell time.\n\n### 3. Suboccipital (Transforaminal)\n\nThrough the foramen magnum. Patient's head flexed forward, probe below the occiput aimed at the bridge of the nose.\n\n**Vessels:** Vertebral arteries, basilar artery.\n\n### 4. Submandibular\n\nBelow the angle of the mandible, angled upward.\n\n**Vessels:** Distal extracranial ICA — needed for the Lindegaard ratio.\n\n---\n\n## Vessel Identification\n\nWithout direct visualization, identity rests on three things: **window, depth, and flow direction relative to the probe.**\n\n| Vessel | Window | Typical depth | Flow direction |\n|---|---|---|---|\n| MCA | Transtemporal | 30–65 mm | Toward probe |\n| ACA (A1) | Transtemporal | 60–80 mm | Away from probe |\n| PCA (P1) | Transtemporal | 60–75 mm | Toward probe |\n| Terminal ICA | Transtemporal | 55–65 mm | Toward probe |\n| Ophthalmic | Transorbital | 40–50 mm | Toward probe |\n| ICA siphon | Transorbital | 55–65 mm | Bidirectional |\n| Vertebral | Suboccipital | 40–75 mm | Away from probe |\n| Basilar | Suboccipital | 80–120 mm | Away from probe |\n| Distal ICA | Submandibular | 40–60 mm | Away from probe |\n\n**The MCA/ACA bifurcation** at around 60–65 mm shows simultaneous bidirectional flow and is the anatomical anchor of the temporal window. Find it first, then walk shallower along the MCA.\n\n**Compression manoeuvres** confirm identity in non-imaging studies — brief common carotid compression alters flow in a predictable, vessel-specific way. Use with caution and avoid entirely in patients with carotid disease or plaque.\n\n---\n\n## Normal Velocities\n\nMean flow velocity (MFV) in adults, approximate:\n\n| Vessel | Normal MFV |\n|---|---|\n| MCA | 55 ± 12 cm/s |\n| ACA | 50 ± 11 cm/s |\n| PCA | 40 ± 10 cm/s |\n| Basilar | 40 ± 10 cm/s |\n| Vertebral | 38 ± 10 cm/s |\n\nVelocities **decrease with age** and **increase with anaemia, fever, pregnancy, and hypercapnia**. Children have substantially higher normal velocities than adults — do not apply adult values to paediatric studies.\n\n**Pulsatility index (PI)** = (PSV − EDV) / MFV. Normal is roughly **0.5–1.1**.\n\n- **Elevated PI** suggests increased distal resistance — raised intracranial pressure, distal microvascular disease\n- **Reduced PI** with a damped, delayed waveform suggests a proximal stenosis or occlusion\n\n---\n\n## Vasospasm After Subarachnoid Haemorrhage\n\nThe commonest indication in most centres. Vasospasm typically develops between days 3 and 14 after aneurysmal SAH, and TCD is used for serial monitoring because it is repeatable at the bedside.\n\n### MCA Velocity Thresholds\n\n| MCA MFV | Interpretation |\n|---|---|\n| \u003c 120 cm/s | Normal |\n| 120–150 cm/s | Mild vasospasm |\n| 150–200 cm/s | Moderate vasospasm |\n| \u003e 200 cm/s | Severe vasospasm |\n\n### The Lindegaard Ratio\n\nVelocity rises in vasospasm — but it also rises in hyperaemia, which is common in these patients. The ratio distinguishes them:\n\n```\nLindegaard ratio = MCA MFV / extracranial ICA MFV\n```\n\nThe extracranial ICA velocity comes from the **submandibular window**, which is why that window matters.\n\n| Ratio | Interpretation |\n|---|---|\n| \u003c 3 | Hyperaemia, not vasospasm |\n| 3–6 | Mild to moderate vasospasm |\n| \u003e 6 | Severe vasospasm |\n\n**This is the single most important calculation in SAH monitoring.** An MCA velocity of 180 cm/s means completely different things at a ratio of 2 versus a ratio of 7 — the first is a well-perfused brain, the second is a brain at risk of infarction.\n\n**Rate of rise matters too.** An increase of more than about 50 cm/s per day is concerning even before absolute thresholds are crossed.\n\nFor the posterior circulation, an analogous basilar-to-vertebral ratio is used.\n\n---\n\n## Sickle Cell Disease Screening\n\nTCD screening in children with sickle cell disease is one of the clearest examples of imaging preventing disease, following the landmark stroke-prevention trial evidence.\n\nMeasurement uses **time-averaged mean maximum velocity (TAMMV)** in the MCA or distal ICA:\n\n| TAMMV | Risk category |\n|---|---|\n| \u003c 170 cm/s | Normal |\n| 170–199 cm/s | Conditional — repeat sooner |\n| ≥ 200 cm/s | Abnormal — high stroke risk |\n\nChildren with abnormal velocities have a substantially elevated stroke risk, and chronic transfusion therapy markedly reduces it. **Use the correct measurement (TAMMV, not peak systolic) and follow your protocol's repeat intervals** — this is a screening programme, and its value depends on consistency.\n\n---\n\n## Other Applications\n\n**Acute stroke:** Assessing intracranial occlusion and recanalization. The TIBI grading system describes residual flow from absent (grade 0) through to normal (grade 5).\n\n**Emboli detection:** Microembolic signals appear as short-duration, high-intensity transient signals within the Doppler spectrum, with a characteristic audible chirp. Used in carotid disease and during cardiac and carotid surgery.\n\n**Right-to-left shunt detection (\"bubble study\"):** Agitated saline injected intravenously while monitoring the MCA. Microbubbles appearing in the cerebral circulation, particularly after Valsalva, indicate a shunt such as a patent foramen ovale.\n\n**Cerebral circulatory arrest:** In brain death assessment, TCD may show characteristic patterns — oscillating to-and-fro flow, or short systolic spikes. This is an ancillary test performed under strict protocol, never a standalone determination.\n\n**Vasomotor reactivity:** Response to a CO₂ or breath-holding challenge assesses cerebrovascular reserve.\n\n---\n\n## Key Images to Capture\n\n1. MCA spectral waveform with depth, MFV, PSV, EDV, PI\n2. ACA, PCA, terminal ICA — bilaterally\n3. Vertebral and basilar arteries via the suboccipital window\n4. Extracranial ICA via the submandibular window where the Lindegaard ratio is needed\n5. Documentation of window adequacy on each side\n6. Serial comparison table where monitoring\n\n---\n\n## Reporting Language\n\n\"Adequate bilateral temporal windows. Right MCA mean flow velocity 186 cm/s at 52 mm depth (previous study 128 cm/s). Right extracranial ICA MFV 28 cm/s, giving a Lindegaard ratio of 6.6. Left MCA MFV 92 cm/s, ratio 2.9. Pulsatility index 0.7 bilaterally. Findings consistent with severe right MCA vasospasm with a significant interval rise. Recommend urgent clinical correlation.\"\n\n---\n\n*SonoBuddy is a reference tool. TCD findings in acute neurological patients require immediate direct communication with the clinical team.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"transcranial-doppler-ultrasound-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"transcranial-doppler-ultrasound-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"transcranial-doppler-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"transcranial-doppler-ultrasound-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"transcranial-doppler-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"transcranial-doppler-ultrasound-guide\",\"title\":\"Transcranial Doppler: Windows, Velocities, and Vasospasm Detection\",\"date\":\"2026-08-27\",\"excerpt\":\"Performing TCD — the four acoustic windows, vessel identification by depth and flow direction, normal velociti
