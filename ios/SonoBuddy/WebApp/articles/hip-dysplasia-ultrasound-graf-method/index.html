c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T17ba,"])</script><script>self.__next_f.push([1,"Developmental dysplasia of the hip (DDH) is the most common musculoskeletal condition in newborns. Ultrasound is the standard imaging modality for hip evaluation in infants under 6 months (before the femoral head ossifies and becomes visible on X-ray). The Graf method is the most widely used technique worldwide.\n\n## Indications for Infant Hip Ultrasound\n\n- Positive Barlow or Ortolani maneuver on physical exam\n- Breech presentation at any gestational age\n- Family history of DDH (first-degree relative)\n- Female sex + breech presentation (highest risk)\n- Clinical finding of hip click or asymmetric skin folds\n- Screening programs (varies by institution and country)\n- Follow-up after treatment (Pavlik harness)\n\n## Equipment\n\n**Probe:** 5–12 MHz linear transducer. High frequency for small infants.\n\n**Patient position:** Infant lies in the lateral decubitus position, hip being examined facing up, hip in neutral or 30–40° flexion.\n\n**Immobilization:** A parent or assistant holds the infant steady. The baby is often easier to scan after feeding.\n\n## The Standard Coronal Plane (Graf Plane)\n\nThe Graf method requires a specific coronal image of the hip. Getting this plane right is everything — measurements made from the wrong plane are meaningless.\n\n### Landmarks for the Correct Plane\n\nYou need to see all three of these simultaneously:\n\n1. **Os ilium (iliac bone):** Straight, horizontal echogenic line — this is the roof of the acetabulum. It must be perfectly flat (straight), not curved. A curved ilium means the probe is tilted.\n\n2. **Triradiate cartilage:** The echogenic midpoint at the base of the acetabulum — the transition from the bony acetabular roof to the cartilaginous roof.\n\n3. **Labrum:** The echogenic fibrocartilaginous rim at the outer edge of the acetabulum.\n\n4. **Femoral head:** Round, hypoechoic structure sitting within the acetabulum.\n\n**If the ilium is not perfectly straight:** Tilt the probe until it is. This is the most common technical error.\n\n## Graf Angle Measurements\n\nOnce you have the correct plane, draw three lines:\n\n**Baseline:** Along the flat surface of the os ilium (the iliac wing). This is your reference line.\n\n**Bony roof line (alpha angle line):** From the bony rim (the corner/edge of the bony acetabular roof) to the intersection with the baseline.\n\n**Cartilaginous roof line (beta angle line):** From the labrum to the midpoint of the triradiate cartilage.\n\n### Alpha Angle (α)\n\nThe angle between the baseline and the bony roof line.\n\n- Measures how much bony coverage the femoral head has\n- **Normal:** ≥ 60°\n- \u003c 60°: Insufficient bony coverage — concerning for dysplasia\n\n### Beta Angle (β)\n\nThe angle between the baseline and the cartilaginous roof line.\n\n- Measures the cartilaginous roof position\n- **Normal:** \u003c 55°\n- \u003e 55°: Cartilaginous roof is displaced laterally\n\n## Graf Classification\n\n| Type | Alpha | Beta | Clinical Meaning |\n|---|---|---|---|\n| Type I | ≥ 60° | \u003c 55° | Mature, normal hip |\n| Type IIa | 50–59° | \u003c 55° | Physiologically immature (\u003c 3 months) — normal, monitor |\n| Type IIb | 50–59° | \u003c 55° | Physiologically immature (\u003e 3 months) — treatment warranted |\n| Type IIc | 43–49° | \u003c 77° | Deficient bony roof, critical range |\n| Type IId | 43–49° | ≥ 77° | Eccentric — cartilaginous roof displaced |\n| Type III | \u003c 43° | \u003e 77° | Poor bony rim, cartilaginous roof pushed superiorly — subluxed |\n| Type IV | \u003c 43° | — | Inferiorly displaced cartilaginous roof — dislocated |\n\n**Practical summary:**\n- **Type I:** Normal\n- **Type IIa:** Normal if \u003c 3 months — recheck at 3 months\n- **Type IIb+:** Requires orthopedic consultation and often Pavlik harness\n- **Type III–IV:** Dysplastic or dislocated hip — treatment necessary\n\n## Dynamic Assessment\n\nIn addition to the static Graf measurements, perform a dynamic stress test:\n\n**Technique:** With the probe coronal, gently push the knee toward the table (posterior force on the hip). Observe whether the femoral head subluxes or dislocates out of the acetabulum.\n\n- **Stable:** Femoral head stays in acetabulum\n- **Lax:** Femoral head moves but returns\n- **Subluxable:** Femoral head partially exits\n- **Dislocatable:** Femoral head fully dislocates with stress\n\nDocument dynamic stability separate from the Graf type.\n\n## Common Technical Errors\n\n**Curved iliac line:** The probe is tilted — the image plane isn't truly coronal. The ilium must be straight. Rotate or tilt the probe until it's flat.\n\n**Missing the triradiate cartilage:** If you can't see the cartilage midpoint, you're too posterior or too anterior. Slide the probe to find it.\n\n**Too much pressure:** Compress the hip and you'll push the femoral head into the acetabulum artificially — don't push hard with the probe.\n\n**Wrong side up:** Always document which hip (right or left) is being imaged. The bony roof is always the deep (far) structure — ilium above, femoral head below.\n\n## Reporting Template\n\nDocument for each hip:\n- Alpha angle (in degrees)\n- Beta angle (in degrees)\n- Graf type\n- Femoral head coverage (% of femoral head covered by bony acetabulum)\n- Dynamic stability\n- Image quality / technical limitations\n\n**Reporting language:**\n- \"Right hip: alpha 64°, beta 48°, Graf Type I. Femoral head well-seated within the acetabulum. No dynamic instability.\"\n- \"Left hip: alpha 52°, beta 53°, Graf Type IIa. Consistent with physiological immaturity given age of 6 weeks. Recommend clinical follow-up at 3 months.\"\n- \"Left hip: alpha 41°, beta 80°, Graf Type III. Poor bony acetabular coverage with superiorly displaced cartilaginous roof. Femoral head subluxes with posterior stress maneuver. Orthopedic consultation recommended.\"\n\n## Post-Harness Follow-Up\n\nDuring Pavlik harness treatment, serial ultrasounds monitor hip development. Goals:\n- Increasing alpha angle toward ≥ 60°\n- Improved femoral head centering\n- Reduction of dynamic instability\n\n---\n\n*SonoBuddy's Protocols section includes infant hip ultrasound. Measurements section covers Graf angle normal values by age.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"hip-dysplasia-ultrasound-graf-method\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"hip-dysplasia-ultrasound-graf-method\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"hip-dysplasia-ultrasound-graf-method\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"hip-dysplasia-ultrasound-graf-method\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"hip-dysplasia-ultrasound-graf-method\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"hip-dysplasia-ultrasound-graf-method\",\"title\":\"Infant Hip Dysplasia Ultrasound: Graf Method Explained\",\"date\":\"2026-08-12\",\"excerpt\":\"How to perform infant hip ultrasound using the Graf method — correct coronal plane, alpha and beta angle measurement, Graf classification, and what each type means clinically.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"pediatric\",\"hip\",\"protocol\",\"Graf\",\"DDH\",\"musculoskeletal\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"pediatric-hip-effusion-septic-vs-transient\",\"title\":\"The Limping Child: Hip Effusion, Septic Arthritis, and Ultrasound-Guided Aspiration\",\"excerpt\":\"Ultrasound for the acutely limping or hip-pain child — measuring effusion correctly, why g
