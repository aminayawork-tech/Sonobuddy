c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1f76,"])</script><script>self.__next_f.push([1,"The inferior vena cava is one of the most frequently measured and most frequently mismeasured structures in point-of-care ultrasound. The measurement itself takes fifteen seconds. Getting a number that means something takes technique and, just as importantly, knowing when the number does not apply.\n\n---\n\n## Why the IVC Is Measured\n\nThe IVC is a compliant vessel draining directly into the right atrium. Its diameter and respiratory variation reflect right atrial pressure, which is used as a surrogate for central venous pressure and, more loosely, intravascular volume status.\n\nThe relationship is real but indirect. The IVC tells you about right atrial pressure. Right atrial pressure is related to volume status, but so are ventricular compliance, intrathoracic pressure, intra-abdominal pressure, and pulmonary vascular resistance. Treat the IVC as one input, not an answer.\n\n---\n\n## Technique\n\n### Subxiphoid Longitudinal (Standard)\n\n**Probe:** Curvilinear or phased array, 2–5 MHz.\n\n**Position:** Patient supine. Probe in the subxiphoid region, marker toward the patient's head, in a sagittal plane just right of midline.\n\n**Landmarks:** Find the liver, then follow the IVC as it passes through the liver toward the right atrium. Confirm you are on the IVC and not the aorta:\n\n| Feature | IVC | Aorta |\n|---|---|---|\n| Position | Right of midline | Left of midline |\n| Wall | Thin, compressible | Thick, non-compressible |\n| Shape | Ovoid, varies with respiration | Round, constant |\n| Drains into | Right atrium | Bifurcates distally |\n| Hepatic veins | Drain into it | No |\n| Pulsatility | Respiratory variation | Arterial pulsation |\n\n**Confirming the hepatic vein confluence entering the vessel is the most reliable single check.**\n\n### Where to Measure\n\nMeasure **1 to 2 cm caudal to the hepatic vein–IVC junction**, or roughly 2 cm from the right atrium. This is the standard location and consistency matters more than precision about the exact centimetre — the IVC tapers, so measuring at different levels on serial studies produces meaningless trends.\n\nMeasure the **anteroposterior diameter**, perpendicular to the vessel walls, at end-expiration for the maximum and at peak inspiration for the minimum.\n\n### The Cylinder Effect\n\nThe commonest technical error. If your scan plane is off-axis, you cut an oblique slice through a cylindrical vessel and systematically **underestimate** the diameter. Angle the probe side to side to find the true maximum diameter before measuring, and keep the vessel walls parallel on screen.\n\n### Coronal (Right Lateral) Window\n\nWhen bowel gas or a surgical dressing blocks the subxiphoid view, image from the right mid-axillary line using the liver as a window, similar to a RUQ FAST view. The IVC is seen in long axis posterior to the liver.\n\nThis view is more reproducible in some patients but tends to give slightly different absolute values than the subxiphoid approach. Note which window you used.\n\n---\n\n## Calculations\n\n### IVC Collapsibility Index (Spontaneously Breathing)\n\n```\nIVC-CI (%) = (Dmax − Dmin) / Dmax × 100\n```\n\nWhere Dmax is end-expiratory and Dmin is peak-inspiratory diameter. During spontaneous inspiration, negative intrathoracic pressure draws blood into the chest and the IVC collapses.\n\n### IVC Distensibility Index (Mechanically Ventilated)\n\n```\nIVC-DI (%) = (Dmax − Dmin) / Dmin × 100\n```\n\nThe physiology **inverts** under positive pressure ventilation — inspiration now increases intrathoracic pressure and distends the IVC. Using the wrong formula for the wrong patient produces a confidently wrong answer, so establish whether the patient is spontaneously breathing or ventilated before you calculate anything.\n\n### Right Atrial Pressure Estimation\n\nWidely used guidance combines diameter and collapse:\n\n| IVC diameter | Collapse with inspiration | Estimated RA pressure |\n|---|---|---|\n| ≤ 2.1 cm | \u003e 50% | Low — approximately 3 mmHg (range 0–5) |\n| ≤ 2.1 cm | \u003c 50% | Intermediate — approximately 8 mmHg |\n| \u003e 2.1 cm | \u003e 50% | Intermediate — approximately 8 mmHg |\n| \u003e 2.1 cm | \u003c 50% | High — approximately 15 mmHg |\n\nThe intermediate category is genuinely intermediate — when a patient falls there, secondary indices and the wider clinical picture carry the weight, not the IVC.\n\nA **sniff test** (a short sharp inspiration) augments collapse and is part of the standard assessment.\n\n---\n\n## Interpretation\n\n**Small, highly collapsible IVC (\u003c 1 cm, near-total collapse):** Suggests low right atrial pressure. In a hypotensive patient this supports hypovolaemia or distributive shock and predicts likely fluid responsiveness.\n\n**Dilated, non-collapsing IVC (\u003e 2.1 cm, minimal variation, sometimes called \"plethoric\"):** Suggests elevated right atrial pressure. Consider right heart failure, pulmonary hypertension, cardiac tamponade, tension pneumothorax, massive pulmonary embolism, or volume overload. **A plethoric IVC in a shocked patient is an important finding** — it argues strongly against giving more fluid and points toward obstructive or cardiogenic causes.\n\n**Intermediate:** Common, and honestly reported as intermediate rather than forced into a category.\n\n---\n\n## When the IVC Lies\n\nThis is the part that matters most, and the part most often skipped.\n\nThe IVC becomes unreliable or uninterpretable in:\n\n- **Mechanical ventilation**, particularly with high PEEP — the relationship between IVC size and volume status is substantially altered\n- **Raised intra-abdominal pressure** — abdominal compartment syndrome, pregnancy, massive ascites, morbid obesity all compress the IVC independent of volume\n- **Right heart failure and pulmonary hypertension** — the IVC is dilated because of pressure, not volume\n- **Cardiac tamponade and tension pneumothorax** — plethoric IVC with a hypovolaemic-appearing patient\n- **Valsalva or breath-holding** — patients often unconsciously do this while you scan; watch that they are breathing normally\n- **Athletes and young healthy people** — can have a physiologically dilated IVC with normal pressures\n- **Arrhythmia** — beat-to-beat variation makes measurements inconsistent\n\nThe honest summary: a very small collapsing IVC and a very large non-collapsing IVC both carry real information. Everything in between should be interpreted cautiously, and a single IVC measurement should never be the sole basis for a fluid decision.\n\n---\n\n## Serial Measurement\n\nThe IVC is arguably more useful as a trend than as a single number. Measuring before and after a fluid challenge, at the same location and in the same window, tracks the response in a way that one snapshot cannot. If your department uses IVC assessment for fluid management, standardizing window and measurement level across operators is what makes serial studies comparable.\n\n---\n\n## Key Images to Capture\n\n1. Subxiphoid long-axis IVC with hepatic vein confluence visible\n2. Maximum diameter measurement at end-expiration, 1–2 cm caudal to the confluence\n3. Minimum diameter at peak inspiration\n4. M-mode trace through the IVC showing respiratory variation\n5. Coronal view if the subxiphoid window is limited\n6. Documentation of whether the patient is spontaneously breathing or ventilated\n\n**M-mode tip:** Place the cursor perpendicular to the vessel at the measurement point. It gives a clean simultaneous record of maximum and minimum diameter over the respiratory cycle and is far easier to reproduce than freezing two separate B-mode frames.\n\n---\n\n## Reporting Language\n\n\"IVC measured in the subxiphoid long-axis view 1.5 cm caudal to the hepatic vein confluence. Maximum diameter 2.6 cm at end-expiration, minimum 2.3 cm at peak inspiration, collapsibility index 12%. Patient spontaneously breathing. Findings suggest elevated right atrial pressure (approximately 15 mmHg). Note the IVC is a single indirect marker — correlate with clinical assessment and cardiac findings.\"\n\n---\n\n*SonoBuddy is a reference tool, not a diagnostic authority. Volume and fluid decisions belong with the treating clinician.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"ivc-ultrasound-volume-status\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"ivc-ultrasound-volume-status\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"ivc-ultrasound-volume-status\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"ivc-ultrasound-volume-status\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"ivc-ultrasound-volume-status\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"ivc-ultrasound-volume-status\",\"title\":\"IVC Ultrasound: Measurement Technique and Volume Status Assessment\",\"date\":\"2026-08-15\",\"excerpt\":\"How to measure the inferior vena cava correctly — subxiphoid and coronal windows, collapsibility and distensibility indices, RA pressure estimation, and the pitfalls that make IVC assessment unreliable.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"vascular\",\"IVC\",\"POCUS\",\"volume status\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"lung-pleural-ultrasound-guide\",\"title\":\"Lung and Pleural Ultrasound: A-Lines, B-Lines, and Effusion Assessment\",\"excerpt\":\"Reading the artifacts that make lung ultrasound work — lung sliding, A-lines and B-lines, pneumothorax signs, pleural effusion volume estimatio
