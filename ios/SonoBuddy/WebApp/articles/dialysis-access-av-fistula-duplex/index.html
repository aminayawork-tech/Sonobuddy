c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1fb6,"])</script><script>self.__next_f.push([1,"Dialysis access is a patient's lifeline, and access failure is one of the leading causes of hospitalization in the haemodialysis population. Duplex surveillance detects failing access before it thromboses, which is the difference between an elective angioplasty and an emergency.\n\nThe study has two distinct purposes depending on timing: assessing whether a new fistula is maturing, and surveilling an established access for stenosis.\n\n---\n\n## Anatomy and Access Types\n\n**Arteriovenous fistula (AVF)** — a direct surgical anastomosis between artery and vein. Preferred access: lower infection and thrombosis rates, longer patency. Needs weeks to months to mature.\n\nCommon configurations, in the usual order of surgical preference:\n\n- **Radiocephalic** (Brescia–Cimino) — radial artery to cephalic vein at the wrist\n- **Brachiocephalic** — brachial artery to cephalic vein at the antecubital fossa\n- **Brachiobasilic** with transposition — basilic vein moved superficially\n\n**Arteriovenous graft (AVG)** — synthetic conduit between artery and vein. Usable sooner, but higher stenosis and infection rates. The **venous anastomosis is the classic site of stenosis**.\n\n---\n\n## Technique\n\n**Probe:** High-frequency linear, 7–15 MHz. A lower-frequency probe may be needed for deep basilic transpositions or obese patients.\n\n**Patient position:** Arm extended, supported, externally rotated. A warm room genuinely matters — a cold arm vasoconstricts and depresses flow measurements.\n\n**Scan the entire circuit** in order, because a stenosis anywhere along it affects the whole access:\n\n1. **Inflow artery** — proximal to the anastomosis\n2. **Anastomosis**\n3. **Juxta-anastomotic segment** — the first few centimetres of outflow vein, the most common stenosis site in an AVF\n4. **Body of the fistula or graft** — including cannulation zones\n5. **Venous outflow** — including the graft's venous anastomosis\n6. **Central veins** — subclavian, brachiocephalic, as far as accessible\n\n**Document arm and configuration** on every study. Serial comparison is the entire value of surveillance, and it is worthless if the reports do not say what was scanned.\n\n---\n\n## Volume Flow Measurement\n\nThe single most important number in access surveillance.\n\n**Where to measure:** In the **brachial artery**, roughly 3–5 cm proximal to the anastomosis, where flow is laminar. Measuring within the fistula itself is unreliable — the vessel is tortuous, aneurysmal, and flow is disturbed.\n\n**How:**\n\n1. Obtain a clean longitudinal image with the vessel walls parallel\n2. Measure the vessel **diameter** carefully — volume flow depends on the square of the radius, so a small diameter error produces a large flow error. This is the dominant source of inaccuracy.\n3. Obtain a **time-averaged mean velocity** (TAMV) with the sample volume covering the full lumen\n4. Keep the **Doppler angle at 60° or less**\n\n```\nVolume flow (mL/min) = TAMV (cm/s) × cross-sectional area (cm²) × 60\n```\n\nMost machines calculate this automatically once diameter and TAMV are set. Take **three measurements and average them.**\n\n### Interpreting Volume Flow\n\n| Volume flow | Interpretation |\n|---|---|\n| \u003c 400–500 mL/min (AVF) | Low — high risk of thrombosis |\n| \u003c 600 mL/min (AVG) | Low — commonly used threshold for intervention in grafts |\n| 600–1500 mL/min | Typical functioning access |\n| \u003e 2000 mL/min | High-output access; consider cardiac consequences |\n\nA **fall of more than about 25% from a previous measurement** is significant even if the absolute value remains within range. This is why serial studies and consistent technique matter more than any single number.\n\n---\n\n## Maturation Assessment — The Rule of 6s\n\nFor a new fistula, a widely used and easily remembered guide:\n\n- **6 weeks** post-creation\n- Flow greater than **600 mL/min**\n- Diameter greater than **6 mm**\n- Depth less than **6 mm** from the skin\n\nDepth is frequently forgotten and is a common reason a fistula with excellent flow still cannot be cannulated — the dialysis nurse cannot reliably needle a vein sitting 12 mm deep. A deep but otherwise mature fistula may need superficialization, so **always report depth**.\n\nAlso assess: absence of significant accessory or competing branches diverting flow, and adequate length of straight, cannulable segment.\n\n---\n\n## Stenosis Criteria\n\n**Peak systolic velocity ratio** is the primary criterion: PSV at the stenosis divided by PSV in a normal segment 2 cm proximal.\n\n- **PSV ratio \u003e 2:1** — suggests a haemodynamically significant stenosis (\u003e 50%)\n- **PSV ratio \u003e 3:1** — used by many laboratories as the threshold for a higher-grade stenosis\n\nSupporting findings:\n\n- **Absolute PSV \u003e 400 cm/s** at the stenosis\n- **Focal luminal narrowing** on B-mode with a residual lumen under about 2 mm\n- **Post-stenotic turbulence** and spectral broadening\n- **Reduced volume flow** downstream\n\n**Where stenoses occur:**\n\n- **AVF:** juxta-anastomotic segment is by far the commonest, followed by cannulation zones and central veins\n- **AVG:** the venous anastomosis is classic, plus intra-graft stenosis at cannulation sites\n\n**Central venous stenosis** deserves specific attention, particularly in patients with prior central lines or pacemakers. Look for loss of respiratory phasicity and loss of cardiac pulsatility in the subclavian and axillary veins — a continuous, non-phasic waveform suggests a more central obstruction even when you cannot image the lesion directly. Arm swelling with a continuous outflow waveform is a strong combination.\n\n---\n\n## Other Complications\n\n**True aneurysm:** Dilatation involving all vessel wall layers, usually at repeatedly cannulated segments. Measure maximum diameter and assess overlying skin thickness — thin, shiny, or ulcerated skin over an aneurysm is a rupture risk and needs urgent flagging.\n\n**Pseudoaneurysm:** Contained wall defect, most often at a cannulation site or graft puncture. Look for the **yin-yang** swirling flow pattern and a demonstrable **neck with to-and-fro flow**. Measure the sac and the neck.\n\n**Thrombus:** Echogenic material within the lumen with absent or reduced flow. Distinguish partial from occlusive, and document the extent — how much of the access is involved determines whether it is salvageable.\n\n**Steal syndrome:** The access diverts so much flow that the distal hand becomes ischaemic. Look for **retrograde (reversed) flow in the artery distal to the anastomosis**. A useful bedside test: compress the fistula and observe whether distal arterial flow normalizes and the patient's symptoms improve. Correlate with clinical findings — cold, painful, pale hand, and in severe cases digital ulceration.\n\n**Infection:** Perigraft fluid collection with surrounding hyperaemia. In a graft this is a serious finding warranting prompt communication.\n\n---\n\n## Key Images to Capture\n\n1. Inflow artery with spectral waveform\n2. Anastomosis, B-mode and colour\n3. Juxta-anastomotic segment with PSV\n4. Volume flow measurement in the brachial artery — diameter, TAMV, calculated flow\n5. Body of fistula or graft with diameter and **depth** measurements\n6. Any stenosis — B-mode, colour, PSV at and proximal to the lesion, with ratio\n7. Venous outflow and accessible central veins with waveforms\n8. Any aneurysm or pseudoaneurysm — measurements and Doppler\n9. Distal arterial flow direction where steal is suspected\n\n---\n\n## Reporting Language\n\n\"Left brachiocephalic AV fistula. Volume flow in the brachial artery 480 mL/min (previous study 890 mL/min, a 46% reduction). Focal narrowing in the juxta-anastomotic segment with residual lumen 1.8 mm, PSV 465 cm/s against 140 cm/s in the adjacent proximal segment, ratio 3.3:1. Post-stenotic turbulence present. Fistula depth 5 mm, diameter 8 mm. Subclavian vein waveform remains phasic. Findings consistent with a high-grade juxta-anastomotic stenosis with significantly reduced access flow; recommend prompt vascular assessment.\"\n\n---\n\n*SonoBuddy includes volume flow and velocity ratio calculators alongside vascular protocols — offline in the vascular lab.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"dialysis-access-av-fistula-duplex\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"dialysis-access-av-fistula-duplex\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"dialysis-access-av-fistula-duplex\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"dialysis-access-av-fistula-duplex\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"dialysis-access-av-fistula-duplex\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"dialysis-access-av-fistula-duplex\",\"title\":\"Dialysis Access Duplex: AV Fistula and Graft Surveillance\",\"date\":\"2026-08-25\",\"excerpt\":\"Scanning arteriovenous fistulas and grafts — volume flow measurement, the rule of 6s for maturation, stenosis velocity criteria, aneurysm versus pseudoaneurysm, and steal syndrome.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"vascular\",\"dialysis\",\"AV fistula\",\"volume flow\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"vein-mapping-ultrasound-protocol\",\"title\":\"Vein Mapping: Preoperative Assessment for Dialysis Access and Bypass Conduit\",\"excerpt\":\"How to map upper limb veins for AV fistula creation and the great saphenous vein for
