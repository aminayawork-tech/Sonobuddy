c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1f66,"])</script><script>self.__next_f.push([1,"This is a different clinical question from infant hip dysplasia screening, and it's worth being clear about the distinction up front: the Graf method assesses acetabular development in infants who aren't yet symptomatic. This study answers a different, more urgent question — a child who is limping or refusing to bear weight, where the differential runs from benign transient synovitis to a joint-destroying septic arthritis. Ultrasound's job here is fast, focused, and specific: is there an effusion, and can we help get a sample of it.\n\n---\n\n## Why Ultrasound First\n\nPlain radiographs are often normal early in septic arthritis and cannot reliably detect a joint effusion. Ultrasound detects hip effusion with high sensitivity, is fast, requires no sedation, and can be performed at the bedside — making it the natural first-line study for the acutely painful pediatric hip.\n\n**What ultrasound cannot do on its own: reliably distinguish septic arthritis from transient synovitis.** Both produce a joint effusion, and grayscale appearance alone is not specific enough to separate them. This is the single most important thing to understand about this study — a normal-looking anechoic effusion does not exclude infection, and effusion characteristics only shift the probability, they don't settle the question.\n\n---\n\n## Technique\n\n**Probe:** High-frequency linear, 7–15 MHz for most children; consider a lower frequency in a larger adolescent if penetration is limited.\n\n**Position:** Supine, hip in **slight flexion and mild internal rotation** — this relaxes the anterior joint capsule and brings the recess into better view. A frog-leg position can help in an infant.\n\n**Approach:** Longitudinal view along the femoral neck, angled to capture the anterior synovial recess — the anatomic space where a hip effusion first accumulates and is most reliably measured.\n\n### Landmarks\n\nIdentify the femoral head, femoral neck, and the anterior joint capsule overlying them. The normal capsule lies flush against the femoral neck. A collection lifts and distends it.\n\n---\n\n## Measuring the Effusion\n\n**What to measure:** The distance between the anterior surface of the femoral neck and the posterior surface of the joint capsule — the **capsule–neck distance** — measured perpendicular to the femoral neck at its most distended point.\n\n**Compare to the contralateral hip.** This is the single most useful technique refinement in this study. Hip capsule distance varies between children, and a bilateral comparison catches a subtle unilateral effusion that a single absolute number might miss.\n\n### Thresholds\n\nWidely cited criteria for a significant effusion:\n\n- **Absolute capsule–neck distance greater than approximately 5 mm** in most pediatric protocols (age-dependent — smaller in infants)\n- **A side-to-side difference greater than approximately 2 mm**, even if the absolute value is below the general threshold\n\nBoth criteria matter, and either one alone can be the finding that changes management — always report both the absolute measurement and the side-to-side comparison.\n\n---\n\n## Grayscale Features — Suggestive, Not Diagnostic\n\nCertain sonographic features are statistically associated with septic arthritis rather than transient synovitis, but none is individually reliable enough to make the call alone:\n\n- **Complex, echogenic, or heterogeneous fluid** — more suggestive of pus than the classically anechoic fluid of transient synovitis, though septic effusions can occasionally appear simple, and transient synovitis fluid is occasionally complex\n- **Synovial thickening and hyperemia** on power or color Doppler — more common in true infection, though also seen in inflammatory arthritis\n- **Capsular thickening**\n- **Adjacent soft tissue edema or a periosteal reaction** — raises concern for adjacent osteomyelitis, a different and more extensive process\n\n**None of these findings excludes or confirms septic arthritis on their own.** The clinical decision leans heavily on validated clinical prediction rules (fever, inability to bear weight, ESR/CRP, white cell count — commonly the Kocher criteria) used **alongside** the ultrasound findings, not instead of them. State plainly in the report that ultrasound demonstrates an effusion and its characteristics, and that the distinction from septic arthritis requires clinical and laboratory correlation — do not imply a grayscale-only diagnosis either way.\n\n---\n\n## Ultrasound-Guided Aspiration\n\nWhen clinical suspicion for septic arthritis is high, aspiration for synovial fluid analysis and culture is often the deciding test — and ultrasound guidance meaningfully improves both success rate and safety over a landmark-based approach, particularly in a small or anxious child.\n\n### Preparation\n\n- Sterile technique: probe cover, sterile gel, prepped skin\n- Position as for diagnostic scanning — slight flexion and internal rotation\n- Identify the largest, most accessible pocket of fluid and the safest needle path, avoiding the femoral vessels and nerve, which sit medial to the joint\n\n### Technique\n\n- **In-plane approach** is generally preferred for this procedure — the needle is visualized along its entire length as it advances toward the fluid pocket, which matters for a small target near vascular structures.\n- Confirm needle tip position within the fluid collection before aspirating.\n- Send fluid for cell count, Gram stain, culture, and glucose per your institution's protocol.\n\n### After Aspiration\n\nDocument the residual effusion size, if any, and note whether the collection was fully or partially evacuated — relevant if a repeat study or drainage procedure is being considered.\n\n---\n\n## Other Considerations\n\n**Osteomyelitis with a contiguous joint effusion** can mimic primary septic arthritis on ultrasound. Look at the adjacent metaphysis and periosteum for subtle changes — subperiosteal fluid or periosteal elevation — that would point toward bone involvement changing the treatment plan and duration.\n\n**Perthes disease and slipped capital femoral epiphysis** are important non-infectious differentials in the limping child, though ultrasound plays a lesser role in these — plain films are usually the more direct study. If clinical suspicion is present alongside a limp, note it, since the imaging pathway differs.\n\n**Serial ultrasound** can track effusion resolution over the course of treatment, useful in following clinical response without repeated radiation exposure.\n\n---\n\n## Key Images to Capture\n\n1. Right hip — longitudinal view along the femoral neck, with capsule–neck distance measurement\n2. Left hip — same view and measurement, for direct comparison\n3. Color or power Doppler over the synovium of the affected side\n4. Any complex or heterogeneous fluid characteristics, documented clearly\n5. If aspiration performed: needle position within the fluid collection, and a post-aspiration image\n\n---\n\n## Reporting Language\n\n**Effusion present, indeterminate:**\n\"Right hip capsule–neck distance measures 7 mm, compared to 3 mm on the asymptomatic left side — a significant unilateral effusion. The fluid is predominantly anechoic with scattered low-level internal echoes. Mild synovial hyperemia is present on power Doppler. These findings do not reliably distinguish septic arthritis from transient synovitis; correlation with clinical exam and inflammatory markers is recommended, and aspiration should be considered per the treating team's assessment.\"\n\n**Post-aspiration:**\n\"Ultrasound-guided aspiration of the right hip joint effusion was performed using an in-plane technique. Approximately 4 mL of turbid fluid was aspirated and sent for cell count, Gram stain, and culture. Residual capsule–neck distance post-procedure measures 3 mm, similar to the contralateral side.\"\n\n---\n\n*SonoBuddy is a reference tool for sonographers, not a diagnostic authority. Suspected septic arthritis in a child requires urgent clinical evaluation regardless of sonographic appearance.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"pediatric-hip-effusion-septic-vs-transient\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"pediatric-hip-effusion-septic-vs-transient\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"pediatric-hip-effusion-septic-vs-transient\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"pediatric-hip-effusion-septic-vs-transient\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"pediatric-hip-effusion-septic-vs-transient\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"pediatric-hip-effusion-septic-vs-transient\",\"title\":\"The Limping Child: Hip Effusion, Septic Arthritis, and Ultrasound-Guided Aspiration\",\"date\":\"2026-10-07\",\"excerpt\":\"Ultrasound for the acutely limping or hip-pain child — measuring effusion correctly, why grayscale can't separate septic from transient synovitis alone, and assisting the aspiration.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"pediatric\",\"hip\",\"effusion\",\"septic arthritis\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"hip-dysplasia-ultrasound-graf-method\",\"title\":\"Infant Hip Dysplasia Ultrasound: Graf Method Explained\",\"excerpt\":\"How to perform infant hip ultrasound using the Graf method — correct coronal plane, alpha and beta angle measurement, Graf classification, and what each type means
