c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1d6c,"])</script><script>self.__next_f.push([1,"Twin pregnancies require careful ultrasound evaluation from the very beginning — the most important determination is chorionicity, because monochorionic twins carry significantly higher risk than dichorionic twins. Get this wrong and clinical management is compromised.\n\n## Why Chorionicity Matters\n\nChorionicity (whether twins share a placenta) determines risk:\n\n| Type | Shared? | Perinatal Mortality Risk |\n|---|---|---|\n| Dichorionic Diamniotic (DCDA) | Separate placentas, separate sacs | ~3–4% |\n| Monochorionic Diamniotic (MCDA) | Shared placenta, separate sacs | ~15% |\n| Monochorionic Monoamniotic (MCMA) | Shared placenta, shared sac | ~30–50% |\n\nMCDA twins are at risk for twin-to-twin transfusion syndrome (TTTS), selective fetal growth restriction (sFGR), and twin anemia-polycythemia sequence (TAPS). MCMA twins have additional risk from cord entanglement.\n\n**Bottom line:** Chorionicity must be established at the first trimester ultrasound when it is most accurate.\n\n---\n\n## First Trimester Determination (\u003c 14 Weeks)\n\nThe first trimester is the best time — accuracy approaches 100% for chorionicity and 98% for amnionicity.\n\n### Number of Gestational Sacs\n\n**Two sacs → Dichorionic** (DI): Each embryo in its own chorionic sac. If two clearly separate sacs are seen, it's dichorionic regardless of placentation appearance.\n\n**One sac → Monochorionic** (MC): One chorionic sac with one or two amnions inside.\n\n### Number of Yolk Sacs\n\nWithin a single chorionic sac:\n- **Two yolk sacs → MCDA** (two amnions — each embryo has its own amnion, but share chorion)\n- **One yolk sac → MCMA** (one amnion — both embryos share everything)\n\n### Membrane Findings\n\nBy 8–10 weeks the dividing membrane (if present) is visible as a thin line.\n\n---\n\n## Second and Third Trimester Determination\n\nWhen first-trimester imaging is unavailable, chorionicity is harder to determine but several signs help.\n\n### The Lambda Sign (Twin Peak Sign) — Dichorionic\n\n**Lambda sign:** A wedge of placental tissue extending into the base of the inter-twin membrane — formed by chorionic villi infiltrating the membrane between the two placentas.\n\n**Appearance:** A triangular echogenic tissue projection at the membrane's placental insertion — \"a peaked cap\" at the base.\n\n**Present in dichorionic diamniotic twins only.** Sensitivity \u003e 90% in second trimester; decreases with advancing gestation.\n\n### The T-Sign — Monochorionic\n\n**T-sign:** The inter-twin membrane inserts at a right angle (90°) to the placenta forming a \"T\" shape. There is no placental tissue infiltrating the base of the membrane.\n\n**Present in monochorionic diamniotic twins.** The membrane is thin and inserts directly onto the chorionic plate.\n\n**Summary:**\n\n| Sign | Chorionicity |\n|---|---|\n| Lambda / twin peak | Dichorionic diamniotic |\n| T-sign | Monochorionic diamniotic |\n| No membrane | Monochorionic monoamniotic |\n\n### Placental Number and Location\n\n- **Two placentas clearly separated:** Dichorionic\n- **Single placenta with fused appearance:** May be DCDA (fused) or MCDA — membrane sign is needed\n- **Single placenta with T-sign:** MCDA\n\n### Membrane Thickness\n\nDCDA: Membrane is thick (four layers — two chorions + two amnions)\nMCDA: Membrane is thin (two layers — amnion only)\n\nMembrane thickness ≥ 2 mm favors dichorionic. However, this becomes less reliable with advancing gestation.\n\n### Fetal Sex\n\nDiscordant sex = almost certainly dichorionic (unless sex chromosomal anomaly).\nConcordant sex: compatible with either — cannot distinguish chorionicity by sex alone.\n\n---\n\n## Routine Twin Surveillance\n\n**DCDA twins:**\n- Growth ultrasound every 4 weeks from 24 weeks\n- Antenatal surveillance typically begins at 36 weeks\n\n**MCDA twins (higher risk):**\n- Serial ultrasound every **2 weeks** from 16 weeks for TTTS surveillance\n- Doppler assessment (MCA PSV, umbilical artery, ductus venosus) when growth discordance or TTTS suspected\n\n**MCMA twins:**\n- Most centers admit for inpatient monitoring at 26–28 weeks\n- Twice-weekly or more frequent biophysical profiles\n- Cord entanglement identified on ultrasound (intertwining)\n\n---\n\n## Twin-to-Twin Transfusion Syndrome (TTTS)\n\nTTTS occurs in ~10–15% of MCDA pregnancies. Vascular anastomoses on the shared placenta allow unbalanced blood flow from the donor twin to the recipient twin.\n\n**Quintero Staging System:**\n\n| Stage | Criteria |\n|---|---|\n| I | Donor: oligohydramnios (DVP \u003c 2 cm). Recipient: polyhydramnios (DVP \u003e 8 cm). Bladder of donor visible |\n| II | Donor bladder not visible on prolonged scanning |\n| III | Abnormal Doppler: absent/reversed EDV in umbilical artery, reversed ductus venosus a-wave, or pulsatile umbilical vein |\n| IV | Hydrops in either twin |\n| V | Fetal demise of either twin |\n\n### Sonographic TTTS Findings\n\n**Donor twin (the one giving blood away):**\n- Oligohydramnios: DVP \u003c 2 cm (single deepest pocket)\n- Small for gestational age, growth restricted\n- Bladder may be absent / very small\n- Umbilical artery: elevated RI, absent or reversed end-diastolic flow\n- Stuck twin: amniotic sac wraps tightly around the stuck donor (no fluid to move in)\n\n**Recipient twin (the one receiving blood):**\n- Polyhydramnios: DVP \u003e 8 cm\n- Larger than donor\n- Enlarged, full bladder (urinates into the sac — that's why it's full)\n- Cardiac hypertrophy, cardiomegaly from volume overload\n- Hydrops in advanced cases (skin edema, ascites, pleural/pericardial effusion)\n\n### Measuring Fluid\n\n**Technique:** In MCDA twins, always measure the DVP (deepest vertical pocket) in each sac separately.\n\n1. Identify the inter-twin membrane (thin T-sign membrane)\n2. Measure DVP in the donor's sac (should be \u003c 2 cm in TTTS Stage I+)\n3. Measure DVP in the recipient's sac (\u003e 8 cm in TTTS Stage I+)\n\n**Do not use AFI in twin pregnancies** — DVP is standard for multiple gestation.\n\n---\n\n## Selective Fetal Growth Restriction (sFGR)\n\nIn MCDA twins, when one twin's EFW is below the 10th percentile AND there's \u003e 25% EFW discordance between twins. Not the same as TTTS — no fluid discordance required.\n\nGraded by umbilical artery Doppler:\n- Type I: normal or reduced end-diastolic flow\n- Type II: absent or reversed EDV (worst prognosis)\n- Type III: intermittent absent/reversed EDV (most unpredictable)\n\n---\n\n## What to Document in Every Twin Scan\n\nFor each twin:\n- Labeling: Twin A (presenting/lower twin), Twin B (upper twin)\n- EFW and biometry (BPD, HC, AC, FL)\n- EFW percentile for gestational age\n- Amniotic fluid (DVP in each sac)\n- Bladder visualization\n- Fetal activity and tone (biophysical profile components as appropriate)\n- Doppler: umbilical artery waveform (if indicated)\n- Chorionicity documentation at each scan\n\n---\n\n## Reporting Language\n\n**Chorionicity:**\n\"Monochorionic diamniotic twin gestation confirmed. A thin inter-twin membrane with T-sign insertion into the anterior placenta is identified. Single anterior placenta. Twin A is the lower twin.\"\n\n**TTTS Stage II:**\n\"Twin A (donor): Oligohydramnios with DVP 1.2 cm. Bladder not identified on 30-minute observation. Umbilical artery: reversed end-diastolic flow. EFW 423 g (\u003c 5th percentile). Twin B (recipient): Polyhydramnios with DVP 10.4 cm. Bladder markedly distended. EFW 712 g (28th percentile). EFW discordance 40%. Findings consistent with twin-to-twin transfusion syndrome, Quintero Stage III. Urgent maternal-fetal medicine consultation is recommended.\"\n\n---\n\n*SonoBuddy's OB protocols include chorionicity determination, growth scans, and fetal Doppler guides.*"])</script><script>self.__next_f.push([1
