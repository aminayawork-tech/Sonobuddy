c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T18ad,"])</script><script>self.__next_f.push([1,"The adrenal glands are small, often overlooked, and technically challenging to image. Most sonographers see them on abdominal scans only when they're abnormal. Here's what you need to know about adrenal anatomy, technique, and findings.\n\n## Anatomy\n\nThe adrenal glands (suprarenal glands) sit in the retroperitoneum, superior and slightly medial to each kidney. They are small — approximately 3–6 cm in length, 2–3 cm wide, and only 3–6 mm thick in their limbs.\n\n**Shape:** Triangular or \"Y\"-shaped. The right adrenal is more pyramidal; the left is more crescentic and elongated.\n\n**Right adrenal:** Located posterior to the IVC, lateral to the right crus of the diaphragm, and just above the right kidney.\n\n**Left adrenal:** More medial and inferior than the right — lies between the aorta and upper pole of the left kidney, medial to the spleen.\n\n**Echogenicity:** Normal adrenals are isoechoic or slightly hyperechoic relative to the surrounding retroperitoneal fat. The central medulla may be slightly more echogenic than the outer cortex.\n\n## Scanning Technique\n\nThe adrenals are notoriously difficult to visualize in adults — unlike in neonates (where they're proportionally large and easily seen). Adequate technique matters.\n\n### Right Adrenal\n\n**Approach:** Coronal through the right lobe of the liver (liver as acoustic window).\n\n1. Position the probe in the right lateral intercostal spaces — liver as window\n2. Identify the right kidney and IVC\n3. Look for the right adrenal between the upper pole of the right kidney, the IVC, and the right crus of the diaphragm\n4. The right crus of the diaphragm appears as a hypoechoic muscular structure — the adrenal is anterior to it\n5. In many patients, the right adrenal is visible as a small \"V\" or \"Y\" of similar echogenicity to surrounding fat\n\n**Tip:** Patient in full inspiration holds the liver down, improving the window. Adjust decubitus position if needed.\n\n### Left Adrenal\n\n**Approach:** Lateral or coronal approach through the spleen (splenorenal window) or the left kidney.\n\n1. Patient in right lateral decubitus (left side up) often improves left-sided windows\n2. Use the spleen as your acoustic window\n3. Identify the left kidney and aorta\n4. The left adrenal sits medial to the upper pole of the left kidney, between the kidney and the aorta/left crus\n5. It's often partially obscured by bowel gas — have patience\n\n**Reality check:** In many adult patients — especially those with moderate body habitus or bowel gas — the adrenals are not visualized. This is normal and should be documented: \"Right/left adrenal gland not visualized — no focal mass identified in the expected anatomical region.\"\n\n## Normal Measurements\n\n| Measurement | Normal |\n|---|---|\n| Maximum limb width | \u003c 10 mm (limb, not entire gland) |\n| Length | 3–6 cm |\n\n**Key:** The limb thickness is more clinically meaningful than overall size. A limb \u003e 10 mm is considered suspicious for pathology.\n\n## Adrenal Pathology\n\n### Adrenal Adenoma (Most Common Adrenal Mass)\n\nMost adrenal masses are benign adenomas — found incidentally during imaging performed for other reasons.\n\n**Sonographic appearance:**\n- Well-defined, rounded, homogeneous mass\n- Usually hypoechoic (but can be isoechoic or slightly hyperechoic)\n- Typically small (\u003c 3–4 cm)\n- No internal vascularity on Doppler (or very minimal)\n\n**The problem:** Ultrasound cannot reliably characterize lipid content (which differentiates benign adenoma from malignancy). Any adrenal mass \u003e 1–2 cm found on ultrasound should be further evaluated with CT or MRI.\n\n### Adrenal Incidentaloma\n\nAn adrenal mass discovered incidentally — not the reason for the scan.\n\n**What to document:** Size (three dimensions), location, echogenicity, internal vascularity, presence of calcification.\n\n**Always recommend:** CT adrenal protocol or MRI for any adrenal mass ≥ 1 cm found on ultrasound. Lipid-rich adenoma = fat content measurable on CT (\u003c 10 HU). Lipid-poor or indeterminate masses need MRI chemical shift imaging.\n\n**Reporting language:** \"1.8 cm well-defined hypoechoic mass identified in the right adrenal region. CT of the adrenal glands is recommended for further characterization.\"\n\n### Adrenal Cyst\n\n- Purely anechoic, thin-walled, posterior enhancement\n- May be simple (benign) or complex (hemorrhagic, pseudocyst)\n- Simple adrenal cysts are benign if criteria are met\n\n### Pheochromocytoma\n\nA catecholamine-secreting tumor — causes hypertensive crises, headaches, sweating, and palpitations.\n\n**Ultrasound appearance:**\n- Often large (\u003e 3–4 cm at presentation)\n- Heterogeneous — may have cystic areas, hemorrhage, or calcification\n- Hypervascular on color Doppler\n- May be bilateral (in hereditary syndromes — MEN2, VHL, NF1)\n\n**Clinical note:** Before any biopsy or procedure on a suspected pheochromocytoma, the patient must be biochemically screened — unblocked pheochromocytoma manipulation can cause hypertensive crisis.\n\n### Adrenal Metastasis\n\nThe adrenal glands are a common site of metastasis — lung, breast, colon, melanoma, and renal cell carcinoma all metastasize here.\n\n**Ultrasound appearance:**\n- Variable — can be small and homogeneous (mimicking adenoma) or large and heterogeneous\n- Bilateral in many metastatic cases\n- History of malignancy is the key clinical context\n\nIf a patient with known malignancy has new adrenal masses on ultrasound — flag it.\n\n### Adrenal Hemorrhage\n\nIn neonates, adrenal hemorrhage is a common cause of adrenal mass. In adults, it occurs with trauma, anticoagulation, or severe stress (sepsis).\n\n**Evolution on ultrasound:**\n- Acute: echogenic mass (hyperechoic blood)\n- Subacute (days–weeks): complex, mixed echogenicity\n- Chronic: hypoechoic or cystic, may calcify\n\nSerial ultrasound to confirm resolution is appropriate for suspected adrenal hemorrhage.\n\n## Key Images to Capture\n\n1. Right adrenal region — long axis with any measurable structure\n2. Left adrenal region — long axis\n3. Any adrenal mass — three dimensions in two planes\n4. Color Doppler of any mass\n5. Document \"not visualized\" if unable to identify in a technically adequate study\n\n---\n\n*SonoBuddy's abdominal protocols include the adrenal gland as part of the retroperitoneal survey. Normal adrenal measurements are in the Measurements section.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"adrenal-gland-ultrasound-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"adrenal-gland-ultrasound-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"adrenal-gland-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"adrenal-gland-ultrasound-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"adrenal-gland-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"adrenal-gland-ultrasound-guide\",\"title\":\"Adrenal Gland Ultrasound: Normal Anatomy, Incidentalomas, and Technique\",\"date\":\"2026-08-28\",\"excerpt\":\"How to find and evaluate the adrenal glands on ultrasound — normal appearance, right vs left approach, what an adrenal mass looks like, and when to recommend CT.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"abdomen\",\"adrenal\",\"protocol\",\"incidentaloma\",\"anatomy\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"salivary-gland-ultrasound-guide\",\"title\":\"Salivary G
