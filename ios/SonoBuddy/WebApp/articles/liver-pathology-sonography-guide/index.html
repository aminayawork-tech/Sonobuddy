c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1cb7,"])</script><script>self.__next_f.push([1,"The liver is the most commonly evaluated organ in abdominal ultrasound. Whether you're performing a right upper quadrant study, a full abdominal scan, or a specific hepatic evaluation, knowing what's normal and what's not — and how to describe it — is fundamental.\n\n## Normal Liver Assessment\n\n**Size:** Measured in the midclavicular line (MCL) in sagittal as the craniocaudal span.\n- Normal: ≤ 15 cm (some references use ≤ 16 cm MCL)\n- \u003e 15–17 cm depending on body habitus: hepatomegaly\n\n**Normal echogenicity:** Isoechoic or slightly hyperechoic compared to the right renal cortex. Slightly hyperechoic compared to the spleen is normal.\n\n**Texture:** Homogeneous, smooth.\n\n**Margins:** Smooth, sharp capsule. The hepatic dome should show a smooth superior surface.\n\n**Vasculature:** Hepatic veins and portal veins visible. Portal veins have echogenic walls (visible as bright lines surrounding the anechoic lumen). Hepatic veins have thin walls and converge toward the IVC at the hepatic confluence.\n\n## Fatty Liver (Hepatic Steatosis)\n\nThe most common diffuse liver disease in ultrasound practice. Prevalence is increasing with obesity and metabolic syndrome.\n\n**Grading by echogenicity:**\n\n| Grade | Appearance | Vascular Visibility |\n|---|---|---|\n| Mild | Slightly hyperechoic vs kidney | Portal vein walls still visible |\n| Moderate | Moderately hyperechoic, similar to spleen | Portal vein walls barely visible |\n| Severe | Markedly hyperechoic, brighter than spleen | Portal vein walls not visible; poor posterior penetration |\n\n**Practical grading:**\n- Compare liver to the right kidney: liver should be equal to or slightly brighter than the kidney cortex\n- In fatty liver, the liver becomes increasingly bright relative to the kidney\n- Severe steatosis: markedly echogenic liver, poor penetration to the posterior liver, diaphragm may be difficult to see\n\n**What to document:** \"Diffuse increased liver echogenicity consistent with hepatic steatosis, mild/moderate/severe grade. Decreased visualization of portal vein walls and posterior hepatic parenchyma.\"\n\n**Focal fat sparing:** Areas that appear hypoechoic against the background of a fatty liver. Classic locations: adjacent to the gallbladder fossa, periportal. They are geographic, non-mass-forming — no mass effect, no distortion of vessels.\n\n**Focal fat deposition:** The opposite — echogenic foci in a normal liver. No mass effect, no vascular distortion.\n\n## Cirrhosis\n\nEnd-stage chronic liver disease characterized by fibrosis and nodular regeneration.\n\n**Sonographic findings:**\n- Coarse, heterogeneous echogenicity (fibrosis disrupts the normal texture)\n- Nodular liver surface (the \"lumpy\" contour of regenerative nodules)\n- Increased echogenicity overall\n- Atrophy of the right lobe and hypertrophy of the caudate lobe (Couinaud segment I) — caudate-to-right lobe ratio \u003e 0.65 is suggestive\n- Small liver (late stage) — shrunken, heterogeneous\n\n**Portal hypertension signs:**\n- Enlarged portal vein (\u003e 13 mm in the porta hepatis)\n- Reversed portal venous flow (hepatofugal) — a critical finding indicating severe portal hypertension\n- Splenomegaly (\u003e 12 cm in the long axis)\n- Ascites (free fluid in the peritoneal cavity)\n- Collateral vessels: umbilical vein recanalization (a worm-like vascular structure in the hepatoduodenal ligament, patent flow on Doppler), gastric varices, caput medusae\n\n**Ascites:** Free anechoic fluid surrounding the liver, in the hepatorenal space (Morison's pouch), and in the pelvis. Complex ascites (internal echoes, septations) may indicate infection (SBP) or hemorrhage.\n\n## Focal Liver Lesions\n\nFocal lesions are common incidental findings. Your role: describe the lesion, not diagnose it.\n\n### Simple Liver Cyst\n\n- Anechoic, thin walls, posterior acoustic enhancement, round\n- No internal echoes, no vascularity on Doppler\n- Benign, no follow-up needed\n- **Polycystic liver disease:** Multiple cysts replacing liver parenchyma, often with associated polycystic kidneys\n\n### Hemangioma\n\n- Most common benign liver tumor\n- Classic appearance: well-defined, hyperechoic (brighter than surrounding liver), homogeneous\n- \"Flame sign\" on power Doppler sometimes seen peripherally\n- Posterior acoustic enhancement behind larger hemangiomas\n- In fatty liver, hemangiomas may appear isoechoic or relatively hypoechoic (contrast reversal)\n\n### Hepatocellular Carcinoma (HCC)\n\n- In a cirrhotic liver, any new focal lesion requires evaluation for HCC\n- Appearance varies: hypoechoic, isoechoic, hyperechoic (smaller tumors), or heterogeneous (larger)\n- \"Mosaic\" pattern: heterogeneous appearance with internal septa\n- Halo sign: thin hypoechoic rim around the lesion\n- Vascular invasion: tumor thrombus in portal vein branches is characteristic\n- AFP elevation + imaging = high suspicion\n\n### Metastases\n\n- Most common malignant focal liver lesion (liver is a common metastatic site)\n- Variable appearance: \"target\" lesion (hypoechoic center, hyperechoic rim), bull's-eye, echogenic, cystic, or calcified\n- Multiple lesions throughout the parenchyma\n- Common primaries: colon, breast, lung, pancreas, neuroendocrine\n\n### Abscess\n\n- Bacterial: heterogeneous, complex, often contains echogenic debris or gas\n- Amoebic: typically anechoic or mildly complex, smooth borders\n- Clinical context (fever, pain, recent travel) is important\n\n## Hepatic Vasculature\n\n**Portal vein Doppler:**\n- Normal: hepatopetal (toward the liver), phasic (respiratory variation)\n- Enlarged: \u003e 13 mm = portal hypertension concern\n- Hepatofugal (away from liver): severe portal hypertension — critical finding\n- Thrombosis: echogenic material in the lumen, absent or markedly reduced flow\n\n**Hepatic veins Doppler:**\n- Normal: triphasic pulsatile waveform (reflects right atrial pressure)\n- Damped (monophasic): hepatic venous outflow obstruction, right heart failure, hepatic congestion\n- Budd-Chiari syndrome: hepatic vein occlusion — absent hepatic venous flow + caudate lobe hypertrophy\n\n**Hepatic artery:**\n- Normal RI: 0.55–0.75\n- Low RI or absent diastolic flow in transplant: hepatic artery thrombosis (emergency in post-transplant)\n\n## Liver Transplant Evaluation\n\n**Standard protocol:** Hepatic artery PSV, RI (\u003c 0.50 is abnormal in early post-transplant), portal vein flow direction and velocity, hepatic vein waveforms, IVC, hepatic parenchymal echogenicity, bile ducts (biloma?), perihepatic collections.\n\n**Critical findings post-transplant:**\n- Hepatic artery thrombosis (absent Doppler signal in hepatic artery) — surgical emergency\n- Portal vein thrombosis — urgent\n- Biliary complications (biloma, stricture): dilated ducts, perihepatic fluid\n\n## Documentation Tips\n\nFor diffuse disease: describe echogenicity relative to the right kidney, note texture, vascular visibility, surface, and size.\n\nFor focal lesions: location (by Couinaud segment if possible), size (three dimensions), echogenicity, margins, internal characteristics (cystic, solid, heterogeneous), posterior features, Doppler vascularity, and relationship to adjacent vessels.\n\n**Segment reference (simplified):**\n- Right lobe: segments V, VI, VII, VIII\n- Left lobe: segments II, III, IV\n- Caudate: segment I\n\n---\n\n*SonoBuddy's Measurements section includes liver size reference values and hepatic Doppler normal values — use them for quick bedside reference.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"liver-pathology-sonography-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\
