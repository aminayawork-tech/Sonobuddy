c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T17cc,"])</script><script>self.__next_f.push([1,"Uterine pathology is among the most common findings in gynecologic ultrasound. Fibroids, adenomyosis, and polyps are frequent incidental findings and are common causes of abnormal uterine bleeding, pelvic pain, and infertility. Here's how to recognize and describe each.\n\n## Fibroids (Leiomyomas)\n\nFibroids are the most common benign uterine tumors — present in up to 70% of women by age 50. They arise from smooth muscle and are estrogen-sensitive.\n\n### Sonographic Appearance\n\n**Classic features:**\n- Well-defined, rounded hypoechoic masses within or adjacent to the uterus\n- Heterogeneous echogenicity (variable — can be hyper or isoechoic)\n- Posterior acoustic shadowing from calcifications (especially in older fibroids)\n- Peripheral vascularity on color Doppler (rim of blood vessels)\n- Distortion of the uterine contour or endometrium\n\n**Degenerative changes in fibroids:**\n- **Hyaline degeneration:** Most common. Increased heterogeneity, cystic spaces.\n- **Calcification:** Dense echogenic foci with shadowing — \"whorled\" calcification pattern.\n- **Red degeneration:** In pregnancy; acute pain, fibroid appears heterogeneous.\n- **Cystic degeneration:** Large anechoic areas within the fibroid.\n\n### FIGO Classification (Location)\n\n| Type | Location | Clinical Impact |\n|---|---|---|\n| 0 | Submucosal, pedunculated intracavitary | Bleeding, infertility — highest impact |\n| 1 | Submucosal \u003c 50% intramural | Significant bleeding |\n| 2 | Submucosal ≥ 50% intramural | Significant bleeding |\n| 3 | Contacts endometrium, 100% intramural | Moderate impact |\n| 4 | Intramural | Variable |\n| 5 | Subserosal ≥ 50% intramural | Least impact on cavity |\n| 6 | Subserosal \u003c 50% intramural | Minimal impact |\n| 7 | Subserosal, pedunculated | Minimal impact |\n\nFor reporting, the most important distinction is **submucosal** (FIGO 0–2 — contacts or distorts the endometrium) vs **intramural** vs **subserosal**.\n\n### Measurement\n\nMeasure each fibroid in three planes. For multiple fibroids, describe the dominant/largest and the overall uterine size. Note the location (anterior, posterior, fundal, lateral), depth relative to the endometrium, and relationship to the serosa.\n\n### Sonohysterography\n\nFor submucosal fibroids, sonohysterography (saline infusion — SIS) provides much better characterization. The saline fills the cavity, and submucosal fibroids bulge into the fluid. This is often requested for surgical planning.\n\n## Adenomyosis\n\nAdenomyosis is the presence of endometrial glands and stroma within the myometrium. It causes heavy, painful periods and uterine enlargement. Diagnosis on ultrasound is challenging but characteristic features exist.\n\n### Sonographic Features\n\n**Global adenomyosis (diffuse):**\n- Enlarged uterus with globally thickened myometrium\n- Heterogeneous myometrium — asymmetric thickening (often posterior wall)\n- **Myometrial cysts:** Small (2–7 mm) anechoic or echogenic cysts in the myometrium — highly specific for adenomyosis\n- **Echogenic islands:** Heterogeneous hyperechoic areas within the myometrium\n- **Subendometrial lines and buds:** Irregular striation extending from the endometrium into the myometrium\n- **Junctional zone thickening:** The inner myometrium normally measures ≤ 12 mm; thickening \u003e 12 mm is suspicious\n- Poor definition of the endometrial-myometrial border\n\n**Focal adenomyosis (adenomyoma):**\n- Poorly defined hypoechoic mass within the myometrium\n- No well-defined capsule or peripheral vascularity (distinguishes it from a fibroid)\n- Often elongated in shape rather than round\n\n### Adenomyosis vs Fibroid\n\n| Feature | Adenomyosis | Fibroid |\n|---|---|---|\n| Margins | Ill-defined | Well-defined |\n| Vascularity | Diffuse internal | Peripheral rim |\n| Shape | Irregular, elongated | Round or oval |\n| Shadow | Rare | May shadow (calcified) |\n| Capsule | None | Present |\n| Uterine shape | Globular, symmetric | Focal contour distortion |\n\n### MUSA Criteria\n\nThe Morphological Uterus Sonographic Assessment (MUSA) provides a standardized framework for describing adenomyosis on ultrasound. Key features: myometrial cysts, echogenic islands, irregular junctional zone, fan-shaped shadowing, translesional vascularity.\n\n## Endometrial Polyps\n\nEndometrial polyps are focal overgrowths of endometrial glands and stroma. They cause irregular bleeding and are a common finding in perimenopausal women.\n\n### Sonographic Appearance\n\n- Focal hyperechoic thickening of the endometrium\n- Well-defined hyperechoic mass within the endometrial cavity\n- May cause asymmetric endometrial thickening\n- **Feeding vessel sign on color Doppler:** A single central pedicle vessel running into the polyp — highly specific\n- Often small and easy to miss on routine survey — SIS dramatically improves detection\n\n### When to Suspect a Polyp\n\n- Focal endometrial thickening asymmetric to the rest of the cavity\n- Irregular endometrial contour\n- Abnormal uterine bleeding with otherwise normal-appearing endometrium\n\n**Endometrial thickness reference:**\n- Premenopausal: variable by cycle phase (2–16 mm)\n- Postmenopausal: ≤ 4–5 mm (if \u003e 5 mm with bleeding — evaluate further)\n\n## Reporting Fibroids\n\n**What to include:**\n- Number: single or multiple (if \u003e 5, \"multiple\" is acceptable)\n- Dominant fibroid: location (anterior/posterior/fundal/right/left lateral), type (submucosal/intramural/subserosal), size (three dimensions)\n- Relationship to endometrium (does it contact or distort it?)\n- Overall uterine size\n- Vascularity on color Doppler\n\n**Example language:**\n- \"Multiple uterine fibroids. Dominant fibroid in the posterior fundal wall measuring 4.2 × 3.8 × 3.5 cm, intramural, with no contact with the endometrium. Additional intramural fibroids measuring up to 2.1 cm.\"\n- \"Single submucosal fibroid in the anterior lower uterine segment measuring 1.8 × 1.5 × 1.4 cm, contacting and mildly indenting the endometrial cavity. Sonohysterography may provide better characterization.\"\n\n---\n\n*SonoBuddy's Pathologies section includes uterine fibroid and adenomyosis US findings, differentials, and red flags.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"uterine-pathology-fibroids-adenomyosis\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"uterine-pathology-fibroids-adenomyosis\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"uterine-pathology-fibroids-adenomyosis\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"uterine-pathology-fibroids-adenomyosis\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"uterine-pathology-fibroids-adenomyosis\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"uterine-pathology-fibroids-adenomyosis\",\"title\":\"Uterine Pathology on Ultrasound: Fibroids, Adenomyosis, and Polyps\",\"date\":\"2026-08-06\",\"excerpt\":\"How to identify and describe uterine fibroids, adenomyosis, and endometrial polyps on ultrasound — sonographic features, classification, and what to include in your report.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"gynecology\",\"uterus\",\"pathology\",\"fibroids\",\"adenomyosis\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"endometrial-assessment-abnormal-uterine-bleeding\",\"title\":\"Endometrial Assessment and Abnormal Uterine Bleeding\",\"excerpt\":\"Measuring endometrial thickness correctly across the cycle and after menopause — the 4 mm thr
