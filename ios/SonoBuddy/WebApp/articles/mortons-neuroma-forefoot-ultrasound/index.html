c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T18c9,"])</script><script>self.__next_f.push([1,"Forefoot pain is a common referral, and Morton's neuroma is one of the more satisfying small-parts diagnoses to make on ultrasound — it's superficial, it's dynamic, and a well-performed scan genuinely changes management. It's also easy to get a false negative from if your technique is off, so the details matter more than they might seem to for such a small structure.\n\n## What a Morton's Neuroma Actually Is\n\nDespite the name, it isn't a true neuroma (a nerve tumor). It's a **perineural fibrosis** of the common plantar digital nerve, most often at the level of the intermetatarsal ligament, caused by chronic mechanical irritation. It occurs almost exclusively in the **third intermetatarsal space** (between the third and fourth metatarsal heads) and, less commonly, the second space. It is rare in the first and fourth spaces — a \"neuroma\" reported there deserves a second look for an alternate diagnosis.\n\n**Typical patient:** Burning, cramping forefoot pain radiating into the toes, often worse with tight or narrow shoes, sometimes with a sensation of \"walking on a pebble\" or a fold in the sock.\n\n## Anatomy of the Intermetatarsal Space\n\nThe common plantar digital nerve runs plantar to the deep transverse intermetatarsal ligament before dividing to supply adjacent toes. This position — just deep to the ligament, at the level of the metatarsal heads — is exactly where a neuroma forms and exactly where you need to look.\n\n## Scanning Technique\n\n**Probe:** High-frequency linear transducer, 12–18 MHz.\n\n**Patient position:** Supine or seated, foot relaxed in slight plantarflexion, sole flat against the exam table or supported.\n\n**Two approaches — use both:**\n\n**1. Dorsal approach:** Probe placed transversely across the dorsum of the forefoot at the level of the metatarsal heads. This is the standard starting view and avoids compressing the space with direct plantar pressure, which can obscure a small neuroma.\n\n**2. Plantar approach:** Probe on the sole, between the metatarsal heads. Useful for confirming a finding seen dorsally and for very superficial lesions, though direct pressure from the probe can compress and hide a soft neuroma — light contact only.\n\n**The maneuver that finds the ones you'd otherwise miss — the toe squeeze (Mulder's sign under ultrasound):**\n1. Locate the intermetatarsal space transversely from the dorsal approach\n2. Have the patient (or you, with your free hand) apply firm medial-to-lateral compression across the forefoot, squeezing the metatarsal heads together\n3. Watch the space in real time — a neuroma will bulge plantarward, becoming more conspicuous and sometimes producing a palpable and visible \"click\"\n\nThis dynamic compression view catches neuromas that are equivocal or invisible on a static scan. Do it on every study where the static images are negative or borderline but the clinical suspicion is high.\n\n## Sonographic Appearance\n\n- **Hypoechoic**, ovoid or lobulated mass centered at the plantar aspect of the intermetatarsal space, typically at or just distal to the metatarsal heads\n- **Longitudinal orientation** — appears elongated when scanned along the long axis of the nerve, rounder in the transverse plane\n- Usually **avascular or hypovascular** on color Doppler — this helps distinguish it from an inflamed bursa\n- **No posterior acoustic enhancement** pattern typical of a simple cyst; internal echotexture is solid, not fluid\n\n## Measurement and the Threshold That Matters\n\nMeasure the neuroma in its largest transverse dimension (short axis).\n\n- **\u003e 5 mm** is generally considered a size threshold that correlates with a higher likelihood of clinically significant, symptomatic neuroma.\n- **\u003c 5 mm** neuromas can still be symptomatic — size correlates with but does not define clinical significance. Correlate with the location of the patient's pain and reproducibility with the toe-squeeze maneuver, not size alone.\n\nDocument three dimensions when possible, and always compare to the contralateral foot if the patient has any pain there too — small, asymptomatic neuromas are a common incidental finding.\n\n## The Key Differential: Intermetatarsal Bursitis\n\nThis is the most important thing to get right, because management differs and the two can look similar on a quick glance.\n\n| Feature | Morton's Neuroma | Intermetatarsal Bursitis |\n|---|---|---|\n| Echogenicity | Hypoechoic, solid | Anechoic to hypoechoic, often compressible |\n| Shape | Ovoid, well-defined solid mass | Irregular, fluid-distended |\n| Compressibility | Non-compressible | Compressible with probe pressure |\n| Doppler | Typically avascular | May show peripheral hyperemia if inflamed |\n| Location | Centered at nerve, deep to ligament | More variable, can be more superficial |\n\nA **bursa with adjacent inflammation can coexist with a neuroma** in the same space — describe both if present, since a bursa alone won't respond to neuroma-directed treatment (injection targeting, alcohol ablation, or surgical excision).\n\n## Other Differentials to Keep in Mind\n\n- **Metatarsal stress fracture** — cortical irregularity/step-off, point tenderness, no soft mass\n- **Plantar plate tear** — at the metatarsophalangeal joint itself, not the intermetatarsal space; associated with toe malalignment\n- **Ganglion cyst** — anechoic, compressible, posterior enhancement\n\n## Reporting Language\n\n**Positive finding:**\n\"A 7 × 4 mm hypoechoic, avascular, ovoid mass is identified in the plantar aspect of the third intermetatarsal space at the level of the metatarsal heads, corresponding to the patient's site of pain. The mass becomes more prominent with the toe-squeeze maneuver. Findings are consistent with Morton's neuroma.\"\n\n**Negative but clinically suspicious:**\n\"No discrete mass identified in the second or third intermetatarsal spaces on static or dynamic (toe-squeeze) imaging. Clinical correlation is recommended; a small or early neuroma cannot be entirely excluded.\"\n\n## Key Images to Capture\n\n1. Dorsal transverse view of the symptomatic space, static\n2. Same view during toe-squeeze compression\n3. Longitudinal view of the mass, if identified, with measurements\n4. Color Doppler over the mass\n5. Contralateral foot for comparison if bilateral symptoms\n\n---\n\n*SonoBuddy's MSK guides include shoulder, knee, ankle, and now forefoot ultrasound protocols.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"mortons-neuroma-forefoot-ultrasound\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"mortons-neuroma-forefoot-ultrasound\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"mortons-neuroma-forefoot-ultrasound\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"mortons-neuroma-forefoot-ultrasound\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"mortons-neuroma-forefoot-ultrasound\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"mortons-neuroma-forefoot-ultrasound\",\"title\":\"Morton's Neuroma and Forefoot Ultrasound: Technique and Measurement Thresholds\",\"date\":\"2026-10-21\",\"excerpt\":\"Scanning the forefoot for Morton's neuroma — dorsal vs. plantar approach, the toe-squeeze maneuver, the size threshold that actually matters, and telling a neuroma apart from intermetatarsal bursitis.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"musculoskeletal\",\"forefoot\",\"Morton's neuroma\",\"protocol\"],\"content\":\"$5\"},\"related\":[{
