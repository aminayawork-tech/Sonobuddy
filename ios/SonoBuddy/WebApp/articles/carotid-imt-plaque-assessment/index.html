c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1aa3,"])</script><script>self.__next_f.push([1,"Carotid duplex is one of the most commonly performed vascular studies. New vascular sonographers spend significant time mastering carotid technique because the velocity criteria are specific, the anatomy is complex, and the clinical consequences of errors — for a patient with symptomatic carotid disease — are significant.\n\n## Anatomy Review\n\n**Carotid system (from proximal to distal):**\n- Common carotid artery (CCA) — bifurcates typically at C3–C4 level\n- Carotid bifurcation — the \"bulb\" where the CCA divides\n- Internal carotid artery (ICA) — supplies the brain; no branches in the neck\n- External carotid artery (ECA) — supplies the face and scalp; gives multiple branches\n\n**Distinguishing ICA from ECA:**\n- ICA: larger diameter, no branches in the neck, located posterolaterally at the bifurcation, lower resistance waveform (forward diastolic flow)\n- ECA: smaller, gives branches (superior thyroid artery first), located anteromedially, high resistance waveform (little or no diastolic flow)\n- **Temporal tap test:** Tap the preauricular area (temporal artery territory) while sampling the ECA. Tapping creates oscillations visible in the spectral waveform — if the tapping artifact appears in your waveform, you're in the ECA. The ICA does not respond to the temporal tap.\n\n## Scanning Protocol\n\n**Patient position:** Supine, neck slightly extended, head turned gently to the contralateral side (about 20–30° — don't force it).\n\n**Probe:** 5–12 MHz linear transducer.\n\n**Systematic approach:**\n1. Begin at the clavicle (proximal CCA) in transverse\n2. Follow the CCA proximally to distally with color Doppler\n3. Identify the bifurcation, ICA origin, ECA origin\n4. Sample: CCA mid, ICA proximal/mid/distal (if accessible), ECA proximal\n5. Evaluate the vertebral artery (posterior to CCA)\n6. Repeat on the contralateral side\n\n## Velocity Criteria for Carotid Stenosis (SRU 2003 Consensus)\n\nThe Society of Radiologists in Ultrasound (SRU) 2003 consensus criteria remain the standard for most institutions:\n\n| ICA Stenosis | ICA PSV | Additional Criteria | ICA/CCA Ratio |\n|---|---|---|---|\n| Normal | \u003c 125 cm/s | No plaque | \u003c 2.0 |\n| \u003c 50% | \u003c 125 cm/s | Plaque present | \u003c 2.0 |\n| 50–69% | 125–230 cm/s | Plaque present | 2.0–4.0 |\n| ≥ 70% to near occlusion | \u003e 230 cm/s | Plaque + turbulence | \u003e 4.0 |\n| Near occlusion | Variable (may be low PSV) | Trickle flow, markedly narrowed lumen | Variable |\n| Total occlusion | No flow | Echogenic lumen fill | N/A |\n\n**Key point:** ICA PSV \u003e 230 cm/s reliably identifies stenosis ≥ 70% when combined with plaque on B-mode.\n\n**Near occlusion is the exception to velocity criteria:** Severely narrowed vessels may have *low* velocities due to critical reduction in flow — the classic teaching is \"don't let a slow velocity reassure you in a tight-looking vessel.\" Color Doppler may show a thin \"trickle\" of aliased color.\n\n## The ICA/CCA Ratio\n\nThe ICA/CCA ratio corrects for patients with globally elevated velocities (high cardiac output, anxiety, fever). Divide the peak ICA PSV by the peak CCA PSV (sample the distal CCA, 1–2 cm proximal to the bifurcation, not the bulb).\n\nRatio \u003e 4.0 = ≥ 70% stenosis regardless of absolute velocity.\n\n## Vertebral Artery Evaluation\n\nThe vertebral artery runs through the cervical vertebral foramina (transverse processes) and is evaluated at its accessible portion (C3–C6 level).\n\n**Normal:** Phasic, forward (antegrade) flow. Low-resistance waveform similar to ICA.\n\n**Vertebral stenosis:** Elevated PSV (\u003e 100 cm/s in the vertebral is concerning; \u003e 140 cm/s is clearly elevated).\n\n**Vertebral steal (subclavian steal):** The ipsilateral subclavian artery has a hemodynamically significant stenosis. Blood is \"stolen\" from the posterior circulation through the vertebral artery to feed the subclavian. The vertebral artery shows reversed, biphasic, or to-and-fro flow.\n\n## Plaque Characterization\n\nPlaque morphology matters because it correlates with embolic risk — not all plaques causing the same degree of stenosis are equally dangerous.\n\n**Location:** Most important is the ICA origin (just above the bifurcation). Document clock position (anterior, posterior, lateral, medial wall).\n\n**Surface character:**\n- Smooth: regular, flat surface\n- Irregular: surface undulations\n- Ulcerated: crater-like defect in the plaque surface (important — associated with emboli)\n\n**Echogenicity:**\n- Homogeneous hyperechoic (calcified): stable, fibrous, dense — acoustic shadow behind\n- Heterogeneous: mixture of echogenic and hypoechoic components — increased risk\n- Hypoechoic (soft plaque): lipid-rich, more prone to rupture — may be hard to see without good technique\n- Anechoic intraplaque components: hemorrhage or lipid pools — highest risk\n\n**Documentation:** \"Heterogeneous plaque involving the posterior wall of the ICA origin, measuring [length × thickness], with irregular surface. No ulceration identified.\"\n\n## Carotid Intima-Media Thickness (cIMT)\n\ncIMT is a surrogate marker for atherosclerosis risk and is measured in research and some preventive cardiology practices.\n\n**Measurement technique:**\n- Far wall of the CCA, 1 cm proximal to the bifurcation\n- High-frequency probe, optimal B-mode resolution, image optimized for wall layers\n- The intima-media complex appears as two echogenic lines (adventitia and intima) with a hypoechoic middle layer (media)\n- Measure from the inner surface of the first echogenic line to the inner surface of the second\n- Typically measure 3 sites, average, and compare to age-matched reference values\n\n**Normal cIMT:** Varies by age, sex, and race. General guidelines:\n- \u003c 0.6 mm: low risk\n- 0.6–0.9 mm: intermediate\n- ≥ 1.0 mm: high risk (equivalent to subclinical plaque)\n- Plaque (focal IMT ≥ 1.5 mm): established atherosclerosis\n\n**Note:** cIMT measurement is highly technique-dependent and not universally performed in clinical practice. Know whether your institution includes it in the protocol.\n\n## Images to Capture for Carotid Study\n\n**B-mode:**\n- CCA sagittal (proximal, mid, distal)\n- Bifurcation (transverse — color Doppler overlay)\n- ICA sagittal (proximal, with any plaque)\n- ECA sagittal\n- Vertebral artery sagittal with color Doppler\n\n**Spectral Doppler:**\n- CCA mid (PSV, EDV, RI)\n- ICA proximal PSV (+ angle, EDV)\n- ICA/CCA ratio (calculated or image with both values)\n- ECA PSV\n- Vertebral artery (antegrade vs retrograde)\n\n**For any plaque:**\n- Two-plane images with measurements (length and thickness)\n- Color Doppler through the stenosis to show the lumen narrowing\n- Velocity at the point of maximum stenosis\n- Post-stenotic turbulence if present\n\n---\n\n*SonoBuddy's Measurements section includes carotid stenosis velocity criteria table — use it for quick bedside reference when grading a stenosis.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"carotid-imt-plaque-assessment\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"carotid-imt-plaque-assessment\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"carotid-imt-plaque-assessment\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"carotid-imt-plaque-assessment\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"carotid-imt-plaque-assessment\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"carotid-im
