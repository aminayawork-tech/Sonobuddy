c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1dc8,"])</script><script>self.__next_f.push([1,"Wrist ultrasound is high-yield and fast. The structures are millimetres from the transducer, which means excellent resolution, and several of the most common diagnoses — carpal tunnel syndrome, De Quervain's, trigger finger — are made on a combination of a single measurement and a dynamic manoeuvre.\n\n**Probe:** The highest frequency you have. 15–22 MHz if available; 12 MHz is a workable floor. Use a generous layer of gel or a standoff for the most superficial structures, and keep probe pressure light — heavy pressure compresses the very structures you are assessing.\n\n---\n\n## Carpal Tunnel Syndrome\n\nThe single most common indication, and the one where ultrasound has largely earned parity with nerve conduction studies for diagnosis.\n\n### The Measurement\n\n**Position:** Wrist supinated and neutral, slight extension over a rolled towel. Probe in **short axis** at the level of the pisiform, which is the standard measurement location and corresponds to the proximal carpal tunnel inlet.\n\n**Landmarks:** The median nerve sits superficial and radial to the flexor tendons, deep to the flexor retinaculum. On short axis it has a characteristic honeycomb appearance — hypoechoic fascicles in a hyperechoic background.\n\n**Measure cross-sectional area** by tracing the inner margin of the hyperechoic epineurium.\n\n| Median nerve CSA at pisiform | Interpretation |\n|---|---|\n| ≤ 9 mm² | Normal |\n| 10–12 mm² | Borderline / mild |\n| 13–15 mm² | Moderate |\n| \u003e 15 mm² | Severe |\n\nPublished thresholds vary somewhat between studies and laboratories — around **10 mm²** is the most widely used cutoff for abnormality. Know what your department uses and be consistent.\n\n### Supporting Findings\n\n- **Wrist-to-forearm ratio:** CSA at the pisiform divided by CSA in the mid-forearm (about 12 cm proximal). A ratio above roughly 1.4 supports the diagnosis and is useful when a patient has diffusely large or small nerves.\n- **Flattening ratio** of the nerve within the tunnel at the level of the hamate\n- **Palmar bowing of the flexor retinaculum**\n- **Loss of the fascicular pattern** — the nerve looks uniformly hypoechoic and swollen\n- **Hyperaemia** within the nerve on power Doppler in more active disease\n\n### Do Not Miss the Cause\n\nMost carpal tunnel syndrome is idiopathic, but ultrasound can identify a treatable structural cause that changes management entirely:\n\n- Tenosynovitis of the flexor tendons\n- Ganglion cyst within the tunnel\n- Persistent median artery, sometimes thrombosed\n- Bifid median nerve, which is a normal variant but changes surgical planning — report it\n- Amyloid deposition or synovial proliferation\n\nAlways look. Finding a ganglion compressing the nerve is a genuinely different report from idiopathic CTS.\n\n---\n\n## De Quervain's Tenosynovitis\n\n**Anatomy:** The first extensor compartment contains abductor pollicis longus (APL) and extensor pollicis brevis (EPB), passing over the radial styloid.\n\n**Position:** Wrist in ulnar deviation, thumb accessible. Scan in short axis over the radial styloid, then long axis.\n\n**Findings:**\n\n- Thickening of the extensor retinaculum over the compartment\n- Hypoechoic fluid or synovial thickening surrounding the tendons\n- Tendon thickening and loss of fibrillar pattern\n- Hyperaemia on power Doppler\n- Tenderness under the probe, which is diagnostically useful — sonopalpation localizes the problem precisely\n\n**Look for a septum.** A vertical septum dividing APL and EPB into separate subcompartments is present in a substantial minority of people and is a recognized cause of injection failure — the steroid goes into one subcompartment and the other stays inflamed. If you see it, report it; it changes how the injection is performed.\n\n---\n\n## Trigger Finger (Stenosing Tenosynovitis)\n\n**Position:** Palm up, probe over the A1 pulley at the metacarpal head.\n\n**Findings:**\n\n- Thickening and hypoechogenicity of the A1 pulley\n- Fluid within the flexor tendon sheath\n- Hyperaemia on Doppler\n\n**The dynamic test is the diagnosis.** Keep the probe in long axis over the A1 pulley and ask the patient to flex and extend the finger. Watch for the tendon catching, then snapping through the pulley. A static image of a thickened pulley is supportive; the visible catch is confirmatory. Record a clip.\n\n---\n\n## Ganglion Cysts\n\nThe most common soft tissue mass in the wrist.\n\n**Typical locations:** Dorsal wrist over the scapholunate ligament (most common), volar radial near the radial artery, and the flexor tendon sheath.\n\n**Sonographic appearance:**\n\n- Well-defined, anechoic, posterior acoustic enhancement\n- Lobulated or multiseptated in many cases\n- **No internal Doppler flow** — this is the key discriminator\n- A stalk connecting to the joint or tendon sheath may be visible and confirms the diagnosis\n\n**Volar ganglia: check the radial artery.** Volar radial ganglia sit immediately adjacent to the artery, and this matters for anyone planning aspiration. Document the relationship with colour Doppler.\n\n**If it has internal flow, it is not a ganglion.** Solid vascular masses in the wrist need a different workup — see soft tissue mass evaluation.\n\n---\n\n## Other Structures Worth Knowing\n\n**Extensor carpi ulnaris (ECU):** Sixth extensor compartment, ulnar side. Tendinopathy and subluxation are common in racquet sports. Test dynamically with forearm supination and ulnar deviation — the tendon can visibly snap out of its groove.\n\n**TFCC region:** The triangular fibrocartilage complex sits between the ulnar head and the carpus. Ultrasound can assess the superficial portion and the distal radioulnar joint but **cannot reliably exclude a TFCC tear** — MR arthrography remains the standard. Say this in the report rather than implying a normal ultrasound rules one out.\n\n**Scapholunate ligament:** The dorsal component is accessible. Widening of the scapholunate interval, particularly on dynamic stress with a clenched fist, suggests instability.\n\n**Ulnar nerve at Guyon's canal:** Less common than cubital tunnel compression but a real entity. Scan short axis between the pisiform and hook of hamate; look for a ganglion, which is the most frequent compressive cause here.\n\n---\n\n## Key Images to Capture\n\n1. Median nerve short axis at the pisiform — with CSA measurement\n2. Median nerve mid-forearm — for the wrist-to-forearm ratio\n3. Median nerve long axis through the tunnel\n4. First extensor compartment — short and long axis, with Doppler\n5. A1 pulley — long axis plus a dynamic clip if triggering\n6. Any cystic lesion — two planes, measurements, and Doppler\n7. Contralateral comparison for any borderline nerve measurement\n\n---\n\n## Reporting Language\n\n**Carpal tunnel syndrome:**\n\"The median nerve measures 14 mm² in cross-section at the level of the pisiform (normal ≤ 9 mm²) with loss of the normal fascicular architecture and palmar bowing of the flexor retinaculum. Wrist-to-forearm ratio 1.9. No ganglion, tenosynovitis, or persistent median artery identified. Findings consistent with moderate median neuropathy at the carpal tunnel; correlate with clinical findings and nerve conduction studies as indicated.\"\n\n**De Quervain's:**\n\"Hypoechoic thickening of the extensor retinaculum overlying the first extensor compartment with surrounding tenosynovial fluid and marked hyperaemia on power Doppler. A vertical septum separating APL and EPB subcompartments is identified. Focal tenderness under the transducer. Findings consistent with De Quervain's tenosynovitis.\"\n\n---\n\n*SonoBuddy keeps nerve cross-sectional area cutoffs and MSK protocols one tap away — offline, in the scan room.*"])</script><script>self.__next_f.push([1,"7:[\"
