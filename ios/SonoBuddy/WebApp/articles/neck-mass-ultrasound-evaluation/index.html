c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1ea1,"])</script><script>self.__next_f.push([1,"A neck mass is a common referral — the patient or clinician found something, and ultrasound is the first imaging step. Your job is to characterize it systematically: location, depth, cystic vs solid, vascular vs avascular, and then correlate with the age of the patient and clinical history.\n\n## Clinical Framework: Age-Based Differential\n\nThe patient's age matters enormously:\n\n**Child / young adult:** Congenital cysts dominate (thyroglossal duct cyst, branchial cleft cyst, dermoid). Reactive lymph nodes are extremely common.\n\n**Adult (20–40):** Reactive or inflammatory nodes, branchial cleft cyst (may present in adulthood), lymphoma.\n\n**Adult (\u003e 40, especially smoker/drinker):** Metastatic squamous cell carcinoma until proven otherwise. Thyroid nodule with cervical node. Lymphoma.\n\n---\n\n## Location-Based Approach\n\nThe location of a neck mass dramatically narrows the differential. Know the anatomic regions.\n\n| Location | Common Diagnoses |\n|---|---|\n| Midline, above thyoid | Thyroglossal duct cyst, dermoid, lymph node |\n| Midline at or below thyroid | Thyroid nodule, thyroglossal duct cyst, lymph node |\n| Anterior triangle (between SCM and midline) | Branchial cleft cyst (anterior triangle, anteromedial to SCM), reactive lymph node, carotid body tumor |\n| Posterior triangle (posterior to SCM) | Lymph node, lipoma, subclavian/external jugular thrombosis |\n| Preauricular / intraparotid | Parotid mass, intraparotid lymph node, first branchial cleft cyst |\n| Submandibular | Submandibular gland (calculus, tumor), lymph node |\n| Submental | Dermoid, lymph node, plunging ranula |\n\n---\n\n## Thyroglossal Duct Cyst (TDC)\n\nThe most common congenital neck mass in children. Remnant of the thyroglossal duct — the tract that forms during thyroid descent from the foramen cecum to the anterior neck.\n\n**Location:** Midline (or just off-midline), typically near the hyoid bone (within 1–2 cm of the hyoid, often embedded in or adjacent to it). Anywhere from the tongue base to the thyroid.\n\n**Sonographic appearance:**\n- Anechoic or hypoechoic cystic structure\n- Well-defined, thin-walled\n- Posterior acoustic enhancement\n- If infected: internal echoes, thickened wall, surrounding inflammatory changes\n- May move superiorly with swallowing or tongue protrusion (clinical test)\n\n**Confirm thyroid:** Always identify normal thyroid gland in separate location — rare ectopic thyroid can mimic a TDC, and removing the only functional thyroid tissue would be catastrophic.\n\n**Reporting:** Size, location relative to hyoid, cyst characteristics, thyroid identification.\n\n---\n\n## Branchial Cleft Cyst\n\nSecond branchial cleft cysts are most common (90%). Present in children or young adults — often discovered after an upper respiratory infection causes the cyst to enlarge.\n\n**Location:** Anterior to the SCM, along its anterior border, typically at the angle of the mandible (second branchial) or lower neck (third/fourth branchial — rare).\n\n**Sonographic appearance:**\n- Oval cystic structure anteromedial to the SCM\n- \"Beak\" sign: the cyst points inward between the internal and external carotid arteries — pathognomonic when present\n- Simple cyst: anechoic, thin wall, posterior enhancement\n- If previously infected: heterogeneous, thickened wall, internal debris\n\n**Key distinguishing feature:** Position between the carotid vessels (the \"beak\" sign).\n\n---\n\n## Dermoid Cyst\n\nA developmental cyst containing ectodermal elements (hair, sebaceous material, skin appendages).\n\n**Location:** Midline — submental, floor of mouth, or periorbital.\n\n**Sonographic appearance:**\n- Well-defined cystic mass\n- Variable internal contents — may have echogenic debris, fat globules (\"sack-of-marbles\" or heterogeneous)\n- Posterior acoustic enhancement\n- No vascularity\n\n**Plunging ranula:** A mucocele of the sublingual gland that herniates through the mylohyoid muscle into the submandibular space. Anechoic, \"diving\" cyst in the floor of mouth extending below the mylohyoid.\n\n---\n\n## Lymph Node Masses\n\nSee the dedicated SonoBuddy lymph node guide for full criteria. For neck mass evaluation specifically:\n\n**Reactive lymph nodes:** Oval, preserved hilum, uniform cortical thickening, hilar flow — benign.\n\n**Metastatic nodes:** Round, lost hilum, peripheral vascularity, calcification (papillary thyroid carcinoma) — suspicious.\n\n**In an adult with a lateral neck cystic mass:** Think **cystic metastasis from squamous cell carcinoma** (tonsillar or base of tongue primary). These can be almost entirely cystic and mimic a benign branchial cleft cyst. History, FNA cytology, and endoscopy are key.\n\n---\n\n## Vascular Masses\n\n### Carotid Body Tumor (Paraganglioma)\n\nA rare but distinctive neck mass arising from the carotid body at the carotid bifurcation.\n\n**Location:** At the bifurcation of the common carotid — typically at the level of the thyroid cartilage.\n\n**Sonographic appearance:**\n- Solid, hypoechoic mass at the carotid bifurcation\n- **Splays the internal and external carotid arteries** apart — the \"lyre sign\" (ICA and ECA are pushed apart by the mass between them)\n- **Hypervascular** on Doppler — intense color signal, high-flow pattern\n- Well-defined margins\n\n**Do not biopsy without surgical awareness** — these are highly vascular and bleeding risk is significant.\n\n### Cervical Venous Thrombosis\n\nThrombosis of the internal jugular vein (IJV) — associated with IV line complications, cavernous sinus thrombosis, or Lemierre's syndrome (septic thrombophlebitis from pharyngeal infection).\n\n**Sonographic appearance:**\n- Non-compressible IJV\n- Echogenic intraluminal thrombus\n- Absent or partial color Doppler signal within the vein\n\n---\n\n## How to Approach Any Unknown Neck Mass\n\n**Step 1:** Locate and describe.\n- Position (relative to SCM, hyoid, mandible, thyroid)\n- Size (three dimensions)\n- Depth (subcutaneous, within a gland, deep to muscles)\n\n**Step 2:** Cystic or solid?\n- Cystic: posterior enhancement, anechoic? → TDC, branchial cleft, dermoid, lymph node (necrotic)\n- Solid: → lymph node, salivary gland tumor, carotid body tumor, thyroid nodule\n\n**Step 3:** Vascularity.\n- Color Doppler of any solid mass\n- Hypervascular → inflammatory node, carotid body tumor, reactive node\n- Avascular or rim only → benign cyst, EIC\n\n**Step 4:** Check the thyroid.\n- Always image the thyroid in any neck mass evaluation — a primary thyroid lesion or thyroid-origin mass changes everything\n\n**Step 5:** Lymph nodes.\n- Survey levels I–V for adenopathy\n- Apply criteria for benign vs suspicious\n\n---\n\n## Reporting Language\n\n**Thyroglossal duct cyst:**\n\"1.8 × 1.4 × 1.6 cm anechoic cystic structure at the midline of the neck, immediately superior to and embedded within the hyoid bone. No internal echoes. Posterior acoustic enhancement. Normal thyroid gland identified in anatomic position. Findings consistent with a thyroglossal duct cyst.\"\n\n**Branchial cleft cyst:**\n\"2.4 × 1.8 × 2.2 cm oval cystic structure along the anterior margin of the right SCM at the level of the mandibular angle. The cyst has a thin wall and anechoic contents with posterior acoustic enhancement. A beaked extension is identified pointing medially between the carotid vessels. Findings are characteristic of a right second branchial cleft cyst.\"\n\n**Cystic neck mass — require further evaluation:**\n\"3.1 × 2.6 cm predominantly cystic mass at the level of left level II with surrounding solid component and a thickened irregular wall. The solid component demonstrates vascularity on Doppler. A purely cystic appearance of a lateral neck mass in an adult requires exclusion of cystic metastasis from oropharyngeal squamous cell carcinoma. ENT evaluation and FNA are recommended.\"\n\n---\n\n*SonoBuddy's small parts protocols include thyroid, salivary gland, lymph node, and neck mass evaluation guides.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"neck-mass-ultrasound-evaluation\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"neck-mass-ultrasound-evaluation\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"neck-mass-ultrasound-evaluation\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"neck-mass-ultrasound-evaluation\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"neck-mass-ultrasound-evaluation\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"neck-mass-ultrasound-evaluation\",\"title\":\"Neck Mass Evaluation on Ultrasound: Cysts, Lymph Nodes, and Vascular Lesions\",\"date\":\"2026-09-27\",\"excerpt\":\"How to approach an unknown neck mass on ultrasound — thyroglossal duct cysts, branchial cleft cysts, lymphadenopathy, vascular tumors, and the features that guide diagnosis and next steps.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"small parts\",\"neck\",\"mass\",\"cyst\",\"head and neck\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"soft-tissue-mass-ultrasound-evaluation\",\"title\":\"Soft Tissue Mass Evaluation on Ultrasound\",\"excerpt\":\"How to characterize soft tissue masses on ultrasound — lipoma, ganglion cyst, epidermal inclusion cyst, hemangioma, and the features that distinguish benign from suspicious lesions.\",\"date\":\"2026-09-15\"},{\"slug\":\"lymph-node-ultrasound-normal-pathologic\",\"title\":\"Lymph Node Ultrasound: Normal vs. Pathologic Criteria\",\"excerpt\":\"How to evaluate lymph nod
