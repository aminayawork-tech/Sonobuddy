 same day.** Hearing your side early helps.\n4. **Check your documentation.** Chaperone noted? Pain or limitations noted? Good charting protects you.\n\n## Separate Fact From Feeling\n\nAsk yourself honestly:\n\n- Is there **something true** in it? (*\"She didn't explain what she was doing.\"*)\n- Is it about **something outside my control**? (Wait times, results policy, insurance.)\n- Is it a **pattern** or a one-off?\n\nIf there's a fair point, own it. Small fixes like explaining each step, offering a warm towel, or checking in about pressure go a long way.\n\n## Prevent the Next One\n\n- **Narrate the exam:** *\"I'm going to press a little here; tell me if it's too much.\"*\n- **Set expectations up front** on results, timing, and what the scan can and can't show.\n- **Use a chaperone** for sensitive exams, and document it.\n- **Know your script** for \"what do you see?\" (see our guide on [what to say when the patient asks](/blog/patient-asks-what-do-you-see)).\n\n## Protect Your Confidence\n\n- **One complaint doesn't define you.** Experienced sonographers have dozens of grateful patients for every complaint.\n- **Talk to coworkers.** Almost all of them have a story.\n- **Watch for burnout signs.** If complaints start feeling crushing, it may be exhaustion talking (see [Sonographer Stress and Burnout](/blog/sonographer-stress-and-burnout)).\n\n## The Bottom Line\n\nComplaints are part of patient-facing work. **Pause, document, talk to your lead, take the fair part, and let go of the rest.** Your skill isn't measured by your worst day."])</script><script>self.__next_f.push([1,"7:[\"slug\",\"when-a-patient-complains-about-you-sonographer\",\"d\"]\n13:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"6dkmVV0ROIQa__W_6e72U\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"when-a-patient-complains-about-you-sonographer\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\
