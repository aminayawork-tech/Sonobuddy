c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T17e3,"])</script><script>self.__next_f.push([1,"Renal artery stenosis (RAS) is an important and underdiagnosed cause of secondary hypertension and chronic kidney disease. Duplex ultrasound is the first-line imaging study — but it's technically one of the most demanding abdominal vascular exams. Here's how to approach it.\n\n## Indications\n\n- Hypertension refractory to three or more medications\n- Hypertension onset before age 30 (consider fibromuscular dysplasia)\n- Acute renal failure after starting ACE inhibitor or ARB\n- Asymmetric kidney size (\u003e 1.5 cm difference)\n- Flash pulmonary edema without clear cardiac cause\n- Abdominal bruit in a hypertensive patient\n- Screening in patients with known atherosclerotic disease elsewhere\n\n## Anatomy\n\nEach kidney is typically supplied by a single renal artery arising from the aorta at the L1–L2 level. Accessory renal arteries (supplying the upper or lower pole separately) occur in 20–30% of people and are clinically important — they can be missed on ultrasound.\n\n**Segments of the renal artery:**\n- Aortic origin → main renal artery → segmental arteries → interlobar arteries → arcuate arteries → interlobular arteries\n\nDisease most commonly occurs at the **ostium** (aortic origin — atherosclerotic) or in the **mid-main renal artery** (fibromuscular dysplasia — beaded appearance).\n\n## Equipment and Setup\n\n**Probe:** 2–5 MHz curvilinear. Lower frequency for deep/obese patients.\n\n**Patient position:** Supine initially; lateral decubitus (coronal approach through the kidney) often gives better windows for intrarenal Doppler.\n\n**Patient prep:** Fasting 4–6 hours reduces bowel gas. Morning scheduling is ideal.\n\n**Time:** Budget 45–90 minutes. This is not a quick study.\n\n## Direct Renal Artery Doppler (Aortic Origin Approach)\n\nThe main renal arteries arise from the anterior-lateral aorta. The right renal artery courses posterior to the inferior vena cava.\n\n**Right renal artery:**\n- Transverse or sagittal plane at the aorta\n- Identify the IVC, then look for the right renal artery passing posterior to it\n- Rotate the probe obliquely following the vessel toward the right kidney\n- Doppler angle 60° or less\n\n**Left renal artery:**\n- Arises slightly superior to the right\n- More accessible in some patients in the left lateral decubitus position via the left kidney window\n- Can also be accessed from anterior with the patient supine — look for it arising from the aorta just above the superior mesenteric artery\n\n**Diagnostic criteria for significant stenosis (\u003e 60%):**\n\n| Parameter | Normal | Significant Stenosis |\n|---|---|---|\n| Main renal artery PSV | \u003c 180 cm/s | \u003e 180–200 cm/s |\n| Renal-to-aortic ratio (RAR) | \u003c 3.5 | \u003e 3.5 |\n| Turbulence | None | Post-stenotic turbulence |\n\n**Renal-to-aortic ratio (RAR):** PSV at the renal artery ÷ PSV at the infrarenal aorta. More reliable than PSV alone because it accounts for cardiac output variation.\n\n## Indirect (Intrarenal) Doppler\n\nWhen direct visualization of the main renal artery is technically impossible (bowel gas, obesity, deep vessels), intrarenal Doppler provides indirect evidence of significant upstream stenosis.\n\n**Where to sample:** Upper pole, mid pole, and lower pole interlobar or arcuate arteries. Use the lateral coronal approach through the kidney.\n\n**Resistive index (RI):** (PSV − EDV) ÷ PSV\n- Normal RI: 0.58–0.72\n- Elevated RI (\u003e 0.80) suggests intrinsic renal parenchymal disease (not stenosis)\n\n**Tardus-parvus waveform:** The hallmark of significant upstream stenosis.\n- Slow systolic acceleration (acceleration time \u003e 70–100 ms)\n- Rounded, blunted peak (loss of the sharp systolic upstroke)\n- Reduced amplitude\n- Acceleration index (AI) \u003c 3.78 m/s²\n\n**Acceleration time (AT):** Time from end-diastole to peak systole. Normal \u003c 70 ms. \u003e 100 ms is highly specific for significant stenosis.\n\n## What to Document\n\nFor each kidney:\n- Main renal artery: PSV, waveform, turbulence, visualization quality\n- Intrarenal arteries: RI at upper/mid/lower pole, waveform character, AT if abnormal\n- Kidney size (length)\n- Cortical echogenicity and thickness\n\n## Fibromuscular Dysplasia vs Atherosclerosis\n\n**Atherosclerotic RAS:**\n- Older patients, usually \u003e 50\n- Stenosis at the ostium or proximal main artery\n- Calcified plaque, irregular vessel wall\n- Often bilateral\n\n**Fibromuscular dysplasia (FMD):**\n- Younger women (20–50s), no traditional risk factors\n- Mid-main renal artery involvement\n- \"String of beads\" appearance on imaging (alternating narrowing and dilation)\n- Often unilateral, right side more common\n\nFMD on ultrasound: may see the beaded appearance on B-mode if the vessel is well-visualized; spectral Doppler often shows multiple zones of elevated velocity.\n\n## Study Limitations\n\nThis is one of the most technically limited abdominal studies in ultrasound. Always document:\n\n- \"Direct visualization of bilateral main renal arteries achieved/not achieved due to bowel gas.\"\n- \"Right main renal artery not visualized — indirect intrarenal Doppler parameters assessed.\"\n- \"Accessory renal arteries cannot be excluded.\"\n\nA technically limited study that provides indirect parameters is still clinically useful. A study where neither direct nor indirect evaluation is possible should be flagged for CT angiography or MR angiography.\n\n## Reporting Language\n\n- \"No evidence of hemodynamically significant renal artery stenosis bilaterally. PSV right renal artery 120 cm/s, RAR 2.1. Intrarenal RI 0.65 bilaterally. Normal waveforms throughout.\"\n- \"Elevated PSV of 240 cm/s at the right renal artery origin, RAR 4.2, with post-stenotic turbulence. Tardus-parvus waveforms in the right intrarenal arteries (AT 110 ms). Findings consistent with hemodynamically significant right renal artery stenosis.\"\n- \"Left main renal artery not directly visualized due to overlying bowel gas. Indirect intrarenal Doppler: RI 0.68, normal acceleration time and waveform morphology — indirect parameters do not suggest significant upstream stenosis.\"\n\n---\n\n*SonoBuddy's Measurements section includes renal artery PSV thresholds, RI normal values, and intrarenal Doppler reference ranges.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"renal-artery-stenosis-doppler-protocol\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"renal-artery-stenosis-doppler-protocol\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"renal-artery-stenosis-doppler-protocol\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"renal-artery-stenosis-doppler-protocol\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"renal-artery-stenosis-doppler-protocol\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"renal-artery-stenosis-doppler-protocol\",\"title\":\"Renal Artery Stenosis: Doppler Protocol and Diagnostic Criteria\",\"date\":\"2026-08-02\",\"excerpt\":\"How to scan the renal arteries for stenosis — direct and indirect Doppler criteria, technical tips for a difficult exam, and what findings prompt intervention.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"vascular\",\"protocol\",\"renal\",\"Doppler\",\"stenosis\",\"hypertension\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"renal-transplant-ultrasound-protocol\",\"title\":\"Renal Transplant Ultrasound: Protocol, Doppler, and Rejection Findings\",\"excerpt\":\"How to evaluate the transplant kidne
