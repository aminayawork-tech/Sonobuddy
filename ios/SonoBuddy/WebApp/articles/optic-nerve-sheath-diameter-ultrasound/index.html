c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T191a,"])</script><script>self.__next_f.push([1,"The optic nerve sheath is a direct anatomical extension of the dura mater, and cerebrospinal fluid fills the subarachnoid space around it. When intracranial pressure rises, that fluid distends the sheath before most other measurable signs appear — which is exactly why a five-minute bedside scan can flag a problem well before a CT is available.\n\nThis is a screening tool, not a monitor. It tells you *possibly elevated*, not *how elevated*, and it never replaces invasive ICP monitoring when that's indicated. Used that way, it's one of the highest-value five-minute scans in emergency and critical care ultrasound.\n\n---\n\n## Why It Works\n\nThe optic nerve sheath is the most distensible part of the CSF-filled space accessible to a surface probe. Autopsy and imaging studies consistently show sheath distension correlating with elevated ICP, and the effect is most pronounced **3 mm behind the globe** — close enough to the eye to image easily, far enough back that the measurement reflects sheath distension rather than the nerve itself flattening near its insertion.\n\n---\n\n## Technique\n\n**Probe:** High-frequency linear, 7–15 MHz. This is a superficial structure; do not drop frequency for penetration you don't need.\n\n**Position:** Patient supine, eyes closed. If cervical spine precautions don't prohibit it, slight head elevation is fine.\n\n**Setup:** Generous gel over the closed eyelid. Rest the probe gently on the lid — **do not press**. The globe is a fluid-filled structure and any compression can transiently increase intraocular pressure or, in trauma, worsen an occult injury. This is a light-touch scan.\n\n**Reduce acoustic output.** The eye is one of the more sensitive structures to ultrasound energy. Use the ophthalmic preset if your machine has one, or manually drop power (MI) and minimize dwell time. This is a hard safety point, not a suggestion.\n\n### Finding the Nerve\n\nSweep in transverse and sagittal planes through the globe. The optic nerve appears as a hypoechoic linear structure extending posteriorly from the globe, roughly in its center. Fan gently to keep the nerve in the same plane as the globe's maximum diameter — an oblique cut foreshortens the nerve and can make a normal sheath look falsely enlarged.\n\n### The Measurement\n\n1. Identify the globe posterior pole and the nerve extending straight back from it.\n2. Measure **3 mm posterior to the globe** — most machines let you drop a caliper on the globe posterior margin, then measure along the nerve axis to the 3 mm mark.\n3. At that point, measure the **sheath diameter perpendicular to the nerve** — outer hyperechoic margin to outer hyperechoic margin, not the hypoechoic nerve itself. The sheath, not the nerve, is what distends.\n4. Take measurements in **both transverse and sagittal planes**, and **both eyes**. Average multiple measurements — this is a small structure and small caliper placement differences move the number meaningfully.\n\n---\n\n## Normal Values and Thresholds\n\nWidely cited adult thresholds:\n\n| ONSD | Interpretation |\n|---|---|\n| **≤ 5.0 mm** | Generally reassuring |\n| **\u003e 5.0 mm** | Suggests possible elevated ICP — commonly cited threshold |\n| **\u003e 5.7–6.0 mm** | Higher-confidence abnormal in several validation studies |\n\nCutoffs vary somewhat between studies, and pediatric normal values are smaller and age-dependent — do not apply adult thresholds to children. Know the specific reference values your institution has adopted.\n\n**This is a probability shift, not a diagnosis.** A sheath measuring 5.5 mm raises concern for elevated ICP; it does not quantify a specific pressure, and ONSD does not substitute for CT when the clinical picture warrants one.\n\n---\n\n## What Affects the Measurement\n\n**Optic neuritis, sheath meningioma, and thyroid orbitopathy** can enlarge the sheath independent of ICP — a relevant differential in a patient with a plausible history for any of these.\n\n**Technique errors that inflate the number:**\n\n- Measuring the **nerve** instead of the **sheath**\n- An **oblique** scan plane, foreshortening and widening the apparent structure\n- Measuring at the wrong distance from the globe — too close to the globe overestimates due to a normal wider insertion point\n- **Pressing the probe**, distorting the globe and displacing tissue\n\n**Population variation:** ONSD tends to run larger in some ethnic groups independent of pathology — this is a documented source of variability in the literature, and a reason to interpret borderline values in clinical context rather than as an absolute cutoff for every patient.\n\n---\n\n## Clinical Use Cases\n\n**Traumatic brain injury** — a rapid adjunct while awaiting imaging or during transport, when formal ICP monitoring isn't yet in place.\n\n**Suspected idiopathic intracranial hypertension** — supportive finding alongside fundoscopy and other clinical assessment.\n\n**Serial monitoring** — trending ONSD over time in a patient with a known elevated-ICP process, watching for worsening or improvement, when direct monitoring isn't available or as a supplement to it.\n\n**Resource-limited settings** — where CT isn't immediately accessible, ONSD provides a rapid triage signal for who needs urgent transfer or escalation.\n\n**What it is not for:** replacing a clinically indicated CT, replacing invasive monitoring in a patient who needs one, or providing a specific pressure value. Correlate every finding with the full clinical picture — mental status, pupillary exam, and the primary diagnosis driving the concern.\n\n---\n\n## Key Images to Capture\n\n1. Sagittal globe and nerve, right eye — with the 3 mm caliper mark and sheath measurement\n2. Transverse globe and nerve, right eye — same measurement\n3. Sagittal and transverse, left eye\n4. Document probe pressure was minimal and acoustic output was reduced\n\n---\n\n## Reporting Language\n\n\"Optic nerve sheath diameter measured 3 mm posterior to the globe. Right eye: 4.8 mm (sagittal), 4.9 mm (transverse). Left eye: 5.6 mm (sagittal), 5.8 mm (transverse). Findings on the left are above the commonly cited 5.0 mm threshold and raise concern for elevated intracranial pressure. This is a screening measurement — correlate with clinical exam and consider CT or definitive ICP monitoring as indicated.\"\n\n---\n\n*SonoBuddy is a reference tool for sonographers — ONSD findings support, but never substitute for, clinical judgment and definitive neuroimaging.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"optic-nerve-sheath-diameter-ultrasound\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"optic-nerve-sheath-diameter-ultrasound\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"optic-nerve-sheath-diameter-ultrasound\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"optic-nerve-sheath-diameter-ultrasound\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"optic-nerve-sheath-diameter-ultrasound\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"optic-nerve-sheath-diameter-ultrasound\",\"title\":\"Optic Nerve Sheath Diameter: A Bedside Window on Intracranial Pressure\",\"date\":\"2026-10-01\",\"excerpt\":\"How to measure optic nerve sheath diameter at the bedside — technique, the 5 mm threshold, and why ONSD is a screening tool for raised ICP, not a replacement for definitive monitoring.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"POCUS\",\"optic nerve\",\"intracrani
