c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1968,"])</script><script>self.__next_f.push([1,"Hepatocellular carcinoma (HCC) is the most common primary liver cancer, and nearly all of it arises in livers that are already diseased: cirrhosis from hepatitis B or C, alcohol, or metabolic-associated fatty liver disease. Surveillance ultrasound exists to catch HCC while it's still small enough to cure. For many cirrhotic patients, **you are the screening test.**\n\n## Who Gets Surveillance, and How Often\n\nMajor guidelines (AASLD, EASL) recommend surveillance ultrasound, with or without serum AFP, **every 6 months** for:\n\n- Adults with **cirrhosis** of any cause who would be candidates for treatment\n- Certain patients with **chronic hepatitis B** even without cirrhosis, based on age, sex, ancestry, and family history\n\nThe 6-month interval reflects how fast HCC typically grows. Annual scans let too many tumors outgrow curative treatment.\n\n## Scanning Technique\n\nThe cirrhotic liver is one of the hardest organs to scan well: shrunken, coarse, nodular, and often tucked high under the ribs.\n\n1. **Fasting** for 4–6 hours improves the window and distends the gallbladder\n2. **Curvilinear probe**, typically 2–5 MHz; drop the frequency for large or fatty patients\n3. **Subcostal and intercostal** sweeps. The intercostal approach often rescues the right lobe and dome.\n4. **Left lateral decubitus** and deep-inspiration breath holds to bring the liver down\n5. Sweep **every segment** systematically, including the dome, caudate, and lateral left lobe\n6. Use **harmonics** and adjust the focal zone as you go deeper\n\n**Also assess:**\n- **Liver surface**: nodular contour (a high-frequency linear probe on the anterior surface helps)\n- **Portal vein**: patency, **flow direction** (hepatopetal or hepatofugal), velocity\n- **Spleen size** and **ascites** as signs of portal hypertension\n- Any **varices** or a recanalized paraumbilical vein\n\n## What HCC Can Look Like\n\nThere's no single \"HCC look,\" which is why any new nodule matters.\n\n- **Small HCC** (under ~2 cm): most often **hypoechoic**\n- **Larger HCC**: heterogeneous, mosaic pattern, sometimes hyperechoic (fat or necrosis)\n- **Peripheral hypoechoic halo**, the pseudocapsule\n- **Arterial hypervascularity** within the nodule on color Doppler\n\n![Hepatocellular carcinoma with arterial hypervascularity on color Doppler](/pathologies/hepatocellular_carcinoma_1.jpg \"HCC: arterial hypervascularity within a hepatic nodule on color Doppler|R. Badea and Simona Ioanitescu, CC BY 3.0, via Wikimedia Commons\")\n\n![Early hepatocellular carcinoma arising in a dysplastic nodule](/pathologies/hepatocellular_carcinoma_3.jpg \"Early HCC arising in a dysplastic nodule: a hypoechoic lesion with internal vascularity|R. Badea and Simona Ioanitescu, CC BY 3.0, via Wikimedia Commons\")\n\nRemember: **ultrasound doesn't diagnose HCC.** Its job is to find observations that need multiphase CT or MRI. Your report categorizes the finding, and imaging with contrast characterizes it.\n\n## LI-RADS Ultrasound Categories\n\nThe ACR's LI-RADS ultrasound surveillance algorithm standardizes what an exam result means and what happens next.\n\n| Category | Meaning | Typical next step |\n|---|---|---|\n| **US-1 Negative** | No observation, or only definitely benign findings (e.g., a simple cyst) | Repeat surveillance in 6 months |\n| **US-2 Subthreshold** | Observation **under 10 mm**, not definitely benign | Repeat ultrasound in about 3 months |\n| **US-3 Positive** | Observation **10 mm or larger**, not definitely benign, **or a new thrombus in a vein** | Multiphase contrast-enhanced CT or MRI |\n\nThe radiologist assigns the category, but your measurements and images are what it's built on, so **measure every observation in its longest dimension** and image it in two planes.\n\n## Visualization Scores\n\nEvery surveillance report also includes how well you could see the liver. That tells the team how much to trust a \"negative\" exam.\n\n| Score | Meaning |\n|---|---|\n| **VIS-A** | No or minimal limitations; small lesions unlikely to be missed |\n| **VIS-B** | Moderate limitations that may obscure small masses |\n| **VIS-C** | Severe limitations; focal lesions could be missed |\n\nCommon causes of VIS-B or VIS-C are a heterogeneous or coarse cirrhotic liver, steatosis with beam attenuation, obesity, and high liver position with rib shadowing. **Be honest here.** A VIS-C exam reported as reassuring is a real patient-safety problem, and repeated VIS-C exams can prompt the team to choose a different surveillance method. Note *why* visualization was limited.\n\n## Portal Vein Thrombus: Bland or Tumor?\n\nA new portal vein thrombus in a cirrhotic patient is a **positive (US-3) finding**.\n\n| Feature | Bland thrombus | Tumor in vein |\n|---|---|---|\n| Vein | Usually not expanded | Often **expanded** |\n| Color Doppler within thrombus | No flow | **Internal flow** |\n| Spectral Doppler | n/a | **Arterial waveform** inside the thrombus |\n| Adjacent liver | Often unremarkable | May have an associated mass |\n\nPut spectral Doppler **inside the thrombus**, not just in the patent lumen. Arterial signal within a thrombus is one of the most important findings you can make on this exam.\n\n## What to Document\n\n1. Liver size, contour, and echotexture\n2. **Each observation**: location (segment), size, echogenicity, margins, color Doppler\n3. Comparison with prior exams. **New or growing** is the key word.\n4. Portal vein patency, direction, velocity, and any thrombus with internal Doppler\n5. Spleen size, ascites, and visible varices\n6. **Visualization score** with the reason for any limitation\n\nExample wording to suggest to the interpreting physician:\n\n\u003e \"New 14 mm hypoechoic observation in segment VI with internal color Doppler flow, not seen on the exam from 6 months ago. Portal vein patent with hepatopetal flow. Visualization: moderate limitation from coarse parenchyma.\"\n\n## Red Flags: Escalate Promptly\n\n- **Tumor in vein**: portal or hepatic vein thrombus with internal arterial flow\n- A **new or growing** observation of 10 mm or more\n- New **hepatofugal** portal flow or new large-volume ascites\n- **Multiple new nodules** compared with the prior exam\n\n## Bottom Line\n\nA surveillance liver exam is only as good as its weakest window. Scan every segment, measure every observation, put Doppler inside any thrombus, and report your visualization honestly. Your job is to flag what needs CT or MRI, every six months, without fail.\n\n*SonoBuddy is a reference tool, not a diagnostic authority. LI-RADS categories are assigned by the interpreting physician.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"hcc-surveillance-ultrasound-li-rads\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"hcc-surveillance-ultrasound-li-rads\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"hcc-surveillance-ultrasound-li-rads\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"hcc-surveillance-ultrasound-li-rads\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"hcc-surveillance-ultrasound-li-rads\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"hcc-surveillance-ultrasound-li-rads\",\"title\":\"HCC Surveillance Ultrasound: LI-RADS Categories and Visualization Scores\",\"date\":\"2026-11-01\",\"excerpt\":\"How to scan a cirrhotic liver for hepatocellular carcinoma — technique, the LI-RADS US-1/US-2/US-3 categories, VIS-A/B/C visualization scores, port
