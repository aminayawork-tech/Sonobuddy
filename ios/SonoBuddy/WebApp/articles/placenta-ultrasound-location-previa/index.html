c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1b5f,"])</script><script>self.__next_f.push([1,"Placental location is a standard component of every second and third trimester ultrasound. A low-lying placenta or placenta previa has significant clinical consequences for delivery planning, so your documentation needs to be accurate and complete. Here's how to approach it.\n\n## Normal Placenta\n\n**Appearance:**\n- Homogeneously echogenic structure (isoechoic to slightly hyperechoic compared to myometrium)\n- Smooth maternal surface (basal plate at the myometrium)\n- Smooth fetal surface (chorionic plate, with umbilical cord insertion)\n- Thickness: typically 2–4 cm (1 mm per week of gestation — rough rule)\n\n**What to document:**\n- Location (anterior / posterior / fundal / right lateral / left lateral / low-lying)\n- Relationship of the lower placental edge to the internal cervical os\n- Grade (Grannum grading — optional, less commonly required now)\n- Umbilical cord insertion site (central / eccentric / marginal / velamentous)\n\n## Placental Location Terminology\n\n| Term | Definition |\n|---|---|\n| Anterior | Placenta on the front uterine wall |\n| Posterior | Placenta on the back uterine wall |\n| Fundal | Placenta at the top of the uterus |\n| Low-lying | Lower placental edge within 2 cm of internal os but not covering it |\n| Marginal previa | Lower placental edge reaches but does not cover the internal os |\n| Partial previa | Placenta partially covers the internal os |\n| Complete previa | Placenta completely covers the internal os |\n\n**Note:** The terms \"marginal,\" \"partial,\" and \"complete\" previa are being replaced in some guidelines with simply \"placenta previa\" (when the placenta covers the os) vs \"low-lying placenta\" (within 2 cm but not covering). Check your department's reporting preference.\n\n## Why Placental Location Matters at Different Gestational Ages\n\n**18–20 weeks (anatomy scan):** A low-lying placenta at 20 weeks is very common and usually resolves by term as the lower uterine segment grows — a process called \"placental migration.\" Do not alarm the patient based on a 20-week finding alone.\n\n**32–36 weeks:** If low-lying at 20 weeks, follow-up imaging is indicated. By 32–36 weeks, the lower uterine segment has elongated and most low-lying placentas have moved.\n\n**Term (36+ weeks):** Distance to internal os is critical for delivery planning. Placenta previa at this stage requires cesarean delivery.\n\n## Measuring the Placenta-to-Os Distance\n\n**Transabdominal approach (TAS):**\n- Sagittal plane through the uterine cervix and lower uterine segment\n- Identify the internal cervical os\n- Measure from the lower placental edge to the os in mm\n- TAS overestimates the distance and is less accurate than TVS\n\n**Transvaginal approach (TVS) — preferred for low-lying placenta:**\n- TVS is safe in placenta previa and provides far superior visualization of the os\n- Insert probe gently to the vaginal fornix — no need to touch or enter the cervix\n- Sagittal plane: identify the internal os as the point where the cervical canal opens into the uterine cavity\n- Measure from the lower placental edge to the internal os\n- If the placenta overlaps: measure how far it covers the os (report as overlap in mm)\n\n**Reporting the distance:**\n- \u003e 20 mm from os at 32+ weeks: vaginal delivery likely safe\n- 1–20 mm (low-lying): close surveillance, likely planned cesarean\n- 0 mm / overlapping: placenta previa — cesarean delivery\n\n## Anterior Placenta: Special Considerations\n\nAn anterior placenta is normal — but it has practical implications:\n\n- **Fundal height:** Uterus may measure larger\n- **Amniocentesis:** Higher risk of placental needle traversal — operator will try to find a window\n- **C-section:** Anterior placenta with prior uterine surgery = higher risk of placenta accreta spectrum\n\n**Documenting an anterior placenta:** Always note whether it is low-lying or reaching toward the lower uterine segment. An anterior placenta near the scar of a prior cesarean section warrants additional scrutiny (see accreta below).\n\n## Placenta Accreta Spectrum\n\nPlacenta accreta spectrum (PAS) refers to abnormal placental attachment to the uterine wall, ranging from accreta (superficial) to increta (into the myometrium) to percreta (through the serosa).\n\n**Risk factors:**\n- Prior cesarean section(s) — the most important risk factor\n- Anterior low-lying placenta over the cesarean scar\n- Prior uterine surgery\n\n**Ultrasound features of PAS:**\n- **Loss of retroplacental clear zone:** The normal hypoechoic strip of myometrium behind the placenta disappears\n- **Placental lacunae:** Irregular anechoic vascular spaces within the placenta — \"moth-eaten\" or \"Swiss cheese\" appearance — highly associated with accreta\n- **Bridging vessels:** Vessels crossing from the placenta into the myometrium on color Doppler\n- **Bladder wall irregularity:** In percreta, vessels may extend into or through the bladder wall\n\n**Reporting language for suspected PAS:** \"Findings are concerning for possible placenta accreta spectrum. Loss of the retroplacental clear zone and placental lacunae are identified at the [location] where the placenta overlies the prior cesarean scar. MRI and maternal-fetal medicine consultation are recommended.\"\n\n## Vasa Previa\n\nVasa previa occurs when fetal vessels from a velamentous cord insertion or succenturiate lobe cross the internal os in front of the presenting part. This is a life-threatening fetal emergency if the membranes rupture.\n\n**Ultrasound features:**\n- Velamentous cord insertion (cord inserts into the membranes, not the placenta directly)\n- Vessels visible overlying the internal os on color Doppler\n- May see pulsatile vessels at the os on transvaginal scan\n\nAny velamentous insertion or low marginal insertion should prompt transvaginal color Doppler evaluation of the internal os.\n\n## Key Images to Capture\n\n1. Placenta — panoramic view showing its full extent and location\n2. Lower uterine segment — sagittal, showing internal os and lower placental edge\n3. Measurement of placenta-to-os distance (TVS if low-lying)\n4. Cord insertion site — color Doppler\n5. Retroplacental zone (for accreta risk cases)\n6. Placental lacunae (if present) — with and without color Doppler\n\n## Reporting Examples\n\n- \"Posterior placenta, fundal, not low-lying. Umbilical cord inserts centrally. No placental abnormality identified.\"\n- \"Anterior placenta, extending into the lower uterine segment. Lower placental edge is 8 mm from the internal cervical os on transvaginal imaging. Findings consistent with low-lying placenta. Follow-up imaging recommended at 32–36 weeks.\"\n- \"Anterior complete placenta previa — placenta covers the internal os with 22 mm of overlap on transvaginal imaging. Prior cesarean scar is underlying the placenta. Retroplacental clear zone is absent at the scar site. Placental lacunae are identified. Findings raise concern for placenta accreta spectrum.\"\n\n---\n\n*SonoBuddy's OB protocols and Pathologies section covers placenta previa and accreta — including red flags and reporting tips.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"placenta-ultrasound-location-previa\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"placenta-ultrasound-location-previa\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"placenta-ultrasound-location-previa\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"placenta-ultrasound-location-previa\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\
