c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1f3a,"])</script><script>self.__next_f.push([1,"The elbow is one of the most rewarding MSK ultrasound studies because so much of what causes elbow pain sits within a centimetre or two of the skin. Tendon origins, the ulnar nerve, and the olecranon bursa are all superficial enough to image at high resolution, and several of them can be tested dynamically in ways MRI cannot match.\n\nWork through four quadrants in the same order every time and the study takes ten minutes.\n\n## Probe and Setup\n\n**Probe:** High-frequency linear, 10–18 MHz. The structures are shallow — resist the temptation to drop frequency.\n\n**The four quadrants:**\n\n1. **Anterior** — distal biceps insertion, brachialis, joint recess, median nerve\n2. **Lateral** — common extensor tendon, radial collateral ligament, radiocapitellar joint\n3. **Medial** — common flexor tendon, ulnar collateral ligament\n4. **Posterior** — triceps insertion, olecranon bursa, posterior fat pad, ulnar nerve\n\n---\n\n## Lateral: Common Extensor Tendon\n\nThis is the most common referral by a wide margin — \"tennis elbow.\"\n\n**Position:** Elbow flexed 90°, forearm pronated, hand resting palm-down. Probe in long axis over the lateral epicondyle.\n\n**Normal:** Hyperechoic fibrillar tendon arising from the lateral epicondyle, roughly 3–5 mm thick, tapering distally. The extensor carpi radialis brevis is the deepest and most commonly affected component.\n\n**Lateral epicondylitis (more accurately, tendinosis):**\n\n- Hypoechoic swelling at the origin with loss of the fibrillar pattern\n- Tendon thickening compared with the asymptomatic side — always compare\n- Cortical irregularity or enthesophytes at the epicondyle\n- Neovascularity on power Doppler, which correlates with symptomatic disease\n- **Partial tear:** focal anechoic cleft within the thickened tendon\n- **Full-thickness tear:** complete discontinuity with fluid filling the gap\n\nCalcification within the tendon is common in chronic cases and does not by itself indicate a tear.\n\n**Tip:** Scan the contralateral elbow. Tendon thickness varies enough between individuals that a single measurement means little without a comparison.\n\n---\n\n## Medial: Common Flexor Tendon and UCL\n\n**Position:** Elbow extended, forearm supinated, arm externally rotated.\n\n**Common flexor tendon** — the medial counterpart, \"golfer's elbow.\" Same findings, same approach, less frequently symptomatic.\n\n**Ulnar collateral ligament (UCL):** The anterior bundle is the functionally important one, running from the medial epicondyle to the sublime tubercle of the ulna.\n\n**Normal:** Compact hyperechoic band, typically around 4–6 mm thick.\n\n**Valgus stress testing** is where ultrasound earns its place. Apply gentle valgus force while imaging the ulnohumeral joint and measure the medial joint space. Compare with the contralateral side — asymmetric gapping suggests UCL insufficiency. This is a common study in throwing athletes and the dynamic component is the entire point.\n\n---\n\n## Posterior: Ulnar Nerve and Olecranon\n\n### Ulnar Nerve at the Cubital Tunnel\n\n**Position:** Elbow flexed 90°, probe in short axis over the groove between the medial epicondyle and olecranon.\n\n**Normal:** Oval hypoechoic fascicles in a hyperechoic sheath. Cross-sectional area at the cubital tunnel is generally **under about 10 mm²**; values above this raise concern for ulnar neuropathy, with larger areas correlating with more severe compression.\n\n**Technique note:** Measure CSA by tracing inside the hyperechoic epineurium, not around it. Keep the probe perpendicular — obliquity inflates the measurement.\n\n**Cubital tunnel syndrome:**\n\n- Nerve enlargement, most pronounced at or just proximal to the tunnel\n- Loss of the normal fascicular pattern; the nerve looks hypoechoic and swollen\n- Flattening distal to the compression point\n\n**Dynamic assessment for subluxation:** Keep the probe in short axis over the nerve and slowly flex the elbow through full range. A subluxating ulnar nerve snaps over or anterior to the medial epicondyle during flexion and returns on extension. This is a purely dynamic diagnosis — a static study will miss it entirely, and it is a genuine cause of medial elbow pain and paraesthesia.\n\n### Olecranon Bursa\n\n**Normal:** Not visible.\n\n**Olecranon bursitis:** Fluid collection superficial to the triceps insertion. Characterize it:\n\n- **Simple** — anechoic, compressible, no Doppler signal\n- **Complex** — internal echoes, septations, synovial thickening, hyperaemia on Doppler\n\nComplex bursitis with surrounding soft tissue hyperaemia and clinical erythema raises concern for septic bursitis, which changes management urgently. Say so explicitly in the report rather than describing echoes and leaving the reader to infer.\n\n### Triceps Insertion\n\nLong axis over the olecranon. Look for tendinosis, partial tearing, and enthesophytes. Complete triceps rupture is uncommon but functionally significant and shows retraction with a fluid-filled gap.\n\n---\n\n## Anterior: Distal Biceps and Joint Recess\n\n### Distal Biceps Tendon\n\nThe hardest structure in the elbow to image well, because it dives deep and posterior to insert on the radial tuberosity — running away from the probe at an angle that produces heavy anisotropy.\n\n**Approaches:**\n\n- **Anterior longitudinal**, elbow extended and supinated — good for the proximal tendon, poor at the insertion\n- **Medial approach** using the pronator teres as a window, which improves the insertion angle\n- **Posterior approach** with the elbow flexed and pronated, imaging the tuberosity directly\n\n**Findings:**\n\n- **Tendinosis:** hypoechoic thickening near the insertion\n- **Partial tear:** fibre discontinuity with adjacent fluid\n- **Complete rupture:** absent tendon at the tuberosity with proximal retraction and a haematoma. Clinically there is often a \"reverse Popeye\" deformity. Complete distal biceps rupture is usually a surgical decision, and the retraction distance matters to the surgeon — measure it.\n\n**Anisotropy warning:** More false-positive distal biceps tears are called from anisotropy than from any other artifact in the elbow. Before calling a hypoechoic area a tear, angle the probe to make it fill in. If it brightens, it was anisotropy.\n\n### Joint Effusion\n\n**Position:** Probe longitudinal over the posterior olecranon fossa, elbow flexed 45°.\n\nThe posterior fat pad is the most sensitive location for elbow effusion. Normally the fat pad sits within the fossa; an effusion displaces it posteriorly. Anteriorly, check the coronoid fossa recess.\n\nCharacterize as simple or complex — complex effusion with synovial hypertrophy and Doppler signal suggests inflammatory or septic arthritis.\n\n---\n\n## Key Images to Capture\n\n1. Common extensor tendon — long and short axis, with power Doppler\n2. Common flexor tendon — long axis\n3. UCL — long axis, with and without valgus stress\n4. Ulnar nerve — short axis with CSA measurement, plus dynamic flexion clip\n5. Olecranon bursa\n6. Triceps insertion — long axis\n7. Distal biceps — long axis to the tuberosity\n8. Posterior olecranon fossa — effusion assessment\n9. Contralateral comparison of any abnormal structure\n\n---\n\n## Reporting Language\n\n**Lateral epicondylitis:**\n\"Hypoechoic thickening of the common extensor tendon origin measuring 7 mm (contralateral 4 mm) with loss of normal fibrillar architecture and moderate neovascularity on power Doppler. A 3 mm intrasubstance cleft is present without full-thickness discontinuity. Findings consistent with common extensor tendinosis with a partial-thickness tear.\"\n\n**Ulnar neuropathy:**\n\"The ulnar nerve measures 14 mm² in cross-section at the cubital tunnel (contralateral 7 mm²) with loss of the normal fascicular pattern. On dynamic flexion the nerve subluxes anteriorly over the medial epicondyle. Findings consistent with ulnar neuropathy at the elbow with associated nerve subluxation.\"\n\n---\n\n*SonoBuddy's MSK reference covers shoulder, elbow, wrist, knee, and ankle protocols — available offline in the scan room.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"elbow-ultrasound-protocol-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"elbow-ultrasound-protocol-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"elbow-ultrasound-protocol-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"elbow-ultrasound-protocol-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"elbow-ultrasound-protocol-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"elbow-ultrasound-protocol-guide\",\"title\":\"Elbow Ultrasound: Epicondylitis, Ulnar Nerve, and Distal Biceps\",\"date\":\"2026-08-09\",\"excerpt\":\"A four-quadrant approach to elbow ultrasound — common extensor and flexor tendons, ulnar nerve at the cubital tunnel, distal biceps, joint effusion, and olecranon bursitis.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"musculoskeletal\",\"elbow\",\"tendon\",\"ulnar nerve\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"shoulder-ultrasound-rotator-cuff-guide\",\"title\":\"Shoulder Ultrasound: Rotator Cuff, Biceps Tendon, and Subacromial Space\",\"excerpt\":\"How to scan the shoulder systematically — supraspinatus, infraspinatus, subscapularis, biceps tendon, and AC joint — with normal appearances, tear findings, and dynamic testing.\",\"date\":\"2026-09-01\"},{\"slug\":\"knee-ultrasound-protocol-
