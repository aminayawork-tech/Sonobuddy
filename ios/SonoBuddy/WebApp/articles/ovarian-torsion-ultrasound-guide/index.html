c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T16e0,"])</script><script>self.__next_f.push([1,"Ovarian torsion is a surgical emergency — the ovary twists on its pedicle, compromising blood supply and leading to irreversible ischemia if not treated promptly. Ultrasound is the primary imaging tool, but the diagnosis is clinical as much as sonographic. Understanding the findings — and their limitations — is essential.\n\n## Clinical Presentation\n\n- Sudden onset severe unilateral pelvic pain, often colicky\n- May radiate to the flank or lower back\n- Nausea and vomiting (common, sometimes the predominant symptom)\n- Can present in any age group — peak in reproductive years, but occurs in children and postmenopausal women\n- Prior history of ovarian cyst or mass (risk factor — provides a pivot point for torsion)\n- Pain may wax and wane (intermittent torsion with spontaneous detorsion)\n\n## Ultrasound Findings\n\n### Primary Findings\n\n**Enlarged ovary:**\nThe most consistent finding in ovarian torsion. A torsed ovary is typically \u003e 4 cm (often much larger — 6–10 cm). Compare carefully to the contralateral side.\n\nNormal ovary volume: length × width × height × 0.523. Normal \u003c 20 mL in reproductive age, \u003c 8 mL postmenopausal.\n\n**Peripheral follicles:**\nThe classic appearance — multiple small follicles displaced to the periphery of an edematous, echogenic stroma. This \"string of pearls\" or peripheral follicle arrangement occurs because the edematous stroma expands outward while the follicles are compressed to the periphery.\n\n**Edematous, echogenic stroma:**\nThe ovarian stroma becomes diffusely echogenic and enlarged due to vascular congestion and edema. The ovary looks \"filled in\" and heterogeneous.\n\n**Associated mass:**\nIn the majority of cases (70–80%), there is an underlying ovarian mass or cyst providing the pivot point for torsion. Dermoid, functional cyst, and benign ovarian neoplasm are the most common.\n\n### Whirlpool Sign\n\nThe **whirlpool sign** is the most specific finding for ovarian torsion and represents the twisted pedicle (the ovarian ligament, blood vessels, and fallopian tube twisted on themselves).\n\n**How to find it:**\n- Use color Doppler and look adjacent to the torsed ovary\n- A twisted, coiled vascular structure with swirling color Doppler signal\n- Rotate the probe to follow the twisted pedicle\n- The twist may be visible on B-mode as a target-like or coiled soft tissue structure\n\n**When you see the whirlpool sign, the diagnosis is made.** Its sensitivity is ~75% but specificity approaches 100%.\n\n### Doppler Flow Findings\n\nThis is the most misunderstood aspect of ovarian torsion:\n\n**Absent ovarian blood flow on Doppler:** Highly specific when present — if you see no flow in an enlarged, edematous ovary, torsion is the diagnosis.\n\n**HOWEVER — normal or even increased Doppler flow does NOT rule out torsion.**\n\nThis is the critical teaching point. Blood flow may be present in:\n- Intermittent/partial torsion (the ovary twists and partially untwists)\n- Early torsion (venous obstruction occurs before arterial)\n- A torsed ovary with adequate collateral supply\n\n**Studies show that Doppler flow is present in 40–60% of surgically confirmed torsion cases.**\n\nIf the ovary is enlarged and the clinical picture fits — do not reassure the patient or the clinician based on normal Doppler flow alone.\n\n### Free Fluid\n\nFree fluid in the pelvis or cul-de-sac is common in torsion — may represent a ruptured cyst (the predisposing lesion) or peritoneal reaction to the ischemic ovary.\n\nComplex fluid (heterogeneous, echogenic) is more concerning than simple free fluid.\n\n## What a Normal Ovary Looks Like\n\nBefore calling something abnormal:\n- Size: 3 × 2 × 2 cm (volume ~7 mL) — varies by cycle phase\n- Echogenicity: Homogeneous intermediate echogenicity with visible follicles\n- Clear Doppler signal: Central stromal flow + peripheral color signal\n\nAn asymmetric ovary with a contralateral side measuring 2× the other should always raise concern.\n\n## Pediatric Torsion\n\nOvarian torsion in children has important differences:\n- Normal (non-pathologic) ovaries can torse in girls — the ovary's mobility relative to pelvic structures is greater\n- Peak age: neonates and early adolescence\n- A neonatal ovarian cyst found prenatally can torse in utero or post-delivery\n- Always consider torsion in a girl with acute lower abdominal or pelvic pain — regardless of age\n\n## Reporting Language\n\nBe decisive — don't hedge if the findings are present.\n\n**Positive findings:**\n- \"Right ovary markedly enlarged measuring 8.2 × 5.4 × 5.0 cm (volume 118 mL) with a heterogeneous echogenic stroma and peripheral displacement of follicles. Whirlpool sign identified adjacent to the right ovary. No identifiable Doppler flow within the right ovarian parenchyma. Findings are highly suspicious for right ovarian torsion. Urgent clinical correlation recommended.\"\n\n**Normal Doppler but suspicious morphology:**\n- \"Left ovary enlarged at 5.8 × 4.2 × 3.9 cm with edematous stroma and peripheral follicles. Doppler flow is present, however the morphologic findings are concerning for possible ovarian torsion. Normal Doppler does not exclude torsion. Urgent gynecologic evaluation is recommended given clinical presentation.\"\n\n**Whirlpool sign present:**\n- \"Whirlpool sign identified — twisted ovarian pedicle visible adjacent to the right ovary on color Doppler. Combined with ovarian enlargement and absent parenchymal Doppler flow, findings are consistent with ovarian torsion.\"\n\n## What to Tell the Radiologist\n\nIf you see an enlarged, edematous ovary with peripheral follicles in a patient with acute pelvic pain — flag the study immediately. This is a time-sensitive diagnosis. Don't wait for the routine read queue.\n\n---\n\n*SonoBuddy's Pathologies section includes ovarian torsion findings, red flags, and differentials. Gynecologic measurements are in the Measurements section.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"ovarian-torsion-ultrasound-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"ovarian-torsion-ultrasound-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"ovarian-torsion-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"ovarian-torsion-ultrasound-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"ovarian-torsion-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"ovarian-torsion-ultrasound-guide\",\"title\":\"Ovarian Torsion on Ultrasound: What to Look For and When to Call It\",\"date\":\"2026-08-22\",\"excerpt\":\"Ultrasound findings in ovarian torsion — enlarged ovary, peripheral follicles, absent or present Doppler flow, the whirlpool sign, and why normal Doppler doesn't rule it out.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"gynecology\",\"ovarian torsion\",\"emergency\",\"pathology\",\"Doppler\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"uterine-pathology-fibroids-adenomyosis\",\"title\":\"Uterine Pathology on Ultrasound: Fibroids, Adenomyosis, and Polyps\",\"excerpt\":\"How to identify and describe uterine fibroids, adenomyosis, and endometrial polyps on ultrasound — sonographic features, classification, and what to include in your report.\",\"date\":\"2026-08-06\"},{\"slug\":\"scrotal-pathology-ultrasound-guide\",\"title\":\"Scrotal Pathology on Ultrasound: Orchitis, Varicocele, Hydrocele, and Epididymitis\",\"excerpt\":\"How to identify and desc
