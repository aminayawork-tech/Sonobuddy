c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1e75,"])</script><script>self.__next_f.push([1,"Soft tissue masses are one of the most common referrals to the ultrasound department. The majority are benign — lipomas, ganglion cysts, epidermal inclusion cysts — but the job is to characterize each lesion carefully and identify the minority that warrant further workup.\n\n## Your Job When Evaluating Any Soft Tissue Mass\n\n1. **Confirm it's a real mass** (not normal tissue, artifact, or lymph node)\n2. **Describe it systematically:** size, depth, location, echogenicity, margins, internal structure, vascularity\n3. **Determine cystic vs solid**\n4. **Identify imaging features that suggest a specific diagnosis**\n5. **Flag features that concern for malignancy**\n6. **Recommend next step if needed**\n\n---\n\n## Cystic vs. Solid: The First Decision\n\n**Simple cyst criteria (all must be met):**\n- Anechoic\n- Thin, imperceptible wall\n- Posterior acoustic enhancement (PA enhancement)\n- No internal vascularity\n\nIf all criteria are met → simple cyst. Management is conservative unless symptomatic.\n\n**Complex cyst:** Meets some but not all criteria — has internal echoes, debris, septations, or a thickened wall. Requires characterization.\n\n**Solid mass:** Echogenic or hypoechoic internal structure without PA enhancement. Needs full characterization and Doppler.\n\n---\n\n## Common Benign Masses\n\n### Lipoma\n\n**The most common soft tissue mass.** A benign fatty tumor.\n\n**Sonographic appearance:**\n- Well-defined, oval or elongated mass\n- Compressible on probe pressure\n- Echogenicity: isoechoic or hyperechoic relative to subcutaneous fat (variable — can be hypoechoic)\n- Thin echogenic capsule\n- Parallel linear echogenic striations within (fat lobules)\n- **No significant internal vascularity** — a few scattered internal vessels are acceptable, but hypervascular lipoma is a red flag\n- Deep to skin, within or between muscle planes depending on depth\n\n**The tricky part:** A lipoma in a subfascial (intramuscular) location is harder to characterize — these have a higher chance of being misclassified. Intramuscular lipomas should have MRI if:\n- Depth: subfascial (deep to the investing fascia)\n- Size \u003e 5 cm\n- Heterogeneous internal appearance\n- Any vascularity\n\n**Simple subcutaneous lipoma:** \u003c 5 cm, homogeneous, no vascularity → no further imaging needed; clinical diagnosis with ultrasound confirmation.\n\n---\n\n### Ganglion Cyst\n\nA ganglion is a cystic structure filled with thick, viscous gelatinous fluid, arising from a joint capsule or tendon sheath.\n\n**Location:** Most commonly dorsal wrist, volar wrist, and foot/ankle.\n\n**Sonographic appearance:**\n- Anechoic or hypoechoic cyst (may have low-level internal echoes from viscous fluid)\n- Round or lobulated\n- Well-defined, thin wall\n- Posterior acoustic enhancement\n- No internal vascularity\n- Often has a visible **pedicle** (stalk) connecting it to the adjacent joint or tendon sheath — follow the cyst to its origin\n\n**Important:** If the ganglion is near the wrist, document proximity to the ulnar artery and median nerve — these can be entrapped or displaced.\n\n**Management:** Often asymptomatic and observed. Aspiration is guided by ultrasound.\n\n---\n\n### Epidermal Inclusion Cyst (EIC)\n\nA benign cyst containing keratin — arises from obstructed hair follicles or implanted skin cells (post-trauma, post-surgery).\n\n**Location:** Skin and subcutaneous tissue — anywhere, but most common on the scalp, face, neck, trunk, and extremities.\n\n**Sonographic appearance:**\n- Well-defined, round to oval hypoechoic cyst in the dermis or subcutaneous tissue\n- Often shows a **punctum** — small echogenic dot on the skin surface at the center of the cyst (the obstructed follicle opening)\n- Internal echoes from keratinous debris (pseudo-solid appearance)\n- Posterior acoustic enhancement despite internal echoes\n- No vascularity internally (occasionally rim vascularity if inflamed)\n\n**Key:** The punctum helps confirm EIC vs other cysts.\n\n**Infected EIC:** Internal echoes increase, rim of peripheral vascularity, tenderness on probe pressure. Distinguish from abscess — abscess is usually more heterogeneous with frank purulent debris and surrounding hyperemia.\n\n---\n\n### Pilomatrixoma\n\nA benign calcifying epithelial neoplasm — common in children and young adults, typically on the head, neck, and upper extremities.\n\n**Sonographic appearance:**\n- Subcutaneous mass with **echogenic rim or internal calcifications** — sometimes heavily calcified with posterior shadowing\n- Heterogeneous internal architecture\n- Small cystic components possible\n\nOften confused with EIC clinically. The calcifications are the clue.\n\n---\n\n### Hemangioma and Vascular Malformations\n\n**Hemangioma:** Benign vascular tumor of infancy. Well-defined, lobulated, heterogeneous mass with marked internal vascularity (often hypervascular on color Doppler). Usually superficial.\n\n**Vascular malformations:**\n- **Venous malformation:** Compressible, heterogeneous mass; may contain phleboliths (round echogenic foci with posterior shadowing — classic). Flow on Doppler is low-flow or absent.\n- **Arteriovenous malformation:** High-flow lesion — visible flow in multiple channels on Doppler; arterial waveforms in otherwise venous locations.\n\nDocument vascularity, compressibility, and presence of phleboliths.\n\n---\n\n## Features That Should Raise Concern\n\nNo single ultrasound feature reliably distinguishes benign from malignant soft tissue masses — MRI is required for concerning lesions. But these features warrant further evaluation:\n\n| Feature | Concern |\n|---|---|\n| Depth: subfascial | Higher malignancy risk than subcutaneous |\n| Size \u003e 5 cm | Malignant soft tissue tumors tend to be large |\n| Heterogeneous internal architecture | Necrosis, hemorrhage |\n| Marked internal vascularity (hypervascular) | Malignant tumors often hyperemic |\n| Irregular, ill-defined margins | Infiltrative growth |\n| Rapid growth on serial imaging | Suspicious |\n| Invasion of adjacent structures | Malignant |\n\n**The \"rule of twos\" (informal teaching):** A soft tissue mass that is \u003e 5 cm OR subfascial OR has irregular margins should be evaluated with MRI before any biopsy.\n\n---\n\n## Documenting Any Soft Tissue Mass\n\n**Minimum documentation:**\n1. Location (anatomic region, depth — subcutaneous vs fascial plane vs intramuscular)\n2. Size (three dimensions)\n3. Echogenicity and internal character (cystic, solid, complex)\n4. Margins (well-defined vs irregular)\n5. Posterior acoustic features (enhancement, attenuation)\n6. Vascularity (hypervascular, avascular, rim only)\n7. Relationship to adjacent structures (tendons, vessels, nerves, bone)\n8. Compressibility\n\n---\n\n## Reporting Language\n\n**Lipoma:**\n\"4.1 × 1.8 × 2.5 cm subcutaneous, well-defined, ovoid echogenic mass in the posterior left upper arm, parallel to the skin surface. The mass is compressible, hyperechoic relative to adjacent subcutaneous fat with internal linear echogenic striations. No significant internal vascularity. Findings consistent with a lipoma. No further imaging is required.\"\n\n**Ganglion cyst:**\n\"1.4 × 0.9 × 1.1 cm anechoic lobulated structure arising from the dorsal aspect of the wrist joint, with posterior acoustic enhancement and no internal vascularity. A connecting pedicle to the scapholunate joint is identified. Findings consistent with a ganglion cyst.\"\n\n**Concerning mass:**\n\"6.2 × 4.8 × 5.0 cm heterogeneous subfascial mass in the posterior right thigh. The mass has ill-defined margins, heterogeneous internal architecture with both solid and cystic components, and moderate internal vascularity. These features are indeterminate; MRI of the right thigh with and without contrast is recommended for further characterization.\"\n\n---\n\n*SonoBuddy's MSK and small parts protocols include soft tissue, lymph node, and joint evaluation guides.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"soft-tissue-mass-ultrasound-evaluation\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"soft-tissue-mass-ultrasound-evaluation\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"soft-tissue-mass-ultrasound-evaluation\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"soft-tissue-mass-ultrasound-evaluation\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"soft-tissue-mass-ultrasound-evaluation\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"soft-tissue-mass-ultrasound-evaluation\",\"title\":\"Soft Tissue Mass Evaluation on Ultrasound\",\"date\":\"2026-09-15\",\"excerpt\":\"How to characterize soft tissue masses on ultrasound — lipoma, ganglion cyst, epidermal inclusion cyst, hemangioma, and the features that distinguish benign from suspicious lesions.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"musculoskeletal\",\"soft tissue\",\"mass\",\"lipoma\",\"small parts\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"neck-mass-ultrasound-evaluation\",\"title\":\"Neck Mass Evaluation on Ultrasound: Cysts, Lymph Nodes, and Vascular Lesions\",\"excerpt\":\"How to approach an unknown neck mass on ultrasound — thyroglossal duct cysts, branchial cleft cysts, lymphadenopathy, vascular tumors, and the features that guide diagnosis and next steps.\",\"date\":\"2026-09-27\"},{\"slug\":\"soft-tissue-foreign-body-ultrasound\",\"title\":\"Finding What the X-Ray Missed: Ultrasound for Soft Tissue Foreign Bodies\",\"e
