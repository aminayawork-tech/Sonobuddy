c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T2107,"])</script><script>self.__next_f.push([1,"The 18–22 week fetal anatomy survey (level 1 ultrasound) is one of the most important scans in obstetrics. Every structure you document — or fail to document — can have clinical implications. This guide walks through the complete anatomy survey with key images, measurements, and what to look for.\n\n## When It's Performed\n\n- Standard timing: 18–22 weeks gestational age\n- Optimal: 18–20 weeks for anatomy + 20–22 weeks for cardiac detail\n- Earlier (16 weeks): limited visualization, may require repeat\n- Later (\u003e 24 weeks): technically adequate, but earlier detection allows more counseling options\n\n## Equipment and Preparation\n\n- Curved array 3–5 MHz for most patients; phased array through ribs if needed\n- Transabdominal is primary; transvaginal available for cervical length, low-lying placenta, or limited transabdominal views\n- Patient: full or partially full bladder is helpful but not required (for most structures)\n\n## Fetal Measurements (Biometry)\n\n**Document all four standard biometric measurements:**\n\n| Measurement | Plane | How to Measure |\n|---|---|---|\n| Biparietal Diameter (BPD) | Axial brain — thalami visible, midline echo, cavum septi pellucidi | Outer edge to inner edge of skull |\n| Head Circumference (HC) | Same axial plane as BPD | Outer perimeter of skull (ellipse or manual trace) |\n| Abdominal Circumference (AC) | Transverse abdomen — stomach bubble + umbilical vein junction | Outer perimeter |\n| Femur Length (FL) | Longest bone length | Outer edge to outer edge of ossified diaphysis (not epiphysis) |\n\n**Calculate estimated fetal weight (EFW):** Use a standard formula (Hadlock 4-parameter is most common). Document EFW with the percentile for gestational age.\n\n**Amniotic Fluid:** Document AFI or largest vertical pocket (MVP). Note if oligohydramnios or polyhydramnios.\n\n**Placental location:** Anterior / posterior / fundal / right lateral / left lateral. Note relationship to the internal os — document if placenta appears low-lying (\u003c 2 cm from os).\n\n## Head and Brain\n\n**Axial views (at three levels):**\n\n**1. Transthalamic plane (BPD/HC plane):**\n- Thalami (oval midline structures)\n- Cavum septi pellucidi (CSP) — a small box-like anechoic space anterior to the thalami\n- Cerebral peduncles\n- This is the BPD/HC measurement plane\n\n**2. Transventricular plane:**\n- Lateral ventricles — measure the atrium of the posterior lateral ventricle\n- Normal: ≤ 10 mm (inner-to-inner at the atrium, at the level of the choroid plexus)\n- \u003e 10 mm = ventriculomegaly\n- Choroid plexus fills the atrium and should be touching the medial wall — note if choroid plexus is \"dangling\" (hanging free in a dilated ventricle)\n\n**3. Transcerebellar plane:**\n- Cerebellum — measure transverse diameter (TD)\n- Cisterna magna — measure AP diameter (normal 2–10 mm)\n- Nuchal fold — only measured at 15–20 weeks: normal \u003c 5 mm at this level\n- Vermis should be intact between the two cerebellar hemispheres\n\n**Posterior fossa:**\n- Banana sign: flattened cerebellum (myelomeningocele/spina bifida)\n- Lemon sign: scalloping of the frontal bones (also spina bifida)\n- Dandy-Walker: enlarged cisterna magna, absent vermis\n\n**Facial features:**\n- Profile: nose, lips, chin, forehead\n- Lip: coronal view of the upper lip and nose — document if both nostrils visible, intact lip\n- Orbits: axial view with both orbits — measure OOD (outer orbital diameter) and IOD (inner orbital distance)\n\n## Spine\n\n**Goal:** Exclude spina bifida (open neural tube defect).\n\n- Sagittal spine: complete spine from cervical to sacrum in one or multiple images\n- Transverse spine: axial views at cervical, thoracic, lumbar, and sacral levels\n- Normal: intact skin line over the spine, intact posterior elements (two ossification centers seen as echogenic structures flanking the spinal canal)\n- Open NTD: disrupted posterior elements, splaying of the dorsal ossification centers, soft tissue defect through the skin\n\n## Heart\n\nThe heart is the most complex part of the anatomy survey and the most common site of missed anomalies.\n\n**Minimum required views (per AIUM guidelines):**\n\n1. **Four-chamber view:**\n   - Heart occupies ~1/3 of the chest\n   - Axis: pointing left (toward left chest wall, 45–60° from midline)\n   - Four chambers roughly equal size (RA ≈ LA; RV ≈ LV)\n   - Intact interventricular and interatrial septa\n   - Atrioventricular valves open and close normally\n   - Pulmonary veins entering the left atrium (ideally 2 visible)\n\n2. **LVOT (Left ventricular outflow tract):**\n   - Aorta arises from the left ventricle\n   - Septal continuity between the interventricular septum and the aortic root (no VSD at the LVOT)\n\n3. **RVOT (Right ventricular outflow tract):**\n   - Pulmonary artery arises from the right ventricle\n   - The great vessels cross — aorta and pulmonary artery should cross each other\n   - Great vessel diameters approximately equal\n\n4. **Three-vessel view:**\n   - Transverse view at the level of the great vessels\n   - Three vessels visible in order from right to left: SVC, aorta, main pulmonary artery\n   - PA \u003e Ao \u003e SVC in size\n\n5. **Three-vessel trachea view:**\n   - Trachea seen as a ring posterior to the three vessels\n   - Ductus arteriosus visible connecting PA to descending aorta\n   - V-sign or \"ductal arch\" forms\n\n**Cardiac position and axis:** \"Dextrocardia\" = heart points right. \"Mesocardia\" = heart points midline. Both are abnormal and warrant further evaluation.\n\n## Chest and Abdomen\n\n**Lungs:** Echogenic, equal bilaterally. Lung mass displacing the heart = CPAM or sequestration concern.\n\n**Diaphragm:** Document intact diaphragm. Absence or herniation = CDH (congenital diaphragmatic hernia) — look for bowel or stomach in the chest.\n\n**Stomach:** Must be visible. A fluid-filled stomach in the left upper quadrant confirms swallowing function and esophageal patency. Absent stomach = esophageal atresia concern (or too early / timing issue).\n\n**Abdominal circumference plane:** Umbilical vein courses through the liver and is visible in the AC plane. The stomach bubble should be visible.\n\n**Abdominal wall:** The umbilical cord inserts normally at the abdominal wall. Bowel outside the abdomen = omphalocele (covered by membrane, cord inserts at apex) vs. gastroschisis (uncovered, cord inserts to the side of the defect).\n\n**Kidneys:** Both kidneys visible. Normal echogenicity (not hyperechoic). Normal pelvic AP diameter: \u003c 4 mm before 20 weeks, \u003c 7 mm at 20–33 weeks.\n\n**Bladder:** Visible as an anechoic structure in the fetal pelvis. Absent bladder = renal agenesis concern (combined with oligohydramnios).\n\n## Extremities and Gender\n\n**Long bones:** Document all four limbs. Measure bilateral femur, humerus (optional per protocol). Significant shortening or bowing = skeletal dysplasia concern.\n\n**Hands and feet:** Digits visible. Note if hands are open or clenched (clenched fists can indicate trisomy 18). Foot: look for clubfoot (talipes equinovarus — foot turns inward and is abnormally positioned).\n\n**Fetal sex:** Document if clearly seen and if the patient wishes to know. \"Fetal sex not determined\" is acceptable if ambiguous. Note if patient requested not to be told.\n\n## Cervical Length (If Protocol Includes It)\n\nFor patients with shortened cervix risk (prior preterm delivery, uterine anomaly):\n- Transvaginal measurement\n- Empty bladder\n- Measure from the internal os to the external os in sagittal\n- Normal: ≥ 25 mm at 18–24 weeks\n- \u003c 20 mm = short cervix requiring management discussion\n\n## Images Checklist\n\nPer AIUM guidelines for the standard OB ultrasound, minimum required images include:\n\n- Fetal number and presentation\n- Biometry: BPD, HC, AC, FL (with measurements labeled)\n- Placental location\n- AFI or MVP\n- Brain: BPD/HC plane, transventricular, posterior fossa\n- Spine sagittal and transverse\n- Heart: 4-chamber, LVOT, RVOT (or 3-vessel view)\n- Stomach\n- Abdominal wall (umbilical cord insertion)\n- Kidneys bilaterally\n- Bladder\n- Long bones bilaterally (at minimum femur)\n- Fetal face (profile and coronal lip)\n- Cervix (if indicated)\n\nDocument any structure not seen and why: \"Fetal position limited evaluation of [structure] — additional views obtained with position change / transvaginal imaging / follow-up recommended.\"\n\n---\n\n*SonoBuddy includes first and second trimester measurement references in the OB Measurements section — including biometry, ventricular width, and cisterna magna normal values.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"second-trimester-anatomy-scan-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"second-trimester-anatomy-scan-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"second-trimester-anatomy-scan-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"second-trimester-anatomy-scan-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"second-trimester-anatomy-scan-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"second-trimester-anatomy-scan-guide\",\"title\":\"Second Trimester Anatomy Scan: Complete Protocol and What to Document\",\"date\":\"2026-07-20\",\"excerpt\":\"Step-by-step guide to the 18–22 week fetal anatomy survey — key images, normal measurements, landmarks, and what must be documented per AIUM guidelines.\",\"a
