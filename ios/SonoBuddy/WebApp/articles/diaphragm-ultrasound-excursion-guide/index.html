c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1e3f,"])</script><script>self.__next_f.push([1,"Diaphragm dysfunction is common in critically ill and ventilated patients, and it is one of the more overlooked reasons a weaning trial fails. Ultrasound assesses the diaphragm two complementary ways — how far it moves, and how much it thickens — and together they give a genuinely useful, repeatable, radiation-free window into respiratory muscle function.\n\n---\n\n## Two Different Questions, Two Different Techniques\n\n**Excursion** answers: how much does the diaphragm move with each breath? Measured with M-mode from a subcostal window.\n\n**Thickening fraction** answers: how much contractile effort is the muscle actually generating? Measured with B-mode over the zone of apposition, on the chest wall.\n\nThey are not interchangeable — a diaphragm can move well passively (pulled by other respiratory muscles or positive pressure) while contracting poorly, and thickening fraction is the more specific measure of active muscle effort. Most complete assessments use both.\n\n---\n\n## Diaphragm Excursion\n\n### Technique\n\n**Probe:** Curvilinear, 2–5 MHz for most adults; a phased array works if a curvilinear isn't available.\n\n**Position:** Supine or semi-recumbent, whichever the patient tolerates and matches your unit's protocol — position affects the numbers, so stay consistent for serial comparisons.\n\n**Right side (preferred — better acoustic window):**\n\nSubcostal, anterior axillary to mid-clavicular line, probe angled cephalad and slightly medial. Use the **liver as an acoustic window** and identify the diaphragm as an echogenic curved line at the liver's superior margin.\n\n**Left side:** Same approach using the spleen as the window — smaller, and often the harder side to obtain a clean trace on.\n\n### The M-Mode Trace\n\n1. Get a clear B-mode image with the diaphragm's brightest, most perpendicular segment in view.\n2. Place the M-mode cursor **perpendicular to the diaphragm**, along its expected excursion path.\n3. Have the patient breathe normally for a **quiet breathing** trace, then repeat with a **maximal (deep/sniff) breath** if assessing full capacity.\n4. Measure the vertical excursion of the diaphragm's caudal movement during inspiration, peak to trough.\n\n**Angle matters.** An oblique cursor angle produces a foreshortened, unreliable trace — the M-mode line has to run along the true direction of diaphragm movement, not simply straight down.\n\n### Normal Values\n\n| Measure | Approximate normal |\n|---|---|\n| Quiet breathing excursion | **1.0–2.5 cm** |\n| Deep breathing excursion | **4–9 cm** (roughly 2–3× quiet breathing) |\n| Sniff maneuver | Should show sharp, brisk downward deflection |\n\n**Paradoxical movement** — the diaphragm moving *upward* during inspiration instead of down — is a specific sign of paralysis, most reliably demonstrated with the **sniff test**: a short sharp inhale through the nose. A paralyzed hemidiaphragm typically shows little or no movement, or moves paradoxically upward, while the normal side moves briskly.\n\n---\n\n## Diaphragm Thickening Fraction\n\n### Technique\n\n**Probe:** High-frequency linear, 10–15 MHz — this is a superficial measurement.\n\n**Position:** Zone of apposition — where the diaphragm lies directly against the rib cage rather than against lung. Typically the **8th–10th intercostal space**, anterior to the mid-axillary line on the right.\n\n**Image:** In B-mode, identify the diaphragm as **two parallel echogenic lines** (pleura and peritoneum) with a hypoechoic muscle layer between them. Measure thickness at **end-expiration** and **end-inspiration**.\n\n### Calculation\n\n```\nThickening Fraction (%) = (Thickness at end-inspiration − Thickness at end-expiration) / Thickness at end-expiration × 100\n```\n\n### Interpretation\n\n| Thickening fraction | Interpretation |\n|---|---|\n| **\u003c 20%** | Suggests diaphragm dysfunction |\n| **20–30%** | Borderline |\n| **\u003e 30%** | Generally adequate contractile function |\n\nValues vary somewhat across published studies — know which cutoff your unit has adopted, and prioritize the trend over any single measurement.\n\n---\n\n## Clinical Applications\n\n### Predicting Extubation Success\n\nThis is the most established use. Diaphragm ultrasound performed during a **spontaneous breathing trial** helps predict whether a patient will tolerate extubation:\n\n- **Excursion \u003c 1.0–1.1 cm** during the trial is associated with higher extubation failure risk in several studies\n- **Thickening fraction \u003c 20–30%** during the trial similarly flags increased risk\n\nNeither measurement alone is a standalone decision tool — both are used **alongside** standard weaning parameters (rapid shallow breathing index, oxygenation, mental status, secretion burden), not as a replacement for them.\n\n### Diagnosing Unilateral Diaphragm Paralysis\n\nCompare excursion side to side. A hemidiaphragm with minimal or paradoxical movement on the sniff test, with a normal contralateral side, supports a diagnosis of phrenic nerve injury or paralysis — common after cardiac surgery, cervical trauma, or as a complication of central line placement or brachial plexus block.\n\n### Ventilator-Induced Diaphragm Dysfunction\n\nDiaphragm thickness and thickening fraction can be trended over the course of mechanical ventilation. A declining thickness over days is consistent with disuse atrophy — a recognized complication of prolonged controlled ventilation, and a reason some units use serial diaphragm ultrasound to guide the timing of spontaneous breathing modes.\n\n### Diaphragm Dysfunction in Neuromuscular Disease\n\nExcursion and thickening fraction both drop in conditions affecting respiratory muscle strength (myasthenia gravis, Guillain-Barré, ALS), and serial measurement can track disease progression or the effect of treatment.\n\n---\n\n## Pitfalls\n\n**Positioning inconsistency.** Excursion changes with body position — compare serial measurements taken in the same position, or note the difference explicitly.\n\n**PEEP and ventilator settings.** Positive pressure alters diaphragm position and passive movement — document ventilator settings alongside the measurement, and be cautious comparing excursion values across different support levels.\n\n**Obesity and poor acoustic windows**, particularly on the left, can make the spleen-window view genuinely difficult — report when a reliable trace could not be obtained rather than forcing an unreliable measurement.\n\n**Zone of apposition location varies with lung volume** — at very high lung volumes the zone can shift and thin, so extreme hyperinflation can distort the thickening fraction measurement.\n\n---\n\n## Key Images to Capture\n\n1. Right hemidiaphragm — B-mode subcostal view showing the diaphragm against the liver\n2. M-mode trace — quiet breathing, right side\n3. M-mode trace — deep breath or sniff maneuver, right side\n4. Left hemidiaphragm — same sequence\n5. Thickening fraction — B-mode at end-expiration and end-inspiration, zone of apposition\n6. Documentation of patient position and ventilator settings if applicable\n\n---\n\n## Reporting Language\n\n\"Right hemidiaphragm excursion 1.8 cm with quiet breathing, 6.2 cm with deep inspiration — normal brisk caudal movement on sniff testing. Left hemidiaphragm excursion 0.3 cm with quiet breathing and paradoxical cephalad movement on sniff testing, consistent with left hemidiaphragm paralysis. Thickening fraction on the right measured 34% at the zone of apposition, within the normal range. Findings support unilateral left phrenic nerve dysfunction with preserved right-sided contractile function.\"\n\n---\n\n*SonoBuddy is a reference tool for sonographers. Weaning and extubation decisions belong with the treating clinical team, using ultrasound findings alongside standard parameters.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"diaphragm-ultrasound-excursion-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"diaphragm-ultrasound-excursion-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"diaphragm-ultrasound-excursion-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"diaphragm-ultrasound-excursion-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"diaphragm-ultrasound-excursion-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"diaphragm-ultrasound-excursion-guide\",\"title\":\"Diaphragm Ultrasound: Excursion, Thickening Fraction, and Weaning Prediction\",\"date\":\"2026-10-03\",\"excerpt\":\"Assessing diaphragm function at the bedside — M-mode excursion technique, thickening fraction for contractile effort, normal values, and how both are used to predict extubation success.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"POCUS\",\"diaphragm\",\"critical care\",\"weaning\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"optic-nerve-sheath-diameter-ultrasound\",\"title\":\"Optic Nerve Sheath Diameter: A Bedside Window on Intracranial Pressure\",\"excerpt\":\"How to measure optic nerve sheath diameter at the bedside — technique, the 5 mm threshold, and why ONSD is a screening tool for raised ICP, not a replacement for definitive monitoring.\",\"date\":\"2026-10-01\"},{\"slug\":\"ivc-ultrasound-volume-status\",\"title\":\"IVC Ultrasound: Measurement Technique and Volume Status Assessment\",\"excerpt\":\"How to measure the inferior vena cava correctly — subxiphoid and coronal windows, collapsibility and d
