c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T2352,"])</script><script>self.__next_f.push([1,"Vascular sonography has three primary credentials: the **RVT** (Registered Vascular Technologist), the **RPhS** (Registered Phlebology Sonographer), and the **RPVI** (Registered Physician in Vascular Interpretation). If you're not a physician, the RPVI isn't your path — but understanding all three clarifies the landscape. Add in the **RVS** (Registered Vascular Specialist) from CCI and you have four different credentials that employers use inconsistently in job postings.\n\nThis guide breaks down each credential, who needs it, and what it actually takes to pass.\n\n---\n\n## The Four Credentials at a Glance\n\n| Credential | Issuing Body | Who It's For | Exam Focus |\n|---|---|---|---|\n| RVT | ARDMS | Vascular sonographers | Peripheral arterial and venous, cerebrovascular, visceral, hemodialysis access |\n| RVS | CCI | Vascular sonographers | Similar to RVT; slightly different eligibility pathway |\n| RPhS | ARDMS | Phlebology-focused sonographers | Venous duplex for varicose vein treatment planning |\n| RPVI | ABVLM | Physicians and APPs | Vascular interpretation (MD/DO/NP/PA only) |\n\nFor practicing vascular sonographers, the decision is primarily **RVT vs. RVS**, with RPhS as a possible add-on for those in phlebology practices.\n\n---\n\n## RVT (Registered Vascular Technologist) — ARDMS\n\nThe RVT is the gold standard in vascular sonography, the most widely recognized credential by hospitals and vascular surgery practices.\n\n### Eligibility Requirements (2026)\n\n**Pathway 1:** Graduate of a CAAHEP-accredited program with a vascular technology track.\n\n**Pathway 2:** 12 months of clinical ultrasound experience in vascular technology + meet one of:\n- Allied health credential (RDMS, RDCS, RT, RN, etc.)\n- Graduate of any accredited healthcare educational program\n\n**Required exams:**\n1. **SPI (Sonography Principles and Instrumentation)** — prerequisite exam covering ultrasound physics\n2. **VT (Vascular Technology) specialty exam** — the clinical content examination\n\nBoth exams are computer-based, administered at Pearson VUE testing centers.\n\n### SPI Exam\n\n- 110 questions, 2 hours\n- Topics: ultrasound physics, instrumentation, hemodynamics, Doppler principles, image quality optimization\n- Pass rate (2024): ~73% first attempt\n- Fee: $195\n\n**Key content areas:**\n- Piezoelectric effect and transducer construction\n- A-mode, B-mode, M-mode, Doppler (pulsed, continuous wave, color, power)\n- Beam properties: resolution, focal zone, near-field/far-field\n- Artifacts: shadowing, enhancement, reverberation, mirror image, aliasing\n- Hemodynamics: flow patterns, Bernoulli principle, spectral waveform analysis\n\n### VT Specialty Exam\n\n- 170 questions, 3 hours\n- Pass rate (2024): ~68% first attempt\n- Fee: $275\n\n**Content domains (approximate weighting):**\n\n| Domain | Approximate % |\n|---|---|\n| Peripheral arterial disease (lower extremity) | 22% |\n| Cerebrovascular disease (carotid, vertebral, TCD) | 20% |\n| Peripheral venous disease (DVT, CVI, saphenous mapping) | 22% |\n| Visceral vascular (mesenteric, renal, aortoiliac, portal) | 16% |\n| Hemodialysis access mapping and surveillance | 10% |\n| Intracranial/intrathoracic/misc. | 10% |\n\n**Clinical reference standards tested:**\n\n- **Carotid stenosis:** SRU 2003 consensus criteria (PSV thresholds for 50–69%, 70–99%)\n- **DVT:** Compressibility criteria, augmentation, phasicity, spontaneous flow\n- **Lower extremity arterial:** ABI interpretation (normal \u003e1.0, borderline 0.9–1.0, mild PAD 0.7–0.89, moderate 0.4–0.69, severe \u003c0.4), segmental pressures, toe-brachial index\n- **Renal artery stenosis:** RAR (renal-to-aortic ratio) \u003e3.5, acceleration time \u003e100ms, tardus parvus waveform\n- **Celiac/SMA:** Peak systolic velocity thresholds for stenosis\n\nSonoBuddy's vascular measurement reference tables cover these thresholds. Know the numbers cold before exam day.\n\n### RVT Study Resources\n\n- **ARDMS Practice Exams** — available at ardms.org; expensive but closest to actual exam format\n- **SoundPrint Vascular Technology Review** — widely used, comprehensive question banks\n- **Pegasus Lectures Physics and Instrumentation** — thorough physics course for SPI prep\n- **Davies Publishing Review Book** — classic text, covers all content areas\n- **Zierler \u0026 Zierler: Strandness's Duplex Scanning in Vascular Disorders** — clinical reference, good for visceral vascular\n\n---\n\n## RVS (Registered Vascular Specialist) — CCI\n\nThe RVS from Cardiovascular Credentialing International covers similar clinical content to the RVT.\n\n### Differences from RVT\n\n| Factor | RVT (ARDMS) | RVS (CCI) |\n|---|---|---|\n| Recognition in hospital job postings | Near-universal | Common; some older postings list only RVT |\n| Combined cardiac/vascular track | Separate exams | RCCS (combined echo/vascular) option exists |\n| Maintenance of certification | CME-based | CME-based |\n| Exam fee | $275 + $195 (SPI) | $250 |\n\n**CCI eligibility:** Requires graduation from a cardiovascular technology program or completion of clinical hours in vascular technology plus documentation of supervised case experience. CCI eligibility requirements differ slightly from ARDMS — check cci-online.org directly for current specifics.\n\n**Who should get RVS instead of or in addition to RVT?**\n- Cardiovascular technologists who already hold CCI credentials (RCCS, RCS, RCES) and want to add vascular — the CCI ecosystem is already familiar\n- Some larger cardiac programs prefer CCI credentialing for their combined echo/vascular technologists\n\n**In practice:** Most vascular lab job postings accept either RVT or RVS. Cardiac cath labs and cardiology-affiliated practices may show CCI preference.\n\n---\n\n## RPhS (Registered Phlebology Sonographer) — ARDMS\n\nThe RPhS is a subspecialty credential for sonographers working in phlebology (vein) practices — venous ablation centers, cosmetic vein clinics, and interventional phlebology offices.\n\n### What It Certifies\n\nScope is narrower than RVT:\n- Superficial venous duplex (great saphenous vein, small saphenous vein, accessory veins)\n- Saphenous vein mapping for ablation planning\n- Perforating vein assessment\n- Post-procedure surveillance\n- DVT evaluation (lower extremity)\n\nDoes NOT cover arterial disease, cerebrovascular, hemodialysis access, or visceral vascular.\n\n### Who Should Get RPhS\n\n- Sonographers working exclusively in vein clinics who don't want or need the full RVT scope\n- Existing RDMS or RVT holders adding a phlebology subspecialty credential\n- Medical assistants at vein practices who have been doing duplex scanning and want to formalize their credentials\n\n**Eligibility:** Requires documentation of phlebology ultrasound clinical hours (typically 500 hours in venous duplex). See ardms.org for current specifics.\n\n**Exam fee:** $275 + SPI prerequisite if not already held.\n\n**Salary impact:** RPhS alone is not a substitute for RVT in most settings. In vein-specific practices, it may be the primary credential required — and those practices often pay competitive rates due to the specialized nature of the work.\n\n---\n\n## Maintaining Your Credentials\n\nAll ARDMS credentials require **Continuing Medical Education (CME)** for renewal:\n\n| Renewal Cycle | CME Required | Cost |\n|---|---|---|\n| Every 3 years | 30 ARDMS-approved CME credits | ~$100–$200 for CME courses; renewal fee ~$140 |\n\nCME sources accepted: SDMS conferences and online modules, AIUM, SVU (Society for Vascular Ultrasound) annual conference, SonoBuddy-credited courses when applicable, hospital grand rounds with documentation.\n\nThe SVU annual conference is one of the best single sources of vascular-specific CME — 3–4 days typically yields 15–20 CME credits plus significant clinical learning.\n\n---\n\n## Which Credential to Pursue First\n\n**If you're a new sonographer entering vascular:**\n→ RVT first. It's the most universally recognized and opens the most doors. Pass the SPI first, then the VT specialty exam.\n\n**If you're already an RDMS considering adding vascular:**\n→ RVT. Your SPI is likely already satisfied; you only need the VT specialty exam.\n\n**If you work in a vein clinic and nowhere else:**\n→ RPhS may be sufficient — confirm with your employer what they accept for credentialing.\n\n**If you're a cardiovascular tech with CCI credentials:**\n→ RVS makes practical sense to stay within the CCI credentialing ecosystem.\n\n---\n\n## Salary Impact of RVT Credential\n\nBased on job posting analysis and SDMS salary survey data (2025):\n\n| Credential Status | Median Hourly Rate |\n|---|---|\n| Unregistered sonographer (vascular experience) | $28–$38/hr |\n| RVT or RVS (entry-level position) | $36–$50/hr |\n| RVT + 3+ years vascular experience | $48–$68/hr |\n| RVT + additional specialty (RDMS or RDCS) | $55–$80/hr |\n| Vascular lab supervisor/director (with RVT) | $75,000–$110,000/yr (salaried) |\n\nThe RVT credential typically adds $4–$8/hour over unregistered rates in direct comparison. In high-demand markets (coastal metros, underserved regions), the premium can be higher because supply is limited."])</script><script>self.__next_f.push([1,"7:[\"slug\",\"vascular-sonographer-certification-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"vascular-sonographer-certification-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"vascular-sonographer-certification-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"vascular-sonographer-certification-guide\\\"}\",{}]}]}]}]},\"$
