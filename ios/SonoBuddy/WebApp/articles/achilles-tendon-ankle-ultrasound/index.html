c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T20e5,"])</script><script>self.__next_f.push([1,"Ankle and Achilles tendon ultrasound is a high-yield MSK study — the structures are superficial, dynamic imaging is easy, and ultrasound answers most clinical questions without radiation or MRI cost. The Achilles is the largest tendon in the body and one of the most commonly injured.\n\n## Achilles Tendon Anatomy\n\nThe Achilles tendon (calcaneal tendon) is formed by the confluence of the gastrocnemius and soleus muscles. It inserts on the posterior calcaneal tuberosity.\n\n**Key structures around the Achilles:**\n- **Retrocalcaneal bursa:** Between the Achilles and the calcaneus — normally a thin sliver of fluid (\u003c 2 mm)\n- **Retroachilles bursa (superficial):** Between the Achilles and the skin — normally trace or no fluid\n- **Kager's fat pad:** Pre-Achilles fat triangle visible on sagittal view — a useful landmark\n\n**No tendon sheath:** The Achilles lacks a true synovial sheath. It has a paratenon (thin connective tissue sleeve). Peritendinous fluid indicates paratenonitis.\n\n---\n\n## Scanning Technique\n\n**Probe:** 12–15 MHz linear transducer.\n\n**Patient position:** Prone, foot hanging off the edge of the table at 90° (neutral position) or slightly plantarflexed. A rolled towel under the ankle helps.\n\n**Approach:** From the myotendinous junction proximally to the calcaneal insertion distally.\n\n### Long Axis (Sagittal) View — Primary View\n\nProbe placed in line with the tendon, posterior aspect of the lower leg/ankle.\n\n**Normal appearance:**\n- Uniformly hyperechoic, fibrillar, striated tendon\n- Parallel fiber bundles running the length of the tendon\n- Width (AP diameter) measured at the thickest point\n- Normal thickness: **\u003c 6 mm** at midsubstance (most labs use 5–6 mm as upper normal)\n\n**Pitfall — anisotropy:** The Achilles must be scanned perpendicular to its fibers. Angle the probe heel-to-toe and slightly tilt to maximize echogenicity. A slightly angulated probe will make a normal tendon look focally hypoechoic, mimicking a tear.\n\n### Short Axis (Transverse) View\n\nRotate 90° to view the tendon in cross-section. Oval to circular shape. Scan from the proximal gastrocnemius confluence down to the insertion.\n\n**Normal:** Oval, uniform, hyperechoic cross-section. At the insertion, the tendon fans out as it meets the calcaneus.\n\n---\n\n## Measurement\n\n**Measure in long axis** at the point of maximum thickness.\n\n**Normal:** ≤ 6 mm AP diameter at midsubstance\n**Tendinosis threshold:** \u003e 6 mm (with echogenic changes)\n\nAlways measure bilaterally and compare.\n\n---\n\n## Pathology: Tendinopathy\n\n### Non-insertional Tendinopathy (Mid-tendon, 2–6 cm from insertion)\n\nMost common site of Achilles tendinopathy — the \"critical zone\" at 2–6 cm proximal to the insertion where vascularity is lowest.\n\n**Sonographic findings:**\n- **Tendon thickening** — AP diameter \u003e 6–7 mm at the affected site\n- **Hypoechoic areas** within the tendon (loss of fibrillar pattern) — focal or diffuse\n- **Loss of normal fibrillar echogenicity**\n- **Neovascularization** on power or color Doppler — abnormal vessels invading the tendon from the paratenon (neovascularization correlates with pain and chronicity)\n\n**Grades (descriptive, not formal):**\n- **Tendinosis:** Thickening + hypoechogenicity + no tear\n- **Partial tear:** Focal hypoechoic defect that does not traverse the full tendon width\n- **Complete tear:** Full-thickness disruption with retraction of the proximal stump\n\n### Insertional Tendinopathy\n\nPain and thickening at the calcaneal insertion. Associated with:\n- Haglund's deformity (prominent posterosuperior calcaneal tuberosity)\n- Retrocalcaneal bursitis\n- Calcification within the distal tendon\n\n**Sonographic findings:**\n- Hypoechoic, thickened distal tendon at the insertion\n- Calcifications within the tendon (echogenic foci ± shadowing)\n- Enlarged retrocalcaneal bursa (\u003e 2 mm)\n- Enthesophyte at the calcaneal insertion\n\n---\n\n## Achilles Tendon Tears\n\n### Partial Tear\n\nFocal hypoechoic defect within the tendon substance — does not extend full-thickness. May be articular-surface (deep) or superficial.\n\n- Describe: location (distance from calcaneus), transverse extent (% of tendon width), AP depth\n- Dynamic assessment: does the defect gape with dorsiflexion? (suggests more significant tear)\n\n### Complete Tear\n\nFull-thickness tear with visible gap.\n\n**Classic history:** Sudden \"pop\" and inability to plantarflex; palpable gap in the tendon.\n\n**Sonographic findings:**\n- Complete fibrillar discontinuity — a gap filled with fluid or heterogeneous hematoma\n- Retracted proximal stump: the gastrocnemius-soleus pulls the proximal tendon proximally — measure the retraction distance\n- Dynamic: significant gaping with passive dorsiflexion\n\n**Measure:** Gap size at rest and with dorsiflexion. Distance of retraction. Length of tendon distal to the tear.\n\n**Thompson (Squeeze) Test:** Squeeze the calf while the patient is prone — if the tendon is intact, the foot plantarflexes. A positive test (no plantar flexion) confirms complete tear. You may observe this clinically at the bedside.\n\n---\n\n## Retrocalcaneal Bursitis\n\nFluid in the retrocalcaneal bursa (between Achilles and calcaneus).\n\n**Normal:** \u003c 2 mm\n**Bursitis:** \u003e 2 mm; anechoic or complex fluid; may be associated with Haglund's deformity or insertional tendinopathy\n\n---\n\n## Plantar Fascia / Plantar Fasciitis\n\nThe plantar fascia is best evaluated from the medial plantar foot.\n\n**Patient position:** Prone, foot dorsiflexed (foot hanging off the table, toes toward the floor — passive dorsiflexion places the fascia under tension).\n\n**Probe placement:** Medial longitudinal arch, heel to midfoot.\n\n**Normal plantar fascia:**\n- Hyperechoic, fibrillar band\n- Thickness at the calcaneal origin: **≤ 4 mm** (upper limit of normal)\n\n**Plantar fasciitis:**\n- **Thickening ≥ 4 mm** at the proximal origin (most meaningful at the calcaneal attachment)\n- Loss of normal fibrillar echogenicity at the insertion (hypoechoic, edematous)\n- Calcification at the origin (calcaneal spur — present in many normals too; the tendon thickness is more diagnostic than spur presence)\n- Doppler: may show increased vascularity at the insertion in active plantar fasciitis\n\n**Measure:** AP thickness at the calcaneal origin in long axis.\n\n---\n\n## Ankle Tendons (Additional)\n\nFor completeness, the ankle tendons are often included in the same scan:\n\n**Medial:** Tibialis posterior, flexor digitorum longus, posterior tibial neurovascular bundle, flexor hallucis longus (Tom, Dick, ANd Harry — from anterior to posterior)\n\n**Lateral:** Peroneus longus and brevis run posterior to the lateral malleolus. Peroneal tendon tears and subluxation are common after ankle sprains.\n\n**Anterior:** Tibialis anterior, extensor hallucis longus, extensor digitorum longus — scan in long and short axis.\n\n---\n\n## Key Images to Capture\n\n1. Achilles tendon — long axis, full length (myotendinous to insertion)\n2. Achilles tendon — short axis at midsubstance with measurement\n3. Retrocalcaneal bursa region\n4. Any area of focal pathology — two planes with measurements\n5. Doppler of any tendinopathy area (neovascularization)\n6. Plantar fascia — long axis at calcaneal origin with measurement\n7. Contralateral side for comparison\n\n---\n\n## Reporting Language\n\n**Normal:**\n\"Achilles tendon intact bilaterally. Uniform fibrillar echogenicity throughout. AP diameter 5.2 mm at midsubstance on the right, 5.0 mm on the left. Retrocalcaneal bursae: no significant fluid. Plantar fascia: 3.4 mm at the calcaneal origin bilaterally — within normal limits.\"\n\n**Tendinopathy:**\n\"Non-insertional Achilles tendinopathy. Right Achilles tendon thickened at 8.4 mm AP diameter at 4 cm from the calcaneal insertion with focal hypoechogenicity and loss of fibrillar pattern over a 2.5 cm segment. Increased color Doppler signal (neovascularization) at the involved segment. No complete tear. Contralateral left Achilles: 5.4 mm, normal appearance.\"\n\n**Complete tear:**\n\"Complete tear of the right Achilles tendon approximately 4.5 cm from the calcaneal insertion. A 2.8 cm gap is identified, filled with heterogeneous fluid and hematoma. The proximal stump is retracted 2.8 cm from the distal tendon. With passive dorsiflexion, the gap increases to 3.5 cm. Clinical correlation and orthopedic consultation are recommended.\"\n\n---\n\n*SonoBuddy's MSK protocols include shoulder, knee, ankle, and soft tissue ultrasound guides.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"achilles-tendon-ankle-ultrasound\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"achilles-tendon-ankle-ultrasound\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"achilles-tendon-ankle-ultrasound\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"achilles-tendon-ankle-ultrasound\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"achilles-tendon-ankle-ultrasound\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"achilles-tendon-ankle-ultrasound\",\"title\":\"Achilles Tendon and Ankle Ultrasound: Tendinopathy, Tears, and Plantar Fascia\",\"date\":\"2026-09-29\",\"excerpt\":\"How to scan the Achilles tendon and ankle — normal thickness, insertional vs non-insertional tendinopathy, partial and complete tears, retrocalcaneal bursitis, and plantar fasciitis.\",\"author\":\"
