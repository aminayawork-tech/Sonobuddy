c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T17e7,"])</script><script>self.__next_f.push([1,"Hepatic vascular Doppler is a critical component of liver disease evaluation, transplant surveillance, and portal hypertension workup. Understanding the normal waveform patterns and what changes mean is essential for any sonographer scanning abdominal studies.\n\n## Vessels to Evaluate\n\n1. **Portal vein** — main, right, and left branches\n2. **Hepatic veins** — right, middle, left (drain into IVC)\n3. **Hepatic artery** — proper hepatic → right and left branches\n4. **IVC** — at the hepatic vein confluence\n\n## Normal Portal Vein\n\n**Anatomy:** The portal vein forms at the confluence of the superior mesenteric vein (SMV) and splenic vein behind the pancreatic neck. It runs in the porta hepatis with the hepatic artery and common bile duct (portal triad).\n\n**Normal values:**\n\n| Parameter | Normal |\n|---|---|\n| Portal vein diameter | \u003c 13 mm (at porta hepatis, held at end-expiration) |\n| Flow direction | Hepatopetal (toward the liver) |\n| Velocity | 15–40 cm/s |\n| Waveform | Mildly phasic (varies with respiration and cardiac cycle) |\n\n**How to measure diameter:** Transverse plane at the porta hepatis, measured from inner wall to inner wall, during quiet end-expiration. Inspiration causes it to dilate — don't measure during a deep breath.\n\n**Waveform character:** The portal vein shows a gently undulating, continuous hepatopetal flow. It does not have the sharp peaks of the hepatic artery or the phasic waveform of the hepatic veins.\n\n## Portal Hypertension Findings\n\nPortal hypertension (PHT) — elevated pressure in the portal system — causes characteristic changes visible on Doppler.\n\n**Findings in PHT:**\n- **Dilated portal vein** (\u003e 13 mm)\n- **Reduced portal vein velocity** (\u003c 15 cm/s)\n- **Loss of respiratory phasicity** — velocity becomes flat and monotonic\n- **Hepatofugal flow** — reversed portal vein flow (away from the liver) — indicates severe PHT\n- **Varices** — dilated tortuous vessels at the splenic and gastroesophageal regions\n- **Splenomegaly**\n- **Ascites**\n- **Collaterals** — recanalized paraumbilical vein, splenorenal collaterals, gastric varices\n\n**Congestion index (CI):** Portal vein cross-sectional area ÷ mean velocity. CI \u003e 0.1 cm·s suggests significant PHT. Rarely used in routine practice but worth knowing.\n\n## Hepatic Veins\n\nThe three hepatic veins (right, middle, left) drain into the IVC at the superior liver margin.\n\n**Normal waveform:** Triphasic — reflects right atrial pressure changes:\n- S wave (systolic hepatic vein flow)\n- D wave (diastolic flow)\n- A wave reversal (atrial contraction)\n\nThis triphasic waveform looks like a \"W\" or \"M\" pattern and is the normal appearance of hepatic vein Doppler.\n\n**Abnormal patterns:**\n\n| Pattern | Appearance | Significance |\n|---|---|---|\n| Biphasic | S and D waves, no A reversal | Mild change, early congestion |\n| Monophasic/flat | Continuous non-phasic flow | Significant hepatic fibrosis, cirrhosis, Budd-Chiari |\n| Reversed/hepatofugal | Flow away from IVC | Severe congestion, Budd-Chiari |\n\n**Budd-Chiari syndrome:** Thrombosis of the hepatic veins or suprahepatic IVC. Look for absent flow in hepatic veins, reversed or absent IVC flow, hepatomegaly, and caudate lobe hypertrophy (caudate has separate venous drainage and enlarges when other hepatic veins are occluded).\n\n## Hepatic Artery\n\nThe hepatic artery runs in the portal triad — the same echogenic band as the portal vein and bile duct at the porta hepatis.\n\n**Normal values:**\n\n| Parameter | Normal |\n|---|---|\n| PSV | 50–150 cm/s |\n| RI (resistive index) | 0.55–0.75 |\n| Waveform | Low-resistance: brisk systolic upstroke, continuous forward diastolic flow |\n\nThe hepatic artery should always have forward diastolic flow — it supplies a metabolically active organ. Absent or reversed diastolic flow is abnormal.\n\n**Resistive index (RI):** (PSV − EDV) ÷ PSV\n\n- RI \u003c 0.55: May suggest AV fistula or arterioportal shunt\n- RI \u003e 0.80: Hepatic artery thrombosis (HAT), severe hepatitis, rejection (in transplants), acute obstruction\n\n## Liver Transplant Surveillance\n\nHepatic Doppler is the primary monitoring tool after liver transplantation. The anastomosis of the hepatic artery is technically demanding and HAT is the most feared early complication.\n\n**What to assess post-transplant:**\n- Hepatic artery: PSV, RI, waveform — must have forward diastolic flow\n- Portal vein: direction, velocity, anastomotic stenosis\n- Hepatic veins: phasicity, outflow obstruction\n- IVC: patency at anastomoses\n\n**Hepatic artery thrombosis (HAT):**\n- Absent hepatic artery flow in the liver — urgent finding\n- Can lead to biliary ischemia and graft loss\n- RI suddenly elevated or absent diastolic flow may precede complete occlusion\n\n**Hepatic artery stenosis:**\n- PSV \u003e 300 cm/s at anastomosis, or PSV ratio \u003e 3:1 across anastomosis\n- Tardus-parvus waveforms distally (slow systolic upstroke, RI \u003c 0.5)\n\n**Portal vein stenosis:**\n- PSV \u003e 100–125 cm/s at anastomosis, or \u003e 3:1 ratio across it\n- May cause portal hypertension in the graft\n\n## Key Images to Capture\n\n1. Portal vein — B-mode with measurement (diameter)\n2. Portal vein — color Doppler showing direction\n3. Portal vein — spectral waveform with velocity\n4. Main hepatic artery — spectral with PSV, EDV, RI\n5. Each hepatic vein — spectral waveform\n6. IVC at hepatic vein confluence\n\n## Reporting Language\n\n- \"Patent portal vein with hepatopetal flow, velocity 22 cm/s, diameter 10 mm. Hepatic artery RI 0.62, normal low-resistance waveform. Hepatic veins with normal triphasic waveforms.\"\n- \"Dilated portal vein measuring 16 mm. Markedly reduced portal vein velocity at 8 cm/s. Hepatofugal flow identified in the left portal vein. Findings consistent with portal hypertension. Splenomegaly and small volume ascites noted.\"\n- \"Post liver transplant: Hepatic artery present with RI 0.58 and forward diastolic flow. No tardus-parvus waveforms. Portal vein patent, hepatopetal, velocity 28 cm/s. Hepatic vein outflow patent.\"\n\n---\n\n*SonoBuddy's Measurements section includes portal vein diameter, hepatic artery RI, and hepatic vein waveform reference values.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"portal-vein-doppler-hepatic-vasculature\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"portal-vein-doppler-hepatic-vasculature\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"portal-vein-doppler-hepatic-vasculature\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"portal-vein-doppler-hepatic-vasculature\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"portal-vein-doppler-hepatic-vasculature\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"portal-vein-doppler-hepatic-vasculature\",\"title\":\"Portal Vein and Hepatic Vasculature Doppler: A Practical Guide\",\"date\":\"2026-08-03\",\"excerpt\":\"How to evaluate the portal vein, hepatic veins, and hepatic artery with Doppler — normal values, waveform patterns, portal hypertension findings, and liver transplant surveillance.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"vascular\",\"protocol\",\"liver\",\"portal vein\",\"Doppler\",\"hepatic\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"renal-transplant-ultrasound-protocol\",\"title\":\"Renal Transplant Ultrasound: Protocol, Doppler, and Rejection Findings\",\"excerpt\":\"How to evaluate the tr
