c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T20c6,"])</script><script>self.__next_f.push([1,"Fetal Doppler ultrasound is a cornerstone of high-risk obstetric surveillance. It provides physiologic information about placental resistance and fetal circulatory adaptation that biometry alone cannot give. Understanding how to perform these studies and interpret the waveforms is essential for any sonographer working in OB.\n\n## Why Fetal Doppler?\n\nDoppler studies are ordered when:\n- Fetal growth restriction (FGR) is suspected or confirmed\n- Fetal anemia risk (isoimmunization, infection, hydrops)\n- Hypertensive disorders of pregnancy (preeclampsia)\n- Prior FGR or adverse perinatal outcome\n- Discordant twins (MCDA: TTTS, sFGR)\n- Post-dates pregnancy (placental insufficiency)\n\nThe goal: identify the compromised fetus before clinical deterioration, so delivery can be timed safely.\n\n---\n\n## Umbilical Artery Doppler\n\nThe umbilical artery (UA) reflects downstream placental resistance. As placental dysfunction progresses, resistance rises — the waveform changes in a predictable sequence.\n\n### Technique\n\n**Probe:** Curved low-frequency (3–5 MHz) or appropriate for fetal depth.\n\n**Gate placement:** Free loop of umbilical cord, away from the fetal or placental insertion (fetal insertion is preferred in some guidelines). The waveform differs slightly at placental vs fetal end.\n\n**Angle correction:** Not used for UA Doppler — S/D ratio is angle-independent (ratio of peak systole to end-diastole).\n\n**Optimal technique:**\n- Fetus at rest (movement and breathing affect waveform)\n- Measure over 3–5 consecutive waveforms\n- Obtain the angle of insonation ≤ 60°\n\n### Normal UA Waveform\n\nHigh-resistance in early pregnancy (very little or no diastolic flow), progressively lower resistance with gestation (diastolic flow increases as the placental vascular tree develops).\n\n**By 24 weeks:** Clear forward diastolic flow should be present.\n\n**Normal S/D ratio:** Decreases with gestation (typically \u003c 3.0 after 30 weeks).\n\n### Abnormal UA Patterns (in order of severity)\n\n| Pattern | Significance |\n|---|---|\n| Elevated S/D ratio | Increased placental resistance — early FGR sign |\n| Absent end-diastolic flow (AEDF) | Severe — 50–70% of placental vascular bed obliterated |\n| Reversed end-diastolic flow (REDF) | Critical — imminent fetal compromise; delivery planning urgent |\n\n**AEDF or REDF:** Report immediately. These findings are associated with perinatal morbidity and mortality and directly trigger obstetric decision-making (steroid administration, NICU preparation, delivery planning).\n\n**Reporting note:** Specify pattern, not just \"abnormal.\" \"Absent end-diastolic flow in the umbilical artery\" is actionable. \"Abnormal UA Doppler\" is not.\n\n---\n\n## Middle Cerebral Artery (MCA) Doppler — PSV\n\nThe MCA is used primarily to **detect fetal anemia**. Not the same indication as UA Doppler.\n\n### Why MCA PSV for Anemia?\n\nWhen a fetus becomes anemic, the blood thins (decreased viscosity) and cardiac output increases — blood moves faster through all vessels. The MCA PSV (peak systolic velocity) rises as a measurable physiologic response to anemia.\n\n**MCA PSV \u003e 1.5 MoM (multiples of the median)** for gestational age = fetal anemia (moderate to severe). Sensitivity ~88%, specificity ~82% for Hgb \u003c 0.84 MoM.\n\n### Technique — This Is Technically Demanding\n\n**Probe:** Curved or sector probe.\n\n**Steps:**\n1. Obtain an axial cross-section of the fetal head at the level of the circle of Willis (same plane as BPD — thalami visible)\n2. Locate the middle cerebral artery using color Doppler — it runs from the circle of Willis laterally toward the temporal lobe\n3. Place the Doppler gate at the **proximal third of the MCA** — near the origin from the internal carotid (most reproducible)\n4. **Critical: zero angle of insonation (0°)** — the MCA must run directly toward or away from the probe. Even a 10–15° angle significantly underestimates PSV. Tilt the probe to make the MCA run horizontal.\n5. Do NOT compress the fetal head (head compression falsely elevates PSV)\n6. Measure the **PSV (peak systolic velocity)** — the highest point on the waveform\n7. Take multiple measurements and use the **highest reproducible PSV** (not the mean)\n\n### Normal MCA PSV Values\n\nValues increase with gestational age. The clinical threshold is **1.5 MoM (multiples of the median)** for that GA.\n\nReference: Mari et al., 2000 (NEJM) — the foundational reference.\n\n**Approximate normal MCA PSV medians:**\n\n| Gestational Age | Median MCA PSV |\n|---|---|\n| 20 weeks | ~40 cm/s |\n| 24 weeks | ~47 cm/s |\n| 28 weeks | ~55 cm/s |\n| 32 weeks | ~64 cm/s |\n| 36 weeks | ~74 cm/s |\n| 40 weeks | ~87 cm/s |\n\n**1.5 MoM = 1.5 × median for GA.** For 28 weeks: 1.5 × 55 = 82.5 cm/s — any PSV above this suggests anemia.\n\n### When Is MCA PSV Ordered?\n\n- Maternal red cell alloimmunization (anti-D, anti-Kell, etc.)\n- Prior history of severe fetal anemia or hydrops\n- Parvovirus B19 exposure (slapped cheek disease)\n- Hydrops of unknown cause\n- Following intrauterine transfusion (surveillance for recurrence)\n\n---\n\n## MCA Pulsatility Index (MCA PI) — Cerebral Redistribution\n\nThe MCA PI is used in a different context — **cerebral redistribution (brain sparing)** in growth-restricted fetuses.\n\nWhen a fetus is hypoxic from placental insufficiency, it prioritizes blood flow to the brain by vasodilating cerebral vessels. The MCA becomes a **low-resistance** vessel (PI drops).\n\n**Normal:** MCA PI \u003e UA PI (brain resistance is higher than placental resistance).\n\n**Brain sparing:** MCA PI falls below the UA PI → the fetus is shunting blood to the brain at the expense of other organs. This is a sign of significant fetal compromise.\n\n**Cerebroplacental ratio (CPR):** MCA PI / UA PI. CPR \u003c 1.0 = brain sparing = concerning.\n\n---\n\n## Ductus Venosus (DV) Doppler\n\nThe ductus venosus carries oxygenated blood from the umbilical vein directly to the right atrium, bypassing the liver. DV Doppler reflects **right heart function and central venous pressure**.\n\n### When Is It Used?\n\nDV Doppler is a late-stage surveillance tool — used when UA AEDF/REDF is present, or in the setting of severe FGR, to assess cardiac decompensation.\n\n### Normal DV Waveform\n\nTriphasic waveform with three components:\n- **S wave:** Ventricular systole (forward flow)\n- **D wave:** Ventricular diastole (passive forward flow)\n- **a wave:** Atrial contraction — normally forward, above the baseline\n\n**Key:** Forward a-wave = normal cardiac function.\n\n### Abnormal DV Patterns\n\n| Pattern | Significance |\n|---|---|\n| Reduced a-wave | Elevated venous pressure — early cardiac compromise |\n| Absent a-wave | Significant compromise — elevated right atrial pressure |\n| Reversed a-wave | Critical — severe cardiac compromise; imminent fetal decompensation; usually indication for delivery |\n\n**DV reversed a-wave** in a premature fetus is a grave sign. Correlate with clinical context and biophysical profile.\n\n---\n\n## Systematic Approach: The Modified Biophysical Profile and Doppler\n\nIn surveillance of the compromised fetus:\n1. **UA Doppler first** — placental resistance\n2. **If UA abnormal → MCA PI** — cerebral redistribution assessment\n3. **If UA AEDF/REDF → DV Doppler** — cardiac venous function\n4. **Biophysical profile** — amniotic fluid, movements, breathing, tone, NST\n\nThis hierarchy reflects the progression of fetal deterioration: placental → brain → heart.\n\n---\n\n## Reporting Language\n\n**Normal:**\n\"Umbilical artery: normal forward end-diastolic flow. S/D ratio 2.6 (normal for 34 weeks). MCA PSV 58.2 cm/s (0.92 MoM — normal). Ductus venosus: normal triphasic waveform with forward a-wave.\"\n\n**Absent EDV:**\n\"Umbilical artery: absent end-diastolic flow identified in a free loop of cord at 30 weeks gestation. MCA PI 1.34 (low — brain sparing pattern). Ductus venosus: forward a-wave, mildly reduced. Umbilical artery AEDF at this gestational age represents significant placental compromise. Urgent obstetric consultation is recommended.\"\n\n**MCA PSV for anemia:**\n\"MCA PSV: 92 cm/s at 30 weeks gestation (1.67 MoM). Values above 1.5 MoM indicate risk for moderate to severe fetal anemia. Clinical correlation with maternal antibody titers and consideration of cordocentesis is recommended.\"\n\n---\n\n*SonoBuddy's OB Doppler protocols include umbilical artery, MCA PSV, and ductus venosus references with gestational-age-specific MoM tables.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"fetal-doppler-mca-umbilical-ductus\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"fetal-doppler-mca-umbilical-ductus\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"fetal-doppler-mca-umbilical-ductus\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"fetal-doppler-mca-umbilical-ductus\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"fetal-doppler-mca-umbilical-ductus\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"fetal-doppler-mca-umbilical-ductus\",\"title\":\"Fetal Doppler: MCA PSV, Umbilical Artery, and Ductus Venosus\",\"date\":\"2026-09-17\",\"excerpt\":\"How to perform fetal Doppler studies — umbilical artery S/D ratio, MCA PSV for fetal anemia, and ductus venosus — including normal values, abnormal patterns, and clinical significance.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"obstetrics\",\"Doppler\",\"fetal\"
