c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T18b7,"])</script><script>self.__next_f.push([1,"Chronic mesenteric ischemia (CMI) — also called intestinal angina — is caused by stenosis or occlusion of the mesenteric arteries. It's underdiagnosed because symptoms are vague: postprandial pain, food fear, and weight loss. Mesenteric artery duplex is the primary non-invasive test. Here's how to approach it.\n\n## Clinical Context\n\nThe bowel has a rich collateral supply from three vessels:\n- **Celiac axis (CA):** Supplies the foregut (stomach, liver, spleen, pancreas)\n- **Superior mesenteric artery (SMA):** Supplies the midgut (small bowel, right colon)\n- **Inferior mesenteric artery (IMA):** Supplies the hindgut (left colon, sigmoid, rectum)\n\nSingle-vessel stenosis rarely causes symptoms because of collateral flow. Significant CMI typically requires disease in two or more vessels. The celiac and SMA are the vessels most commonly assessed by duplex.\n\n## Indications\n\n- Chronic postprandial abdominal pain (pain 15–30 minutes after eating, lasting 1–2 hours)\n- Unexplained weight loss with bowel symptoms\n- Food fear (sitophobia — avoiding eating to prevent pain)\n- Suspected celiac artery compression syndrome (median arcuate ligament syndrome)\n- Evaluation before mesenteric revascularization\n- Post-procedure surveillance\n\n## Equipment and Setup\n\n**Probe:** 2–5 MHz curvilinear. Bowel gas is the enemy — a curved probe gets under the ribs better than a linear.\n\n**Patient prep:** Fasting 8–12 hours is critical. A full bowel is impossible to scan through. Fasting also allows you to assess normal fasting velocities as a baseline.\n\n**Patient position:** Supine. Elevating the head of the bed slightly can help in obese patients.\n\n**Tip:** These exams often take 60–90 minutes for complete evaluation. Warn the patient.\n\n## Anatomy\n\n**Celiac axis:**\n- First major branch of the aorta below the diaphragm, at T12/L1\n- Short trunk (1–2 cm), trifurcates (or bifurcates) into the common hepatic artery, splenic artery, and left gastric artery\n- The celiac has a low-resistance waveform (supplies highly vascular organs)\n\n**Superior mesenteric artery:**\n- Arises from the aorta 1–2 cm below the celiac, at L1\n- Courses inferiorly behind the pancreatic neck, then over the third portion of the duodenum\n- **Fasting:** High resistance (reduced bowel activity) — prominent reversal of diastolic flow is normal\n- **Post-prandial:** Low resistance — forward diastolic flow increases significantly\n\n## Scanning Technique\n\n### Step 1: Aorta Survey\n\nStart with the proximal aorta in sagittal — identify the celiac and SMA origins. Note the aortic diameter (aneurysmal disease may coexist) and proximal aortic Doppler waveform (you'll use the aortic PSV for ratio calculations).\n\n### Step 2: Celiac Axis\n\n- Sagittal or transverse approach at the epigastrium\n- Short vessel — find its origin from the aorta, then follow to its bifurcation/trifurcation\n- Sample at: origin (1 cm from aorta), mid vessel, and at the bifurcation\n- Celiac has a characteristic \"seagull\" or \"T\" shape in transverse as it divides\n\n**Technique for celiac:** In transverse, the celiac looks like a seagull in flight — the two wings are the splenic (left) and hepatic (right) arteries, the body is the celiac trunk. This is your landmark.\n\n### Step 3: Superior Mesenteric Artery\n\n- Sagittal plane: the SMA runs parallel to the aorta, separated by the renal vein and splenic vein\n- Sample at: origin (1 cm from aorta), proximal, and mid SMA\n- Keep Doppler angle ≤ 60°\n\n**Normal fasting SMA waveform:** Triphasic with reversal of diastolic flow — high resistance, similar to peripheral arteries. This is NORMAL in a fasting patient.\n\n## Diagnostic Criteria\n\n### Celiac Axis\n\n| Stenosis | PSV |\n|---|---|\n| Normal | \u003c 200 cm/s |\n| ≥ 70% stenosis | \u003e 200 cm/s |\n| Occlusion | Absent flow, post-stenotic turbulence in hepatic/splenic |\n\n### Superior Mesenteric Artery\n\n| Stenosis | Fasting PSV |\n|---|---|\n| Normal | \u003c 275 cm/s |\n| ≥ 70% stenosis | \u003e 275 cm/s |\n| Occlusion | Absent flow |\n\n**Celiac-to-aortic ratio and SMA-to-aortic ratio** may also be used (PSV at stenosis ÷ PSV at aorta) similarly to renal artery RAR. Values \u003e 3.5 suggest significant stenosis.\n\n## Median Arcuate Ligament Syndrome (MALS)\n\nMALS occurs when the median arcuate ligament of the diaphragm compresses the celiac axis from above, typically in young, thin patients.\n\n**Ultrasound findings:**\n- Elevated celiac PSV on inspiration that normalizes or decreases on expiration\n- The hook-shaped compression of the celiac origin visible on B-mode\n- Post-stenotic turbulence\n\n**Key technique:** Obtain celiac Doppler in both deep inspiration (increases compression) and full expiration (releases compression). A PSV that drops significantly from inspiration to expiration — or that exceeds 200 cm/s on inspiration but normalizes on expiration — is characteristic of MALS.\n\n## Post-Prandial Evaluation (Optional)\n\nIf fasting velocities are normal but clinical suspicion is high, a post-prandial study can be performed. The patient eats a standardized meal (or glucose drink), and the SMA is rescanned at 30 minutes.\n\n**Normal post-prandial response:** SMA PSV increases and EDV increases significantly (diastolic flow increases, RI drops). A blunted response suggests hemodynamically significant disease.\n\n## What to Document\n\n- Aortic PSV (reference for ratios)\n- Celiac: origin PSV, visualization quality, presence of turbulence\n- SMA: origin PSV, proximal PSV, waveform character (fasting)\n- Note whether any vessels were not visualized (bowel gas)\n- Respiratory variation for celiac if MALS suspected\n\n## Reporting Language\n\n- \"Celiac axis PSV 148 cm/s, SMA PSV 186 cm/s. Normal fasting waveforms. No hemodynamically significant stenosis of the celiac axis or SMA.\"\n- \"Celiac axis PSV elevated at 310 cm/s with post-stenotic turbulence at the origin. Celiac-to-aortic ratio 4.1. SMA PSV 205 cm/s. Findings consistent with hemodynamically significant celiac axis stenosis and possible SMA stenosis.\"\n- \"Celiac axis PSV 390 cm/s on deep inspiration, decreasing to 110 cm/s on full expiration. Consistent with extrinsic celiac axis compression — findings suggest median arcuate ligament syndrome (MALS).\"\n\n---\n\n*SonoBuddy's vascular protocols include mesenteric artery duplex criteria and normal value ranges in the Measurements section.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"mesenteric-artery-duplex-protocol\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"mesenteric-artery-duplex-protocol\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"mesenteric-artery-duplex-protocol\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"mesenteric-artery-duplex-protocol\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"mesenteric-artery-duplex-protocol\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"mesenteric-artery-duplex-protocol\",\"title\":\"Mesenteric Artery Duplex: Scanning the SMA and Celiac for Bowel Ischemia\",\"date\":\"2026-08-18\",\"excerpt\":\"How to perform mesenteric artery duplex — scanning the celiac axis and superior mesenteric artery, Doppler criteria for stenosis, and the clinical context of chronic mesenteric ischemia.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"vascular\",\"protocol\",\"mesenteric\",\"Doppler\",\"ischemia\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"rena
