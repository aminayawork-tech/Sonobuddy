c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1366,"])</script><script>self.__next_f.push([1,"When we asked sonographers where scanning hurts most, \"right shoulder\" came up again and again. That's no surprise: across studies of sonographers, the **shoulder is the most frequently injured body part**, usually the scanning arm.\n\nThe cause is almost always the same, and so is the fix.\n\n## Why Your Shoulder Takes the Hit\n\nThe rotator cuff is four small muscles that keep the ball of your shoulder centered in its socket. They're built for movement, not for **holding your arm out to the side for 30 minutes at a time.**\n\nWhen you scan with your elbow lifted away from your body (called **abduction**), those muscles are working the entire time just to hold your arm up. Add downward pressure on the probe and a reach across the patient, and the load climbs fast. Over months and years that sustained, static load leads to:\n\n- **Rotator cuff tendinopathy:** irritated, painful tendons, often felt at the front or side of the shoulder\n- **Impingement:** the tendons get pinched under the bony roof of the shoulder when the arm is raised\n- **Tears:** in the long run, worn tendons can partially or fully tear\n\nThe two biggest culprits are **how far your arm is out** and **how long it stays there.**\n\n## The 30-Degree Rule\n\n![The 30 degree rule for sonographer shoulders](/blog/ergonomics/shoulder-30-degree-rule.svg \"Keep your scanning arm close to your body|SonoBuddy\")\n\nErgonomic guidance for sonographers, including the SDMS industry standards for preventing work-related injury, recommends keeping your scanning arm **within about 30 degrees of your body.** In practice, that means your elbow stays close to your side and **never rises above your shoulder.**\n\nA useful check: if someone could slide a ball between your elbow and your ribs, you're fine. If they could fit a basketball, your shoulder is working too hard.\n\n## How to Keep Your Elbow In\n\nThe rule is easy to understand and hard to follow, because the room usually fights you. These are the setup moves that make it possible:\n\n### Bring the patient to you\n\nThe single most effective change. Ask the patient to **slide to the edge of the bed** closest to you before you start. Every inch they move toward you is an inch your arm doesn't have to reach. For a right-sided scan from the patient's right, this one change often eliminates most of the reach.\n\n### Match your height to the bed\n\n- **Sitting:** raise your chair, or lower the bed, until your forearm can rest roughly level with the patient\n- **Standing:** set the bed so your scanning arm can work with the elbow bent and low, not reaching up and over\n\nIf your shoulder hikes up toward your ear, the bed is too high or you're too low.\n\n### Support the arm\n\nRest your forearm on the bed, the patient (with permission), or a **support cushion or rolled towel.** A supported arm takes most of the static load off the rotator cuff. Some departments have arm supports that clip to the bed; ask for them.\n\n### Reach across less\n\nScanning the far side of the patient (for example, a left kidney from the patient's right side) forces a long reach. When the exam allows, **move to the other side of the bed** or roll the patient toward you instead.\n\n### Break up the static hold\n\nEvery few minutes, during a measurement or while you freeze an image, **drop the arm, relax the shoulder, and let it hang** for a few seconds. Short breaks in the static load matter more than one long break at lunch.\n\n## Shoulder Resets Between Patients\n\nThirty seconds between patients:\n\n- **Shoulder rolls:** 5 slow rolls backward\n- **Shoulder blade squeeze:** pull the shoulder blades back and down, hold 5 seconds, repeat 5 times\n- **Doorway chest stretch:** forearms on a door frame, step gently through for 15 to 20 seconds. Scanning pulls you forward all day; this opens the front of the shoulder back up\n- **Pendulum:** lean on the bed with your free arm, let the scanning arm hang and swing in small circles\n\nStop if anything brings on sharp pain, clicking with pain, or tingling down the arm.\n\n## Warning Signs\n\nSee a clinician or occupational health if you have:\n\n- Pain when **lifting the arm overhead** or reaching behind your back\n- Pain at **night**, especially when lying on that shoulder\n- **Weakness** lifting or rotating the arm\n- Pain that spreads down the arm, or numbness and tingling in the hand (this can come from the neck, not the shoulder)\n- Pain that's lasted **more than a couple of weeks** or keeps returning\n\nShoulder problems caught early usually respond well to physical therapy and workstation changes. Problems ignored for years are the ones that end careers.\n\n## The Bottom Line\n\n**Elbow in, patient close, arm supported, and drop it between images.** If you remember one number, make it 30 degrees.\n\nNext in this series: the **neck**, and the 10-second monitor setup that prevents most of it.\n\n*This article is general educational information, not medical advice. If you have pain, numbness, or weakness, see a qualified clinician.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"sonographer-shoulder-pain-30-degree-rule\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"MkkPr9wyMs2zjZF5e3_OM\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"sonographer-shoulder-pain-30-degree-rule\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonographer-shoulder-pain-30-degree-rule\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"sonographer-shoulder-pain-30-degree-rule\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\
