c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1bcf,"])</script><script>self.__next_f.push([1,"The images you capture tell the story — but how you document your findings determines whether that story is understood. While radiologists write the final report, sonographers provide the raw material: image labels, worksheet findings, and sometimes preliminary reports depending on your institution. Clear documentation is a professional skill worth developing early.\n\n## Why Documentation Quality Matters\n\nPoor documentation leads to:\n- Radiologists missing significant findings you intended to flag\n- Repeat studies because key structures were not clearly documented\n- Legal liability if a finding wasn't documented and a problem developed\n- Unnecessary follow-up imaging because it was unclear what was seen\n\nGood documentation saves time, prevents errors, and makes your work defensible.\n\n## Structure of a Clear Sonography Worksheet\n\nMost institutions use a structured worksheet. Fill it in systematically, not just as a checkbox exercise.\n\n**Elements of a good worksheet:**\n\n1. **Study quality and limitations first:** If anything limited the exam, say so upfront. \"Study limited by: patient body habitus / patient cooperation / bowel gas obscuring [specific structure].\"\n\n2. **Systematic findings:** Document each structure evaluated, even if normal. \"Liver: normal size, echogenicity, and contour. No focal lesions.\" is better than leaving a field blank.\n\n3. **Measurements with context:** Don't just write \"7 mm\" — write \"Common bile duct: 7 mm (upper limit of normal for age).\" Context helps the radiologist calibrate quickly.\n\n4. **Comparisons:** If prior studies are available, reference them. \"Gallstone stable compared to study from [date].\" or \"Liver lesion increased from 1.2 cm to 1.8 cm compared to [date].\"\n\n5. **Flag unexpected findings:** If you see something outside the clinical question, document it. An incidental finding you noted but didn't flag is harder to defend if it turns out to be significant.\n\n## Writing Descriptions That Are Useful\n\n**Describe what you see, not what you think it means:**\n\nNot helpful: \"Gallbladder looks bad.\"\nBetter: \"Gallbladder wall thickened at 6 mm. Multiple echogenic shadowing foci in the gallbladder lumen, largest measuring 1.2 cm. No pericholecystic fluid.\"\n\nNot helpful: \"Liver is probably normal.\"\nBetter: \"Liver is normal in size (14 cm) and echogenicity. No focal lesions identified. Hepatic vasculature is patent.\"\n\n**Be specific with size:**\n- Include measurements in cm (or mm for small structures)\n- Specify measurement plane when relevant (e.g., \"7 mm in transverse plane at the porta hepatis\")\n- For masses: three dimensions in two planes\n\n**Describe location clearly:**\n- Use anatomic location: \"Lower pole of the right kidney\" not \"bottom of right kidney\"\n- Use clock positions for breast: \"Right breast, 2 o'clock, 3 cm from the nipple\"\n- Use segment for liver (segments I–VIII)\n- Use zone for prostate (peripheral, transition, central zone)\n\n**Describe echogenicity consistently:**\n- Compared to a reference organ: \"Hyperechoic relative to liver,\" \"isoechoic to renal cortex\"\n- Use standard terms: anechoic, hypoechoic, isoechoic, hyperechoic, heterogeneous, complex\n\n## What to Write When You Can't See Something\n\nThis is one of the most important documentation skills.\n\n**Never write \"normal\" for a structure you didn't actually see.** Instead:\n\n- \"Pancreatic tail not visualized due to overlying bowel gas.\"\n- \"Right kidney technically difficult — adequate images obtained with patient in decubitus position.\"\n- \"Distal common bile duct not well-visualized due to duodenal gas.\"\n- \"Ovaries not identified — patient is post-menopausal; atrophic ovaries may be below ultrasound resolution.\"\n\nThis protects you legally and gives the radiologist important context. A radiologist who reads \"pancreas: not visualized\" knows to consider recommending CT if the clinical question requires it.\n\n## Flagging Critical Findings\n\nKnow your institution's critical finding communication protocol. The ACR defines a critical finding as one that requires immediate notification because a delay in treatment could cause serious harm.\n\n**Examples of critical findings that require direct physician notification:**\n- Ruptured abdominal aortic aneurysm\n- Free fluid with suspected ectopic pregnancy\n- Echogenic free fluid suggesting hemorrhage\n- Absent fetal heart activity not previously known\n- Pneumothorax seen incidentally\n- Signs of acute appendicitis not previously known\n\n**How to communicate:**\n1. Stop scanning and call the ordering provider (or emergency department if emergent)\n2. Document in your worksheet: \"[Finding] noted. Ordering provider Dr. [X] notified at [time] by telephone. Acknowledge by [name].\"\n3. Follow up to ensure the call was received and acknowledged\n\nThis documentation matters in legal situations. Make it a habit.\n\n## Terminology to Avoid\n\n**Diagnostic conclusions:** Unless your institution authorizes sonographers to state impressions, avoid diagnostic language. Write descriptions, not conclusions.\n\n- Avoid: \"This is gallbladder cancer.\"\n- Write: \"Focal echogenic mass with irregular margins in the gallbladder wall measuring 2.3 cm.\"\n\n**Vague qualifiers:** \"Possibly,\" \"probably,\" \"maybe\" — these are interpretation words. Describe what you see.\n\n**Relative terms without reference:** \"Large\" or \"small\" mean nothing without context. \"Significantly enlarged\" is meaningless without a measurement.\n\n## Image Labeling\n\nLabel every image so it can be understood without the worksheet:\n- Structure: \"LT KIDNEY\" not just \"LT\"\n- Plane: \"SAG\" or \"TRV\"\n- Measurement marker labels if the measurement is on the image: \"LT KIDNEY LONG: 8.9 CM\"\n- Doppler: \"RT RENAL ART PSV 68 CM/S\" (include angle, velocity, RI if displayed)\n- For pathology: \"GB STONE 1.2CM\" with a labeled arrow or marker\n\nLabel images *as you scan*, not after the fact. Relabeling images after the fact is harder and sometimes not possible depending on your system.\n\n## Documenting Doppler Measurements\n\nFor vascular studies, document:\n- Vessel name and side\n- Measurement type: PSV, EDV, RI, S/D ratio\n- Angle of insonation\n- Waveform description (triphasic, biphasic, monophasic, phasic, turbulent)\n\n**Example:** \"Right renal artery: PSV 120 cm/s at 60°. Intrarenal RI: 0.65 upper pole, 0.63 mid, 0.68 lower pole. Normal waveforms bilaterally.\"\n\n## A Note on Preliminary Findings and Scope\n\nIn most institutional settings, sonographers provide technical assessments and the radiologist provides the clinical interpretation. Know your institution's policy before offering clinical opinions verbally to patients or ordering providers.\n\nSaying \"your kidney looks fine\" to a patient when you saw a 2 cm lesion you weren't sure about creates confusion and potential harm. The safest approach:\n\n- \"I've completed the images and they'll be read by the radiologist.\"\n- \"If you have specific questions about the results, your doctor will go over them with you after the images are reviewed.\"\n\n---\n\n*SonoBuddy's Protocols section includes report checklist items for each exam type — use them to make sure you haven't missed documenting a key finding.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"sonographer-report-writing-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"sonographer-report-writing-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonographer-report-writing-guide\",
