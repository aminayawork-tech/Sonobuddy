c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T167f,"])</script><script>self.__next_f.push([1,"Temporomandibular joint (TMJ) ultrasound is an underused small-parts study. It's fast, dynamic, well-tolerated, and genuinely useful for effusion, synovitis, and gross joint mobility — but it has real limits that are worth understanding before you scan one, because referring providers don't always know them either.\n\n## Anatomy Quick Reference\n\nThe TMJ is a synovial joint between the mandibular condyle and the temporal bone's articular fossa, with a fibrocartilaginous **articular disc** interposed between them. The disc divides the joint into superior and inferior compartments and normally sits over the condylar head, moving forward with the condyle during mouth opening.\n\n**Key structures to identify:**\n- Mandibular condyle (rounded, well-defined cortical surface)\n- Articular eminence and glenoid fossa\n- Joint capsule and superior/inferior joint spaces\n- The disc itself — often only indirectly inferred on ultrasound rather than clearly outlined\n\n## Indications\n\n- Jaw pain, clicking, or locking\n- Suspected TMJ effusion or synovitis (often in the context of rheumatoid arthritis or other inflammatory arthropathy)\n- Palpable joint swelling\n- Limited mouth opening\n- Guidance for TMJ aspiration or injection\n\n## Scanning Technique\n\n**Probe:** High-frequency linear transducer, 12–18 MHz — the joint is superficial and small.\n\n**Patient position:** Seated or supine, head turned slightly away from the side being scanned. Scan both sides for comparison; asymmetry is often the most useful finding.\n\n**Landmark:** Place the probe just anterior to the tragus, in a coronal-oblique plane parallel to the long axis of the condyle.\n\n**The dynamic exam is the whole point of TMJ ultrasound.** Scan the joint:\n1. **Closed mouth (static)** — assess the condyle position, joint space, and look for effusion\n2. **Partially open** — the condyle translates anteriorly and inferiorly along the articular eminence\n3. **Fully open** — confirm normal, symmetric anterior excursion of the condyle\n4. **Have the patient open and close slowly two or three times** while you watch condylar movement in real time — this is where you catch restricted or asymmetric translation that a static image will miss entirely\n\n## What Ultrasound Can Show\n\n**Joint effusion:** Anechoic or hypoechoic fluid distending the joint capsule, most easily seen in the superior joint space. Compare side-to-side — unilateral effusion is more clinically significant than a small amount seen bilaterally.\n\n**Synovitis / synovial thickening:** Hypoechoic, non-compressible soft tissue thickening within the joint capsule, sometimes with increased Doppler flow in active inflammation. Relevant in known or suspected rheumatoid arthritis, juvenile idiopathic arthritis, or other inflammatory joint disease.\n\n**Condylar surface irregularity:** Cortical erosion or flattening can sometimes be appreciated in advanced degenerative or inflammatory disease, though this is better characterized by CT or MRI.\n\n**Restricted or asymmetric translation:** Reduced anterior excursion of the condyle on the affected side during opening, especially compared to the contralateral joint, supports a mechanical problem even without direct disc visualization.\n\n## What Ultrasound Cannot Reliably Show\n\nThis is the section to actually read before you tell a referring provider what the study can do.\n\n**Disc position and internal derangement.** The disc itself is difficult to consistently visualize and is not reliably distinguished from surrounding soft tissue on ultrasound. Anterior disc displacement — the most common cause of clicking and locking — is the classic indication people expect ultrasound to answer, and it's the one ultrasound answers worst.\n\n**MRI is the reference standard for internal derangement,** specifically because closed-mouth and open-mouth MRI sequences directly visualize disc position relative to the condyle in a way ultrasound cannot reproduce reliably.\n\n**Bone marrow edema, osteoarthritic changes deep to the cortical surface, and detailed joint architecture** all require CT or MRI.\n\n**The practical framing for your report or verbal handoff:** ultrasound is a good first-line tool for effusion, synovitis, and gross dynamic mobility, and a poor tool for definitively characterizing disc displacement. If the clinical question is specifically about disc position, say so — it saves the patient a second, unnecessary study cycle.\n\n## Reporting Language\n\n**Normal:**\n\"Bilateral TMJs demonstrate normal condylar morphology with symmetric anterior translation on dynamic opening. No joint effusion or synovial thickening identified.\"\n\n**Effusion / synovitis:**\n\"Mild anechoic fluid distending the superior joint space of the right TMJ, not present on the left. Associated hypoechoic synovial thickening along the joint capsule. Findings are nonspecific but compatible with synovitis; clinical correlation with inflammatory arthropathy is recommended.\"\n\n**Suspected internal derangement:**\n\"Reduced anterior excursion of the right mandibular condyle on dynamic opening compared to the left. No definitive disc position abnormality identified on ultrasound; MRI of the TMJ is recommended for further characterization of suspected internal derangement.\"\n\n## Key Images to Capture\n\n1. Both TMJs, closed mouth, for baseline comparison\n2. Both TMJs, open mouth, documenting condylar excursion\n3. Any effusion or synovial thickening, with and without color Doppler\n4. A brief clip or sequential images through the open/close cycle if your system supports cine capture — this documents the dynamic finding far better than a static image can\n\n---\n\n*SonoBuddy's small parts protocols include thyroid, salivary gland, lymph node, and soft tissue ultrasound guides.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"tmj-ultrasound-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"tmj-ultrasound-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"tmj-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"tmj-ultrasound-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"tmj-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"tmj-ultrasound-guide\",\"title\":\"TMJ Ultrasound: Technique, Disc Position, and When It's Not Enough\",\"date\":\"2026-10-19\",\"excerpt\":\"Scanning the temporomandibular joint — dynamic open/close technique, effusion and synovitis, indirect signs of disc displacement, and why MRI remains the reference standard for internal derangement.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"musculoskeletal\",\"TMJ\",\"small parts\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"hernia-ultrasound-guide\",\"title\":\"Hernia Ultrasound: Inguinal, Femoral, Umbilical, and Sports Hernia\",\"excerpt\":\"How to evaluate hernias on ultrasound — inguinal canal anatomy, direct vs indirect hernia, dynamic Valsalva technique, femoral hernia, and what findings require urgent reporting.\",\"date\":\"2026-08-26\"},{\"slug\":\"shoulder-ultrasound-rotator-cuff-guide\",\"title\":\"Shoulder Ultrasound: Rotator Cuff, Biceps Tendon, and Subacromial Space\",\"excerpt\":\"How to scan the shoulder systematically — supraspinatus, infraspinatus, subscapularis, biceps tendon, and AC joint — with normal appearances, tear findings, and dynamic testing.\",\"date\":\"2026-09-01\"},{\"slug\":\"knee-u
