c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T2212,"])</script><script>self.__next_f.push([1,"Endometrial assessment is one of the highest-stakes measurements in gynaecological ultrasound. A single number — endometrial thickness in a postmenopausal woman with bleeding — routinely determines whether a patient proceeds to biopsy. That puts real weight on measuring it correctly.\n\n---\n\n## How to Measure\n\n**Transvaginal is required.** Transabdominal imaging cannot reliably measure the endometrium, and a transabdominal-only study in a patient with abnormal bleeding should say so rather than report a number.\n\n**Plane:** True **midsagittal** view of the uterus, showing the endometrial stripe continuously from the fundus to the internal cervical os.\n\n**What to measure:** The **double-layer thickness** — the full anteroposterior measurement of both endometrial layers at the thickest point, measured perpendicular to the endometrial stripe, **excluding** any intracavitary fluid.\n\n**If fluid is present in the cavity**, measure each layer separately and report the sum of the two single layers. Including the fluid inflates the measurement and is a common error.\n\n### Technical Points That Change the Number\n\n- **Get a true midline.** An oblique plane cuts the endometrium tangentially and overestimates thickness.\n- **Measure at the thickest point**, not wherever the calipers happen to land.\n- **A markedly retroverted or axial uterus, large fibroids, or adenomyosis** can make the endometrium impossible to measure reliably. When that is the case, say the endometrium is not adequately visualized rather than reporting an unreliable number — this is a genuinely important reporting distinction, because \"not visualized\" prompts further evaluation while a falsely thin number is reassuring and wrong.\n\n---\n\n## Thresholds\n\n### Postmenopausal With Bleeding\n\nThis is the critical scenario.\n\n**An endometrial thickness of 4 mm or less** in a postmenopausal woman with bleeding carries a very low likelihood of endometrial carcinoma, and widely used consensus guidance treats this as sufficiently reassuring that biopsy is not automatically required.\n\n**Above 4 mm** warrants tissue sampling or further evaluation.\n\nTwo important qualifications:\n\n- **Recurrent or persistent bleeding warrants evaluation regardless of thickness.** A thin endometrium does not exclude pathology in a woman who keeps bleeding, and some endometrial cancers — particularly type II histologies — can present with a thin stripe.\n- **The threshold applies specifically to bleeding.** It is not a screening threshold.\n\n### Postmenopausal Without Bleeding\n\nMore contentious, and there is no single agreed cutoff. Incidentally thickened endometrium in an asymptomatic postmenopausal woman is managed according to the degree of thickening, the presence of other features, and individual risk factors. Values in the region of 8–11 mm are variously cited as prompting consideration of further assessment. Report the measurement and any morphological abnormality; the management decision belongs with the clinician.\n\n### Premenopausal\n\nThere is no single normal value — thickness varies through the cycle, so the measurement is only interpretable alongside cycle day.\n\n| Phase | Typical double-layer thickness | Appearance |\n|---|---|---|\n| Menstrual | 2–4 mm | Thin, irregular, may contain blood |\n| Early proliferative | 4–8 mm | Hypoechoic, developing three-layer pattern |\n| Late proliferative / periovulatory | 8–12 mm | Classic **trilaminar** pattern |\n| Secretory | 7–16 mm | Uniformly echogenic, thickest phase |\n\n**Always document cycle day.** A 14 mm endometrium is entirely normal in the secretory phase and abnormal on day 5.\n\n**Best timing for assessment** in a premenopausal woman with abnormal bleeding is the **early proliferative phase**, days 4 to 6, when the endometrium is thinnest and focal lesions stand out most clearly.\n\n---\n\n## Focal Lesions\n\nMost abnormal bleeding with a thickened endometrium turns out to be focal, and distinguishing the two commonest lesions matters because they are managed differently.\n\n### Endometrial Polyp\n\n- **Focal, echogenic** lesion within the cavity\n- Preserves the endometrial–myometrial junction\n- Often surrounded by a thin rim of fluid, best seen in the early proliferative phase\n- **Pedicle artery sign:** a single feeding vessel entering the lesion on colour Doppler. This is the most useful discriminating feature — a solitary feeding vessel strongly favours a polyp.\n- May be single or multiple, sessile or pedunculated\n\n### Submucosal Fibroid\n\n- **Hypoechoic** rather than echogenic\n- **Broad-based**, arising from and continuous with the myometrium\n- Distorts or interrupts the endometrial–myometrial junction\n- **Circumferential (rim) vascularity** rather than a single pedicle\n- Often produces posterior acoustic shadowing or edge shadowing\n- May show calcification in degenerated lesions\n\n**Report the degree of intracavitary protrusion.** Whether a submucosal fibroid is mostly within the cavity or mostly intramural determines whether it can be resected hysteroscopically, so the surgeon needs that detail rather than just \"submucosal fibroid.\"\n\n### Concerning Features\n\nFindings that raise concern for hyperplasia or malignancy:\n\n- Diffuse, markedly thickened, **heterogeneous** endometrium\n- **Irregular or indistinct endometrial–myometrial junction** — suggests possible myometrial invasion\n- **Irregular, multivessel** vascular pattern rather than a single pedicle\n- Intracavitary fluid alongside a thickened, irregular endometrium in a postmenopausal woman\n- Irregular endometrial surface\n\nNone of these is diagnostic. The report should describe them and recommend tissue sampling — the diagnosis is histological.\n\n---\n\n## Saline Infusion Sonohysterography\n\nSIS distends the cavity with sterile saline and is the single most useful next step when standard transvaginal imaging shows a thickened or irregular endometrium without a clear explanation.\n\n**What it adds:** It separates the endometrial layers, so a focal lesion becomes obvious and can be characterized as a polyp versus a submucosal fibroid, and its size, location, and degree of intracavitary protrusion can be measured precisely.\n\n**Timing:** Early proliferative phase, days 4 to 10, after bleeding has stopped and before the endometrium thickens.\n\n**Contraindications:** Pregnancy, active pelvic infection. Exclude pregnancy before proceeding in any premenopausal patient.\n\n**Practical note:** A negative SIS in a woman with a diffusely thickened endometrium does not remove the need for sampling — it tells you the thickening is diffuse rather than focal, which is itself clinically useful information.\n\n---\n\n## Special Situations\n\n**Tamoxifen:** Produces characteristic endometrial changes — thickening, subendometrial cysts, and a heterogeneous appearance — that make thickness measurement poorly predictive. Standard thresholds do not apply, and management is generally driven by symptoms rather than measurement. Note tamoxifen use prominently in the report.\n\n**Hormone replacement therapy:** Sequential HRT produces cyclical changes; measure early in the cycle where possible and document the regimen.\n\n**Retained products of conception:** Echogenic material in the cavity with vascularity on colour Doppler in a recently pregnant patient. Vascularity is the key feature distinguishing retained products from blood clot.\n\n---\n\n## Key Images to Capture\n\n1. Midsagittal uterus with endometrial thickness measurement\n2. Transverse uterus at the level of maximum endometrial thickness\n3. Endometrial–myometrial junction, documented as regular or irregular\n4. Colour Doppler of any focal lesion, demonstrating the vascular pattern\n5. Any intracavitary fluid, with single-layer measurements\n6. Both ovaries\n7. Cycle day or menopausal status documented\n\n---\n\n## Reporting Language\n\n**Polyp:**\n\"Endometrial thickness 13 mm (day 6 of cycle). Within the cavity there is a 1.4 × 0.9 cm echogenic focal lesion with a single feeding vessel on colour Doppler. The endometrial–myometrial junction is preserved. Appearances favour an endometrial polyp. Saline infusion sonohysterography or hysteroscopy would confirm and allow assessment for resection.\"\n\n**Postmenopausal bleeding, reassuring:**\n\"Endometrial thickness 3 mm, uniform and regular, with a distinct endometrial–myometrial junction. No focal lesion or intracavitary fluid. In a postmenopausal woman with bleeding, an endometrial thickness of 4 mm or less carries a low likelihood of endometrial carcinoma. Persistent or recurrent bleeding warrants further evaluation regardless of this measurement.\"\n\n---\n\n*SonoBuddy is a reference tool. Endometrial sampling decisions belong with the referring clinician.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"endometrial-assessment-abnormal-uterine-bleeding\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"endometrial-assessment-abnormal-uterine-bleeding\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"endometrial-assessment-abnormal-uterine-bleeding\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"endometrial-assessment-abnormal-uterine-bleeding\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"endometrial-assessment-abnormal-uterine-bleeding\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"endometrial-assessment-abnormal-uterine-bl
