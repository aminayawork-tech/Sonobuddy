c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1a12,"])</script><script>self.__next_f.push([1,"The vertebral arteries are evaluated as part of a complete extracranial cerebrovascular assessment. Vertebral artery disease — particularly subclavian steal — is a clinically important diagnosis that ultrasound can identify directly. Here's how to approach it.\n\n## Why Evaluate the Vertebral Arteries?\n\nThe vertebral arteries (VA) supply the posterior circulation — the brainstem, cerebellum, and posterior cerebral hemispheres. Disease in the vertebral arteries or proximal subclavian arteries can cause:\n\n- **Posterior circulation TIA or stroke:** Vertigo, ataxia, visual changes, drop attacks\n- **Subclavian steal:** Reversed vertebral artery flow due to proximal subclavian artery stenosis or occlusion\n- **Vertebral artery dissection:** Neck trauma, chiropractic manipulation\n- **Vertebral artery origin stenosis**\n\n## Anatomy\n\nEach vertebral artery arises from the subclavian artery and enters the bony transverse foramina at C6, coursing superiorly through C6–C1 before entering the skull at the foramen magnum. The two VAs join at the basilar artery.\n\nThe **first segment (V1):** From the subclavian origin to the C6 entry. This is where origin stenosis occurs.\n\nThe **second segment (V2):** Within the transverse foramina — this is what you typically image with ultrasound (interforaminal segment).\n\n## Scanning Technique\n\n**Probe:** 5–12 MHz linear transducer.\n\n**Patient position:** Supine, head turned slightly away from the side being examined.\n\n### Identifying the Vertebral Artery\n\n1. Find the carotid arteries — you're already in the right neighborhood\n2. The vertebral artery lies posterior to the common carotid artery\n3. Look for the characteristic **acoustic shadowing of the transverse processes** — the C-spine vertebrae create alternating shadows like fence posts\n4. The vertebral artery runs **between** these shadows, appearing as a pulsatile vessel in the acoustic windows between the shadows\n5. The vertebral vein typically runs alongside (often visible on color Doppler)\n\n**The interforaminal segment (V2)** is what you're imaging — the windows between the transverse processes give you glimpses of the artery at each level.\n\n### Doppler Sampling\n\n- Sample in the interforaminal segment at mid-cervical level\n- Angle correction ≤ 60°\n- Get spectral waveform and color Doppler flow direction\n\n## Normal Vertebral Artery Findings\n\n**Direction:** Cephalad (toward the head) — away from the subclavian, toward the brain. This is called **antegrade** or **orthograde** flow.\n\n**Waveform:** Low resistance — similar to the internal carotid artery. Continuous forward diastolic flow reflecting the low-resistance posterior cerebral circulation.\n\n**Normal PSV:** 20–60 cm/s (lower than ICA/CCA)\n\n**Diameter:** 3–5 mm (may be asymmetric — a hypoplastic VA on one side is common)\n\n**Flow direction on color Doppler:** Should be the same color (same direction) as the adjacent carotid arteries.\n\n## Subclavian Steal\n\nSubclavian steal occurs when there is significant stenosis or occlusion of the **proximal subclavian artery** (before the vertebral artery origin). The ipsilateral arm is then perfused via retrograde flow through the vertebral artery — the vertebral \"steals\" blood from the posterior circulation to supply the arm.\n\n### Spectrum of Subclavian Steal\n\n**Pre-steal (latent):**\n- Normal antegrade flow at rest\n- Systolic deceleration notch (\"bunny ear\" pattern) — waveform transiently decelerates at peak systole\n- May become overt with arm exercise\n\n**Partial (transitional) steal:**\n- Bidirectional flow — antegrade in systole, retrograde in diastole\n- Waveform alternates above and below the baseline\n\n**Complete steal:**\n- Fully retrograde flow — opposite direction to the carotid\n- On color Doppler, the vertebral artery will be the OPPOSITE color from the carotid arteries\n\n### Provocative Testing for Latent Steal\n\nIf a bunny ear notch is seen, perform arm blood pressure cuff inflation:\n1. Inflate the arm cuff on the affected side above systolic for 2–3 minutes\n2. Release suddenly (reactive hyperemia)\n3. Observe the vertebral artery — if complete flow reversal occurs after cuff release, subclavian steal is confirmed\n\n### Clinical Significance\n\nNot all subclavian steal causes symptoms. **Hemodynamic steal** (retrograde VA flow) can be asymptomatic. **Symptomatic subclavian steal** causes symptoms with arm exercise (vertigo, visual changes, ataxia) — the exercising arm demands more blood and \"steals\" from the posterior circulation.\n\nAlways measure bilateral arm blood pressures (or note that they were measured clinically). A difference of \u003e 15–20 mmHg between arms suggests significant subclavian stenosis.\n\n## Vertebral Artery Origin Stenosis\n\nThe origin of the VA from the subclavian is the most common site of stenosis.\n\n**How to image:** The V1 segment (from subclavian to C6 entry) is technically challenging. Try a low supraclavicular approach — probe above the clavicle angled inferiorly. Optimize with color Doppler to find the subclavian and follow it to the VA origin.\n\n**Findings:** Elevated PSV at the origin (\u003e 100–120 cm/s), post-stenotic turbulence, and dampened waveforms in the V2 segment distally.\n\n## Vertebral Artery Hypoplasia\n\nA hypoplastic VA (diameter \u003c 2 mm, low velocity) is a normal variant, more common on the right. It doesn't cause steal but may contribute to posterior circulation insufficiency in some patients.\n\n**Distinguish from occlusion:** A hypoplastic VA has flow (slow, low-volume). An occluded VA has no flow.\n\n## Key Images to Capture\n\n1. Right and left vertebral arteries — color Doppler showing flow direction\n2. Spectral waveform with angle-corrected velocity\n3. Flow direction clearly demonstrated (cephalad = antegrade = normal)\n4. If steal: waveform showing reversal or bidirectional flow\n5. Arm blood pressure discrepancy (noted in report)\n\n## Reporting Language\n\n- \"Bilateral vertebral arteries patent with antegrade flow. PSV right 38 cm/s, left 42 cm/s. Normal low-resistance waveforms. No evidence of subclavian steal.\"\n- \"Left vertebral artery demonstrates complete reversal of flow (retrograde). Left arm systolic blood pressure 80 mmHg, right 138 mmHg — consistent with left subclavian steal. Retrograde flow confirmed with arm cuff provocation test.\"\n- \"Right vertebral artery: bunny-ear notch pattern on spectral Doppler — consistent with pre-steal physiology. Partial flow reversal demonstrated with arm cuff provocation. Findings suggest significant right proximal subclavian artery disease.\"\n\n---\n\n*SonoBuddy's carotid/vertebral protocol includes vertebral artery evaluation steps and normal Doppler values.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"vertebral-artery-subclavian-steal-protocol\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"vertebral-artery-subclavian-steal-protocol\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"vertebral-artery-subclavian-steal-protocol\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"vertebral-artery-subclavian-steal-protocol\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"vertebral-artery-subclavian-steal-protocol\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"vertebral-artery-subclavian-steal-protocol\",\"title\":\"Vertebral Artery Ultrasound and Subclavian Steal: Protocol and Findings\",\"da
