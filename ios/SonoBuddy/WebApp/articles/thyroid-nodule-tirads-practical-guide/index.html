c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1a20,"])</script><script>self.__next_f.push([1,"Thyroid nodules are extremely common — found in up to 67% of adults on ultrasound. The vast majority are benign. The challenge is identifying the small subset that requires biopsy. The ACR TI-RADS (Thyroid Imaging Reporting and Data System) 2017 provides a structured scoring system to guide this decision. Here's how to apply it in practice.\n\n## Normal Thyroid Measurements\n\nBefore evaluating nodules, know what normal looks like:\n\n| Parameter | Normal Value |\n|---|---|\n| Lobe length | 4–6 cm |\n| Lobe width | 1.5–2.5 cm |\n| Lobe AP | 1.5–2.5 cm |\n| Isthmus thickness (AP) | ≤ 5 mm |\n| Echogenicity | Homogeneously hyperechoic (brighter than adjacent muscles) |\n\n**Thyroid volume** = 0.524 × (length × width × height) for each lobe, summed.\n- Normal: 4–20 mL (women), 4–25 mL (men)\n\n## ACR TI-RADS Scoring System (2017)\n\nThe ACR TI-RADS assigns points in five categories. Total points determine the TI-RADS level and biopsy recommendation.\n\n### Category 1: Composition\n\n| Finding | Points |\n|---|---|\n| Cystic or almost completely cystic | 0 |\n| Spongiform | 0 |\n| Mixed cystic and solid | 1 |\n| Solid or almost completely solid | 2 |\n\n**Spongiform:** Composed of tiny cystic spaces (\u003e 50% of volume). Think \"sponge.\" Strongly suggests benign colloid nodule.\n\n### Category 2: Echogenicity\n\n| Finding | Points |\n|---|---|\n| Anechoic | 0 |\n| Hyperechoic or isoechoic | 1 |\n| Hypoechoic | 2 |\n| Very hypoechoic | 3 |\n\nCompare the nodule to adjacent strap muscles. \"Very hypoechoic\" = darker than the surrounding muscles. This is a significant finding associated with malignancy.\n\n### Category 3: Shape\n\n| Finding | Points |\n|---|---|\n| Wider than tall | 0 |\n| Taller than wide | 3 |\n\n\"Taller than wide\" = the longest axis of the nodule is in the anteroposterior direction (perpendicular to the transducer surface). This is a strong predictor of malignancy (grows across tissue planes).\n\n**Measure in the transverse plane:** Compare height (AP dimension) to width (transverse dimension). If height \u003e width = taller than wide.\n\n### Category 4: Margin\n\n| Finding | Points |\n|---|---|\n| Smooth | 0 |\n| Ill-defined | 0 |\n| Lobulated or irregular | 2 |\n| Extra-thyroidal extension | 3 |\n\n**Lobulated:** Small bumps along the margin.\n**Irregular:** Angular, spiculated, or not smooth.\n**Extra-thyroidal extension:** Nodule breaks through the thyroid capsule into adjacent structures. High suspicion for malignancy.\n\n**Ill-defined margins:** Paradoxically, ill-defined (not sharply demarcated) margins score 0 — the concern is for clearly lobulated or irregular margins, not simply the inability to define the border.\n\n### Category 5: Echogenic Foci\n\nChoose all that apply (add points for each):\n\n| Finding | Points |\n|---|---|\n| None or large comet-tail artifacts | 0 |\n| Macrocalcifications | 1 |\n| Peripheral (rim) calcifications | 2 |\n| Punctate echogenic foci | 3 |\n\n**Large comet-tail artifacts:** V-shaped reverberation artifacts behind bright foci — represent colloid crystals. These are benign. Score 0.\n\n**Macrocalcifications:** Large echogenic foci with clean posterior shadowing. Associated with both benign (dystrophic) and malignant (papillary thyroid cancer) processes.\n\n**Peripheral (rim) calcifications:** Echogenic line along the nodule periphery. Eggshell or discontinuous rim calcification (especially with soft tissue extending through it) is more concerning.\n\n**Punctate echogenic foci:** Tiny bright dots without comet-tail artifact. These represent microcalcifications — the pathological hallmark of papillary thyroid carcinoma. High specificity for malignancy. Score 3.\n\n## TI-RADS Levels and Recommendations\n\n| Total Points | TI-RADS Level | Biopsy Threshold |\n|---|---|---|\n| 0 | TR1 (Benign) | No biopsy |\n| 2 | TR2 (Not suspicious) | No biopsy |\n| 3 | TR3 (Mildly suspicious) | FNA if ≥ 2.5 cm; Follow if ≥ 1.5 cm |\n| 4–6 | TR4 (Moderately suspicious) | FNA if ≥ 1.5 cm; Follow if ≥ 1.0 cm |\n| ≥ 7 | TR5 (Highly suspicious) | FNA if ≥ 1.0 cm; Follow if ≥ 0.5 cm |\n\n**FNA:** Fine-needle aspiration biopsy\n**Follow:** Ultrasound surveillance without immediate biopsy\n\n**How to measure the nodule:** Three perpendicular dimensions in two planes. Use the largest dimension for the size threshold decision.\n\n## Scanning Protocol for Thyroid Nodule Evaluation\n\n**Probe:** 10–15 MHz linear transducer\n\n**Systematic scanning:**\n1. Isthmus: transverse and sagittal\n2. Right lobe: transverse (apex to base) and sagittal; measure dimensions\n3. Left lobe: same\n4. Each nodule: describe and measure in transverse and sagittal\n\n**For each nodule, document:**\n- Location: right lobe / left lobe / isthmus; upper/mid/lower pole\n- Size: three dimensions (length × width × height)\n- Composition\n- Echogenicity\n- Shape\n- Margin\n- Echogenic foci\n- Vascularity on color Doppler (peripheral vs central — not a TI-RADS criterion but worth noting)\n\n**Color Doppler:** Document vascularity pattern. Primarily an adjunct finding — intense internal vascularity can be seen in malignancy but also in hypervascular benign nodules (toxic adenoma). Not included in TI-RADS scoring.\n\n## Lymph Node Evaluation\n\nAlways evaluate the cervical lymph nodes, particularly:\n- Level VI (central compartment — between the carotids)\n- Level III and IV (along the jugular chain)\n\n**Suspicious lymph node features:**\n- Loss of fatty hilum\n- Round shape (short axis \u003e 5 mm)\n- Cystic change within the node\n- Microcalcifications within the node\n- Peripheral vascularity\n\nIn the context of a suspicious thyroid nodule, abnormal cervical nodes raise concern for regional metastasis.\n\n## Common Mistakes in TI-RADS Scoring\n\n**Confusing comet-tail artifacts with microcalcifications:** Comet-tail = V-shaped, behind the echogenic focus. Microcalcifications = punctate bright dots, no reverberation behind them. One scores 0, the other scores 3. This distinction matters enormously.\n\n**Not measuring in the correct plane for taller-than-wide:** Shape must be assessed in the transverse plane. If you measure in sagittal, the shape assessment will be wrong.\n\n**Missing extra-thyroidal extension:** Look carefully at the thyroid capsule around any suspicious nodule. Capsular irregularity or obvious extension beyond it adds 3 points and is clinically significant.\n\n**Counting each feature separately for echogenic foci:** The scoring says \"choose all that apply\" for echogenic foci — if a nodule has both macrocalcifications and microcalcifications, score both (1 + 3 = 4 points from that category alone).\n\n---\n\n*SonoBuddy's TI-RADS scoring guide and normal thyroid measurements are in the Measurements and Pathologies sections — search \"thyroid\" for quick reference.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"thyroid-nodule-tirads-practical-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"thyroid-nodule-tirads-practical-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"thyroid-nodule-tirads-practical-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"thyroid-nodule-tirads-practical-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"thyroid-nodule-tirads-practical-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"thyroid-nodule-tirads-practical-guide\",\"title\":\"Thyroid Nodules and ACR TI-RADS: A Practical Sonographe
