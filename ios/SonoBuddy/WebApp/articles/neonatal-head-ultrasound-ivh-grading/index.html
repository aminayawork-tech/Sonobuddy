c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1eba,"])</script><script>self.__next_f.push([1,"Neonatal head ultrasound is a specialized skill often performed at the bedside in the NICU. The premature brain is fragile and at high risk for hemorrhage and ischemic injury. Your images directly guide decisions about management and prognosis in some of the most vulnerable patients.\n\n## When Is Neonatal Head Ultrasound Performed?\n\n- **Routine screening:** All infants ≤ 30 weeks gestational age — typically at 7–14 days of life and 36–40 weeks corrected gestational age\n- **Symptomatic infants:** Apnea, seizure, acute neurologic deterioration, drop in hematocrit\n- **Follow-up:** After documented IVH — monitor for progression, hydrocephalus, cystic evolution\n\n## Why Ultrasound (Not CT)?\n\n- No radiation (critical for the developing brain)\n- Portable — comes to the NICU bedside\n- The fontanelles provide acoustic windows that CT cannot exploit\n- Highly sensitive for hemorrhage and ventricular size in this age group\n\n---\n\n## Anatomy and Acoustic Windows\n\n### Anterior Fontanelle (Primary Window)\n\nThe **anterior fontanelle** (bregma) is the main acoustic window. It's located at the junction of the coronal and sagittal sutures — the diamond-shaped soft spot at the top of the head. It closes between 9–18 months.\n\n**Probe:** 5–8 MHz sector/curved probe (small footprint). Some labs use a high-frequency linear probe for supplemental views.\n\n### Posterior Fontanelle (Secondary Window)\n\nThe **posterior fontanelle** (lambda) is smaller, at the junction of the sagittal and lambdoid sutures. It closes by 2–3 months. Useful for:\n- Posterior fossa evaluation (cerebellum)\n- Supplemental views of occipital lobes\n\n### Mastoid Fontanelle\n\nLateral window — useful for posterior fossa and temporal lobe views when available.\n\n---\n\n## Scanning Protocol\n\n### Coronal Planes (Anterior Fontanelle)\n\nFrom the anterior fontanelle, angle the probe forward (toward the face) to backward (toward the occiput) to obtain a series of coronal planes.\n\n**Standard coronal planes (6 views):**\n\n1. **Frontal** — anterior to the frontal horns: frontal lobes, interhemispheric fissure\n2. **Frontal horns** — through the frontal horns of the lateral ventricles: caudothalamic groove (where IVH begins), frontal horns, corpus callosum\n3. **Foramen of Monro** — third ventricle, thalami, choroid plexus\n4. **Trigones / atria** — body and atria of lateral ventricles, choroid plexus, periventricular white matter\n5. **Posterior horns** — occipital horns, periventricular regions\n6. **Parieto-occipital** — far posterior, occipital lobes\n\n### Sagittal Planes (Anterior Fontanelle)\n\nRotate the probe 90° for sagittal views. Angle left and right to sweep through the brain.\n\n**Standard sagittal planes:**\n\n1. **Midline sagittal** — corpus callosum, third ventricle, cerebral aqueduct, fourth ventricle, cerebellar vermis, cavum septi pellucidi\n2. **Right parasagittal** — body of lateral ventricle, caudothalamic groove, choroid plexus, caudate nucleus\n3. **Left parasagittal** — same for left side\n4. **Right temporal** — temporal horn, Sylvian fissure\n5. **Left temporal** — same for left side\n\n### Posterior Fontanelle / Mastoid Views\n\nPosterior coronal views of the cerebellum, fourth ventricle, posterior fossa.\n\n---\n\n## Normal Neonatal Brain Landmarks\n\n**Germinal matrix:** Present only in premature infants — the subependymal zone at the **caudothalamic groove** (junction of caudate nucleus and thalamus, adjacent to the floor of the frontal horn). This is where IVH originates. It appears as a small echogenic nub at the caudothalamic groove.\n\n**Choroid plexus:** Fills the lateral ventricles posteriorly — highly echogenic, irregular, \"cauliflower\" appearance in the trigones. Extends into the roof of the third ventricle.\n\n**Corpus callosum:** Thin echogenic band spanning the midline on sagittal view.\n\n**Cavum septi pellucidi:** Normal fluid-filled space between the leaves of the septum pellucidum — present in premature infants (usually closes by 6 months).\n\n**Periventricular white matter:** Should be homogeneous, slightly echogenic relative to cortex.\n\n---\n\n## Intraventricular Hemorrhage (IVH) — Grading\n\nThe Papile grading system (modified) is the standard:\n\n| Grade | Description |\n|---|---|\n| Grade I | Subependymal hemorrhage (germinal matrix) — does NOT extend into ventricle |\n| Grade II | IVH without ventricular dilation — blood in ventricle, no hydrocephalus |\n| Grade III | IVH WITH ventricular dilation (hydrocephalus) |\n| Grade IV | Periventricular hemorrhagic infarction (PVHI) — parenchymal involvement; formerly called \"Grade IV IVH\" but now recognized as infarction, not extension of IVH |\n\n**Sonographic appearance of IVH:**\n- Subependymal: echogenic nub at the caudothalamic groove, larger than the normal germinal matrix remnant\n- Intraventricular: echogenic material filling the ventricle (acute blood is brightly echogenic)\n- Dilated ventricles: measure ventricular index (frontal horn width at level of foramen of Monro)\n\n**Ventricular index (VI) measurement:** Width of the lateral ventricle measured from the midline to the lateral wall at the level of the foramen of Monro on the coronal view. Normal values are gestational-age-dependent (Levene's nomogram).\n\n**Grade I** is benign — nearly all resolve without sequelae. **Grade III–IV** carries higher risk of neurodevelopmental impairment; **PVHI** has the worst prognosis.\n\n---\n\n## Periventricular Leukomalacia (PVL)\n\nPVL is ischemic white matter injury in the premature brain — injury to periventricular white matter due to hypoxia-ischemia.\n\n**Acute phase (0–1 week):**\n- Increased echogenicity in periventricular white matter (bilateral, usually symmetric)\n- Compare to normal: white matter should be less echogenic than choroid plexus\n- A common pitfall: normal periventricular \"blush\" can mimic PVL — look for abnormal echogenicity that persists and is ≥ choroid plexus brightness\n\n**Subacute / chronic phase (2–6 weeks):**\n- Echogenicity may transiently normalize\n- Later: cystic PVL develops — periventricular cysts (anechoic, non-vascular) in the white matter\n- Cystic PVL = strong predictor of cerebral palsy (particularly spastic diplegia)\n\n---\n\n## Hydrocephalus: Monitoring\n\nSerial measurements of the ventricular index track progressive dilation after IVH.\n\n**Levene's ventricular index:**\n- Measure at the level of the foramen of Monro in the coronal plane\n- Compare to age-corrected nomogram\n- Progressive dilation \u003e 97th percentile warrants neurosurgical consultation\n\nAlso document:\n- Third ventricle width (normal \u003c 3 mm in term)\n- Torcular-choroid plexus distance in occipital horn\n\n---\n\n## Key Images to Capture\n\n**Coronal:** 6 standard planes as described above\n**Sagittal:** Midline, bilateral parasagittal, temporal views\n**Posterior fontanelle:** Posterior fossa views\n\n**Always measure:**\n- Ventricular index bilaterally (coronal, at foramen of Monro)\n- Any focal lesion — size, location, echogenicity\n\n---\n\n## Reporting Language\n\n**Normal:**\n\"Anterior fontanelle scan: normal brain parenchyma with homogeneous echogenicity. Germinal matrix within expected limits. No subependymal or intraventricular hemorrhage identified. Lateral, third, and fourth ventricles are of normal size for gestational age. Corpus callosum intact. No periventricular cystic change.\"\n\n**Grade III IVH:**\n\"Bilateral intraventricular hemorrhage with associated ventricular dilation. Echogenic blood fills the frontal horns and bodies of the lateral ventricles bilaterally. Ventricular index: right 15.2 mm, left 15.6 mm (above 97th percentile for corrected gestational age of 30 weeks). No periventricular extension. Grade III IVH bilaterally. Neurosurgical consultation recommended. Repeat imaging in 1 week.\"\n\n---\n\n*SonoBuddy's pediatric protocols include neonatal head, pyloric stenosis, and hip dysplasia guides.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"neonatal-head-ultrasound-ivh-grading\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"neonatal-head-ultrasound-ivh-grading\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"neonatal-head-ultrasound-ivh-grading\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"neonatal-head-ultrasound-ivh-grading\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"neonatal-head-ultrasound-ivh-grading\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"neonatal-head-ultrasound-ivh-grading\",\"title\":\"Neonatal Head Ultrasound: IVH Grading, Fontanelle Windows, and Technique\",\"date\":\"2026-09-07\",\"excerpt\":\"How to scan the neonatal brain through the fontanelles, grade intraventricular hemorrhage, recognize periventricular leukomalacia, and document findings accurately in the premature infant.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"pediatric\",\"neonatal\",\"brain\",\"IVH\",\"NICU\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"hip-dysplasia-ultrasound-graf-method\",\"title\":\"Infant Hip Dysplasia Ultrasound: Graf Method Explained\",\"excerpt\":\"How to perform infant hip ultrasound using the Graf method — correct coronal plane, alpha and beta angle measurement, Graf classification, and what each type means clinically.\",\"date\":\"2026-08-12\"},{\"slug\":\"pyloric-stenosis-ultrasound-protocol\",\"title\":\"Pyloric Stenosis Ultrasound: Diagnosis Criteria and Scanning Technique\",
