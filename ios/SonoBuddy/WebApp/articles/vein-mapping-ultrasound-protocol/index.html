c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T206e,"])</script><script>self.__next_f.push([1,"Vein mapping is a study performed entirely for someone else. The surgeon is going to make an operative decision from your report, often without repeating the scan, so the value of the examination lies in how completely and precisely you document what you found — not in reaching a diagnosis.\n\nTwo distinct indications share the same technique: mapping upper limb vessels before creating dialysis access, and mapping the great saphenous vein as a conduit for arterial bypass.\n\n---\n\n## Universal Technique Points\n\n**Warm the room and the limb.** This is not a comfort measure — it is the single biggest determinant of measurement accuracy. A cold limb vasoconstricts, and veins that measure 1.8 mm in a cold room may measure 3.0 mm when warm. That difference decides whether a fistula gets created. If the patient arrives cold, warm the limb with a blanket or warm packs for ten to fifteen minutes before scanning.\n\n**Probe:** High-frequency linear, 7–15 MHz.\n\n**Light probe pressure.** Veins collapse under almost no pressure. Use plenty of gel and rest the probe on the gel layer rather than on the skin. Excessive pressure is the second most common cause of falsely small measurements.\n\n**Measure in transverse**, inner wall to inner wall, at the point of maximum diameter.\n\n**Use a tourniquet** for venous distension, applied proximally.\n\n---\n\n## Upper Limb Mapping for Dialysis Access\n\n### What the Surgeon Needs\n\nAccess creation follows a preference hierarchy — distal before proximal, autogenous fistula before graft, non-dominant arm before dominant. Your map determines where on that hierarchy the patient can start.\n\n**Scan both arms** unless directed otherwise, and always document which arm is dominant.\n\n### Venous Assessment\n\n**Cephalic vein:** Map from the wrist, along the radial forearm, through the antecubital fossa, up the lateral upper arm to its junction with the axillary vein.\n\n**Basilic vein:** Map from the medial forearm up the medial upper arm.\n\n**At each level, record:**\n\n- **Diameter** with tourniquet applied — at wrist, mid-forearm, antecubital fossa, mid-upper arm, and proximal upper arm\n- **Depth** from skin surface\n- **Compressibility** — confirming patency\n- **Continuity** — segments of sclerosis, prior cannulation damage, or thrombosis\n- **Duplications and major tributaries**\n\n### Diameter Criteria\n\nThresholds vary between surgeons and guidelines, but as a general guide:\n\n| Vessel | Minimum for access creation |\n|---|---|\n| Cephalic vein | ≥ 2.5 mm (some accept 2.0 mm) |\n| Basilic vein | ≥ 3.0 mm for transposition |\n| Inflow artery | ≥ 2.0 mm |\n\n**Depth matters as much as diameter.** A vein deeper than about 6 mm from the skin is difficult to cannulate reliably and may need superficialization even after it matures. Report depth at every level.\n\n### Arterial Assessment\n\nDo not skip this — a fistula needs adequate inflow, and inadequate arterial supply is a common cause of failure.\n\n- **Radial artery** at the wrist: diameter and spectral waveform\n- **Brachial artery**: diameter and waveform\n- **Assess for calcification**, which is common in diabetic and dialysis patients and can preclude a distal fistula\n- **Waveform character:** the normal resting upper limb arterial waveform is triphasic. A monophasic waveform suggests proximal disease.\n\n**Allen test or digital assessment** may be requested to confirm adequate palmar arch collateral supply before radial artery sacrifice.\n\n### Central Veins\n\nAssess the subclavian and, as far as accessible, brachiocephalic veins. **Look at the waveform**: loss of respiratory phasicity or cardiac pulsatility suggests central stenosis, which would compromise any access created downstream.\n\n**This is critical in patients with prior central venous catheters, pacemakers, or defibrillator leads** — central stenosis is common in this group and creating access into an obstructed outflow produces a swollen, unusable arm.\n\n---\n\n## Great Saphenous Vein Mapping for Bypass\n\n### Why It Is Done\n\nThe great saphenous vein is the preferred conduit for infrainguinal arterial bypass and for coronary grafting. Autogenous vein substantially outperforms prosthetic graft in patency, so establishing whether usable vein exists — and where — is worth doing carefully.\n\n### Position\n\n**Reverse Trendelenburg, or the patient standing or sitting with the leg dependent.** Gravity distends the vein and gives realistic measurements. A GSV mapped supine will measure smaller than the same vein mapped dependent, and the supine measurement may wrongly exclude a usable conduit.\n\n### Technique\n\nMap the GSV from the **saphenofemoral junction** in the groin, down the medial thigh, past the knee, along the medial calf to the ankle.\n\n**Mark the skin** at intervals as you go, if your surgeon uses skin marking — many do, and it saves considerable operative time.\n\n**At each level record:**\n\n- **Diameter** — at SFJ, proximal thigh, mid-thigh, distal thigh, knee, proximal calf, mid-calf, distal calf\n- **Depth** from skin\n- **Patency and compressibility**\n- **Wall thickening or sclerosis** from prior thrombophlebitis\n- **Duplicated systems** — common and useful, since a duplicated GSV may offer two conduits\n- **Varicosities** — dilated, tortuous segments are generally unusable\n- **Prior harvest or stripping** — check for surgical scars and absent segments\n\n### Diameter Criteria\n\n| GSV diameter | Suitability as conduit |\n|---|---|\n| \u003c 2.0 mm | Generally unsuitable |\n| 2.0–2.5 mm | Marginal |\n| ≥ 2.5–3.0 mm | Generally acceptable |\n| \u003e 3.0 mm | Good conduit |\n\n**Report the diameter profile along the whole length**, not a single number. A vein that is 4 mm in the thigh and 1.8 mm in the calf still yields a usable thigh segment, and the surgeon needs to know exactly where the usable portion begins and ends.\n\n### Alternative Conduits\n\nIf the GSV is inadequate, map the alternatives before the surgeon asks:\n\n- **Small saphenous vein** — posterior calf, patient prone\n- **Contralateral GSV**\n- **Upper limb veins** — cephalic and basilic, which can be harvested as conduit\n\n---\n\n## Common Pitfalls\n\n**Cold limb.** Worth stating twice. It is the commonest reason a mappable vein is reported as unusable.\n\n**Excessive probe pressure.** Rest on gel, not skin.\n\n**Measuring without a tourniquet** in the upper limb, or supine in the lower limb — both systematically underestimate.\n\n**Missing duplication.** A duplicated system can double available conduit or explain why a fistula has competing outflow.\n\n**Not documenting depth.** Diameter alone does not tell the surgeon whether a fistula will be cannulable.\n\n**Forgetting the arteries** in an access map. A perfect vein with a calcified, monophasic inflow artery is not a workable fistula.\n\n**Vague reporting.** \"Cephalic vein adequate\" is not usable. Give numbers at defined levels.\n\n---\n\n## Key Images to Capture\n\n**Upper limb access mapping:**\n\n1. Cephalic vein transverse with diameter and depth at wrist, forearm, antecubital fossa, upper arm\n2. Basilic vein transverse with diameter and depth at forearm and upper arm\n3. Radial and brachial artery diameters with spectral waveforms\n4. Subclavian vein waveform, both sides\n5. Any sclerosed, thrombosed, or duplicated segment\n\n**GSV mapping:**\n\n1. Saphenofemoral junction with diameter\n2. Serial diameters at defined thigh and calf levels\n3. Depth at each level\n4. Any varicose, sclerosed, or absent segment\n5. Alternative conduit if GSV inadequate\n\n---\n\n## Reporting Language\n\n\"Non-dominant left arm. Cephalic vein patent and compressible throughout. Diameters with tourniquet: wrist 2.1 mm (depth 3 mm), mid-forearm 2.8 mm (depth 4 mm), antecubital fossa 4.2 mm (depth 5 mm), mid-upper arm 4.6 mm (depth 7 mm). No sclerosis or duplication. Basilic vein 4.9 mm in the mid-upper arm at 11 mm depth. Radial artery 2.3 mm at the wrist with a triphasic waveform and no significant calcification. Brachial artery 4.4 mm, triphasic. Left subclavian vein shows normal respiratory phasicity. Findings suitable for consideration of a radiocephalic fistula, with brachiocephalic as an alternative. Note cephalic vein depth of 7 mm in the upper arm.\"\n\n---\n\n*SonoBuddy keeps vessel diameter criteria and vascular protocols available offline — in the lab or at the bedside.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"vein-mapping-ultrasound-protocol\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"vein-mapping-ultrasound-protocol\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"vein-mapping-ultrasound-protocol\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"vein-mapping-ultrasound-protocol\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"vein-mapping-ultrasound-protocol\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"vein-mapping-ultrasound-protocol\",\"title\":\"Vein Mapping: Preoperative Assessment for Dialysis Access and Bypass Conduit\",\"date\":\"2026-08-29\",\"excerpt\":\"How to map upper limb veins for AV fistula creation and the great saphenous vein for arterial bypass — diameter and depth criteria, tourniquet technique, and the findings surgeons actually need.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"vascular\",\"vein mapping\",\"dialysis access\",\"bypass\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug
