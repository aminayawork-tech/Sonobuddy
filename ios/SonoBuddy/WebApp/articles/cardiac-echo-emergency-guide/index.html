c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1b02,"])</script><script>self.__next_f.push([1,"Cardiac ultrasound in emergency settings saves lives — and sonographers who understand what they're looking at can communicate findings faster and more accurately. Whether you work in a general hospital where you occasionally image the heart, or you assist with echocardiography regularly, knowing the basics of pericardial effusion, tamponade, and focused cardiac assessment is essential.\n\n## Pericardial Effusion: What It Is and What to Look For\n\nThe pericardium is a fibrous sac surrounding the heart. Normally it contains 15–50 mL of fluid. When fluid accumulates abnormally, it's called a pericardial effusion.\n\n**Causes:**\n- Viral pericarditis (most common)\n- Post-cardiac surgery or catheterization\n- Malignancy (breast, lung, lymphoma — most common cancers)\n- Uremia (end-stage renal disease)\n- Autoimmune disease (lupus, rheumatoid arthritis)\n- Hypothyroidism\n- Trauma\n- Aortic dissection (hemopericardium — emergency)\n\n**Sonographic appearance:**\nPericardial fluid appears as an anechoic (or complex) space between the epicardium (moving heart surface) and the pericardium (outer fixed sac).\n\n**Key distinction:** The pericardial space is *posterior* and *lateral* to the left ventricle. Differentiate from pleural effusion (which extends behind the descending thoracic aorta in the parasternal long-axis view — effusion posterior to the descending aorta = pleural, not pericardial).\n\n## Grading Pericardial Effusion by Size\n\n| Grade | Size | Echo-free Space |\n|---|---|---|\n| Small | \u003c 100 mL | \u003c 10 mm (seen only posteriorly, diastole only) |\n| Moderate | 100–500 mL | 10–20 mm (circumferential) |\n| Large | \u003e 500 mL | \u003e 20 mm (circumferential, with heart swinging) |\n\n**Circumferential:** Fluid surrounds the entire heart, visible both anteriorly (between RV free wall and chest) and posteriorly.\n\n**\"Swinging heart\":** In large effusions, the heart swings pendulum-like within the pericardial fluid on each beat. This is associated with electrical alternans on ECG and strongly suggests tamponade physiology.\n\n## Cardiac Tamponade\n\nTamponade occurs when pericardial fluid pressure exceeds cardiac filling pressure, impairing cardiac output. It's a clinical diagnosis — but echocardiography provides the definitive imaging evidence.\n\n**The physiology:** As fluid accumulates, pericardial pressure rises. When pericardial pressure exceeds the filling pressure of the low-pressure right-sided chambers, the right atrium and right ventricle collapse during diastole (when filling pressure is lowest). When right-sided collapse is prolonged, it causes tamponade physiology.\n\n### Echocardiographic Signs of Tamponade\n\n**Right atrial diastolic collapse:**\n- The right atrial free wall inverts (collapses inward) during ventricular systole\n- Lasts for more than 1/3 of systole = hemodynamic significance\n- Most sensitive sign of tamponade\n\n**Right ventricular diastolic collapse:**\n- The RVOT (right ventricular outflow tract) or RV free wall inverts during diastole\n- Very specific for tamponade — if you see this, communicate urgently\n- Best seen in parasternal long-axis or subcostal views\n\n**IVC plethora:**\n- IVC is dilated (\u003e 2.1 cm) and shows \u003c 50% collapse with inspiration\n- Suggests elevated right atrial pressure (inability to decompress)\n- Non-specific but supports tamponade in context\n\n**Respiratory variation in transvalvular flow (Doppler):**\n- Mitral inflow decreases \u003e 25% with inspiration (opposite on tricuspid)\n- The \"pulsus paradoxus\" on Doppler — loss of the normal mitral inflow dominance\n- This is the Doppler confirmation of pulsus paradoxus seen clinically\n\n### What Is Not Tamponade\n\n**Effusion without hemodynamic compromise:** A large effusion without RV collapse, without IVC plethora, and with normal cardiac function is not tamponade. The rate of accumulation matters more than size — a slowly developing 1 L effusion may be tolerated better than a rapidly developing 200 mL effusion (e.g., after cardiac surgery or trauma).\n\n## Standard Echocardiographic Views\n\nFor any cardiac study, these are the core views:\n\n**Parasternal Long Axis (PLAX):**\n- Probe at the left sternal border, 2nd–4th intercostal space\n- Shows: LV outflow tract, aortic root, mitral valve, posterior pericardium\n- Best view for: pericardial effusion (posterior), aortic root dilation, LV function qualitative\n\n**Parasternal Short Axis (PSAX):**\n- Rotate 90° from PLAX\n- Shows: levels from base (aortic valve \"Mercedes\" sign) to mid (papillary muscles) to apex\n- Best view for: RV size relative to LV (RV \u003e LV at mid level = RV pressure overload), wall motion\n\n**Apical 4-Chamber:**\n- Probe at the cardiac apex\n- Shows: all four chambers simultaneously\n- Best view for: chamber size comparison, LV global function, tricuspid and mitral inflow Doppler\n\n**Subcostal (Subxiphoid):**\n- Probe below xiphoid, angled toward left shoulder\n- Shows: all four chambers (sometimes clearer than apical in obese patients or post-CABG)\n- Best view for: pericardial effusion (especially anteriorly), IVC evaluation\n\n**IVC (Subcostal Long Axis):**\n- From subcostal, rotate probe to show IVC entering right atrium\n- Measure IVC diameter 2 cm from the hepatocaval junction\n- Assess respiratory collapse with sniff or inspiration\n\n## Communicating Cardiac Findings\n\nWhen you see any of the following, communicate directly and promptly to the clinical team:\n\n- RV diastolic collapse (tamponade physiology)\n- Large pericardial effusion without prior documentation\n- Significantly impaired LV function (globally reduced wall motion)\n- New wall motion abnormality (may indicate acute MI)\n- Aortic dissection flap in the root\n\nFor tamponade specifically: **This is a medical emergency.** Pericardiocentesis may be lifesaving. Your communication can make the difference.\n\n## Focused Cardiac Ultrasound (FOCUS / POCUS)\n\nFOCUS is a limited bedside assessment asking specific binary questions:\n1. Is there a pericardial effusion? (Yes/No)\n2. Is LV function grossly normal or depressed?\n3. Is there RV dilation?\n4. Is the IVC plethoric?\n5. Is there a pleural effusion?\n\nFOCUS is performed by emergency physicians and intensivists, often with sonographer assistance. As a sonographer, your role is to obtain quality images quickly — the physician interprets in real time.\n\nStandard FOCUS views: subcostal, parasternal long axis, apical 4-chamber, and IVC.\n\n## Normal Echo Measurements Quick Reference\n\n| Parameter | Normal |\n|---|---|\n| LV end-diastolic diameter | 3.9–5.3 cm (women), 4.2–5.8 cm (men) |\n| LV end-systolic diameter | 2.1–3.7 cm (women), 2.5–4.0 cm (men) |\n| LVEF (visual) | ≥ 55% |\n| Aortic root | ≤ 3.7 cm at sinuses |\n| IVC (normal) | \u003c 2.1 cm, \u003e 50% collapse with inspiration |\n| Pericardial fluid | \u003c 10 mm (systole only, posterior) |\n\n---\n\n*SonoBuddy's Measurements tab includes cardiac reference values — search \"aortic root,\" \"LV,\" or \"IVC\" for quick bedside reference.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"cardiac-echo-emergency-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"cardiac-echo-emergency-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"cardiac-echo-emergency-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"cardiac-echo-emergency-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"cardiac-echo-eme
