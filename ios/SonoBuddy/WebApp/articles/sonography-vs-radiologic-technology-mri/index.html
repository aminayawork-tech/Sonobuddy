c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:Tdc8,"])</script><script>self.__next_f.push([1,"Sonography, radiologic technology (X-ray), and MRI are the three imaging careers people compare most. They share a department, but the work, pay, and training are quite different.\n\n![Sonography vs X-ray vs MRI](/blog/career/sonography-vs-radtech-mri.svg \"Imaging careers compared|SonoBuddy. Median pay: U.S. Bureau of Labor Statistics, May 2024\")\n\n## Which Pays Better?\n\nBLS median pay, May 2024:\n\n| Career | Median annual pay |\n|---|---|\n| **Diagnostic medical sonographers** | **$89,340** |\n| **MRI technologists** | **$88,180** |\n| **Radiologic technologists (X-ray)** | **$77,660** |\n\n**Sonography and MRI pay roughly the same** at the median, and both pay more than general radiography. In all three, specialty, location, and shifts can move pay well above the median.\n\n## How You Get In\n\n- **Radiologic technology:** usually a 2-year associate degree, then the **ARRT** radiography exam. It's often the most accessible entry point to imaging.\n- **MRI:** many MRI techs start as X-ray techs and add MRI as a **post-primary** credential through ARRT. Some programs train MRI directly, with certification through ARRT or ARMRIT.\n- **Sonography:** a 2-year associate or 4-year bachelor's program, or a **12–18 month certificate** if you already have a healthcare degree. Registry is through **ARDMS** (or CCI for cardiac), starting with the SPI physics exam.\n\n## What the Work Is Like\n\n### Sonography\nYou **create the images yourself**, in real time, by hand. Image quality depends heavily on your skill, and you're often the first to see the findings. Exams are long and one-on-one, which is great for patient connection but **physically demanding** on your arm, shoulder, and back.\n\n### X-ray\n**Fast-paced and high volume.** You position patients, set technique, and take images in minutes, then move to the next. There's a lot of variety: ER, OR, portables, and fluoroscopy. You'll do more **lifting and positioning** of patients.\n\n### MRI\n**Longer, protocol-driven exams.** Much of the work is screening patients for metal and implants, positioning them, and running sequences from the console. It's **less physically strenuous** than sonography, but it demands strict attention to **magnet safety**.\n\n## Radiation and Safety\n\n- **Sonography:** no ionizing radiation. The main occupational risk is **musculoskeletal strain**.\n- **X-ray and CT:** ionizing radiation, controlled with shielding, distance, and dosimetry badges.\n- **MRI:** no ionizing radiation, but a **powerful magnet**. Screening for metal is a constant, critical safety task.\n\n## Which Should You Choose?\n\n- **Choose sonography** if you love anatomy, want hands-on control of the images, and enjoy one-on-one time with patients.\n- **Choose X-ray** if you want the quickest path into imaging, like a fast pace, and might add CT, MRI, or mammography later.\n- **Choose MRI** if you like technical, protocol-driven work, want less physical strain, and are comfortable with safety-critical screening.\n\n**Is sonography better than MRI?** Neither is better overall. Pay is about the same; the deciding factor is whether you'd rather **scan by hand** or **run the scanner**. Shadow both.\n\n## The Bottom Line\n\nSonography and MRI pay about the same, and both pay more than X-ray at the median. X-ray is the most common entry point. Sonography is the most hands-on and skill-dependent. MRI is the least physically demanding. Choose the daily work you'd enjoy, not just the paycheck.\n\n*Salary figures are BLS national medians for May 2024; local pay varies widely.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"sonography-vs-radiologic-technology-mri\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"
