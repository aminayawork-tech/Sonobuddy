c/chunks/app/(app)/layout-8ce999a1c6075f94.js\"],\"default\"]\ne:I[8195,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"default\"]\nf:I[2972,[\"972\",\"static/chunks/972-4ca4dc3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\n10:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n12:I[1060,[],\"\"]\n5:T110c,"])</script><script>self.__next_f.push([1,"\"Should I do nursing or sonography?\" is one of the most common questions from people choosing a healthcare career. Both are good jobs with solid pay. They're also very different jobs, and \"harder\" depends a lot on what you're good at.\n\n![Sonography vs nursing comparison](/blog/career/sonography-vs-nursing.svg \"Sonography vs nursing at a glance|SonoBuddy. Median pay: U.S. Bureau of Labor Statistics, May 2024\")\n\n## The Short Answer\n\n- **Pay:** close. The BLS median was **$93,600 for registered nurses** and **$89,340 for diagnostic medical sonographers** (May 2024). Your specialty, location, and shifts matter more than the title.\n- **School:** nursing covers **more material**; sonography goes **deeper in fewer subjects** and is often **harder to get into**.\n- **Daily work:** nursing is broad patient care; sonography is focused imaging, one patient at a time.\n\n## Getting In\n\n**Nursing** programs are everywhere: community colleges (ADN), universities (BSN), and accelerated programs for career changers. Competitive programs exist, but there are many seats nationwide.\n\n**Sonography** programs are fewer and usually admit **small classes**, because each student needs scanning-lab time and a clinical placement. It's common to apply to several programs, or more than once. Look for **CAAHEP-accredited** programs, which give you the most direct route to registry exams.\n\n## What's Hard About Each\n\n### Nursing school\n- A huge volume of content: pharmacology, pathophysiology, health assessment, and clinical judgment across every body system\n- Care plans, dosage calculations, and constant exams\n- The **NCLEX-RN** licensing exam at the end\n- Clinicals that can involve heavy patient care, emotional situations, and shift work\n\n### Sonography school\n- **Ultrasound physics**, which most students say is the hardest class (see our [guide to sonography school](/blog/is-sonography-school-hard))\n- **Cross-sectional anatomy** in every plane, and recognizing it in grayscale\n- **Hand-eye scanning skill**, which only comes with hours of practice\n- Long, often **unpaid clinical rotations**, frequently close to full time\n- The **ARDMS SPI** physics exam plus at least one specialty exam (abdomen, OB/GYN, vascular, or cardiac) to become registered\n\nIf you're strong at spatial reasoning and like mastering one skill deeply, sonography may feel easier. If you prefer variety and people-centered care over technical work, nursing may.\n\n## Pay and Earning Potential\n\nBoth medians sit in the high $80Ks to low $90Ks. In both careers, the biggest pay jumps come from:\n\n- **Specialty** (for example, cardiac or vascular sonography; ICU or OR nursing)\n- **Location**, with West Coast states typically paying the most\n- **Shift differentials, call, and overtime**\n- **Travel contracts**\n\nNurses have a higher ceiling through advanced degrees (nurse practitioner, CRNA). Sonographers can grow pay with extra credentials, travel, leadership, or education roles. See [Can You Make Six Figures as a Sonographer?](/blog/sonographer-six-figure-salary)\n\n## Flexibility\n\nNursing wins on **flexibility**. RNs work in hospitals, clinics, schools, home health, telehealth, insurance, and dozens of specialties, and switching specialties is relatively easy.\n\nSonographers mostly work in **imaging**: hospitals, outpatient centers, physician offices, and mobile services. Moving between specialties usually means a new credential.\n\n## The Physical and Emotional Side\n\n- **Nursing:** on your feet for 12-hour shifts, patient lifting and transfers, high patient loads, and frequent end-of-life care.\n- **Sonography:** repetitive strain from scanning. The **shoulder, wrist, neck, and back** take the hit (see our [ergonomics series](/blog/sonographer-wrist-pain-scanning)). Emotionally hard moments also come up, like finding a fetal demise or a new cancer, often while the patient is watching your face.\n\n## Which Should You Choose?\n\n**Choose sonography if** you love anatomy and visual puzzles, want deep expertise in one skill, and prefer one-on-one patient time.\n\n**Choose nursing if** you want the widest range of jobs, enjoy broad hands-on patient care, and may want to go on to an advanced degree.\n\nEither way, **shadow both** before you apply. One day in each is the best tiebreaker there is.\n\n*Salary figures are BLS national medians for May 2024; local pay varies widely.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"sonography-vs-nursing-harder-pay\",\"d\"]\n13:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"rst51C0o07fifbX90kMIV\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"sonography-vs-nursing-harder-pay\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonography-vs-nursing-harder-pay\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"sonography-vs-nursing-harder-pay\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonography-vs-nursing-harder-pay\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"sonography-vs-nursing-harder-pay\",\"title\":\"Sonography vs Nursing: Which Is Harder, and Which Pays More?\",\"date\":\"2026-11-17\",\"excerpt\":\"RN or ultrasound tech? An honest comparison of school difficulty, licensing exams, pay, flexibility, and the physical toll, from people who know the scan room.\",\"author\":\
