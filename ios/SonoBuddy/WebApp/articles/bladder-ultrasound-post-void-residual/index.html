c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1f99,"])</script><script>self.__next_f.push([1,"Bladder ultrasound looks trivial and is routinely done badly. The volume calculation is a single formula, but the inputs depend on getting three genuinely orthogonal planes, and a small error in each dimension compounds into a number that changes management. Post-void residual in particular drives catheterization decisions, so a wrong measurement has direct consequences.\n\n---\n\n## Technique\n\n**Probe:** Curvilinear, 2–5 MHz. Suprapubic, transverse and sagittal.\n\n**Filling matters.** For assessment of the bladder itself, a comfortably full bladder is required — an empty bladder makes wall assessment impossible and hides small lesions. For post-void residual, scan immediately after voiding.\n\n**Position:** Supine. Probe just above the pubic symphysis, angled caudally into the pelvis.\n\n---\n\n## Volume Calculation\n\nThe bladder is modelled as an ellipsoid:\n\n```\nVolume (mL) = L × W × H × 0.52\n```\n\nWhere L, W, and H are in centimetres.\n\n**How to get the three dimensions:**\n\n- **Transverse plane:** measure **width** (side to side) and **height/AP** (anterior to posterior)\n- **Sagittal plane:** measure **length** (craniocaudal)\n\nThe 0.52 coefficient approximates π/6 and assumes an ellipsoid shape. Some departments use 0.7 for a fuller bladder or apply different coefficients depending on shape. Know what your protocol uses and apply it consistently — mixing coefficients across serial scans makes trends meaningless.\n\n### Where the Errors Come From\n\n**Oblique planes.** The single biggest source of error. If your transverse image is oblique, you overestimate width. Square up to the bladder before freezing.\n\n**Measuring an incompletely visualized bladder.** A very full bladder may extend beyond the field of view of a high-frequency setting. Drop frequency or increase depth so the entire bladder is on screen before measuring.\n\n**Bladder shape.** The formula assumes an ellipsoid. Bladders distorted by a large prostate, a cystocele, prior surgery, or a pelvic mass depart from that assumption, and the calculated volume becomes an estimate rather than a measurement. Say so in the report when the shape is clearly non-ellipsoid.\n\n**Timing after voiding.** Urine continues to enter the bladder from the ureters. A \"post-void residual\" measured ten minutes after voiding includes several minutes of new urine production. Scan within a few minutes of voiding and note the delay if it was longer.\n\n---\n\n## Post-Void Residual\n\nWidely used thresholds, though exact cutoffs vary between guidelines and clinical contexts:\n\n| PVR | General interpretation |\n|---|---|\n| \u003c 50 mL | Normal |\n| 50–100 mL | Generally considered acceptable, particularly in older patients |\n| 100–200 mL | Abnormal — warrants correlation and often repeat measurement |\n| \u003e 200 mL | Significant retention |\n| \u003e 300–400 mL | Marked retention; catheterization frequently indicated |\n\n**Interpretation caveats worth including in the report:**\n\n- A single elevated PVR should generally be repeated before acting on it. Patients void poorly in unfamiliar settings, with a full schedule and a waiting room outside the door.\n- PVR rises with age; a modestly elevated value in an 85-year-old means something different than in a 30-year-old.\n- The patient must have voided normally, not partially or under instruction to hurry.\n\n---\n\n## Bladder Wall\n\n**Normal wall thickness:** Generally under about **3 mm when the bladder is well distended**, and up to around 5 mm when empty or partially filled. **Always state the degree of distension alongside the measurement** — a 6 mm wall in an empty bladder is normal, and the same measurement in a fully distended bladder is not.\n\n**Wall thickening causes:**\n\n- **Bladder outlet obstruction** — commonly benign prostatic enlargement in men, producing diffuse thickening with trabeculation\n- **Chronic cystitis** — diffuse thickening, sometimes with debris\n- **Neurogenic bladder** — thickened, trabeculated, often with diverticula\n- **Malignancy** — focal, irregular thickening\n\n**Trabeculation:** Irregular, interdigitating internal wall contour from detrusor hypertrophy. A marker of chronic outlet obstruction.\n\n**Focal versus diffuse is the key distinction.** Diffuse thickening is usually obstructive or inflammatory. **Focal thickening or a polypoid lesion needs to be treated as a possible tumour** until proven otherwise — apply colour Doppler, look for internal vascularity, and recommend cystoscopy. A non-mobile, vascular, focal lesion is a very different report from mobile echogenic debris.\n\n---\n\n## Common Findings\n\n### Bladder Stones\n\nEchogenic focus with **posterior acoustic shadowing** that is **mobile** with patient repositioning. Mobility is the discriminator — roll the patient into a decubitus position and rescan. A stone moves; a tumour does not.\n\n### Bladder Diverticula\n\nOutpouching connected to the bladder lumen by a neck. Look for the neck to confirm — a fluid collection adjacent to the bladder without a demonstrable communication is something else. Diverticula are associated with chronic outlet obstruction, may retain urine after voiding, and can harbour stones or tumour. Note whether the diverticulum empties on voiding.\n\n### Debris, Clot, and Infection\n\nMobile low-level internal echoes that layer dependently and shift with position. Clot may be more organized and adherent. Apply Doppler: **clot is avascular; tumour may show flow.** An adherent, vascular mass needs cystoscopy.\n\n### Ureteric Jets\n\nColour Doppler over the trigone shows periodic jets of urine entering the bladder from each ureteric orifice. Present bilateral jets argue against complete ureteric obstruction on that side. Absent or markedly asymmetric jets support obstruction, though jets are intermittent — watch for a couple of minutes before calling one absent.\n\n### Catheters\n\nA Foley balloon appears as a rounded anechoic structure with an echogenic rim within the bladder. Confirm correct position — a balloon inflated in the urethra or a catheter in a diverticulum is a genuine and reportable finding.\n\n---\n\n## Related Prostate Assessment\n\nWhile the bladder is full, the prostate can be assessed transabdominally through it.\n\n**Prostate volume** uses the same ellipsoid formula: L × W × H × 0.52. Normal is roughly 25 mL in a young adult, increasing with age.\n\n**Intravesical prostatic protrusion (IPP):** measured in the sagittal plane as the distance the prostate protrudes into the bladder lumen above the bladder base. Greater protrusion is associated with more significant outlet obstruction and is worth measuring in men with lower urinary tract symptoms.\n\nTransabdominal assessment is a screening view — it does not replace transrectal ultrasound where detailed prostate evaluation is needed.\n\n---\n\n## Key Images to Capture\n\n1. Transverse bladder — width and AP measurements\n2. Sagittal bladder — length measurement\n3. Calculated volume displayed\n4. Bladder wall — with distension state documented\n5. Any focal wall lesion — two planes, with colour Doppler\n6. Ureteric jets — bilateral, with colour Doppler\n7. Post-void transverse and sagittal, with calculated PVR\n8. Prostate measurements where relevant\n\n---\n\n## Reporting Language\n\n**Retention with obstruction:**\n\"Pre-void bladder volume 620 mL. Diffuse bladder wall thickening measuring 7 mm with marked trabeculation. Two small diverticula arise from the left lateral wall, the larger measuring 2.3 cm, without internal stone or solid content. Prostate volume 78 mL with 1.4 cm intravesical protrusion. Post-void residual 340 mL. Findings consistent with chronic bladder outlet obstruction with significant retention.\"\n\n**Focal lesion:**\n\"A 1.8 cm focal polypoid lesion arises from the right posterolateral bladder wall. The lesion is immobile on repositioning and demonstrates internal vascularity on colour Doppler. Appearances are concerning for a bladder neoplasm; cystoscopic evaluation is recommended.\"\n\n---\n\n*SonoBuddy includes a bladder and prostate volume calculator alongside its measurement reference — offline, in the scan room.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"bladder-ultrasound-post-void-residual\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"bladder-ultrasound-post-void-residual\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"bladder-ultrasound-post-void-residual\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"bladder-ultrasound-post-void-residual\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"bladder-ultrasound-post-void-residual\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"bladder-ultrasound-post-void-residual\",\"title\":\"Bladder Ultrasound: Volume Calculation, Post-Void Residual, and Wall Assessment\",\"date\":\"2026-08-17\",\"excerpt\":\"Measuring bladder volume and post-void residual accurately — the ellipsoid formula, PVR thresholds, wall thickness, diverticula, stones, ureteric jets, and the errors that produce wrong numbers.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"genitourinary\",\"bladder\",\"post-void residual\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"endometrial-assessment-abnormal-uterine-bleeding\",\"title\":\"Endometrial Assessment and Abnormal Uterine Bleeding\",\"excerpt\":\"Measuring endometrial thickness correctly across the cycle and after men
