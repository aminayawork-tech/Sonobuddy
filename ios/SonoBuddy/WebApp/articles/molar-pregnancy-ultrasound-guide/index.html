c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1a05,"])</script><script>self.__next_f.push([1,"Molar pregnancy, or hydatidiform mole, is the most common form of gestational trophoblastic disease (GTD). It's an abnormal growth of placental tissue, and it can turn up on what was booked as a routine dating scan or a \"rule out miscarriage\" exam. Seeing it is what sends the patient for serial hCG follow-up after evacuation, because a small share of moles go on to become persistent or invasive disease.\n\n## Complete vs. Partial Mole\n\nThe two types differ in genetics, in appearance, and in what you'll see on the screen.\n\n| Feature | Complete mole | Partial mole |\n|---|---|---|\n| Genetics | Diploid, all paternal DNA | Usually triploid (69 chromosomes) |\n| Fetus or embryo | **None** | Often present, usually abnormal or growth-restricted |\n| Placenta | Diffusely abnormal, vesicular | Focal cystic change in an enlarged placenta |\n| hCG | Often markedly elevated for dates | Normal to mildly elevated |\n| Theca lutein cysts | More common | Uncommon |\n| Risk of persistent disease (GTN) | Higher | Lower |\n\n## The Complete Mole: \"Snowstorm\" Uterus\n\nThe textbook second-trimester appearance is an enlarged uterus filled with echogenic, heterogeneous tissue scattered with countless tiny cystic spaces. These are the hydropic chorionic villi. There is no gestational sac, no embryo, and no cardiac activity.\n\n![Complete hydatidiform mole on transabdominal ultrasound](/pathologies/molar_pregnancy_1.jpg \"Complete hydatidiform mole: the classic \\\"snowstorm\\\" appearance, with heterogeneous echogenic uterine contents and no fetal parts|Mikael Häggström, Public Domain, via Wikimedia Commons\")\n\n**Look for:**\n- Uterus **large for dates**\n- Echogenic, heterogeneous intracavitary mass with many small anechoic cysts (the vesicular, or \"cluster of grapes,\" pattern)\n- **No** fetal pole, yolk sac, or cardiac activity\n- Bilateral, enlarged, multiloculated ovarian cysts (**theca lutein cysts**), driven by very high hCG\n- Variable color Doppler flow within the mass, but the myometrium should look intact\n\n![Molar pregnancy with heterogeneous vesicular uterine contents and caliper measurement](/pathologies/molar_pregnancy_2.jpg \"Molar pregnancy: heterogeneous, vesicular uterine contents with caliper measurement|Mme Mim, CC BY-SA 4.0, via Wikimedia Commons\")\n\n## Why Early Moles Get Missed\n\nMost moles are now scanned in the first trimester, often before 10 weeks, and at that stage the classic snowstorm often **hasn't developed yet**. An early complete mole can look like:\n\n- A missed miscarriage or anembryonic pregnancy\n- A thickened, slightly cystic, or \"bubbly\" endometrium\n- An irregular, collapsed sac with echogenic surroundings\n\nThat's why many moles are diagnosed by pathology after evacuation for presumed miscarriage, and why the hCG level matters so much. **Uterine contents that don't fit the clinical picture, with an hCG far higher than expected for dates, should always raise the question.** You don't have to make the call. Describe what you see clearly so the interpreting physician can.\n\n## The Partial Mole\n\nA partial mole is subtler, because a fetus is usually present.\n\n**Look for:**\n- An embryo or fetus, often **growth-restricted** or with structural anomalies (triploidy features)\n- An **enlarged placenta with focal cystic spaces** (\"Swiss cheese\" placenta)\n- A gestational sac whose **transverse diameter is increased** relative to its AP diameter\n- Oligohydramnios in some cases\n\nDocument the fetal biometry, any anomalies, and the placental appearance together. The combination, not any single feature, is what points toward a partial mole.\n\n## Important Mimics\n\n| Mimic | How it differs |\n|---|---|\n| Incomplete miscarriage / retained products | Usually vascular tissue at the endometrium; hCG falling, not elevated |\n| Hydropic degeneration of the placenta | Follows fetal demise; hCG not markedly elevated |\n| Placental mesenchymal dysplasia | Cystic placenta **with a normal, often healthy fetus**; normal karyotype |\n| Complete mole with a coexisting normal twin | Separate normal placenta and fetus beside a molar component |\n| Degenerating fibroid | Arises from the myometrium, not the cavity; hCG negative |\n\nThe coexisting twin scenario is worth special attention. A normal fetus beside a cystic placental mass isn't automatically a partial mole. Map each placenta separately and describe their relationship.\n\n## What to Document\n\n1. Uterine size and whether it's large for dates\n2. Intracavitary contents: echogenicity, cystic spaces, measurements in three planes\n3. **Presence or absence** of a gestational sac, yolk sac, embryo, and cardiac activity\n4. Placental appearance if a fetus is present\n5. Both ovaries, with size and any multiloculated cysts\n6. Myometrial interface: is it clearly defined, or is there concern for invasion?\n7. Free fluid in the pelvis\n\nExample wording to suggest to the interpreting physician:\n\n\u003e \"Heterogeneous, vesicular-appearing intrauterine contents without an identifiable gestational sac or embryo. Bilateral multiloculated ovarian cysts. Findings may represent gestational trophoblastic disease; correlation with quantitative hCG recommended.\"\n\n## Red Flags\n\n- **Myometrial invasion**: loss of the clear interface between the mass and the myometrium, with disorganized, high-velocity, low-resistance flow extending into the wall, raises concern for invasive mole or gestational trophoblastic neoplasia\n- **Large theca lutein cysts** carry a risk of torsion. Check ovarian flow if the patient has acute pain.\n- **Very high hCG with symptoms** such as severe hyperemesis, early-onset hypertension (before 20 weeks), or thyroid symptoms. Make sure the ordering provider knows promptly.\n\n## The Patient in the Room\n\nThese patients have often been told they're pregnant, and they may be watching the screen closely. Seeing no baby while you take extra images is frightening. Stay within scope: explain that you're collecting all the images the radiologist needs, and that their provider will go over the results. Don't speculate, and don't say \"nothing's there.\" Use the scripts in our article on [what to say when the patient asks what you see](/articles/patient-asks-what-do-you-see).\n\n## Bottom Line\n\nThe classic snowstorm uterus is easy to recognize, but most moles you see won't look classic. Think of GTD whenever first-trimester contents don't fit a normal or failing pregnancy, especially with a markedly elevated hCG. Document the uterus, contents, embryo, placenta, and ovaries systematically, and let the hCG correlation and pathology finish the story.\n\n*SonoBuddy is a reference tool, not a diagnostic authority. Final interpretation rests with the interpreting physician.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"molar-pregnancy-ultrasound-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"molar-pregnancy-ultrasound-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"molar-pregnancy-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"molar-pregnancy-ultrasound-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"molar-pregnancy-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"molar-pregnancy-ultrasound-guide\",\"title\":\"Molar Pregnancy on Ultrasound: Complete vs. Partial Mole\",\"date\":\"2026-10-28\",\"excerpt\":\"How gestational tropho
