c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T13c1,"])</script><script>self.__next_f.push([1,"Lower back pain rounds out the list of places sonographers told us scanning hurts. Unlike the wrist and shoulder, your back usually isn't hurt by the probe itself. It's hurt by **how you position your body around the patient**: leaning, reaching, and twisting, hour after hour.\n\n## What Strains Your Back\n\nYour lower back handles load best when your spine is upright and facing forward. Scanning tends to push it into the three positions it likes least:\n\n1. **Leaning forward** over a bed that's too low, so your back muscles hold your upper body up\n2. **Twisting** to face the monitor while your hips face the patient\n3. **Reaching** across the bed, which multiplies the load on your back the farther your arm goes\n\nAdd helping patients reposition, pushing heavy machines, and long periods of standing on hard floors, and it's easy to see why back pain is so common in sonographers.\n\n## Set Up the Bed and Yourself\n\n![Lower back protection checklist for sonographers](/blog/ergonomics/lower-back-setup.svg \"Get close first: most back strain starts with a long reach|SonoBuddy\")\n\n### If you're standing\n\n**Raise the bed to roughly elbow height.** You should be able to scan with your back upright and your elbow bent, not bent over the patient. If the bed doesn't go high enough, that's an equipment issue worth raising with your manager.\n\nStand with your **feet hip-width apart, facing the patient**, and shift your weight between feet. An anti-fatigue mat helps a lot if you stand for most exams.\n\n### If you're sitting\n\n- **Feet flat** on the floor or a footrest, knees roughly level with your hips\n- **Back against the lumbar support.** Perching on the front edge of the chair is the most common sitting mistake\n- Pull the chair **close to the bed** so you don't have to lean forward to reach\n- Use a chair with **adjustable height and a swivel** so you can turn your whole body\n\n### Don't twist\n\nWhen the patient, the probe, and the monitor pull you in different directions, your spine twists to compromise. Instead:\n\n- Put the **monitor in front of you** (see our neck article for the setup)\n- Turn your **whole body** using the swivel chair or your feet\n- **Bring the patient close** to your edge of the bed, so you aren't reaching\n\n### Vary your position\n\nAlternate between sitting and standing through the day when the exam allows. A body that changes positions recovers between exams; a body that holds one posture all day does not.\n\n## The Portable Exam Checklist\n\nPortable and bedside exams in the ICU, ED, and patient rooms are the hardest on your back: beds that are too low, crowded rooms, and machines you have to steer around equipment. Before you start:\n\n1. **Raise the bed** to working height. Ask the nurse if you're unsure whether you can move it\n2. **Lower the side rail** on your side so you aren't reaching over it\n3. **Position the patient close** to your edge, with help if needed\n4. **Park the machine** so the monitor faces you and the keyboard is within reach\n5. **Use a stool** if one's available rather than bending over the bed for the whole exam\n6. **Get help to reposition patients**, and use slide sheets or lift equipment where your facility has them\n\nPushing the machine: **push, don't pull**, keep it close to your body, and use your legs.\n\n## Back Resets Between Patients\n\n- **Standing back bend:** hands on your lower back, gently lean back for 3 to 5 seconds, repeat 5 times\n- **Seated knee hug:** sitting, pull one knee toward your chest for 15 seconds each side\n- **Hip flexor stretch:** in a short lunge, gently push the hips forward for 15 to 20 seconds each side\n- **Walk:** even a 1-minute walk down the hall breaks up a long static posture\n\nKeep movements slow and comfortable. Stop if anything causes sharp or radiating pain.\n\n## Warning Signs\n\nMost back strain improves with rest and position changes. See a clinician promptly if you have:\n\n- Pain that **spreads down the leg**, especially below the knee\n- **Numbness, tingling, or weakness** in the legs or feet\n- Pain that **doesn't improve after a few weeks**, or keeps you up at night\n\n**Get emergency care** for back pain with loss of bladder or bowel control, numbness in the groin or inner thighs, or rapidly worsening leg weakness.\n\n## The Bottom Line\n\n**Bed at the right height, back supported, face the patient, and get close before you scan.** Most back strain starts with a long reach, and most long reaches can be fixed in the first 30 seconds of the exam.\n\n## The Whole Series\n\nScanning-related pain is common, but it isn't inevitable. Catch up on the rest of the series:\n\n- [Sonographer Wrist Pain: Why Scanning Hurts Your Wrist and How to Fix It](/blog/sonographer-wrist-pain-scanning)\n- [Sonographer Shoulder Pain and the 30-Degree Rule](/blog/sonographer-shoulder-pain-30-degree-rule)\n- [Sonographer Neck Pain: The 10-Second Monitor Setup That Prevents It](/blog/sonographer-neck-pain-monitor-setup)\n\n*This article is general educational information, not medical advice. If you have pain, numbness, or weakness, see a qualified clinician.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"sonographer-lower-back-pain-scanning\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ghXGlW2TziYQw25JXH-MF\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"sonographer-lower-back-pain-scanning\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonographer-lower-back-pain-scanning\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"sonographer-lower-back-pain-scanning\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\
