c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1b54,"])</script><script>self.__next_f.push([1,"Abdominal aortic aneurysm (AAA) screening is life-saving. A ruptured AAA carries 80–90% mortality, but a detected AAA can be managed electively with far better outcomes. Ultrasound is the primary screening tool because it's accurate, cheap, and safe. Getting the measurement right matters.\n\n## AAA Screening Guidelines\n\n**Who qualifies for one-time AAA screening ultrasound:**\n- Men aged 65–75 who have ever smoked (≥ 100 cigarettes lifetime) — per USPSTF Grade B recommendation\n- Some guidelines extend screening to men 65+ with family history of AAA\n- Women: USPSTF recommends against routine screening (lower prevalence), but high-risk women (smoking + family history) may be screened per individual clinical judgment\n\n**Surveillance intervals after a normal exam:**\n- Aortic diameter \u003c 3.0 cm: no follow-up needed\n- 3.0–3.9 cm: follow-up ultrasound in 3 years\n- 4.0–4.9 cm: follow-up ultrasound every 12 months\n- 5.0–5.4 cm: follow-up every 6 months; surgical evaluation recommended\n- ≥ 5.5 cm: referral to vascular surgery for repair planning\n\n## Normal Aortic Measurements\n\nThe aorta tapers as it goes distally:\n\n| Location | Normal Diameter |\n|---|---|\n| Proximal (at celiac/SMA) | ≤ 3.0 cm |\n| Mid (infrarenal) | ≤ 2.5 cm |\n| Distal (above bifurcation) | ≤ 2.0 cm |\n\n**Aneurysm definition:** Aortic diameter ≥ 3.0 cm (infrarenal) OR a focal dilatation ≥ 1.5× the normal adjacent aorta.\n\n**A 3.0 cm aorta is the cutoff** — but clinically, most surgeons don't recommend elective repair until 5.5 cm in men or 5.0–5.5 cm in women (rupture risk exceeds surgical risk at these sizes).\n\n## How to Measure the Aorta Correctly\n\n**This is where errors happen most.** Two main techniques exist, and they give different numbers:\n\n**Outer-to-outer (OTO):** Measure from the outer wall of the anterior aorta to the outer wall of the posterior aorta. This is the standard for AAA measurement in most guidelines (Society for Vascular Surgery recommendation).\n\n**Inner-to-inner (ITI):** Measures only the lumen, excluding the wall. This is used less commonly.\n\n**Consistent measurement is most important:** When comparing to prior studies, use the same technique. Discrepancies between OTO and ITI measurements have caused confusion in surveillance programs.\n\n**Measurement plane:**\n- Transverse (axial): most reproducible for diameter\n- Measure at the widest point (usually infrarenal, between renal arteries and bifurcation)\n- Always measure in two perpendicular planes: maximum AP and maximum transverse\n\n**Avoid measurement errors:**\n- Don't measure obliquely — an oblique cut through a straight vessel gives a falsely large measurement\n- Include the aortic wall in OTO measurement\n- For aneurysms with mural thrombus: the lumen may appear small, but you must measure the entire aneurysm sac (outer wall to outer wall) — the thrombus can expand and rupture even with a small lumen\n\n## Scanning Protocol\n\n**Patient preparation:** Ideally NPO 4–6 hours (reduces bowel gas). This is an elective screen — most patients can be well-prepared.\n\n**Probe:** 3–5 MHz curved array. Lower frequency (2–3 MHz) for large patients.\n\n**Transverse scan:**\n1. Begin just below the xiphoid in the epigastrium\n2. Identify the aorta (pulsatile, anechoic lumen, thick echogenic wall) anterior to the spine\n3. Follow the aorta from the diaphragm to the bifurcation (L4–L5 level)\n4. At each level, assess: diameter, wall morphology, presence of thrombus\n5. Measure maximum diameter in transverse at the widest point\n\n**Sagittal scan:**\n- Roll 90° to show the aorta in long axis\n- Verify the AP diameter matches the transverse measurement\n- Assess the posterior wall (often thrombus is posterior and may not be visible in transverse without good technique)\n\n**Bifurcation:** Follow the aorta to the common iliac arteries. AAAs often extend to or involve the iliac arteries — measure both common iliac arteries.\n\n**Normal iliac artery:** \u003c 1.5 cm. Iliac aneurysm: \u003e 1.8 cm (some guidelines use \u003e 1.5 cm).\n\n**Renal arteries:** The infrarenal aorta begins just below the renal arteries. Document whether the aneurysm neck is infrarenal (most common) or pararenal/suprarenal (more complex surgically).\n\n## Aortic Thrombus\n\nLarge AAAs often contain mural thrombus — echogenic or heterogeneous crescent-shaped material lining the aneurysm wall. This is not always appreciated on transverse alone.\n\n**Key point:** The patent lumen (anechoic, with flow) is smaller than the true aneurysm sac. Always measure outer-to-outer, not just the lumen.\n\n**Layered thrombus:** Alternating echogenic layers = organized, older thrombus. More echogenic, homogeneous = acute or fresh. Fresh thrombus in a known aneurysm may indicate recent expansion.\n\n## Acute Aortic Findings — Medical Emergencies\n\n**Ruptured AAA:** Retroperitoneal hemorrhage may or may not be visible. Periaortic echogenic fluid, loss of the normal posterior aortic wall, or large aneurysm with a shocked patient = presumed rupture until proven otherwise.\n\n**Free intraperitoneal rupture:** Anechoic or complex fluid throughout the peritoneal cavity — more common in anterior rupture. Rare — most AAA ruptures are contained in the retroperitoneum.\n\n**Aortic dissection:** A dissection flap may be visible as a mobile echogenic linear structure within the aortic lumen, creating a true and false lumen. Color Doppler may show differential flow in the two lumens.\n\n**What to do with a suspected ruptured AAA:**\n1. Stop scanning immediately — do not delay emergency care by continuing the study\n2. Inform the clinical team directly and urgently\n3. Document the finding and your notification\n\nDo not wait for the radiologist to read the images in a suspected emergency.\n\n## Iliac Artery Evaluation\n\nAlways evaluate both common iliac arteries as part of an AAA study.\n\n**Common iliac artery (CIA):**\n- Normal: \u003c 1.5 cm diameter\n- Aneurysm: \u003e 1.8 cm\n- Measure OTO in transverse\n\n**External and internal iliac arteries:** Typically not measured unless pathology is suspected.\n\n**Aortoiliac occlusive disease:** Diminished or absent color flow in the distal aorta or iliac arteries, calcified walls — may accompany or be confused with an aneurysm.\n\n## Documentation\n\nFor every aortic study:\n- Maximum aortic diameter (specify plane: AP and transverse)\n- Measurement location (proximal, mid-infrarenal, distal infrarenal)\n- Presence of mural thrombus (describe if present)\n- Visualization quality (note if segments not seen)\n- Iliac artery measurements bilaterally\n- Comparison to prior if available\n\n**Example:** \"Infrarenal aorta: maximum diameter 4.2 cm AP × 4.0 cm transverse, measured outer-to-outer. Mural thrombus along the posterior wall. Both common iliac arteries measured: right 1.3 cm, left 1.4 cm. Comparable to prior study from [date] (4.0 cm).\"\n\n---\n\n*SonoBuddy's Measurements section includes aortic diameter normal values and AAA surveillance thresholds — quick reference when you need it during the exam.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"aorta-ultrasound-aaa-screening\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"aorta-ultrasound-aaa-screening\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"aorta-ultrasound-aaa-screening\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"aorta-ultrasound-aaa-screening\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"
