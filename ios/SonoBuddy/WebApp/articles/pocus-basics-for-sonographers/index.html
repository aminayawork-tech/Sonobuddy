c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1878,"])</script><script>self.__next_f.push([1,"Point-of-care ultrasound (POCUS) is one of the most significant shifts in how ultrasound is used clinically. It's also one of the most misunderstood topics among sonographers — some see it as a threat, others as an opportunity. Here's a clear-eyed look at what POCUS is, what it isn't, and how it affects you.\n\n## What Is POCUS?\n\nPOCUS refers to ultrasound performed at the bedside by the treating clinician — an emergency physician, intensivist, hospitalist, anesthesiologist, or surgeon — to answer a specific, focused clinical question in real time.\n\n**Examples of POCUS applications:**\n- eFAST exam (extended focused assessment with sonography for trauma): Is there free fluid (hemorrhage) in the abdomen, pericardium, or chest?\n- Cardiac: Is there a pericardial effusion? Is the left ventricle squeezing adequately?\n- Lung: Pneumothorax? Pulmonary edema?\n- IVC assessment: Volume status — is the patient fluid-responsive?\n- Vascular access: Guide IV or central line placement\n- Procedural guidance: Thoracentesis, paracentesis, joint aspiration\n\nPOCUS is focused, time-critical, and intended to guide immediate decision-making. It is **not** a comprehensive diagnostic study.\n\n## How POCUS Differs From Department Ultrasound\n\nThis distinction matters clinically and professionally:\n\n| Feature | Department Ultrasound | POCUS |\n|---|---|---|\n| Performed by | Registered sonographer | Treating clinician |\n| Scope | Comprehensive protocol | Narrow, focused question |\n| Documentation | Full report, PACS | Often brief clinical note |\n| Interpretation | Radiologist / reading physician | Treating clinician at bedside |\n| Purpose | Diagnosis, surveillance | Real-time clinical decision |\n| Time | 20–90 minutes | 2–5 minutes |\n\nThe key point: POCUS is not trying to replace the diagnostic ultrasound you perform. It's answering different questions in different settings.\n\n## Where Sonographers Fit In the POCUS World\n\n### 1. Training POCUS Providers\n\nHospitals and residency programs increasingly hire experienced sonographers to teach POCUS to physicians. If you have strong fundamentals — probe manipulation, anatomy, image optimization — you have something physicians learning POCUS desperately need.\n\n**Opportunity:** POCUS educator roles are growing. This is a premium job — combining clinical expertise with education.\n\n### 2. Quality Oversight\n\nPOCUS images are often stored and reviewed for quality assurance. Some institutions have formal POCUS QA programs where experienced sonographers review images for technical quality and flag findings that may have been missed or misinterpreted.\n\n**Opportunity:** POCUS QA coordinator roles exist at academic centers and large health systems.\n\n### 3. Performing Clinician-Ordered POCUS\n\nIn some settings, sonographers perform focused POCUS-type studies under physician orders — a focused cardiac view in the ICU, a rapid eFAST in a trauma bay. This is standard department ultrasound performed by a sonographer, just faster and more focused.\n\n### 4. Hybrid Roles in ED and ICU\n\nEmergency department and intensive care unit sonographers often perform rapid focused studies alongside POCUS. These roles require strong real-time communication skills and comfort with urgent findings.\n\n## Common POCUS Applications You Should Know\n\nEven if you don't perform POCUS yourself, understanding these studies helps you communicate with clinicians, understand clinical context, and potentially cross-train.\n\n### eFAST (Extended FAST)\n\nFocused views:\n- Right upper quadrant (hepatorenal space — Morison's pouch)\n- Left upper quadrant (splenorenal space)\n- Pelvic (suprapubic — pelvic free fluid)\n- Cardiac (subxiphoid — pericardial effusion)\n- Bilateral chest (pleural sliding — pneumothorax)\n\nFree fluid in the hepatorenal space appears as an anechoic stripe between the liver and right kidney. In trauma, this represents blood until proven otherwise.\n\n### Cardiac POCUS Views\n\n- **Parasternal long axis (PLAX):** Left ventricle, aortic valve, mitral valve — gross LV function\n- **Parasternal short axis (PSAX):** Cross-section of the LV\n- **Apical 4-chamber:** All four chambers\n- **Subxiphoid:** Pericardial effusion (fluid surrounds the heart as an anechoic rim)\n- **IVC:** Collapsibility with respiration correlates with volume status\n\n### Lung POCUS\n\n**Lung sliding:** The bright echogenic pleura sliding with respiration (like two sheets rubbing together, creating a \"seashore sign\" on M-mode). Absent lung sliding = pneumothorax until proven otherwise.\n\n**B-lines:** Vertical hyperechoic artifacts arising from the pleura. Three or more B-lines per intercostal space = interstitial fluid (pulmonary edema, pneumonia).\n\n## Should You Learn POCUS?\n\nIf you're interested in expanding your role, POCUS training is a legitimate career investment:\n\n- POCUS Society and SRU offer sonographer-specific education\n- Emergency ultrasound certificates exist for sonographers\n- Some progressive departments train sonographers in eFAST and limited cardiac\n- ICU sonographer roles frequently require these skills\n\nThis doesn't replace your core sonographer training — it builds on it. A sonographer who understands POCUS is more valuable in the ED, ICU, and procedural settings than one who doesn't.\n\n## The Threat Question\n\nIs POCUS a threat to sonography jobs?\n\nThe honest answer: POCUS takes over some studies that might otherwise be ordered as formal department studies — particularly rapid bedside assessments. But it also generates more ultrasound use overall (the \"availability effect\"), and complex studies, surveillance imaging, and obstetric/vascular work remain firmly in the sonographer domain.\n\nPOCUS and diagnostic ultrasound coexist because they answer different questions for different purposes. The better question is: **how do you position yourself to be valuable in a world where both exist?**\n\nThe answer is expertise. A sonographer who produces excellent comprehensive studies and can communicate clinically with POCUS-trained physicians is exactly what progressive departments want.\n\n---\n\n*SonoBuddy focuses on the diagnostic ultrasound skills that remain the core of sonographer practice — protocols, measurements, and clinical reference — the foundation POCUS builds on.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"pocus-basics-for-sonographers\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"pocus-basics-for-sonographers\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"pocus-basics-for-sonographers\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"pocus-basics-for-sonographers\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"pocus-basics-for-sonographers\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"pocus-basics-for-sonographers\",\"title\":\"POCUS for Sonographers: What Point-of-Care Ultrasound Means for Your Role\",\"date\":\"2026-08-24\",\"excerpt\":\"What point-of-care ultrasound is, how it differs from department ultrasound, where sonographers fit in the POCUS world, and how to position yourself as POCUS expands in clinical settings.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"POCUS\",\"career\",\"professional development\",\"emergency\",\"clinical\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"point-of-care-sonographer-certification\",\"title\":\"Point-of-Care Ultrasound Certification for Sonographers: PO
