c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1bc8,"])</script><script>self.__next_f.push([1,"Peripheral arterial disease (PAD) affects millions of people and is significantly underdiagnosed. Lower extremity arterial duplex is the primary non-invasive diagnostic tool. This is a technically demanding exam — here's how to approach it systematically.\n\n## Indications\n\n- Claudication (calf, thigh, or buttock pain with walking that resolves with rest)\n- Rest pain (severe PAD)\n- Non-healing wounds or ulcers on the foot or lower leg\n- Abnormal ABI or pulse volume recordings on segmental pressures\n- Pre-procedure planning for revascularization\n- Post-intervention surveillance (stent, bypass graft)\n- Pulsatile mass in the popliteal fossa (popliteal artery aneurysm)\n\n## Equipment and Setup\n\n**Probe:** Start with a 5–9 MHz linear transducer for the thigh and calf. Use a 2–5 MHz curvilinear probe for the aortoiliac segment (deep vessels in larger patients).\n\n**Patient position:** Supine for most of the exam. Semi-prone or lateral decubitus for popliteal access.\n\n**Color Doppler settings:** Optimize for arterial flow — higher PRF than venous studies, lower wall filter.\n\n## Anatomy\n\nFollow the arterial tree from proximal to distal:\n\n- **Aortoiliac:** Common iliac → external iliac → common femoral\n- **Thigh:** Common femoral → profunda femoris (deep femoral) + superficial femoral artery (SFA) → popliteal\n- **Infrageniculate:** Popliteal → anterior tibial + tibioperoneal trunk → posterior tibial + peroneal\n\nThe SFA is the most commonly diseased segment and runs through Hunter's canal (adductor canal) in the mid-thigh — this is where it dives deep and is the most technically challenging segment to image.\n\n## Scanning Protocol\n\n### Step 1: ABI First\n\nBefore imaging, obtain ankle-brachial indices bilaterally:\n- Measure brachial systolic pressure in both arms (use the higher)\n- Measure systolic pressure at the dorsalis pedis and posterior tibial with a handheld Doppler\n- ABI = ankle pressure ÷ highest brachial pressure\n\n| ABI | Interpretation |\n|---|---|\n| \u003e 1.4 | Non-compressible (calcified vessels — common in diabetics) |\n| 1.0–1.4 | Normal |\n| 0.9–1.0 | Borderline |\n| 0.7–0.9 | Mild PAD |\n| 0.5–0.7 | Moderate PAD |\n| \u003c 0.5 | Severe PAD / critical limb ischemia |\n\n### Step 2: Waveform Survey\n\nBefore detailed duplex, quickly sample waveforms at key levels bilaterally:\n- Common femoral artery (CFA)\n- Mid SFA\n- Popliteal\n- Posterior tibial\n\nA normal lower extremity artery at rest is **triphasic** (three phases: forward flow, brief reversal, forward again). Loss of the reversal phase (biphasic → monophasic) indicates proximal obstruction.\n\n### Step 3: Aortoiliac Segment\n\n- Low-frequency curvilinear probe, patient supine\n- Sample the distal aorta, both common iliac and external iliac arteries\n- Evaluate for stenosis, occlusion, aneurysm\n- Dampened waveforms at the CFA suggest proximal disease even if you can't directly image the iliac vessels\n\n### Step 4: Common Femoral Artery\n\nThe CFA is your reference point for the entire study.\n\n- Located just inferior to the inguinal ligament\n- Should be triphasic in a normal patient\n- Evaluate the CFA bifurcation into SFA and profunda (deep femoral)\n- Plaque and stenosis at the CFA are common\n\n### Step 5: Superficial Femoral Artery\n\nThe SFA is the workhorse of this exam and the most common site of disease.\n\n- Follow from CFA bifurcation to the adductor canal (Hunter's canal)\n- Image in transverse to identify the vessel, switch to sagittal for Doppler\n- The adductor canal segment is deep — use enough gain, possibly switch to lower frequency\n- **Key pitfall:** Don't confuse the profunda with the SFA. The SFA continues straight down the thigh; the profunda dives posteriorly.\n\n**Doppler criteria for SFA stenosis:**\n\n| Stenosis | PSV Ratio | Waveform |\n|---|---|---|\n| \u003c 50% | \u003c 2:1 | Preserved triphasic |\n| 50–75% | 2:1 to 4:1 | Biphasic distal |\n| \u003e 75% | \u003e 4:1 | Monophasic distal |\n| Occlusion | No flow | Collateral waveforms distally |\n\nPSV ratio = PSV at stenosis ÷ PSV in the normal segment just proximal to it.\n\n### Step 6: Popliteal Artery\n\n- Patient prone, or supine with knee slightly flexed and foot elevated\n- Access from the popliteal fossa\n- Evaluate for stenosis, occlusion, and popliteal aneurysm (normal diameter \u003c 10–12 mm)\n- The popliteal is the most common site for peripheral aneurysm — always measure in transverse\n\n### Step 7: Infrageniculate Vessels\n\n- Posterior tibial: behind the medial malleolus → follow proximally up the calf\n- Anterior tibial: anterior compartment, lateral to the tibia → becomes dorsalis pedis at the ankle\n- Peroneal: deepest, between tibia and fibula — most difficult to image\n- In critical limb ischemia, you may only find flow in one vessel. Document which ones are patent.\n\n## Waveform Interpretation\n\n**Triphasic:** Normal peripheral artery at rest — high resistance with forward, reverse, and forward components.\n\n**Biphasic:** Loss of reversal phase. May be normal in young people or after exercise. Suggests mild proximal disease or vasodilation.\n\n**Monophasic/dampened:** Significant proximal obstruction. Low velocity, prolonged systolic upstroke.\n\n**Tardus-parvus:** Slow upstroke, rounded peak, no reversal. Classic for hemodynamically significant stenosis or occlusion upstream.\n\n## Bypass Graft Surveillance\n\nPost-bypass patients need regular surveillance. The graft can be native vein or synthetic.\n\n**What to look for:**\n- Vein graft stenosis (most common at anastomoses or valve sites)\n- PSV \u003e 300 cm/s at any graft segment = significant stenosis\n- PSV \u003c 45 cm/s throughout = at risk for thrombosis\n- Kinking, perigraft fluid collection\n\n## Reporting Template\n\nDocument for each segment:\n- Vessel patency (patent / occluded / not visualized)\n- Plaque description (calcified / soft / mixed)\n- Peak systolic velocity\n- PSV ratio at any stenosis\n- Waveform character (triphasic / biphasic / monophasic)\n\n**Conclusion language:**\n- \"Triphasic waveforms throughout the right lower extremity arterial system. No hemodynamically significant stenosis identified.\"\n- \"Hemodynamically significant stenosis of the left mid SFA. PSV 380 cm/s, PSV ratio 3.8:1. Distal waveforms monophasic.\"\n- \"Occlusion of the right SFA from mid-thigh to the adductor canal. Reconstitution via collaterals at the popliteal level with monophasic waveform.\"\n\n## Common Pitfalls\n\n**Missing Hunter's canal:** The SFA dives deep here and is easy to lose. Follow continuously in longitudinal view, adjusting depth and angle as it descends.\n\n**Confusing profunda for SFA:** They're side by side at the bifurcation. The profunda goes deep and lateral; the SFA continues straight.\n\n**Calling a calcified vessel normal:** If the ABI is \u003e 1.4, the vessels are calcified and incompressible. The ABI is falsely elevated — this isn't normal. Refer to toe pressures.\n\n**Missing popliteal aneurysm:** Always measure the popliteal in transverse. An aneurysm here can thrombose or embolize without warning.\n\n---\n\n*SonoBuddy's Calculators include the ABI calculator with interpretation. Protocols section covers lower extremity arterial step-by-step.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"lower-extremity-arterial-duplex-protocol\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"lower-extremity-arterial-duplex-protocol\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"lower-extremity-arterial-duplex-protocol\",\"d\"],{\"children\":[\"
