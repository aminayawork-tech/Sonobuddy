c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1ef0,"])</script><script>self.__next_f.push([1,"Knee ultrasound covers four anatomic compartments and is excellent for soft tissue pathology — tendon tears, bursitis, effusion, cysts, and ligament injuries. The key is moving through the four quadrants systematically rather than chasing symptoms.\n\n## Why Ultrasound for the Knee?\n\n- Dynamic assessment — test tendons under load, watch patellar tracking\n- Sensitive for joint effusion (more sensitive than physical exam)\n- Excellent for popliteal (Baker's) cysts\n- Ligament evaluation (MCL/LCL visible; ACL/PCL requires MRI)\n- Guides aspiration and injection in real time\n\n**What ultrasound cannot reliably show:** Menisci (only the peripheral rim is accessible), ACL/PCL, intra-articular chondral defects — MRI required for these.\n\n---\n\n## Patient Position and Setup\n\n**Probe:** 5–15 MHz linear transducer.\n\n**The four-compartment approach:**\n\n1. Anterior: quad tendon, patella, patellar tendon, pre-patellar bursa\n2. Medial: MCL, medial collateral ligaments, medial meniscus peripheral rim\n3. Lateral: LCL, iliotibial band, lateral meniscus peripheral rim\n4. Posterior: Baker's cyst, popliteal vessels, semimembranosus and biceps femoris tendons\n\n---\n\n## Anterior Compartment\n\n### Patient Position\n\nKnee flexed 30–45° over a pillow. More flexion puts the patellar tendon under tension, improving visualization of fibers.\n\n### Quadriceps Tendon\n\n**Probe:** Longitudinal (long axis), just superior to the patella.\n\n**Normal:** Hyperechoic fibrillar tendon with three layers (rectus femoris, vastus intermedius, and combined layer). Thickness at the proximal patella ≈ 5–8 mm.\n\n**Pathology:**\n- **Tendinosis:** Focal hypoechoic areas, tendon thickening, loss of fibrillar pattern — insertional (at patella) or proximal\n- **Tear:** Discontinuity of fibers; complete rupture shows a gap with fluid\n- **Enthesopathy:** Irregular cortex at the patella insertion, calcium deposits\n\n### Patella\n\nInspect the patellar cortex for irregularity (fracture, chondrocalcinosis). Measure any osteophytes.\n\n### Patellar Tendon (Ligament)\n\n**Position:** Same — flexed knee.\n\n**Probe:** Long axis from inferior pole of patella to tibial tuberosity.\n\n**Normal:** Hyperechoic fibrillar band, 3–5 mm thick, courses from apex of patella to tibial tuberosity.\n\n**Pathology:**\n- **Jumper's knee (patellar tendinopathy):** Hypoechoic thickening at the proximal patellar tendon (inferior patella insertion). Most common finding in athletes.\n- **Tear:** Focal hypoechoic defect or complete discontinuity\n- **Patellar bursitis (infrapatellar bursa):** Fluid-filled sac at the deep or superficial infrapatellar position\n\n### Pre-Patellar Bursa\n\n**Position:** Over the anterior patella.\n\n**Normal:** Not visible (no fluid).\n\n**Bursitis (Housemaid's knee):** Anechoic fluid collection anterior to the patella. Measure thickness, note if complex (infected bursitis shows internal echoes/septations).\n\n---\n\n## Medial Compartment\n\n### Patient Position\n\nLeg in external rotation, hip abducted (\"frog-leg\" position or knee slightly externally rotated).\n\n### Medial Collateral Ligament (MCL)\n\n**Probe:** Longitudinal over the medial joint line.\n\n**Normal:** Echogenic fibrillar band — two layers (superficial, deep) with a potential space between them (MCL bursa).\n\n**Valgus stress test:** Apply gentle valgus force while scanning the MCL. Look for abnormal joint gapping (\u003e 1–2 mm compared to contralateral side).\n\n**Pathology:**\n- **Grade I (sprain):** Periligamentous edema, thickening, normal fiber continuity\n- **Grade II (partial tear):** Hypoechoic area within the ligament; fibers partially disrupted\n- **Grade III (complete tear):** Full discontinuity, marked periligamentous edema, joint gapping on stress\n\n### Medial Meniscus (Peripheral Rim)\n\nThe body and posterior horn of the medial meniscus are accessible at the medial joint line.\n\n**Normal:** Triangular echogenic structure at the joint line. Posterior horn is larger than anterior.\n\n**Meniscal cyst:** Anechoic or complex cystic structure at the joint line, often adjacent to a meniscal tear. If present, assess the meniscus carefully.\n\n---\n\n## Lateral Compartment\n\n### Patient Position\n\nLeg in internal rotation.\n\n### Lateral Collateral Ligament (LCL)\n\n**Normal:** Cord-like hyperechoic structure running from lateral femoral condyle to fibular head. Less accessible than MCL due to overlying iliotibial band.\n\n**Probe:** Longitudinal, lateral joint line — adjust probe placement to separate IT band (superficial) from LCL (deep).\n\n### Iliotibial Band (IT Band)\n\nThick fibrous band lateral thigh/knee — can become painful (IT band syndrome in runners). Scan in long and short axis.\n\n**IT band syndrome:** Periligamentous fluid between the IT band and lateral femoral condyle; tendon thickening; tenderness on probe pressure.\n\n---\n\n## Posterior Compartment\n\n### Patient Position\n\nPatient **prone** (lying face down) with knee extended or slightly flexed. This is the key position for posterior knee evaluation.\n\n### Baker's Cyst (Popliteal Cyst)\n\nThe most common posterior knee mass. A Baker's cyst is a distended semimembranosus-gastrocnemius bursa located in the medial popliteal fossa between the medial head of gastrocnemius and the semimembranosus.\n\n**Sonographic appearance:**\n- Anechoic or hypoechoic fluid-filled structure in the medial popliteal fossa\n- Has a characteristic **neck** connecting it to the joint (the \"stalk\" extending between the medial gastrocnemius and semimembranosus)\n- If the cyst ruptures: fluid tracks down the calf between the gastrocnemius and soleus (\"dissecting\" Baker's cyst) — mimics DVT clinically\n\n**Measure:** Transverse × AP × craniocaudal dimensions. Note contents (simple vs complex — debris, rice bodies in RA, loose bodies).\n\n**Tip:** Neck identification confirms it's a popliteal cyst and not a ganglion or other mass.\n\n**Complex cyst:** Internal echoes, septations, or solid components → consider ganglion, synovial cyst with synovitis, or other pathology.\n\n### Popliteal Vessels\n\nWhile in the posterior position, identify the popliteal artery (deep, pulsatile) and popliteal vein (superficial, compressible). Assess for DVT (compress the popliteal vein) and popliteal artery entrapment if clinically suspected.\n\n---\n\n## Joint Effusion\n\nSmall joint effusions are best visualized in the suprapatellar recess.\n\n**Probe:** Longitudinal, suprapatellar, above the patella on the anterior thigh.\n\n**Normal:** Minimal anechoic fluid in the recess.\n\n**Effusion:** Fluid extends and lifts the prefemoral fat pad. Measure the AP dimension of the suprapatellar fluid collection.\n\n**Simple vs complex:**\n- Simple (anechoic) → mechanical or early inflammatory\n- Complex (echoes, septations) → hemarthrosis, septic arthritis, crystalline disease (gout — look for hyperechoic deposits on cartilage)\n\n---\n\n## Key Images to Capture\n\n1. Quadriceps tendon — long axis and short axis\n2. Patellar tendon — long axis (proximal, mid, distal)\n3. Pre-patellar bursa region\n4. Suprapatellar recess — effusion evaluation\n5. MCL — long axis ± stress\n6. Medial joint line — meniscal rim\n7. LCL — long axis\n8. Posterior fossa — Baker's cyst (two planes, measure)\n9. Popliteal vessels — DVT exclusion\n10. Any focal pathology — two planes with measurements\n\n---\n\n## Reporting Language\n\n**Baker's cyst:**\n\"3.8 × 2.1 × 4.4 cm anechoic popliteal cyst in the medial popliteal fossa consistent with a Baker's cyst. A communicating neck is identified between the medial head of gastrocnemius and semimembranosus. No internal debris or septations. No evidence of rupture.\"\n\n**Patellar tendinopathy:**\n\"Proximal patellar tendon hypoechoic thickening measuring 8 mm at the inferior pole of the patella (normal ≤ 5 mm) with loss of normal fibrillar echogenicity. No complete tear. Findings consistent with patellar tendinopathy.\"\n\n---\n\n*SonoBuddy's MSK guides include shoulder, knee, and ankle ultrasound protocols.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"knee-ultrasound-protocol-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"knee-ultrasound-protocol-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"knee-ultrasound-protocol-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"knee-ultrasound-protocol-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"knee-ultrasound-protocol-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"knee-ultrasound-protocol-guide\",\"title\":\"Knee Ultrasound: Baker's Cyst, Tendons, Effusion, and Ligaments\",\"date\":\"2026-09-09\",\"excerpt\":\"A systematic protocol for knee ultrasound — anterior, medial, lateral, and posterior compartments — covering patellar tendon, quadriceps tendon, Baker's cyst, MCL/LCL, and joint effusion.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"musculoskeletal\",\"knee\",\"tendons\",\"Baker's cyst\",\"protocol\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"musculoskeletal-ultrasound-basics\",\"title\":\"Musculoskeletal Ultrasound Basics for Sonographers\",\"excerpt\":\"An introduction to MSK ultrasound — probe technique, normal tissue appearances, common pathologies, and what to document for tendons, bursae, joints, and nerves.\",\"date\":\"2026-07-11\"},{\"slug\":\"elbow-ultrasound-protocol-guide\",\"title\":\"Elbow Ultrasound: Epicondylitis, Ulnar
