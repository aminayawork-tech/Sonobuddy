c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1a41,"])</script><script>self.__next_f.push([1,"The first trimester ultrasound is one of the most clinically important studies in obstetrics. It confirms intrauterine pregnancy, establishes gestational age, evaluates for early complications, and screens for chromosomal abnormalities. Here's a systematic approach.\n\n## Indications\n\n- Confirm intrauterine pregnancy\n- Establish gestational age (crown-rump length dating is most accurate in first trimester)\n- Evaluate for threatened abortion, missed abortion, blighted ovum\n- Evaluate for ectopic pregnancy\n- Nuchal translucency screening (11w0d – 13w6d)\n- First trimester anatomy screen (when performed)\n- Evaluate subchorionic hematoma\n- Evaluate pelvic pain or bleeding in early pregnancy\n\n## Transducer Choice\n\n**Transvaginal (TVS):** Preferred in early first trimester (before 10–11 weeks). Superior resolution for small structures. Sees the gestational sac 1–2 weeks earlier than transabdominal.\n\n**Transabdominal (TAS):** Used after 10–12 weeks when the uterus is rising out of the pelvis. Also used if TVS is declined or not appropriate.\n\nMost early first trimester studies begin transvaginally and may finish transabdominally.\n\n## Systematic Scanning Approach\n\n### Step 1: Uterus Overview\n\nBefore looking for the pregnancy, survey the uterus:\n- Is it anteverted or retroverted?\n- Any fibroids? (Document size and location — can affect pregnancy)\n- Endometrial appearance\n\n### Step 2: Gestational Sac\n\nThe gestational sac (GS) is the first sonographic sign of pregnancy.\n\n**Normal GS:**\n- Round or oval anechoic structure with echogenic rim (decidual reaction)\n- Located in the uterine fundus or mid-cavity — **not** in the lower uterine segment or cervix\n- Mean sac diameter (MSD): measure in three planes, average them\n- Visible on TVS at approximately 4.5–5 weeks (when MSD ≈ 2–3 mm)\n\n**Empty sac without yolk sac:** Normal until MSD ≈ 8–10 mm. If MSD \u003e 16–20 mm without a yolk sac, this is a failed pregnancy (blighted ovum / anembryonic pregnancy).\n\n**Double decidual sac sign:** Two echogenic rings around the GS — the inner decidua capsularis and outer decidua parietalis. Helps distinguish IUP from a pseudogestational sac seen in ectopic pregnancy.\n\n### Step 3: Yolk Sac\n\nThe yolk sac is the first structure visible inside the GS and confirms intrauterine pregnancy.\n\n- Visible on TVS at approximately 5–5.5 weeks\n- Appears as a round echogenic ring with an anechoic center\n- **Normal diameter:** 3–6 mm\n- Should be visible when MSD \u003e 10–12 mm\n- Large yolk sac (\u003e 6 mm) or calcified/irregular yolk sac — associated with poor outcomes\n\n### Step 4: Embryo and Cardiac Activity\n\nThe embryo is visible as a small echogenic structure adjacent to the yolk sac.\n\n**Crown-rump length (CRL):** Measure the longest axis of the embryo, excluding the yolk sac. Use calipers at the natural curvature of the embryo, not stretched or compressed.\n\n**Gestational age from CRL:**\n- CRL 3–84 mm corresponds to approximately 6w0d – 14w0d\n- Most accurate dating method in pregnancy\n\n**Cardiac activity:**\n- Should be visible when CRL ≥ 7 mm (TVS)\n- If CRL ≥ 7 mm and no cardiac activity — likely failed pregnancy (embryonic demise)\n- Document heart rate — normal: 100–170 bpm by 8–10 weeks\n- Bradycardia (\u003c 100 bpm before 8 weeks) is a poor prognostic sign\n\n**M-mode for heart rate:** Use M-mode rather than spectral Doppler for cardiac rate in first trimester (reduces acoustic output exposure). Measure at least 3 cycles.\n\n### Step 5: Uterine Adnexa\n\nAlways evaluate both adnexa in early pregnancy:\n- Ovaries: size, appearance, corpus luteum (normal finding — supports the pregnancy)\n- Adnexal masses: evaluate any cysts \u003e 3 cm\n- Free fluid in the cul-de-sac\n\nAny adnexal mass in conjunction with an empty uterus or abnormal sac requires careful evaluation for ectopic pregnancy.\n\n### Step 6: Nuchal Translucency (11w0d – 13w6d, CRL 45–84 mm)\n\nNT screening requires specific training and quality review (most sites require FMF or similar certification).\n\n**Technique:**\n- Neutral position of fetal head (not flexed or extended)\n- Mid-sagittal view of the fetus — must see nasal bone, palate, and corpus callosum\n- Zoom so the fetal head and chest fill the screen\n- Measure the maximum thickness of the fluid-filled space behind the fetal neck\n- Place calipers on-to-on (inner edge of the echogenic skin to inner edge of the echogenic line of the neck)\n- Measure at the widest point, not including the amnion\n\n**Normal NT:** \u003c 3.0 mm (varies by CRL — use reference chart)\n**Elevated NT:** ≥ 3.0 mm — associated with chromosomal abnormalities and structural defects\n\n## Subchorionic Hematoma\n\nA subchorionic hematoma (SCH) appears as a hypoechoic or heterogeneous collection between the chorionic membrane and the uterine wall.\n\n**Document:**\n- Size (three dimensions)\n- Location relative to the placenta and cervix\n- Appearance (hypoechoic = acute; echogenic = organizing)\n- % of GS circumference involved\n\nLarge SCH covering more than 25–50% of the GS has a higher risk of adverse outcome.\n\n## Failed Pregnancy Criteria (AIUM/ACR guidelines)\n\n| Finding | Criteria |\n|---|---|\n| No cardiac activity | CRL ≥ 7 mm (TVS) |\n| No embryo | MSD ≥ 25 mm (TVS) without embryo |\n| No yolk sac | MSD ≥ 10 mm without yolk sac (concerning) |\n| No growth | No interval growth on follow-up after ≥ 11 days |\n\nThese criteria have high specificity but always use clinical correlation and consider follow-up imaging before final diagnosis.\n\n## Key Images to Capture\n\n1. Uterus — sagittal and transverse overview\n2. Gestational sac — transverse with MSD measurement (3 planes)\n3. Yolk sac — close-up with measurement\n4. Embryo — CRL measurement (sagittal)\n5. Cardiac activity — M-mode with heart rate\n6. Right and left adnexa\n7. Cervix (if TVS) — assess length and internal os\n8. NT measurement (if appropriate gestational age)\n\n## Reporting Language\n\n- \"Single live intrauterine pregnancy. CRL 8.2 mm, consistent with 6 weeks 4 days. Fetal cardiac activity present at 118 bpm. Yolk sac visualized, normal appearance. No adnexal abnormality.\"\n- \"Gestational sac identified measuring 22 mm (MSD). No embryo identified. No cardiac activity. Yolk sac visualized measuring 4 mm. Findings are suspicious for anembryonic pregnancy — recommend follow-up imaging in 7–10 days before final determination.\"\n- \"Single live intrauterine pregnancy at 12 weeks 3 days by CRL of 61 mm. Nuchal translucency 1.8 mm (normal for gestational age). No gross structural abnormalities identified on limited first trimester survey.\"\n\n---\n\n*SonoBuddy's Calculators include gestational age from CRL and NT percentile reference. OB normal values are in the Measurements section.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"first-trimester-ultrasound-protocol\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"first-trimester-ultrasound-protocol\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"first-trimester-ultrasound-protocol\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"first-trimester-ultrasound-protocol\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"first-trimester-ultrasound-protocol\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"first-trimester-ultrasound-protocol\",\"title\":\"First Trimester Ultrasound Protocol: What to Scan and Document\",\"date\":
