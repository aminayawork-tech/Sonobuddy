c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1cd0,"])</script><script>self.__next_f.push([1,"Penile duplex ultrasound with pharmacostimulation is the primary vascular imaging study for erectile dysfunction (ED). It directly assesses cavernosal artery blood flow before and after intracavernosal injection of a vasoactive agent, allowing classification of ED as arteriogenic, venogenic, or mixed. This is a specialized study typically performed by experienced vascular sonographers.\n\n## Anatomy\n\n**Two corpora cavernosa:** The paired erectile bodies running the length of the penile shaft, separated by the midline septum.\n\n**Corpus spongiosum:** Ventral, surrounds the urethra.\n\n**Cavernosal arteries:** One within each corpus cavernosum, running centrally. These are the vessels interrogated in penile duplex.\n\n**Helicine arteries:** Branch off cavernosal arteries → dilate during erection to fill the lacunar spaces.\n\n**Venous drainage:** Via emissary veins → dorsal vein → pudendal veins. During erection, venous outflow is restricted by tunica albuginea compression against the sinusoids (veno-occlusive mechanism).\n\n---\n\n## Why Penile Duplex?\n\nDifferentiates two types of vasculogenic ED:\n1. **Arteriogenic:** Insufficient arterial inflow — peak systolic velocity (PSV) \u003c 25 cm/s\n2. **Venogenic (veno-occlusive dysfunction):** Normal arterial inflow but failure of venous restriction — normal PSV with persistent end-diastolic velocity (EDV) \u003e 5 cm/s\n\nKnowing which mechanism is involved guides treatment: PDE5 inhibitors, penile revascularization (rare), penile prosthesis implantation.\n\n---\n\n## Pharmacostimulation\n\nThe study cannot be done without inducing a pharmacologic erection. Cavernosal arteries are in a high-resistance, low-flow state at baseline. After intracavernosal injection, they dilate and peak systolic flow increases dramatically.\n\n**Agent:** Alprostadil (prostaglandin E1) — most common. Dose varies (5–20 mcg). Some labs use a trimix (papaverine + phentolamine + alprostadil).\n\n**Who injects:** A physician or trained provider (urologist, radiologist, or delegated per institutional protocol). You may take post-injection Doppler measurements. Know your institution's protocol.\n\n**Timing:** Measurements are taken at specific intervals post-injection:\n- **5 minutes:** Tumescence beginning\n- **10 minutes:** Peak response expected\n- **20–25 minutes:** Final assessment\n\n---\n\n## Technique\n\n### Probe\n\nHigh-frequency linear transducer: 9–15 MHz.\n\n### Patient Position\n\nSupine, penis stretched and placed on the lower abdomen against the ventral surface, tip pointing toward the umbilicus. This standardizes the scanning approach.\n\n### Baseline (Pre-Injection)\n\n1. Transverse survey of both corpora cavernosa — identify both cavernosal arteries (small, round pulsatile structures centrally within each corpus)\n2. Long-axis view of each cavernosal artery\n3. Color Doppler to confirm vessel identification\n4. Spectral Doppler baseline (usually low-amplitude, high-resistance waveform)\n\n### Post-Injection Measurements\n\nAfter injection and at each interval:\n\n**Spectral Doppler of each cavernosal artery:**\n- Angle of insonation: ≤ 60°, preferably 45°–60° for cavernosal arteries\n- Measure: PSV, EDV, RI = (PSV − EDV) / PSV\n\n**Also measure:** Cavernosal artery diameter before and after injection — normal dilation is \u003e 75% or \u003e 0.7 mm increase.\n\n**Both sides:** Always measure both cavernosal arteries. Asymmetric PSV (\u003c 70% of contralateral) suggests unilateral disease.\n\n---\n\n## Normal and Abnormal Values\n\n### Peak Systolic Velocity (PSV)\n\n| PSV | Interpretation |\n|---|---|\n| ≥ 25 cm/s | Normal arteriogenic response |\n| 20–25 cm/s | Borderline — may be adequate; correlate clinically |\n| \u003c 20 cm/s | Arteriogenic ED — insufficient inflow |\n| \u003c 25 cm/s with poor erection | Arteriogenic component likely |\n\nSome references use ≥ 30 cm/s as the robust normal threshold.\n\n### End-Diastolic Velocity (EDV) and RI\n\nThe EDV reflects venous outflow. As erection develops and the veno-occlusive mechanism engages, EDV should **fall toward zero** (or reverse slightly) with good erection.\n\n| EDV | Interpretation |\n|---|---|\n| ≤ 0–5 cm/s at full tumescence | Normal veno-occlusion |\n| \u003e 5 cm/s at full tumescence | Venogenic ED — persistent outflow; veno-occlusion fails |\n\n**Resistive index at full erection:** Should approach 1.0 (near-zero EDV, high resistance as the veno-occlusive mechanism maximally restricts outflow).\n\n### Summary of Patterns\n\n| PSV | EDV | Interpretation |\n|---|---|---|\n| ≥ 25 cm/s | \u003c 5 cm/s | Normal vascular function |\n| ≥ 25 cm/s | \u003e 5 cm/s | Venogenic ED |\n| \u003c 25 cm/s | Any | Arteriogenic ED |\n| \u003c 25 cm/s | \u003e 5 cm/s | Mixed arteriogenic + venogenic |\n\n---\n\n## Cavernosal Artery Diameter\n\nMeasure in transverse before and after injection:\n- Normal baseline: ~0.3–0.5 mm\n- Post-injection: should dilate ≥ 75% or ≥ 0.7 mm increase\n- Poor dilation: suggests smooth muscle dysfunction or fibrosis (Peyronie's)\n\n---\n\n## Peyronie's Disease\n\nPeyronie's disease is fibrosis of the tunica albuginea causing penile curvature and painful erections. Often evaluated concurrently.\n\n**Sonographic findings:**\n- Echogenic plaques within or on the tunica albuginea — focal thickening\n- Calcification within plaques (posterior shadowing)\n- Located at the site of maximal curvature\n- Document: number, size, location (dorsal, ventral, lateral)\n\n---\n\n## Priapism (Urgent Indication)\n\nPriapism (prolonged erection ≥ 4 hours) may require urgent evaluation.\n\n**Ischemic (low-flow) priapism:**\n- Most common (90%)\n- Medical emergency — compartment syndrome of the penis\n- Doppler: **absent or very low cavernosal artery flow** — the engorged, ischemic corpora prevent arterial entry\n- Requires aspiration ± irrigation ± sympathomimetic injection; surgical shunt if refractory\n\n**Non-ischemic (high-flow) priapism:**\n- Post-traumatic arteriovenous fistula (perineal or penile trauma)\n- Doppler: **turbulent, high-velocity arterial flow** within the corpora (fistula feeding the priapism)\n- Color Doppler: chaotic, disorganized color signal at the fistula site\n\n---\n\n## Key Images\n\n1. Transverse bilateral corpora cavernosa — baseline\n2. Long-axis cavernosal artery × 2 sides — baseline spectral\n3. Post-injection at 5, 10, 20 minutes: spectral Doppler both sides with measurements\n4. Cavernosal artery diameter pre and post injection\n5. Peyronie's plaques if present — location, size, calcification\n6. Color Doppler of any fistula (if priapism evaluation)\n\n---\n\n## Reporting Language\n\n**Normal:**\n\"Following intracavernosal alprostadil injection, bilateral cavernosal arteries demonstrate adequate response. Peak systolic velocity: right 38 cm/s, left 34 cm/s (both ≥ 25 cm/s). At maximal tumescence, end-diastolic velocity is ≤ 3 cm/s bilaterally, indicating intact veno-occlusive mechanism. No plaques or calcification. Normal penile vascular response — arteriogenic and venogenic ED excluded.\"\n\n**Arteriogenic ED:**\n\"Peak systolic velocity: right 14 cm/s, left 18 cm/s (both \u003c 25 cm/s despite pharmacostimulation). Limited cavernosal artery dilation. End-diastolic velocity appropriate. Findings are consistent with arteriogenic erectile dysfunction. Venogenic dysfunction cannot be assessed in the setting of inadequate arterial response.\"\n\n---\n\n*SonoBuddy's vascular protocols include penile duplex, renal artery stenosis, and peripheral arterial studies.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"penile-duplex-ultrasound-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\"
