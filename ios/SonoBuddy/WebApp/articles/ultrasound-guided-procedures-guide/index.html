c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T21dc,"])</script><script>self.__next_f.push([1,"Ultrasound guidance has transformed procedural medicine — it reduces complications, improves accuracy, and replaces blind landmark techniques across specialties. As a sonographer, you may perform real-time guidance, assist physicians during procedures, or provide needle localization images before the interventionalist takes over. Know the principles regardless of your role.\n\n## Why Ultrasound Guidance?\n\nReal-time ultrasound guidance offers:\n- **Visualization of the target:** Confirm location before and after needle placement\n- **Avoidance of critical structures:** Vessels, nerves, bowel, lung\n- **Confirmation of needle position:** See the tip before aspirating or injecting\n- **Real-time feedback:** Watch fluid flow, cyst decompression, biopsy needle travel\n\n**Studies show:** US guidance reduces pneumothorax rate for thoracentesis from 10–18% to \u003c 1%; reduces arterial puncture for central venous access; improves FNA yield for thyroid nodules.\n\n---\n\n## Core Principles of Needle Visualization\n\n### In-Plane (Long Axis) Approach\n\nThe needle enters parallel to the long axis of the probe — you see the **entire needle shaft** as a hyperechoic line from skin to target.\n\n**Advantages:** Confirms needle tip position at all times; safest for tracking tip near critical structures.\n\n**Disadvantage:** Requires practice to maintain alignment; probe must be exactly parallel to the needle.\n\n### Out-of-Plane (Short Axis) Approach\n\nThe needle enters perpendicular to the probe long axis — you see the needle as a **bright dot** (cross-section) as it passes through the imaging plane.\n\n**Advantages:** Easier to learn, less path constraint.\n\n**Disadvantage:** Only the cross-section at that depth is visible, not the tip — you can see the shaft but must infer where the tip is. Risk of advancing beyond the target.\n\n### Angled (Oblique) Approach\n\nA compromise — probe at a slight angle. Often used for central venous access.\n\n### Practical Tip: Needle Visualization\n\n**Angle of approach matters:** The steeper the angle relative to the probe, the less echogenic the needle appears (anisotropy). A near-parallel (shallow) angle maximizes needle echogenicity. For real-time guidance, aim for the shallowest approach angle that reaches the target safely.\n\n**Always confirm the tip** before activating: aspirate, inject, or fire the biopsy gun.\n\n---\n\n## Thyroid and Neck FNA / Core Biopsy\n\n### Indications\n\n- Thyroid nodule ACR TI-RADS 4–5, or ≥ 1 cm at TR3–4\n- Suspicious lymph node — FNA for cytology\n- Salivary gland mass\n\n### Technique\n\n**Probe:** High-frequency linear (12–15 MHz) for superficial targets.\n\n**Approach:** In-plane preferred for thyroid (tracks the needle through the isthmus or lobe). Out-of-plane may be used for small nodules where precise alignment is easier.\n\n**Steps:**\n1. Identify and confirm the target nodule\n2. Confirm approach path avoids vessels (use color Doppler)\n3. Local anesthesia (physician role; sonographer assists)\n4. Real-time needle tip tracking to the nodule\n5. Fan the needle within the nodule (capillary technique for FNA — no suction needed for thyroid FNA in many labs)\n6. After passes are complete, compress and check for hematoma\n\n**Your role:** Hold the probe steady and confirm needle tip position; call out when the tip enters and leaves the target.\n\n---\n\n## Breast Biopsy (US-Guided Core Needle Biopsy)\n\n### Indications\n\n- BI-RADS 4 or 5 breast lesions\n- BI-RADS 3 with patient preference or high-risk factors\n\n### Equipment\n\n- 14-gauge core needle biopsy gun (automatic spring-loaded) — most common\n- 11-gauge vacuum-assisted device for larger sampling\n\n**Approach:** In-plane, parallel to the skin (to keep the needle away from the chest wall). Never approach perpendicular to the pectoral muscle.\n\n**Steps:**\n1. Confirm lesion location and approach in both planes\n2. Mark the approach with the probe — freehand technique most common\n3. Anesthesia (surgeon/radiologist role)\n4. Advance the core needle to the edge of the lesion, fire, confirm the needle traversed the lesion\n5. 4–6 passes typically, fanning through the lesion\n6. Biopsy clip placement (titanium marker) to mark the biopsy site — document clip position on post-procedure mammogram (often done same day)\n7. Compress, image for hematoma\n\n**Document:** Lesion location (clock position, distance from nipple, depth from skin), number of cores, clip placement confirmation.\n\n---\n\n## Drainage Procedures: Thoracentesis, Paracentesis, Abscess\n\n### Thoracentesis (Pleural Effusion Drainage)\n\n**Your role (pre-procedure marking):** Identify the optimal site for needle entry — the largest pocket of fluid at least 10 mm deep, above the rib (to avoid the neurovascular bundle that runs under each rib), away from the diaphragm and liver/spleen.\n\n**Mark the site:** Use a skin marker or indentation over the probe while the patient is in the position they'll be drained in (usually upright, leaning forward). Document the depth of fluid and distance from the skin.\n\n**Real-time guidance:** Some procedures are performed with real-time guidance; others use a pre-procedure mark and a landmark technique. Know your lab's protocol.\n\n**Critical:** The neurovascular bundle runs under the inferior rib — always target the space ABOVE the rib.\n\n### Paracentesis (Abdominal Fluid Drainage)\n\n**Approach:** Left lower quadrant (most common) or right lower quadrant, 4–6 cm from the midline (avoids inferior epigastric vessels).\n\n**Use color Doppler:** Confirm no vessels in the needle path (inferior epigastric artery runs lateral to the rectus).\n\n**Document:** Volume and depth of fluid, optimal site, bowel vs omentum vs fluid in the path.\n\n### Abscess Drainage\n\nReal-time guidance for needle/catheter placement into a fluid collection.\n\n**Assess before drainage:**\n- Size (three dimensions)\n- Depth from skin\n- Contents: simple fluid vs complex (debris, septations, gas — suggests infection)\n- Safe approach: avoids bowel, vessels, organs\n- Color Doppler: confirm no vessels in path\n\n**Document post-drainage:** Residual collection size.\n\n---\n\n## Vascular Access: Central Lines and Arterial Lines\n\nUltrasound-guided central venous access is now the standard of care (AHRQ Patient Safety Initiative).\n\n### Internal Jugular Vein (IJ) Central Line\n\n**Anatomy on US:**\n- **Common carotid artery:** Round, pulsatile, does not compress\n- **Internal jugular vein:** Oval, medial to/lateral to CCA (varies), easily compressible, increases in size with Valsalva\n\n**Approach:**\n1. Transverse (out-of-plane) most common for IJ — real-time view of the needle cross-section entering the vein\n2. Confirm the needle tip is in the vein: aspirate dark blood + watch the guide wire advance within the vein under ultrasound\n\n**Pitfall:** The right IJ is often approached first. Confirm you're entering vein, not artery — Doppler can confirm.\n\n### Femoral Vein Access\n\n**Anatomy:**\n- Common femoral vein (CFV) lies medial to the CFA at the inguinal crease\n- Use NAVEL mnemonic (lateral to medial): **N**erve, **A**rtery, **V**ein, Empty space, **L**ymphatics\n\n**Short-axis approach** is common — watch the needle enter the vein as a bright dot. Confirm by compressibility before wire placement.\n\n---\n\n## PICC Line Placement\n\nPeripherally inserted central catheter (PICC) is guided by ultrasound at the upper arm (basilic or brachial vein).\n\n**Basilic vein (preferred):** Medial upper arm, larger, fewer valves.\n**Brachial vein:** Adjacent to brachial artery — confirm you're in vein, not artery.\n\n**MST (Modified Seldinger Technique):** Small introducer needle, guidewire, peel-away sheath — the PICC threads through. Real-time US confirms wire and catheter advance into the vein.\n\n**Tip confirmation:** Tip position in the SVC/cavoatrial junction confirmed by chest X-ray (PICC) or ECG tip detection.\n\n---\n\n## What to Document on Every Guided Procedure\n\n- Consent obtained (per institutional protocol)\n- Target location — anatomy, depth, approach\n- Needle type and gauge\n- Number of passes (biopsy)\n- Volume aspirated / drained\n- Any complications encountered (bleeding, pneumothorax — for thoracentesis)\n- Post-procedure images: residual collection, hematoma check, clip position\n\n---\n\n## Sonographer Safety During Procedures\n\n- Stay sterile: know your role in the sterile field vs non-sterile\n- Sterile probe covers and sterile gel for all invasive procedures\n- Never allow an unsupervised trainee to advance a needle during your guidance\n- If the procedure is not going safely — stop and report\n\n---\n\n*SonoBuddy's procedural guidance section includes thyroid FNA, breast biopsy, paracentesis, and vascular access protocols.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"ultrasound-guided-procedures-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"ultrasound-guided-procedures-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"ultrasound-guided-procedures-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"ultrasound-guided-procedures-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"ultrasound-guided-procedures-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"ultrasound-guided-procedures-guide\",\"title\":\"Ultrasound-Guided Procedures: Biopsy, Drainage, and Vascular Access\",\"date
