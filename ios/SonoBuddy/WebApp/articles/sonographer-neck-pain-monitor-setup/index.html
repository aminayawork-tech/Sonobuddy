c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T114e,"])</script><script>self.__next_f.push([1,"Neck pain was one of the most common answers when we asked sonographers where scanning hurts. It's also one of the easiest to fix, because most of it comes from **where the monitor is**, and that's something you control before the first image.\n\n## Why Scanning Strains Your Neck\n\nYour head weighs roughly 10 to 12 pounds. Balanced directly over your shoulders, the neck holds it easily. But tilt it forward or turn it to the side, and the muscles at the back of the neck and top of the shoulders (the **upper trapezius**) have to work constantly to hold it there.\n\nDuring a typical exam, you're doing two awkward things at once:\n\n1. **Rotating** your head to watch a monitor that sits off to one side\n2. **Flexing** your head down to watch the probe and the patient\n\nHeld for a whole exam and repeated all day, that leads to muscle tension, stiffness, headaches, and over time, irritation of the joints and discs in the neck. Neck problems can also send **tingling or numbness down the arm**, which people often mistake for a wrist or shoulder problem.\n\n## The 10-Second Monitor Setup\n\n![Monitor setup checklist for sonographers](/blog/ergonomics/neck-monitor-setup.svg \"Set up the monitor before the first image|SonoBuddy\")\n\nBefore you pick up the probe, take ten seconds:\n\n### Put the monitor directly in front of you\n\nNot at 45 degrees off to the side. When you sit or stand in your scanning position, you should be able to see the screen **without turning your head.** Most machines have an articulating monitor arm; use it, every exam, every room.\n\n### Top of the screen at or just below eye level\n\nYour eyes should look **straight ahead or slightly down** at the image. A screen that's too low makes you drop your chin; too high makes you tip your head back. Both load the neck.\n\n### About an arm's length away\n\nClose enough to read measurements without leaning in, far enough that you're not craning back. If you catch yourself leaning toward the screen to read calipers, bring it closer or increase the text size.\n\n### Turn your chair, not your neck\n\nWhen the patient, the probe, and the monitor can't all line up in front of you, **rotate your whole body.** A chair that swivels, or simply repositioning your feet, keeps your head centered over your shoulders.\n\n## Head Position While You Scan\n\n- **Chin back, ears over shoulders.** Forward head posture is the habit to break. Imagine a string pulling the top of your head straight up.\n- **Look down with your eyes, not your neck**, when you glance at the probe.\n- **Don't cradle the phone.** Taking a call with the phone on your shoulder mid-scan is a fast route to a stiff neck.\n- **Watch the keyboard.** If the console is far away, you'll lean and twist to reach it. Bring it closer or position yourself so it's within easy reach.\n\n## Portable and Bedside Exams\n\nPortables are where neck setups fall apart: cramped rooms, fixed beds, monitors you can't move far. A few rules still apply:\n\n- **Park the machine on the same side you're scanning from**, as close to your line of sight as the room allows\n- **Raise the bed** so you aren't hunching down over it\n- Move the monitor to face you even if it means repositioning the cart; that 20 seconds saves the next 20 minutes\n\n## Neck Resets Between Patients\n\n- **Chin tucks:** draw your chin straight back (making a \"double chin\"), hold 3 seconds, repeat 10 times\n- **Side bend:** ear toward shoulder, hold 15 seconds each side\n- **Rotation:** turn slowly to look over each shoulder, 5 times each way\n- **Shoulder shrug and drop:** lift the shoulders toward the ears, hold 2 seconds, then let them drop completely\n\nMove gently. Never force a stretch into pain.\n\n## Warning Signs\n\nSee a clinician if you have:\n\n- Neck pain with **numbness, tingling, or weakness** in the arm or hand\n- **Headaches** that start at the base of the skull and keep coming back\n- Pain that **wakes you at night** or doesn't ease with rest\n- Stiffness that lasts **more than a couple of weeks**\n\n## The Bottom Line\n\n**Monitor in front, top of the screen at eye level, an arm's length away, and turn your body instead of your neck.** It takes ten seconds per room, and your neck will notice by the end of the week.\n\nLast in this series: the **lower back**, and why most back strain starts with a long reach.\n\n*This article is general educational information, not medical advice. If you have pain, numbness, or weakness, see a qualified clinician.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"sonographer-neck-pain-monitor-setup\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ghXGlW2TziYQw25JXH-MF\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"sonographer-neck-pain-monitor-setup\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonographer-neck-pain-monitor-setup\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"sonographer-neck-pain-monitor-setup\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonographer-neck-pain-monitor-setup\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"sonographer-neck-pain-monitor-setup\",\"title\":\"Sonographer Neck Pain: The 10-Second Monitor Setup That Prevents It\",\"date\":\"2026-11-13\",\"excerpt\":\"Twisting to see the screen and looking down at the patient load your neck all day. Here's how to position the monitor, your chair, and your head so a full shift doesn't end with a stiff, aching neck.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"ergonomics\",\"neck
