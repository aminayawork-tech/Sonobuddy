c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1b88,"])</script><script>self.__next_f.push([1,"The relationship between sonographers and radiologists is one of the most clinically important in the hospital. You acquire the images; they interpret them. Your ability to communicate findings, flag concerns, and ask the right questions directly affects patient outcomes. This is a skill set that most training programs cover lightly but that makes an enormous difference in practice.\n\n## Understanding the Radiologist's Perspective\n\nRadiologists read hundreds of studies per day in a busy department. They rely on:\n1. Quality images that answer the clinical question\n2. Accurate image labeling and measurements\n3. Relevant clinical context on the order (not always complete)\n4. Your verbal flag when something unexpected or urgent is found\n\nThey are not watching you scan in real time. They read what you give them. Your role is to give them everything they need to write an accurate, complete report.\n\n## When to Call the Radiologist During or After a Scan\n\n**Always notify immediately for:**\n- Suspected ruptured AAA\n- Cardiac tamponade signs\n- Free fluid with suspected ruptured ectopic pregnancy\n- Absent fetal cardiac activity not previously documented\n- New vascular occlusion (hepatic artery thrombosis in transplant)\n- Any finding so unexpected that delay could harm the patient\n\n**Notify promptly (same day) for:**\n- Unexpected malignancy findings in a scan ordered for something else\n- Significant change from prior imaging\n- Critical laboratory correlation (patient is clinically deteriorating + imaging is abnormal)\n- Equivocal findings where you need guidance on additional views\n\n**Don't notify for:**\n- Every finding that is abnormal but not urgent — let the report process work\n- Findings clearly expected based on the clinical indication\n- Questions about normal variants you know are benign\n\n## How to Deliver a Verbal Flag\n\nWhen you walk up to a radiologist, be concise and clinical. They don't have time for a long narrative.\n\n**Structure:**\n1. Who: \"I have a study on [patient name or MRN] in [room/area].\"\n2. What: The key finding. One sentence.\n3. Why it matters: If not obvious.\n\n**Example:** \"I just scanned a 67-year-old with abdominal pain. I'm seeing an 8 cm infrarenal aortic aneurysm with complex periaortic fluid. Patient is hypotensive.\"\n\n**Then be quiet and let the radiologist respond.**\n\nNot: \"So I was scanning, and you know how sometimes the aorta can be hard to see, but this one was actually pretty easy, and so I found something I think might be concerning…\"\n\nClarity and brevity = faster response = better patient care.\n\n## Asking Radiologists for Feedback\n\nThe most growth-oriented sonographers regularly ask for feedback on their images. Most radiologists appreciate the question when asked well.\n\n**Good timing:**\n- During a low-volume period (not when they're clearing a stack of 50 studies)\n- After completing a study where you were uncertain about image quality\n- When you have a specific question\n\n**Good phrasing:**\n- \"Do you have a moment to look at a study with me? I wasn't sure I got the best views of the IVC.\"\n- \"When you're reading [patient], could you let me know if there's anything I could have done differently technically?\"\n- \"I saw a finding I wasn't sure how to describe — can I show you what I was looking at?\"\n\n**Avoid:**\n- \"Did I do okay?\" (Too vague, no educational value)\n- Asking when they're clearly overwhelmed\n- Defensiveness if the feedback is critical\n\n## Learning From Discrepancies\n\nSometimes you will scan something as benign and the radiologist will call it a significant finding — or vice versa. When this happens, the instinct can be to feel embarrassed or defensive. Resist this.\n\n**Instead:**\n- Ask to see the image and understand why the interpretation changed\n- If the discrepancy was technical (you missed a window, didn't get additional views), note it and fix it\n- If the discrepancy was interpretive, that's outside your scope — but you can learn to acquire better images that make the interpretation clearer\n\nDiscrepancies are how you grow. The ones you don't know about don't help you.\n\n## When You Disagree With the Radiologist's Interpretation\n\nThis happens — especially as you develop clinical experience. A radiologist may not have access to all the information you had at the bedside (patient symptoms, clinical deterioration, what the area looked like on real-time Doppler that didn't save to an image).\n\n**Appropriate response:**\n- Flag additional information that may not have been communicated: \"I wanted to mention — the patient said the pain onset was 3 hours ago and it's been getting worse.\"\n- Ask respectfully: \"I was concerned because on real-time imaging the flow looked very sluggish — is there additional information that might warrant a comment in the report?\"\n\n**Inappropriate response:**\n- Telling the patient \"the radiologist got it wrong\"\n- Overriding or attempting to alter reports\n- Arguing during a patient case without new clinical information\n\nIf you have ongoing concerns about a discrepancy pattern, bring it to your lead sonographer or department chief through proper channels.\n\n## Communicating With Other Team Members\n\nRadiologists aren't the only people you communicate with.\n\n**Ordering physicians (ED docs, hospitalists, PCPs):** They may approach you in the hallway asking for preliminary findings. Know your department's policy — many departments restrict sonographers from providing preliminary interpretations verbally. A safe response: \"I've completed the images — they'll be reviewed by radiology as soon as possible. If this is urgent, I can flag the read as stat.\"\n\n**Nursing staff:** They often bring patients to you and have valuable clinical information. \"The patient was febrile at 103 and has right flank pain\" is more useful than an order that says \"abdominal pain.\" Ask questions. Nurses often know things about patients that aren't on the order.\n\n**Other sonographers:** Your team is your most immediate resource. If you see something unusual and want a second opinion before releasing the study, ask. \"Can you look at this image with me?\" is always appropriate.\n\n## Building a Professional Reputation\n\nYour reputation as a sonographer is built over thousands of small interactions. The things that build it:\n\n- Being reliable: starting on time, completing studies without gaps\n- Being accurate: consistent measurements, complete protocols\n- Being communicative: flagging what needs to be flagged, asking for help when unsure\n- Being teachable: receiving feedback without defensiveness\n- Being trustworthy: if you say you got the views, you got the views\n\nRadiologists who trust the sonographers in their department give more weight to technical comments, flag concerning studies for quick read, and generally create a better working environment. That trust is earned one study at a time.\n\n---\n\n*SonoBuddy keeps you sharp on the clinical content — measurements, protocols, and pathology — so you're more confident in what you're communicating when you do talk to the radiologist.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"sonographer-radiologist-communication-tips\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"uEQyINkmvIiIBKvwxparS\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"sonographer-radiologist-communication-tips\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"sonographer-radiologist-communication-tips\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"sonographer-radiologist-communication-tips\\\"}\",{}]}]}]}]},\"$
