c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1937,"])</script><script>self.__next_f.push([1,"Lymph node evaluation comes up on nearly every neck, axillary, and groin scan. Knowing what makes a node normal, reactive, or suspicious changes what you document — and whether a patient gets a biopsy.\n\n## Normal Lymph Node Architecture\n\nUnderstanding the normal appearance is everything in lymph node sonography.\n\n**Normal node sonographic features:**\n- **Oval shape** — elongated, not round (short-to-long axis ratio, or S:L ratio \u003c 0.5)\n- **Hyperechoic fatty hilum** — central echogenic fatty hilum with hilar vascularity on Doppler\n- **Hypoechoic cortex** — thin, uniform cortex surrounding the hilum\n- **Hilar blood flow** — Doppler flow enters through the hilum, branches peripherally (centripetal pattern)\n\n**Size:** No universal cutoff, but general guidelines:\n- Cervical nodes: short axis (S) ≤ 10 mm considered normal; ≤ 8 mm in posterior triangle\n- Axillary nodes: S ≤ 10–15 mm; cortex ≤ 3 mm\n- Inguinal nodes: up to 15 mm S axis; inguinal nodes are normally somewhat larger\n- **Jugulodigastric (level II):** Up to 15 mm S axis is acceptable in the neck\n\n## Sonographic Criteria for Concern\n\nNo single feature reliably distinguishes reactive from malignant nodes — use the overall constellation of findings.\n\n### Shape: Roundness\n\nAs a node becomes infiltrated by tumor, it becomes more spherical.\n\n**S:L ratio (short-to-long axis ratio):**\n- \u003c 0.5: Normal, oval — favors reactive\n- \u003e 0.5: More round — suspicious\n\nA round node (S:L ≥ 0.5) in the neck or axilla deserves careful scrutiny even if small.\n\n### Hilum: Present or Absent?\n\nThe fatty hilum is the most important single feature.\n\n| Hilum | Interpretation |\n|---|---|\n| Present, normal | Strongly favors benign / reactive |\n| Absent, replaced by cortex | Suspicious — loss of hilum suggests tumor infiltration |\n| Hilar fat replaced by hypoechoic tissue | Suspicious |\n\n**Exception:** Submandibular and parotid area nodes may normally have less visible hila.\n\n### Cortex Thickness\n\nNormal cortex is thin and uniform (≤ 3 mm). Eccentric or focal cortical thickening \u003e 3 mm is suspicious.\n\n- **Uniform (concentric) thickening** → reactive (infection, inflammation)\n- **Eccentric (focal) bulge** → malignancy until proven otherwise\n\n### Vascularity Pattern\n\nNormal: Hilar flow (enters at the hilum, fans out centrally).\n\n**Abnormal patterns:**\n- **Peripheral (capsular) vascularity** — flow wraps around the node periphery or enters from the cortex → suspicious for malignancy\n- **Absent vascularity** — completely avascular node → may be necrotic (lymphoma, metastasis from squamous cell carcinoma)\n- **Mixed pattern** — both hilar and peripheral → indeterminate\n\n### Calcification\n\n**Punctate calcifications** within a node strongly suggest papillary thyroid carcinoma metastasis (psammoma bodies). Also seen in treated lymphoma.\n\n**Coarse calcifications** may represent prior granulomatous disease (TB, sarcoid) or treated malignancy.\n\n### Necrosis\n\nCentral necrosis appears as an anechoic or complex central area replacing the hilum. Associated with squamous cell carcinoma metastases and lymphoma.\n\n---\n\n## Common Clinical Scenarios\n\n### Reactive Lymphadenopathy\n\nThe most common finding. Nodes are oval, have a preserved hyperechoic hilum, uniform cortical thickening, and hilar Doppler flow. Clinical context (recent infection, dental work, URI) confirms.\n\n**Typical example:** Bilateral cervical adenopathy in a patient with pharyngitis. Nodes are enlarged but oval, have normal hila, and show symmetric hilar flow.\n\n### Metastatic Lymphadenopathy\n\nThink about the primary tumor's drainage territory:\n- **Neck nodes:** Thyroid, nasopharynx, oropharynx, oral cavity, skin\n- **Axillary nodes:** Breast, upper extremity, skin\n- **Inguinal nodes:** Perineum, lower extremity, anorectal\n- **Supraclavicular nodes (Virchow's):** Lung, stomach, pancreas, lymphoma\n\n**Findings suggesting metastasis:**\n- Round node (S:L \u003e 0.5)\n- Absent or replaced hilum\n- Focal eccentric cortical bulge\n- Peripheral vascularity\n- Calcification (papillary thyroid)\n- Central necrosis\n\n### Lymphoma\n\nLymphoma nodes are often markedly enlarged, multiple, and may be matted (grouped). They tend to be round, have reduced or absent hila, and show disorganized internal vascularity. They are typically homogeneous and markedly hypoechoic (\"pseudocystic\" appearance).\n\n### Tuberculous Lymphadenopathy\n\nNodes may be matted, may show central necrosis, and occasionally calcify in chronic disease. Can be indistinguishable from metastatic nodes — biopsy is often needed.\n\n---\n\n## Neck Levels: Know the Map\n\nRadiologists and surgeons use a standardized cervical nodal level system. Knowing this helps you document node location properly.\n\n| Level | Location |\n|---|---|\n| I | Submental (Ia) and submandibular (Ib) |\n| II | Upper jugular (above hyoid) |\n| III | Middle jugular (hyoid to cricoid) |\n| IV | Lower jugular (cricoid to clavicle) |\n| V | Posterior triangle |\n| VI | Central compartment (pretracheal, paratracheal) |\n| VII | Superior mediastinum |\n\nAlways document level when reporting cervical nodes. Example: \"1.2 × 0.8 cm oval node at level IIA with preserved hyperechoic hilum.\"\n\n---\n\n## When to Recommend Further Evaluation\n\nRecommend additional imaging or biopsy when:\n- Short axis \u003e 10 mm with loss of fatty hilum\n- Round node (S:L \u003e 0.5) with eccentric cortical thickening\n- Peripheral (non-hilar) vascularity\n- Central necrosis or calcification\n- Matted or grouped nodes\n- Rapid growth on serial imaging\n- Clinical context: known malignancy, constitutional symptoms (B symptoms — fevers, night sweats, weight loss)\n\n**Reporting language for suspicious node:**\n\"1.4 cm short-axis lymph node at left level IIB with loss of the fatty hilum and eccentric cortical thickening. Peripheral vascularity on Doppler. Findings raise concern for metastatic or lymphomatous involvement. Correlation with clinical history and consideration of CT neck or biopsy are recommended.\"\n\n---\n\n## Ultrasound-Guided Lymph Node Biopsy\n\nWhen FNA or core biopsy is needed, ultrasound guidance improves yield by:\n- Targeting the most vascular, non-necrotic portion of the node\n- Avoiding major vessels\n- Confirming the needle tip position before sampling\n\nYou may be asked to assist or perform needle localization during biopsy. Document the procedure in your images.\n\n---\n\n*SonoBuddy's small parts section includes thyroid, lymph node, and soft tissue evaluation guides.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"lymph-node-ultrasound-normal-pathologic\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"lymph-node-ultrasound-normal-pathologic\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"lymph-node-ultrasound-normal-pathologic\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"lymph-node-ultrasound-normal-pathologic\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"lymph-node-ultrasound-normal-pathologic\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"lymph-node-ultrasound-normal-pathologic\",\"title\":\"Lymph Node Ultrasound: Normal vs. Pathologic Criteria\",\"date\":\"2026-09-03\",\"excerpt\":\"How to evaluate lymph nodes on ultrasound — normal architecture, the criteria that distinguish reactive from malignant nodes, and when to recommend biopsy.\",\"author\
