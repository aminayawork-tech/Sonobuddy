c3c7ae80b63.js\",\"160\",\"static/chunks/app/not-found-052c815ab64aa317.js\"],\"\"]\nf:I[9197,[\"185\",\"static/chunks/app/layout-76d54f0bf8e94701.js\"],\"Analytics\"]\n11:I[1060,[],\"\"]\n5:T1fc2,"])</script><script>self.__next_f.push([1,"Salivary gland ultrasound is a high-yield small parts study. The glands are superficial, accessible, and ultrasound is often the first — and sometimes only — imaging needed to answer the clinical question. Understanding what to look for separates a good scan from a great one.\n\n## Major Salivary Glands: Anatomy\n\n### Parotid Gland\n\n**Largest** of the three major glands. Lies in the preauricular region, anterior and inferior to the ear, extending into the retromandibular region.\n\n**Structure:** Two lobes (superficial and deep) separated by the facial nerve — the nerve is not directly visible on ultrasound, but its course (from the stylomastoid foramen through the gland) determines surgical approach. Stensen's duct drains anteriorly into the oral cavity at the upper second molar.\n\n**Normal echogenicity:** Isoechoic to slightly hyperechoic compared to adjacent muscle. Homogeneous.\n\n**Intraparotid lymph nodes:** Normal — the parotid is the only major salivary gland that contains lymph nodes. These are often visible as small oval hypoechoic structures within the gland.\n\n### Submandibular Gland\n\nLocated in the submandibular triangle (floor of mouth, below the mandible). Wharton's duct opens at the sublingual papilla near the frenulum.\n\n**Normal echogenicity:** Similar to parotid — homogeneous, moderate echogenicity.\n\n**Size:** Roughly 3 × 2 × 2 cm (variable).\n\n### Sublingual Gland\n\nSmallest of the major glands. Located in the floor of the mouth. Not always well-visualized on standard neck ultrasound.\n\n---\n\n## Scanning Technique\n\n**Probe:** 12–15 MHz linear transducer — high frequency for these superficial glands.\n\n**Patient position:** Supine, head extended slightly, turned away from the side being examined.\n\n**Protocol:**\n1. **Survey the gland in transverse** — sweep through the entire gland\n2. **Long axis** — measure length\n3. **Identify the duct** — Stensen's (parotid) or Wharton's (submandibular) — look for any dilation or calculus\n4. **Doppler** — color flow to characterize vascularity of any mass\n5. **Compare to contralateral side** — asymmetry is significant\n\n---\n\n## Normal Measurements\n\n| Gland | Approximate Size |\n|---|---|\n| Parotid | 5–6 × 3–4 × 2–3 cm |\n| Submandibular | 3–5 × 2–3 × 2–3 cm |\n\nDocument if you can't visualize a gland or if it appears atrophic.\n\n---\n\n## Inflammatory Conditions\n\n### Acute Sialadenitis\n\nBacterial infection of a salivary gland — usually parotid or submandibular. Common organism: Staphylococcus aureus. May follow dehydration, post-surgical period, or dental work.\n\n**Sonographic findings:**\n- Gland **enlargement**\n- **Decreased echogenicity** (edema) — diffuse or focal\n- **Increased vascularity** on color Doppler — hypervascular gland\n- Thickened overlying skin/subcutaneous tissue\n- ± Reactive periparotid/submandibular lymphadenopathy\n\n**Abscess formation:** Focal anechoic or hypoechoic collection within the gland; complex, with internal echoes. Doppler: absent flow centrally; rim vascularity.\n\n### Chronic Sialadenitis / Sialolithiasis\n\nDuctal obstruction from calculi (stones) → chronic inflammation.\n\n**Submandibular gland:** Most common site for calculi (80–90%) — Wharton's duct has a longer, tortuous course.\n\n**Parotid:** Less common calculi but still occurs (Stensen's duct calculi).\n\n**Sonographic findings of calculi:**\n- Echogenic focus within the duct or gland parenchyma\n- **Posterior acoustic shadowing** (as with gallstones — the higher the calcium content, the more shadowing)\n- Small calculi (\u003c 3 mm) may not shadow\n- Ductal dilation proximal to the stone\n\n**Always trace the duct:** Start at the gland hilum and follow the duct distally. A dilated duct with an echogenic focus at any point = calculus until proven otherwise.\n\n### Sjögren's Syndrome\n\nAutoimmune destruction of salivary and lacrimal glands. Bilateral parotid and submandibular involvement.\n\n**Sonographic findings:**\n- Heterogeneous echotexture — classic \"Swiss cheese\" or geographic hypoechoic areas\n- Lobulated, irregular appearance\n- Multiple cystic (anechoic) foci within parenchyma\n- Hypervascularity on Doppler\n- Normal or enlarged glands early; atrophic in chronic disease\n- Associated cervical lymphadenopathy\n\n**Clinical note:** Increased lymphoma risk in Sjögren's — any dominant mass within the gland deserves further evaluation.\n\n---\n\n## Benign Tumors\n\n### Pleomorphic Adenoma (Benign Mixed Tumor)\n\nMost common salivary gland tumor (70% of all salivary tumors). Most common in the parotid gland (superficial lobe).\n\n**Sonographic appearance:**\n- Well-defined, oval or rounded mass\n- Hypoechoic relative to normal gland parenchyma\n- Homogeneous (small) or heterogeneous (larger — may have cystic areas)\n- Smooth, well-defined capsule\n- Posterior acoustic enhancement (due to soft tissue vs surrounding gland)\n- **Low to moderate vascularity** on Doppler\n\n**Important:** Pleomorphic adenoma has a small but real risk of malignant transformation (carcinoma ex pleomorphic adenoma) — especially if untreated \u003e 10–15 years or if growing rapidly.\n\n**Reporting:** Document size, location within the gland (superficial vs deep lobe), and proximity to the facial nerve (deep lobe masses may require total parotidectomy).\n\n### Warthin's Tumor (Papillary Cystadenoma Lymphomatosum)\n\nSecond most common benign parotid tumor. Almost exclusively in the parotid gland, particularly the inferior pole (tail of parotid). Associated with smoking.\n\n**Sonographic appearance:**\n- Well-defined\n- **Heterogeneous** — mixed solid and cystic components; \"honeycomb\" or mixed architecture\n- Hypoechoic to anechoic cystic areas within a predominantly solid mass\n- Often bilateral or multifocal (10–15% bilateral, 10–15% multiple)\n- Doppler: moderate vascularity\n\n---\n\n## Malignant Tumors\n\nMalignant salivary gland tumors are uncommon but important to recognize.\n\n**Types:** Mucoepidermoid carcinoma (most common), adenoid cystic carcinoma, acinic cell carcinoma, carcinoma ex pleomorphic adenoma.\n\n**Concerning ultrasound features:**\n- Irregular, ill-defined margins\n- Heterogeneous internal architecture\n- Infiltrative growth (poorly demarcated from surrounding gland)\n- Adjacent lymphadenopathy (with loss of hilum, rounded nodes)\n- Marked vascularity (disorganized, peripheral pattern)\n- Fixation to surrounding structures\n\n**If any of these features are present → MRI (or CT) is recommended.** Ultrasound alone cannot reliably diagnose malignancy in salivary gland tumors.\n\n---\n\n## Key Images to Capture\n\n1. Parotid gland — long and transverse views with measurements\n2. Submandibular gland — long and transverse views with measurements\n3. Stensen's duct / Wharton's duct — document if dilated or obstructed\n4. Any mass — two planes, three dimensions, Doppler\n5. Periparotid / submandibular lymph nodes\n6. Contralateral gland for comparison\n\n---\n\n## Reporting Language\n\n**Normal:**\n\"Bilateral parotid glands are symmetric, homogeneous, and of normal echogenicity. No focal mass, ductal dilation, or calculus. Small oval intraparotid lymph nodes noted bilaterally — within normal limits. Bilateral submandibular glands: normal size, echogenicity, and homogeneous parenchyma.\"\n\n**Calculus:**\n\"Dilated Wharton's duct identified within the right submandibular gland measuring 4 mm in diameter. A 5 mm echogenic focus with posterior acoustic shadowing is identified within the proximal right submandibular duct, consistent with a sialolith. The right submandibular gland parenchyma is mildly heterogeneous with increased echogenicity, consistent with chronic sialadenitis.\"\n\n**Mass:**\n\"2.4 × 1.8 × 2.1 cm well-defined, oval hypoechoic mass in the superficial lobe of the right parotid gland. The mass has a thin echogenic capsule, posterior acoustic enhancement, and moderate internal vascularity. No adjacent lymphadenopathy. Sonographic features are most consistent with a pleomorphic adenoma. MRI of the parotid is recommended for pre-operative characterization.\"\n\n---\n\n*SonoBuddy's small parts protocols include thyroid, salivary gland, lymph node, and soft tissue ultrasound guides.*"])</script><script>self.__next_f.push([1,"7:[\"slug\",\"salivary-gland-ultrasound-guide\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Ayt8iwzQUb6Ni7h-FNJ6-\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"articles\",\"salivary-gland-ultrasound-guide\",\"\"],\"initialTree\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"salivary-gland-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"salivary-gland-ultrasound-guide\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"(app)\",{\"children\":[\"articles\",{\"children\":[[\"slug\",\"salivary-gland-ultrasound-guide\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"article\":{\"slug\":\"salivary-gland-ultrasound-guide\",\"title\":\"Salivary Gland Ultrasound: Parotid, Submandibular, and Pathology\",\"date\":\"2026-09-25\",\"excerpt\":\"How to evaluate the major salivary glands on ultrasound — normal anatomy, sialadenitis, calculi, pleomorphic adenoma, Warthin's tumor, and when to recommend further imaging.\",\"author\":\"SonoBuddy Team\",\"tags\":[\"small parts\",\"salivary gland\",\"parotid\",\"head and neck\",\"pathology\"],\"content\":\"$5\"},\"related\":[{\"slug\":\"lymph-node-ultrasound-normal-pathologic\",\"title\":\"Lymph Node Ultrasound: Normal vs. Pathologic Criteria\",\"excerpt\":\"How to evaluate lymph nodes on ultrasound — normal architecture, the criteria that distinguish react
