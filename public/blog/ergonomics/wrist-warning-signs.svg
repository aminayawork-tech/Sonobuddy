<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="900" fill="#F0F8FF"/>
<rect x="72" y="64" width="291" height="40" rx="20" fill="#E0F2FE"/>
<text x="94" y="91" font-size="18" font-weight="700" letter-spacing="3" fill="#0EA5E9">WHEN TO GET CHECKED</text>
<text x="72" y="180" font-size="62" font-weight="900" letter-spacing="-2"><tspan fill="#0F172A">Wrist </tspan><tspan fill="#0EA5E9">warning signs</tspan></text>
<rect x="72" y="276" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="114" cy="312" r="16" fill="#F59E0B"/><text x="114" y="320" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">!</text>
<text x="148" y="321" font-size="27" font-weight="700" fill="#0F172A">Numbness or tingling in the thumb to ring finger</text>
<rect x="72" y="362" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="114" cy="398" r="16" fill="#F59E0B"/><text x="114" y="406" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">!</text>
<text x="148" y="407" font-size="27" font-weight="700" fill="#0F172A">Pain or tingling that wakes you at night</text>
<rect x="72" y="448" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="114" cy="484" r="16" fill="#F59E0B"/><text x="114" y="492" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">!</text>
<text x="148" y="493" font-size="27" font-weight="700" fill="#0F172A">Weaker grip, or dropping the probe</text>
<rect x="72" y="534" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="114" cy="570" r="16" fill="#F59E0B"/><text x="114" y="578" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">!</text>
<text x="148" y="579" font-size="27" font-weight="700" fill="#0F172A">Pain on the thumb side when you make a fist</text>
<rect x="72" y="620" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="114" cy="656" r="16" fill="#F59E0B"/><text x="114" y="664" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">!</text>
<text x="148" y="665" font-size="27" font-weight="700" fill="#0F172A">Symptoms that last more than two weeks</text>
<text x="72" y="844" font-size="22" fill="#475569">Early care is easier than fixing a chronic injury.</text>
<text x="1128" y="846" text-anchor="end" font-size="34" font-weight="900" letter-spacing="-1"><tspan fill="#0F172A">Sono</tspan><tspan fill="#0EA5E9">Buddy</tspan></text>
</svg>