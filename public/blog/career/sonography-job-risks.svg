<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="900" fill="#F0F8FF"/>
<rect x="72" y="64" width="161" height="40" rx="20" fill="#E0F2FE"/>
<text x="94" y="91" font-size="18" font-weight="700" letter-spacing="3" fill="#0EA5E9">JOB RISKS</text>
<text x="72" y="180" font-size="62" font-weight="900" letter-spacing="-2"><tspan fill="#0F172A">Is sonography a </tspan><tspan fill="#0EA5E9">high-risk</tspan></text>
<text x="72" y="250" font-size="62" font-weight="900" letter-spacing="-2"><tspan fill="#0F172A">job?</tspan></text>
<rect x="72" y="346" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="391" font-size="27" font-weight="700" fill="#0F172A">Musculoskeletal injury</text>
<text x="1096" y="391" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">Biggest risk</text>
<rect x="72" y="432" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="477" font-size="27" font-weight="700" fill="#0F172A">Infection exposure</text>
<text x="1096" y="477" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">Standard precautions</text>
<rect x="72" y="518" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="563" font-size="27" font-weight="700" fill="#0F172A">Ionizing radiation</text>
<text x="1096" y="563" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">None from ultrasound</text>
<rect x="72" y="604" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="649" font-size="27" font-weight="700" fill="#0F172A">Lawsuits</text>
<text x="1096" y="649" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">Usually facility + physician</text>
<rect x="72" y="690" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="735" font-size="27" font-weight="700" fill="#0F172A">Emotional strain</text>
<text x="1096" y="735" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">Real, often ignored</text>
<text x="72" y="844" font-size="22" fill="#475569">Most risks are manageable with habits, setup, and good documentation.</text>
<text x="1128" y="846" text-anchor="end" font-size="34" font-weight="900" letter-spacing="-1"><tspan fill="#0F172A">Sono</tspan><tspan fill="#0EA5E9">Buddy</tspan></text></svg>