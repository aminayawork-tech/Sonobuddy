<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="900" fill="#F0F8FF"/>
<rect x="72" y="64" width="226" height="40" rx="20" fill="#E0F2FE"/>
<text x="94" y="91" font-size="18" font-weight="700" letter-spacing="3" fill="#0EA5E9">CAREER COMPARE</text>
<text x="72" y="180" font-size="62" font-weight="900" letter-spacing="-2"><tspan fill="#0EA5E9">Sonography </tspan><tspan fill="#0F172A">vs </tspan><tspan fill="#0EA5E9">nursing</tspan></text>
<rect x="72" y="276" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="321" font-size="27" font-weight="700" fill="#0F172A">Median pay, sonographers</text>
<text x="1096" y="321" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">$89,340</text>
<rect x="72" y="362" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="407" font-size="27" font-weight="700" fill="#0F172A">Median pay, registered nurses</text>
<text x="1096" y="407" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">$93,600</text>
<rect x="72" y="448" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="493" font-size="27" font-weight="700" fill="#0F172A">Licensing exam</text>
<text x="1096" y="493" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">ARDMS vs NCLEX</text>
