<rect x="72" y="620" width="1056" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="665" font-size="27" font-weight="700" fill="#0F172A">Biggest physical strain</text>
<text x="1096" y="665" text-anchor="end" font-size="27" font-weight="800" fill="#0EA5E9">Scanning arm vs lifting</text>
<text x="72" y="844" font-size="22" fill="#475569">Median pay: U.S. Bureau of Labor Statistics, May 2024.</text>
<text x="1128" y="846" text-anchor="end" font-size="34" font-weight="900" letter-spacing="-1"><tspan fill="#0F172A">Sono</tspan><tspan fill="#0EA5E9">Buddy</tspan></text></svg>